"], ["p", "拿俄米要面對的，不只是失去。"], ["p", "還有被人看見她的失去。"], ["p", "她怎樣回答？"], ["q", "「不要叫我拿俄米……要叫我瑪拉……因為全能者使我受了大苦。」（1:20）"], ["p", "拿俄米的意思，是甜。"], ["p", "瑪拉的意思，是苦。"], ["p", "她要把自己的名字，從甜改成苦。"], ["q", "「我滿滿地出去，耶和華使我空空地回來。」（1:21）"], ["p", "請注意，她離開的時候，正是饑荒。"], ["p", "她卻說，自己是滿滿地出去。"], ["p", "因為那時，丈夫和兩個兒子都在身邊。"], ["p", "她的滿，從來不是糧食。"], ["p", "是人。"], ["p", "「空空地」原文是 רֵיקָם（reqam）。"], ["p", "就是空著手。"], ["p", "像那台很輕的行李車。"], ["p", "「降禍與我」，原文直譯是「作見證攻擊我」。"], ["p", "這是法庭上的用語。"], ["p", "她覺得自己站在神的法庭上，被定了罪。"], ["p", "弟兄姊妹，我們要怎樣聽這些話？"], ["p", "有人很快就替她下結論：信心太軟弱。"], ["p", "可是請你仔細看，她說話的對象。"], ["p", "每一句的主詞，都是神。"], ["p", "她沒有說神不存在。"], ["p", "她沒有轉去求摩押的神。"], ["p", "她是對著神哭。"], ["p", "她四次說神作了甚麼，這叫作哀歌。"], ["p", "哀歌，是信心的一種形式。"], ["p", "約伯這樣哭過。"], ["p", "詩篇的作者這樣哭過。"], ["p", "主耶穌在十字架上，也用詩篇這樣呼喊："], ["q", "「我的神，我的神！為什麼離棄我？」（詩 22:1）"], ["p", "經文怎樣回應拿俄米？"], ["p", "敘述者沒有糾正她。"], ["p", "婦人們沒有反駁她。"], ["p", "神也沒有責備她。"], ["q", "神承受得起我們誠實的話。"], ["p", "所以，我們也不要急著對受苦的人說："], ["p", "不要再哭了，要喜樂。"], ["p", "這些話也許是好意。"], ["p", "可是聽在剛失去的人耳裡，像是把門關上。"], ["p", "拿俄米可以說，她是苦的。"], ["p", "你也可以。"], ["p", "可是請聽，經文並沒有停在她的話。"], ["p", "第二十二節，是全章最後一句。"], ["q", "「拿俄米和她兒婦摩押女子路得，從摩押地回來到伯利恆，正是動手割大麥的時候。」（1:22）"], ["p", "這句話很平淡，像一個日期。"], ["p", "可是放在第二十一節後面，它是一個溫柔的回答。"], ["p", "拿俄米剛說完「空空地」。"], ["p", "經文就把鏡頭，轉向滿田的大麥。"], ["p", "它沒有反駁她，只是讓我們看見她還看不見的。"], ["p", "而且，她不是一個人回來的。"], ["p", "摩押女子路得，就在她身邊。"], ["p", "拿俄米說她空了。"], ["p", "可是到了第四章，伯利恆的婦女會這樣說路得："], ["q", "「有這兒婦比有七個兒子還好！」（4:15）"], ["p", "還有一件事。"], ["p", "「空空地」這個字，全卷只出現兩次。"], ["p", "另一次在第三章。"], ["p", "波阿斯把大麥給了路得，對她說："], ["q", "「你不可空手回去見你的婆婆。」（3:17）"], ["p", "拿俄米說：神使我空空地回來。"], ["p", "神卻差一個人說：不可讓她空著。"], ["q", "她的話是真實的，但不是最後一句。"], ["p", "弟兄姊妹，我們回到入境大廳。"], ["p", "兩個女人站在門口。"], ["p", "誰也沒有來接。"], ["p", "可是請你再看一次那張照片。"], ["p", "那個年輕的女人，為甚麼在這裡？"], ["p", "她本來可以不來。"], ["p", "她本來可以留在自己的國家，自己的娘家。"], ["p", "她跟著一個甚麼都給不了她的人。"], ["p", "走進一個沒有人接她的地方。"], ["p", "她說：你的神就是我的神。"], ["p", "這使我們想起主耶穌說的話："], ["q", "「若有人要跟從我，就當捨己」（路 9:23）"], ["p", "路得沒有聽過這句話。"], ["p", "可是她活出了它的樣子。"], ["p", "在看不見回報的地方，作了一個不回頭的決定。"], ["p", "主耶穌自己，也走進一個不接待祂的世界。"], ["p", "祂沒有撇下我們。"], ["p", "321 說：讓耶穌作王。"], ["p", "起點，就在第十六節。"], ["p", "不是先算好代價，再決定跟隨。"], ["p", "是先說：你的神就是我的神。"], ["p", "然後一步一步地走。"], ["p", "這就是從舊人有己，到新人無己。"], ["p", "有己的人問：跟著你，我得到甚麼？"], ["p", "無己的人說：你往哪裡去，我也往那裡去。"], ["p", "今天回家，有三件小事。"], ["p", "第一，如果你正在「剩下」的處境裡。"], ["p", "不要急著找原因。"], ["p", "今天晚上，把你的苦，誠實地告訴神。"], ["p", "像拿俄米一樣，對著祂說。"], ["p", "第二，如果你身邊有一位拿俄米。"], ["p", "一位剛失去、剛搬回來、沒有人接的人。"], ["p", "這個禮拜，作那個去接她的人。"], ["p", "不用講道理，只要說：我在。"], ["p", "第三，請你安靜問自己一句話。"], ["p", "我跟隨神，是因為祂給我甚麼？"], ["p", "還是因為，祂就是我的神？"], ["p", "如果今天的信息，碰到你心裡很深的傷。"], ["p", "失去、不孕，或是一個人的孤單。"], ["p", "會後請私訊同工或小組長，我們願意陪你走。"], ["p", "我們一起低頭禱告。"], ["p", "親愛的天父，謝謝你記得每一個名字。"], ["p", "主啊，我們有時候也說：我是空空地回來的。"], ["p", "謝謝你承受得起我們誠實的眼淚。"], ["p", "求你讓我們看見，你已經放在我們身邊的人。"], ["p", "求你給我們路得的心。"], ["p", "在沒有回報的路上，仍然說：你的神就是我的神。"], ["p", "也求你使我們，成為別人的路得。"], ["p", "在入境大廳，作那個去接人的人。"], ["p", "謝謝你差來主耶穌，祂從來沒有撇下我們。"], ["p", "奉主耶穌基督的名禱告，阿們。"]]}, "2": {"min": 18, "blocks": [["h", "《投靠耶和華－以色列神的翅膀下》"], ["p", "弟兄姊妹平安，今天我們一起讀路得記第二章。"], ["p", "我們先到一塊麥田去。"], ["p", "想像一下，五月的一個下午。"], ["p", "一大片麥田，金黃金黃的。"], ["p", "一台收割機從田的這一頭開進去。"], ["p", "轟隆轟隆，一排一排地割。"], ["p", "一個下午，整塊田就割完了。"], ["p", "可是你走到田邊，仔細看。"], ["p", "田的四個角，總有一點沒割到。"], ["p", "機器轉彎的地方，割不乾淨。"], ["p", "在今天，那一點沒有人在意。"], ["p", "可是在三千年前的伯利恆，那一點很重要。"], ["p", "因為那一點，是神為窮人留的。"], ["p", "神在律法裡這樣吩咐："], ["q", "「在你們的地收割莊稼，不可割盡田角，也不可拾取所遺落的。」（利 19:9）"], ["q", "「要留給窮人和寄居的。」（利 19:10）"], ["p", "田角不是地主忘了割。"], ["p", "是神叫他不要割。"], ["p", "神把它留給沒有田的人。"], ["p", "弟兄姊妹，路得記第二章，就發生在那一角。"], ["p", "一個外邦寡婦，在別人的田裡彎著腰。"], ["p", "她不知道自己走進了誰的田。"], ["p", "可是神知道。"], ["p", "今天的章題，是第十二節的一句話："], ["q", "「你來投靠耶和華－以色列神的翅膀下，願你滿得他的賞賜。」（2:12）"], ["p", "今天我們講三件事。"], ["p", "第一，她恰巧到了。"], ["p", "第二，投靠在翅膀下。"], ["p", "第三，是一個至近的親屬。"], ["q", "第一件事：她恰巧到了。"], ["p", "第一章結束的時候，兩個寡婦走進伯利恆。"], ["p", "拿俄米說了一句很痛的話："], ["q", "「我滿滿地出去，耶和華使我空空地回來。」（1:21）"], ["p", "我們不必責備她。"], ["p", "那是一首哀歌。"], ["p", "她是對著神哭，不是離開神。"], ["p", "經文也沒有責備她。"], ["p", "經文只是在下一節，輕輕加了一句："], ["q", "「正是動手割大麥的時候。」（1:22）"], ["p", "她說自己是空的。"], ["p", "敘述者卻讓我們看見，田已經熟了。"], ["p", "第二章一開頭，故事忽然停下來。"], ["p", "路得還沒說話，敘述者先放了一個名字在桌上。"], ["q", "「拿俄米的丈夫以利米勒的親族中，有一個人名叫波阿斯，是個大財主。」（2:1）"], ["p", "原文第一個字，是「至於拿俄米」。"], ["p", "讀者先知道了，拿俄米自己還不知道。"], ["p", "她以為她是一個人。"], ["p", "其實田的那一頭，已經有一個人。"], ["p", "「大財主」原文是 גִּבּוֹר חַיִל（gibbor chayil）。"], ["p", "חַיִל 是一個很寬的字。"], ["p", "到了第三章，同一個字會落在路得身上。"], ["p", "波阿斯說，她是一個「賢德的女子」。"], ["p", "一個有地的以色列男人。"], ["p", "一個沒有地的摩押寡婦。"], ["p", "聖經用同一個字形容他們。"], ["p", "聖經量人的尺，不是出身，也不是存款。"], ["p", "是品格。"], ["p", "然後，路得開口了。"], ["q", "「容我往田間去，我蒙誰的恩，就在誰的身後拾取麥穗。」（2:2）"], ["p", "請注意，是路得自己提出來的。"], ["p", "她知道以色列有一條為窮人留的路。"], ["p", "她也知道，律法給了權利。"], ["p", "卻不保證人家給好臉色。"], ["p", "「我蒙誰的恩」，原文直譯是："], ["p", "在誰的眼中找到恩。"], ["p", "弟兄姊妹，這個「眼中」很重要。"], ["p", "路得記最後一句話是："], ["q", "「那時，以色列中沒有王，各人任意而行。」（士 21:25）"], ["p", "「任意而行」，原文是："], ["p", "各人作自己眼中看為對的事。"], ["p", "路得記第二章，這個說法出現三次。"], ["p", "每一次，都出自路得的口。"], ["p", "路得記的人，只看自己的眼睛。"], ["p", "路得只求別人的眼睛裡有恩典。"], ["p", "這就是謙卑。"], ["p", "謙卑不是看輕自己。"], ["p", "是不再把自己當作標準。"], ["p", "拿俄米回答得很短："], ["q", "「女兒啊，你只管去。」（2:2）"], ["p", "可是一個剛說完「全能者使我受苦」的人。"], ["p", "還能叫一聲「女兒」。"], ["p", "那已經是愛了。"], ["q", "「她恰巧到了以利米勒本族的人波阿斯那塊田裡。」（2:3）"], ["p", "「恰巧」這兩個字，原文很特別。"], ["p", "וַיִּקֶר מִקְרֶהָ（vayyiqer miqreha）。"], ["p", "直譯是：她的機遇，遇上了。"], ["p", "讀者在第一節，已經知道波阿斯是誰。"], ["p", "作者用一個最不屬靈的字，講一件最屬靈的事。"], ["p", "整卷路得記，敘述者只親口說了兩次神的作為。"], ["p", "第一章，耶和華眷顧百姓，賜糧食。"], ["p", "第四章，耶和華使路得懷孕。"], ["p", "其餘的時候，神都藏起來了。"], ["p", "藏在「恰巧」裡。"], ["p", "這裡要小心，守住兩條界線。"], ["p", "第一，這不是命定論。"], ["p", "她自己出門，自己走進一塊田。"], ["p", "神的帶領，沒有取消她的選擇。"], ["p", "第二，這不是成功神學。"], ["p", "有人說，跟隨神就會遇到有錢的好人。"], ["p", "經文不是這樣說的。"], ["p", "路得是彎著腰，跟在收割的人後面。"], ["p", "撿別人掉下來的東西。"], ["p", "神的護理，不是在舞台上被看見的。"], ["p", "是在最卑微的工作裡被看見的。"], ["p", "就在這時候，第四節，波阿斯來了。"], ["q", "「願耶和華與你們同在！」（2:4）"], ["q", "「願耶和華賜福與你！」（2:4）"], ["p", "老闆一進田，第一句話不是查工。"], ["p", "是祝福。"], ["p", "這是士師秉政的年代。"], ["p", "伯利恆在路得記裡，出過兩個悲劇。"], ["p", "現在，同一個伯利恆。"], ["p", "有一塊田，老闆和工人用神的名彼此祝福。"], ["p", "屬神的體系，不一定先從會幕開始。"], ["p", "常常先從一塊田的上下關係開始。"], ["p", "從你對清潔阿姨的一聲問候開始。"], ["p", "然後，波阿斯看見了一個陌生的人。"], ["q", "「那是誰家的女子？」（2:5）"], ["p", "原文直譯是：她屬於誰？"], ["p", "僕人回答的時候，提了兩次摩押。"], ["q", "「是那摩押女子，跟隨拿俄米從摩押地回來的。」（2:6）"], ["p", "她屬於誰？"], ["p", "好像不屬於任何人。"], ["p", "可是僕人也替她作了見證。"], ["p", "她先開口請求，然後等候。"], ["p", "從早晨直到如今，幾乎沒有停過。"], ["p", "今天有很多人第一次走進教會。"], ["p", "心裡也在問：我在這裡，屬於誰？"], ["p", "一句真誠的「願主與你同在」。"], ["p", "可能就是他留下來的第一個理由。"], ["q", "第二件事：投靠在翅膀下。"], ["p", "第八節，波阿斯對路得開口了。"], ["q", "「女兒啊，聽我說，不要往別人田裡拾取麥穗，也不要離開這裡，要常與我使女們在一處。」（2:8）"], ["p", "他先叫她「女兒」。"], ["p", "然後一連三個吩咐。"], ["p", "「常在一處」，原文是 דָּבַק（davaq）。"], ["p", "就是第一章「路得捨不得拿俄米」的那個字。"], ["p", "她緊緊黏住了婆婆。"], ["p", "現在，有人為她找一個可以黏住的地方。"], ["q", "「我已經吩咐僕人不可欺負你」（2:9）"], ["p", "「欺負」，原文是 נָגַע（naga‘）。"], ["p", "直譯就是：碰。"], ["p", "不可碰你。"], ["p", "弟兄姊妹，這一句不是客套話。"], ["p", "一個單身的外邦女子，在一群男工中間。"], ["p", "危險是真實的。"], ["p", "路得記第十九章，伯利恆另一個女子。"], ["p", "在基比亞的街上，終夜被人凌辱。"], ["p", "沒有一個人保護她。"], ["p", "同一個年代，同一個伯利恆。"], ["p", "這一次，有人先開口，把門關上。"], ["p", "波阿斯給路得的第一份恩典，不是糧食。"], ["p", "是安全。"], ["p", "然後是水。"], ["q", "「你若渴了，就可以到器皿那裡喝僕人打來的水。」（2:9）"], ["p", "不是她替人打水，是以色列的少年人打水給她喝。"], ["p", "恩典，把位置倒了過來。"], ["p", "路得聽了，俯伏在地叩拜。"], ["q", "「我既是外邦人，怎麼蒙你的恩，這樣顧恤我呢？」（2:10）"], ["p", "這是本章第二次「在誰的眼中蒙恩」。"], ["p", "這一節，原文有一個很美的雙關。"], ["p", "「顧恤我」是 לְהַכִּירֵנִי（lehakkireni），認出我。"], ["p", "「外邦人」是 נָכְרִיָּה（nokhriyyah），陌生人。"], ["p", "路得是在說："], ["p", "我是一個沒有人認得的人。"], ["p", "你為甚麼認得我？"], ["p", "恩典最深的地方，不在多少麥穗。"], ["p", "在於被看見。"], ["p", "她沒有說：我很勤快，這是我該得的。"], ["p", "她越蒙恩，越把自己放低。"], ["q", "「自從你丈夫死後，凡你向婆婆所行的……這些事人全都告訴我了。」（2:11）"], ["p", "她怎樣對待一個空了的婆婆，人全都告訴了波阿斯。"], ["p", "然後，波阿斯為她禱告。"], ["q", "「願耶和華照你所行的賞賜你。你來投靠耶和華－以色列神的翅膀下，願你滿得他的賞賜。」（2:12）"], ["p", "請注意，波阿斯沒有說：以後我來照顧你。"], ["p", "他沒有把焦點放在自己身上。"], ["p", "他把路得指向神的翅膀。"], ["p", "「翅膀」，原文是 כָּנָף（kanaf）。"], ["q", "「你要投靠在他的翅膀底下」（詩 91:4）"], ["p", "一隻母鳥張開翅膀。"], ["p", "小鳥躲到底下。"], ["p", "「滿得」，原文是 שְׁלֵמָה（shelemah），完全的。"], ["p", "拿俄米說，耶和華使我空空地回來。"], ["p", "波阿斯說，願你滿得祂的賞賜。"], ["p", "這是全卷第一次，有人為這個空的家，求一個滿。"], ["p", "可是這個賞賜，不是工錢。"], ["p", "她是「來投靠」的人。"], ["p", "是躲到翅膀底下的小鳥。"], ["p", "投靠的人，所得的一切都是恩典。"], ["p", "還有一件事，要到第三章才看得見。"], ["p", "第三章，路得會對波阿斯說："], ["q", "「求你用你的衣襟遮蓋我」（3:9）"], ["p", "「衣襟」的原文，就是這個 כָּנָף。"], ["p", "波阿斯求神用翅膀遮蔽她。"], ["p", "後來，神差波阿斯自己去遮蓋她。"], ["p", "神回答禱告，常常是差那個禱告的人自己去。"], ["p", "你為一個人禱告了很久嗎？"], ["p", "也許神正在問你：你願不願意成為答案？"], ["q", "「我主啊，願在你眼前蒙恩。我雖然不及你的一個使女，你還用慈愛的話安慰我的心。」（2:13）"], ["p", "這是第三次「在你眼中蒙恩」。"], ["p", "而且一次比一次低。"], ["p", "這裡她說：我連你一個使女都不如。"], ["p", "「安慰我的心」，原文直譯是："], ["p", "你對著我的心說話。"], ["p", "一個在異鄉喪夫的女人。"], ["p", "她最缺的，不只是糧食。"], ["p", "是有人對著她的心說話。"], ["p", "你看見了嗎？謙卑帶動謙卑。"], ["p", "路得的謙卑，引出波阿斯的慈愛。"], ["p", "波阿斯的慈愛，又引出路得更深的謙卑。"], ["p", "謙卑帶動謙卑，兩個人都回到本位。"], ["p", "然後，是午飯的時間。"], ["q", "「你到這裡來吃餅，將餅蘸在醋裡。」（2:14）"], ["p", "路得原本在田邊。"], ["p", "現在被請到了桌邊。"], ["p", "「遞給她」這個動詞，原文是單數的「他」。"], ["p", "最自然的讀法，是波阿斯自己。"], ["p", "田主親手把烘了的穗子，遞給撿穗的人。"], ["p", "他沒有只吩咐別人，他自己服事。"], ["q", "「她吃飽了，還有餘剩的。」（2:14）"], ["p", "「吃飽」這個字，全卷只出現在這一章。"], ["p", "第一章的空，第一次被一頓午飯填了一角。"], ["p", "波阿斯對僕人下了兩道命令。"], ["q", "「她就是在捆中拾取麥穗，也可以容她，不可羞辱她」（2:15）"], ["q", "「並要從捆裡抽出些來，留在地下任她拾取，不可叱嚇她。」（2:16）"], ["p", "弟兄姊妹，我們回到開頭那塊田。"], ["p", "律法說，不可割盡田角。"], ["p", "這是神給的底線。"], ["p", "可是波阿斯做的，比底線多。"], ["p", "他不只留下田角。"], ["p", "他叫人從捆裡抽出來，放在地上。"], ["p", "不是忘了掉的。"], ["p", "是故意留的。"], ["p", "而且，他保住了她的尊嚴。"], ["p", "不可羞辱她，不可叱嚇她。"], ["p", "他讓她照樣自己拾取。"], ["p", "她仍然用自己的雙手工作。"], ["p", "只是地上的穗子，多了。"], ["p", "好的幫助，不會讓人覺得自己是乞丐。"], ["p", "聖經是我的準則。"], ["p", "可是準則告訴我們的，是至少要做到哪裡。"], ["p", "準則是底線，不是天花板。"], ["p", "愛不會停在最低標準。"], ["p", "這使我們想起保羅說的那一位："], ["q", "「他本來富足，卻為你們成了貧窮，叫你們因他的貧窮，可以成為富足。」（林後 8:9）"], ["p", "我們的主，不只給我們留下田角。"], ["p", "祂把自己給了我們。"], ["q", "第三件事：是一個至近的親屬。"], ["p", "第十七節，太陽下山了。"], ["q", "「這樣，路得在田間拾取麥穗，直到晚上，將所拾取的打了，約有一伊法大麥。」（2:17）"], ["p", "恩典沒有取消她的勞苦。"], ["p", "對一個撿穗的人，這是很驚人的分量。"], ["p", "她還做了一件很溫柔的事。"], ["q", "「又把她吃飽了所剩的給了婆婆。」（2:18）"], ["p", "她在別人的桌上吃飽了。"], ["p", "第一個想到的，是家裡那個還沒吃的人。"], ["p", "拿俄米一看，嚇了一跳。"], ["q", "「你今日在哪裡拾取麥穗，在哪裡做工呢？願那顧恤你的得福。」（2:19）"], ["p", "還沒等到答案，就先祝福了。"], ["p", "弟兄姊妹，這是拿俄米回到伯利恆以後。"], ["p", "口中第一次出現祝福。"], ["p", "「顧恤你的」，原文就是第十節那個字。"], ["p", "認出你、看見你的人。"], ["p", "她還不知道是誰。"], ["p", "已經知道，有人看見了她的媳婦。"], ["p", "路得把名字留到最後才說。"], ["q", "「我今日在一個名叫波阿斯的人那裡做工。」（2:19）"], ["p", "然後，全卷的樞紐來了。"], ["q", "「願那人蒙耶和華賜福，因為他不斷地恩待活人死人。」（2:20）"], ["p", "弟兄姊妹，請把這一句，和第一章放在一起。"], ["p", "剛回到伯利恆的時候，她說："], ["q", "「耶和華降禍與我；全能者使我受苦。」（1:21）"], ["p", "同一個人，同一位神。"], ["p", "從哀歌，變成了祝福。"], ["p", "中間只隔了一天的拾穗。"], ["p", "一伊法的大麥。"], ["p", "和一個名字。"], ["p", "她的處境，還沒有改變。"], ["p", "丈夫沒有回來，兒子也沒有回來。"], ["p", "可是她的觀點，先改變了。"], ["p", "「不斷地恩待」，原文直譯是："], ["p", "沒有撇下祂的慈愛。"], ["p", "「慈愛」就是 חֶסֶד（chesed）。"], ["p", "是立了約、就不放手的愛。"], ["p", "「他不斷地恩待」的「他」，是誰？"], ["p", "有人說是波阿斯，是他善待死人的家。"], ["p", "有人說是耶和華，因為最近的名詞是耶和華。"], ["p", "原文最自然的讀法，是指耶和華。"], ["p", "可是神的慈愛，正是藉著波阿斯臨到的。"], ["p", "兩者並不衝突。"], ["p", "拿俄米看見的，是一個人的善待。"], ["p", "她認出來的，是神沒有撇下。"], ["q", "「那是我們本族的人，是一個至近的親屬。」（2:20）"], ["p", "「至近的親屬」，原文是 גֹּאֵל（go’el）。"], ["p", "這是全卷最重要的一個字。"], ["q", "「他至近的親屬就要來把弟兄所賣的贖回。」（利 25:25）"], ["p", "所以 גֹּאֵל，就是贖回的人。"], ["p", "是願意為家人付代價的人。"], ["p", "這是全卷第一次。"], ["p", "חֶסֶד 和 גֹּאֵל，在同一節相遇了。"], ["p", "慈愛，有了一個名字。"], ["p", "盼望，也有了一個名字。"], ["p", "前半卷是空，後半卷是贖。"], ["p", "第二十節，是轉身的那一步。"], ["p", "這使我們想起另一位，成了我們弟兄的主。"], ["q", "「所以，他稱他們為弟兄也不以為恥」（來 2:11）"], ["p", "祂付上了代價，把我們贖回來。"], ["p", "最後三節，很安靜。"], ["p", "路得告訴婆婆，波阿斯叫她緊隨他的僕人。"], ["p", "敘述者在這裡，又叫她「摩押女子路得」。"], ["p", "她蒙了恩，出身卻沒有被抹掉。"], ["p", "神接納她，不需要她假裝自己不是摩押人。"], ["p", "神不看你從哪裡來，看你歸向誰。"], ["q", "「女兒啊，你跟著他的使女出去，不叫人遇見你在別人田間，這才為好。」（2:22）"], ["p", "這位婆婆，開始保護她的媳婦了。"], ["p", "先是祝福，然後是看顧。"], ["p", "她從自己的痛裡，抬起頭來了。"], ["q", "「於是路得與波阿斯的使女常在一處拾取麥穗，直到收完了大麥和小麥。路得仍與婆婆同住。」（2:23）"], ["p", "從大麥到小麥，大約七個星期。"], ["p", "只是天天去田裡。"], ["p", "波阿斯也還沒有開口。"], ["p", "路得的忠心，不是一天的熱情。"], ["p", "是一整季的重複。"], ["p", "信心不只在高峰。"], ["p", "也在看不出進展的季節裡，照樣去田裡。"], ["p", "弟兄姊妹，我們回到那塊收割完的田。"], ["p", "田角那一點，還在那裡。"], ["p", "也許你今天，就站在那個田角。"], ["p", "你覺得自己是被割剩的那一點。"], ["p", "你像拿俄米一樣說：我是空的。"], ["p", "那一點，不是被忘記的。"], ["p", "是神刻意留的。"], ["p", "神沒有撇下活人，也沒有忘記死人。"], ["p", "也許你今天，是那塊田的主人。"], ["p", "你願不願意多留下一點？"], ["p", "不只是留田角。"], ["p", "是從捆裡抽出來，故意放在地上。"], ["p", "還要保住別人的尊嚴。"], ["p", "今天回家，有三件小事。"], ["p", "第一，晚上睡前問一問自己。"], ["p", "今天，神透過誰看見了我？"], ["p", "把那個名字寫下來，為他感謝神。"], ["p", "第二，這個禮拜，記住一個陌生人的名字。"], ["p", "一位新住民，一位外籍看護，一位新來的組員。"], ["p", "叫出他的名字，對著他的心說一句話。"], ["p", "第三，你為誰禱告了很久？"], ["p", "問一問神：我可以怎樣成為那個答案？"], ["p", "如果你今天正在很深的痛裡，還說不出祝福。"], ["p", "沒有關係，神可以承受你誠實的話。"], ["p", "會後請私訊同工或小組長，讓我們陪你走一段。"], ["p", "耶穌是我的榜樣。"], ["p", "祂是那位不以我們為恥的親屬。"], ["p", "讓祂作王，不再讓自己的眼睛作王。"], ["p", "在人的慈愛裡，把一切的榮耀歸給神。"], ["p", "我們一起低頭禱告。"], ["p", "親愛的天父，謝謝你在我們看不見的時候，仍然在做工。"], ["p", "謝謝你藏在「恰巧」裡，藏在一個人的慈愛裡。"], ["p", "主啊，我們有時候像拿俄米，覺得自己是空的。"], ["p", "求你讓我們看見，田已經熟了。"], ["p", "求你讓我們投靠在你的翅膀底下。"], ["p", "也求你使用我們，成為別人禱告的答案。"], ["p", "叫我們留下田角，也保住人的尊嚴。"], ["p", "謝謝你差來那位贖回我們的主。"], ["p", "祂付了代價，從來沒有撇下我們。"], ["p", "奉主耶穌基督的名禱告，阿們。"]]}, "3": {"min": 18, "blocks": [["h", "《求你用你的衣襟遮蓋我》"], ["p", "弟兄姊妹平安，今天我們一起讀路得記第三章。"], ["p", "我們先不到打穀場。"], ["p", "我們先到一家醫院。"], ["p", "想像一下，凌晨兩點。"], ["p", "醫院的走廊很長，燈開了一半。"], ["p", "手術室門口，有一排藍色的塑膠長椅。"], ["p", "長椅上坐著一個女兒。"], ["p", "她的母親晚上十點被推進去。"], ["p", "護理師說，大概要四個鐘頭。"], ["p", "四個鐘頭過了，門還沒有開。"], ["p", "她手裡握著一杯早就冷掉的咖啡。"], ["p", "該簽的字，她都簽了。"], ["p", "該問的問題，她都問了。"], ["p", "現在，她甚麼都不能做了。"], ["p", "她只能坐著。"], ["p", "門上那盞紅燈一直亮著。"], ["p", "有一次，門開了一條縫。"], ["p", "她整個人站起來。"], ["p", "出來的是另一家的醫生。"], ["p", "她又坐下。"], ["p", "天快亮的時候，紅燈熄了。"], ["p", "主刀的醫生走出來，拉下口罩。"], ["p", "他只說了一句話："], ["q", "「成了，手術很順利。」"], ["p", "她整夜的力氣，一下子都鬆掉了。"], ["p", "弟兄姊妹，那一整夜，她最需要的是甚麼？"], ["p", "不是更多的主意。"], ["p", "她的主意已經用完了。"], ["p", "她需要知道一件事。"], ["p", "門後面，有一個人不肯停手。"], ["p", "那個人，正在替她把事情辦成。"], ["p", "路得記第三章，最後就停在這樣一張長椅上。"], ["p", "拿俄米對路得說："], ["q", "「女兒啊，你只管安坐等候，看這事怎樣成就，因為那人今日不辦成這事必不休息。」（3:18）"], ["p", "今天的章題，是第九節路得的一句話："], ["q", "「求你用你的衣襟遮蓋我，因為你是我一個至近的親屬。」（3:9）"], ["p", "今天我們講三件事。"], ["p", "第一，我不當為你找個安身之處嗎？"], ["p", "第二，求你用你的衣襟遮蓋我。"], ["p", "第三，你只管安坐等候。"], ["q", "第一件事：我不當為你找個安身之處，使你享福嗎？"], ["p", "第二章結束的時候，拿俄米抬起頭來了。"], ["p", "她說了一句全卷的樞紐："], ["q", "「願那人蒙耶和華賜福，因為他不斷地恩待活人死人。」（2:20）"], ["p", "第三章一開頭，她就開口了。"], ["q", "「女兒啊，我不當為你找個安身之處，使你享福嗎？」（3:1）"], ["p", "請注意，這是拿俄米第一次替別人盤算。"], ["p", "第一章的她，說自己是空的。"], ["p", "現在，她叫路得「女兒」。"], ["p", "她問的，是路得的好處。"], ["p", "「安身之處」這四個字，原文很有意思。"], ["p", "原文是 מָנוֹחַ（manoach）。"], ["p", "我們翻回第一章第九節。"], ["p", "拿俄米在摩押的路上，為兩個兒婦祝福："], ["q", "「願耶和華使你們各在新夫家中得平安！」（1:9）"], ["p", "「平安」原文是 מְנוּחָה（menuchah）。"], ["p", "兩個字，出自同一個字根。"], ["p", "在第一章，主詞是耶和華。"], ["p", "願耶和華使你們得安歇。"], ["p", "在第三章，主詞變成了「我」。"], ["p", "我要為你去找。"], ["q", "禱告沒有被收回，禱告的人站了起來。"], ["p", "她為甚麼站得起來？"], ["p", "因為她先看見了神的慈愛沒有斷。"], ["p", "不是她先動，逼神配合。"], ["p", "是神先動，她才醒過來。"], ["p", "接著，她說出了計畫。"], ["p", "波阿斯今夜在場上簸大麥。"], ["p", "第三節，她吩咐路得："], ["q", "「你要沐浴抹膏，換上衣服，下到場上」（3:3）"], ["p", "這三個動作，舊約另一處也連在一起。"], ["p", "大衛的孩子死了以後。"], ["p", "他從地上起來，沐浴，抹膏，換了衣裳。"], ["p", "那是一個人走出居喪的動作。"], ["p", "所以這句話最先要說的，不是打扮。"], ["p", "是路得可以脫下寡婦的日子了。"], ["p", "弟兄姊妹，這個計畫有沒有風險？"], ["p", "有。"], ["p", "一個外邦寡婦，夜裡到打穀場。"], ["p", "萬一被人看見，她在伯利恆就無處容身。"], ["p", "所以有人說，拿俄米是在操縱。"], ["p", "想替神把事情推快一點。"], ["p", "也有人說，這是信心。"], ["p", "她看見神的慈愛，就起身配合。"], ["p", "經文怎麼說？"], ["p", "經文沒有評語。"], ["p", "它沒有把拿俄米立為模範。"], ["p", "也沒有責備她。"], ["p", "可是請看她計畫的最後一句："], ["q", "「他必告訴你所當做的事。」（3:4）"], ["p", "她把下一步，交在波阿斯的品格上。"], ["p", "她在第二章看過這個人。"], ["p", "看過他怎樣待一個外邦寡婦。"], ["p", "這不是設局。"], ["p", "是給一個敬畏神的人，作決定的機會。"], ["p", "路得怎麼回答？"], ["q", "「凡你所吩咐的，我必遵行。」（3:5）"], ["p", "這一句，常常被講成孝道條款。"], ["p", "媳婦就該聽婆婆的。"], ["p", "經文不支持這種講法。"], ["p", "第一章，婆婆一再勸她回去。"], ["p", "她沒有照做。"], ["p", "到了打穀場，她開口說的話。"], ["p", "也不在婆婆的劇本裡。"], ["p", "她的順服，根基在第一章。"], ["p", "「你的神就是我的神」。"], ["p", "她不是怕婆婆，她是信得過婆婆的神。"], ["q", "被愛的人才甘心順服；被逼的人只會服從。"], ["q", "第二件事：求你用你的衣襟遮蓋我。"], ["p", "現在我們進到打穀場。"], ["p", "這一段，我要特別小心地讀。"], ["p", "因為這是全卷最常被講歪的一段。"], ["p", "有人講得曖昧，有人乾脆跳過。"], ["p", "也有人拿來教人怎樣追求。"], ["p", "這三種講法，經文都不支持。"], ["p", "我們的原則很簡單。"], ["p", "經文寫多少，我們就讀多少。"], ["q", "「波阿斯吃喝完了，心裡歡暢，就去睡在麥堆旁邊。」（3:7）"], ["q", "「路得便悄悄地來掀開他腳上的被，躺臥在那裡。」（3:7）"], ["p", "「腳上的被」，原文是 מַרְגְּלוֹת（margelot）。"], ["p", "字面意思，是「腳的地方」。"], ["p", "有學者認為，這幾個字寫得很含蓄。"], ["p", "經文確實留下了張力。"], ["p", "可是經文也親手把張力解開。"], ["p", "它告訴我們結果。"], ["p", "波阿斯稱她是賢德的女子。"], ["p", "他指著永生的耶和華起誓，照律法辦。"], ["p", "她天還沒亮就起來了。"], ["q", "經文刻意含蓄，我們就照它的含蓄來讀。"], ["p", "「心裡歡暢」，原文是「他的心好了」。"], ["p", "讀過路得記的人，會覺得心裡一緊。"], ["p", "路得記第十九章，也有伯利恆。"], ["p", "也有吃喝之後，心裡歡暢的夜。"], ["p", "同樣牽連著伯利恆，同一種夜。"], ["p", "路得記走向暴力。"], ["p", "路得記走向保護。"], ["q", "「到了夜半，那人忽然驚醒，翻過身來，不料有女子躺在他的腳下。」（3:8）"], ["p", "「不料」，原文是「看哪」。"], ["p", "我們被放進波阿斯的眼睛裡。"], ["p", "黑夜，麥堆旁邊，一個認不出來的人影。"], ["p", "真正的品格，不在白天的田間。"], ["p", "是在半夜驚醒的那一刻。"], ["p", "他開口第一句話是："], ["q", "他就說：「你是誰？」（3:9）"], ["p", "弟兄姊妹，這是全卷最要緊的一個問題。"], ["p", "路得的回答，是全卷最勇敢的一句話。"], ["q", "「我是你的婢女路得。」（3:9）"], ["p", "她沒有說，我是摩押女子。"], ["p", "也沒有說，我是瑪倫的遺孀。"], ["p", "她說，我是你的婢女。"], ["p", "「婢女」這個字，也很細。"], ["p", "第二章她說，自己不及他的一個使女。"], ["p", "那裡用的是 שִׁפְחָה（shifchah），最低一等的侍女。"], ["p", "這裡她用 אָמָה（’amah）。"], ["p", "是一個可以被娶進家中的身分。她不抬高自己，也不貶低自己。"], ["p", "她站在一個請求者的本位上。"], ["p", "然後，她改了婆婆的劇本。"], ["p", "婆婆說，他必告訴你所當做的事。"], ["p", "路得卻自己先開口了："], ["q", "「求你用你的衣襟遮蓋我」（3:9）"], ["p", "「衣襟」原文是 כָּנָף（kanaf）。"], ["p", "這個字，我們在第二章讀過。"], ["p", "第二章，波阿斯為路得祝福："], ["q", "「你來投靠耶和華－以色列神的翅膀下」（2:12）"], ["p", "「翅膀」，原文也是 כָּנָף。"], ["p", "同一個字。"], ["p", "這一夜，她對他說："], ["p", "那就請你展開你的翅膀。"], ["q", "波阿斯成了他自己禱告的答案。"], ["p", "弟兄姊妹，神回答禱告。"], ["p", "常常是差那個禱告的人自己去。"], ["p", "你為一個人禱告了很久。"], ["p", "有一天，神可能對你說："], ["p", "那你去吧，你去當他的遮蓋。"], ["p", "這句話是求婚嗎？"], ["p", "以西結書第十六章，神用衣襟搭在人身上。"], ["p", "緊接著說，與你結盟。"], ["p", "那是立約娶妻的語言。"], ["p", "所以，這確實是一個婚姻的請求。"], ["p", "可是請聽她給的理由："], ["q", "「因為你是我一個至近的親屬。」（3:9）"], ["p", "「至近的親屬」，原文是 גֹּאֵל（go’el）。"], ["p", "就是「贖回的人」。"], ["p", "路得不是在為自己找一個男人。"], ["p", "她是在為一個家，求一位贖回者。"], ["p", "求他履行神律法裡的本分。"], ["p", "叫以利米勒的家，不至斷絕。"], ["p", "所以，這一章不是戀愛指南。"], ["p", "不是教人怎樣追求，怎樣主動。"], ["p", "也不是拿來論斷誰的婚前界線。"], ["p", "它是一個寡婦，為死去的家求救贖。"], ["p", "波阿斯怎麼回應？"], ["p", "第一句不是答應，是祝福。"], ["q", "「女兒啊，願你蒙耶和華賜福。你末後的恩比先前更大」（3:10）"], ["p", "「恩」原文是 חֶסֶד（chesed）。"], ["p", "是超過義務的忠誠之愛。"], ["p", "先前的，是她離開父母，跟隨婆婆。"], ["p", "末後的，是她連婚姻也交給這個家。"], ["p", "她還年輕，她有選擇。"], ["p", "波阿斯說，少年人無論貧富，你都沒有跟從。"], ["p", "她大可以為自己挑一個合意的人。"], ["p", "她卻選了一位能為這個家盡本分的人。"], ["q", "被要求的付出是本分，甘心的付出才是慈愛。"], ["p", "接著，波阿斯說："], ["q", "「女兒啊，現在不要懼怕，凡你所說的，我必照著行」（3:11）"], ["p", "半夜的危險裡，他第一句是「不要懼怕」。"], ["p", "「凡你所說的，我必照著行」。"], ["p", "這句話，幾乎就是路得對婆婆說的那句。"], ["p", "路得用信任回應拿俄米。"], ["p", "波阿斯用同樣的信任回應路得。"], ["p", "然後，是經文對這一夜的定論："], ["q", "「我本城的人都知道你是個賢德的女子。」（3:11）"], ["p", "「賢德」原文是 חַיִל（chayil）。"], ["p", "第二章說波阿斯是個大財主。"], ["p", "原文是 גִּבּוֹר חַיִל，有才德的勇士。"], ["p", "同一個字。"], ["p", "他有田產，她有品格。"], ["p", "在神眼中，兩個人站在同樣的高度。"], ["p", "箴言最後一章問："], ["q", "「才德的婦人誰能得著呢？」（箴 31:10）"], ["p", "「才德的婦人」，原文和這裡完全一樣。"], ["p", "有些抄本把路得記排在箴言後面。箴言問了一個問題。"], ["p", "下一卷，就給了一個名字。"], ["p", "一個摩押女子，一個貧窮的寡婦。"], ["p", "弟兄姊妹，也許你是新住民。"], ["p", "也許你是外籍配偶，或是在外地的移工。"], ["p", "你常覺得，別人先看見你的口音。"], ["p", "這一節告訴你，神看見的是你的品格。"], ["q", "神不看你從哪裡來，看你歸向誰、怎樣活。"], ["p", "可是故事在這裡轉了一個彎。"], ["p", "波阿斯可以立刻答應。"], ["p", "他沒有。"], ["q", "「我實在是你一個至近的親屬，只是還有一個人比我更近。」（3:12）"], ["p", "照律法，贖回的責任照遠近排序。"], ["p", "越近的，越先。"], ["p", "波阿斯若在這一夜就作主。"], ["p", "他得著了想要的。"], ["p", "卻踩過了另一個人的位分。"], ["p", "他守住自己的本位，也守住別人的本位。"], ["p", "你看，這一夜兩個人都回到了本位。"], ["p", "路得說，我是你的婢女。"], ["p", "波阿斯說，還有一個人比我更近。"], ["p", "驕傲是離開本位，抓住權力。"], ["p", "謙卑是放下權力，回到本位。"], ["q", "真正的愛不走捷徑，因為它在乎每一個人在神面前的位置。"], ["p", "然後，他起了一個誓："], ["q", "「倘若不肯，我指著永生的耶和華起誓，我必為你盡了本分」（3:13）"], ["p", "夜裡私下的請求，被他帶回神的面前。"], ["p", "帶回律法的次序裡。"], ["q", "「路得便在他腳下躺到天快亮，人彼此不能辨認的時候就起來了。」（3:14）"], ["p", "波阿斯說，不可使人知道有女子到場上來。"], ["p", "這是遮掩嗎？"], ["p", "不是。"], ["p", "他剛說過，全城都知道她是賢德的女子。"], ["p", "他要保護的，正是這份名譽。"], ["p", "他也在保護程序。"], ["p", "那位更近的親屬還沒有表態。"], ["p", "事情要在城門口，光明正大地辦。"], ["p", "臨走之前，他撮了六簸箕大麥，幫她扛在肩上。"], ["p", "不必把「六」數算成甚麼奧祕。"], ["p", "經文要我們看見的，只是一個慷慨周到的人。"], ["p", "保護一個人的名譽，是愛的一部分。"], ["p", "我們要學波阿斯。"], ["p", "連別人可能受的傷，也替他先想到。"], ["q", "第三件事：你只管安坐等候。"], ["p", "天亮了，路得回到家。"], ["p", "拿俄米問她一句話。"], ["p", "和合本譯作："], ["q", "婆婆說：「女兒啊，怎麼樣了？」（3:16）"], ["p", "可是原文，和第九節是同一句話。"], ["p", "「你是誰？」"], ["p", "半夜，波阿斯問她，你是誰。"], ["p", "天亮，婆婆又問她，你是誰。"], ["p", "出門的時候，她是一個寡婦。"], ["p", "回來的時候，她已經是一位贖回者起誓要承擔的人。"], ["q", "一夜之間，處境還沒改變，身分已經不同了。"], ["p", "路得放下大麥，轉述了一句話。"], ["p", "這句話，第十五節沒有記。"], ["p", "敘述者特意留到這裡，讓拿俄米親耳聽見："], ["q", "「你不可空手回去見你的婆婆。」（3:17）"], ["p", "「空手」，原文是 רֵיקָם（reqam）。"], ["p", "這個字，全卷只出現兩次。"], ["p", "第一次，是拿俄米自己說的："], ["q", "「我滿滿地出去，耶和華使我空空地回來。」（1:21）"], ["p", "她說的是一首哀歌。"], ["p", "神沒有責備她的哀歌。"], ["p", "神也沒有跟她講道理。"], ["p", "祂用一份沉甸甸的大麥回應她。"], ["q", "有人特別吩咐：不要讓她的家空手。"], ["p", "然後，那個一直在盤算的拿俄米，說了一句話："], ["q", "「女兒啊，你只管安坐等候，看這事怎樣成就」（3:18）"], ["p", "她不再出主意了。"], ["p", "第一章，她勸媳婦回去。"], ["p", "第三章，她安排了一整夜。"], ["p", "現在，她說：坐下吧。"], ["p", "為甚麼她坐得住？"], ["p", "因為她知道一件事："], ["q", "「那人今日不辦成這事必不休息。」（3:18）"], ["p", "「休息」這個字，原文是 שָׁקַט（shaqat）。"], ["p", "讀過路得記的人，對這個字很熟。"], ["p", "路得記一再說，國中太平幾十年。"], ["p", "「太平」，就是這個字。"], ["p", "可是到了基甸以後，這句話再也沒有出現。"], ["p", "路得記的人，都在求自己的安靜。"], ["p", "路得記換了一個方向。"], ["q", "是一位贖回的人不肯休息，好叫別人得安息。"], ["p", "拿俄米在第一節說，要為路得找安身之處。"], ["p", "到了第十八節，她知道有人會替她找到。"], ["p", "該做的，她們都做了。"], ["p", "剩下的，交在那位不肯休息的人手裡。"], ["p", "弟兄姊妹，安坐等候不是放棄。"], ["p", "是該做的做完了，不再用自己的焦慮去推。"], ["p", "很多時候，我們比拿俄米還坐不住。"], ["p", "等檢查報告的時候。"], ["p", "等孩子回家的時候。"], ["p", "等一個人回心轉意的時候。"], ["p", "我們一直滑手機，一直打電話。"], ["p", "321說，用心靠聖靈，不要用腦靠自己。"], ["p", "用心就開心，用腦就煩惱。"], ["p", "用腦的人，一直在想下一步怎麼推。"], ["p", "用心的人，知道門後面有一位。"], ["p", "「至近的親屬」這個身分。"], ["p", "使我們想起那位成了我們弟兄的主。"], ["p", "祂付上代價，把我們贖回來。"], ["p", "聖經說："], ["q", "「因為他是長遠活著，替他們祈求。」（來 7:25）"], ["p", "你在長椅上坐著的時候，祂沒有休息。"], ["p", "祂在父面前，替你把事情辦成。"], ["p", "這使我們想起十字架上的那一聲："], ["q", "就說：「成了！」（約 19:30）"], ["p", "那一句「成了」，不是一場手術的結果。"], ["p", "是我們一切罪債的了結。"], ["p", "因為祂不肯休息，我們才能安息。"], ["q", "真正的安息，是有一位不肯休息的贖回者，替我們把事辦成。"], ["p", "弟兄姊妹，我們回到那條醫院走廊。"], ["p", "那個女兒，在長椅上坐了一整夜。"], ["p", "有些人，現在就坐在這樣的長椅上。"], ["p", "也許是真的在醫院。"], ["p", "也許是在等一份判決，等一個消息。"], ["p", "也許是一位喪偶的長輩，一個人守著空房子。"], ["p", "也許是一對夫妻，等一個一直沒有來的孩子。"], ["p", "我不會對你說，等一下就好了。"], ["p", "我也不會說，你要更有信心。"], ["p", "我只想把拿俄米這句話，輕輕放在你手裡。"], ["p", "你只管安坐等候。"], ["p", "那人今日不辦成這事，必不休息。"], ["p", "今天回去，有三件小事。"], ["p", "第一，如果你還在用腦盤算。"], ["p", "把那件事寫在紙上，交給主，說一句："], ["p", "主啊，該做的我做了，剩下的交給你。"], ["p", "第二，想一想，誰是你的那一個「2」。"], ["p", "你為他禱告很久了。"], ["p", "這個禮拜，也許神要你去當他的遮蓋。"], ["p", "一通電話，一頓飯，一份實在的幫助。"], ["p", "第三，如果你正坐在長椅上。"], ["p", "不要一個人坐。"], ["p", "會後請私訊同工或小組長。"], ["p", "讓我們陪你一起坐，一起等。"], ["p", "我們一起低頭禱告。"], ["p", "親愛的天父，謝謝你從不撇下活人死人。"], ["p", "謝謝你在我們空空的時候，送來沉甸甸的大麥。"], ["p", "主啊，我們常常坐不住。"], ["p", "我們用腦盤算，越盤算越煩惱。"], ["p", "求你教我們做完該做的，就安坐等候。"], ["p", "求你讓我們像路得，站在本位上求告你。"], ["p", "也讓我們像波阿斯，在沒有人看見的夜裡敬畏你。"], ["p", "主耶穌，謝謝你是我們至近的親屬。"], ["p", "你成了我們的弟兄，付上代價贖回我們。"], ["p", "你長遠活著，替我們祈求。"], ["p", "求你記念此刻坐在長椅上的每一個人。"], ["p", "讓他們知道，你沒有休息，你正在辦成。"], ["p", "奉主耶穌基督的名禱告，阿們。"]]}, "4": {"min": 18, "blocks": [["h", "《今日沒有撇下你》"], ["p", "弟兄姊妹平安，今天我們一起讀路得記第四章。"], ["p", "我先請你想像兩張紙。"], ["p", "第一張，是一頁家譜。"], ["p", "一張泛黃的紅紙，夾在老家神桌的抽屜裡。"], ["p", "上面只有十個名字。"], ["p", "毛筆字，一代一代，往下寫。"], ["p", "十個名字，幾百年。"], ["p", "可是每一個名字，都有人記得。"], ["p", "清明的時候，有人會唸出來。"], ["p", "第二張紙，是一份地契。"], ["p", "也是在抽屜裡找到的。"], ["p", "這一張，寫得滿滿的。"], ["p", "賣主的名字，買主的名字。"], ["p", "見證人一排，蓋了七八個印。"], ["p", "寫得清清楚楚，一個都不少。"], ["p", "可是今天，家裡沒有一個人記得。"], ["p", "這些人是誰？"], ["p", "最後是誰保住了它？"], ["p", "沒有人知道。"], ["q", "一張只有十個名字的家譜，人人記得；一張寫滿名字的契約，沒有人記得。"], ["p", "弟兄姊妹，路得記第四章，剛好就是這兩張紙。"], ["p", "前半章，是一份契約。"], ["p", "後半章，是一份家譜。"], ["p", "從法勒斯，一直寫到大衛。"], ["p", "奇妙的是，契約裡最重要的那個人。"], ["p", "那個比波阿斯更有權利贖地的人。"], ["p", "經文沒有留下他的名字。"], ["p", "波阿斯叫他：某人。"], ["p", "今天這一章的題目，是婦人們對拿俄米說的一句話："], ["q", "「耶和華是應當稱頌的！因為今日沒有撇下你，使你無至近的親屬。」（4:14）"], ["p", "今天我們講三件事。"], ["p", "第一，我不能贖了。"], ["p", "第二，你們今日作見證。"], ["p", "第三，拿俄米得孩子了。"], ["q", "第一件事：我不能贖了。"], ["p", "第三章結束在一個清晨。"], ["p", "拿俄米對路得說了一句話："], ["q", "「你只管安坐等候，看這事怎樣成就，因為那人今日不辦成這事必不休息。」（3:18）"], ["p", "第四章第一節，波阿斯就到了城門。"], ["p", "昨夜在打穀場答應的事。"], ["p", "今天一早，就帶到全城最公開的地方。"], ["p", "那裡是法院，是市場，也是廣場。"], ["p", "波阿斯沒有私下處理。"], ["p", "他把一件家裡的事，放到眾人面前。"], ["p", "在路得記那個「各人任意而行」的年代。"], ["p", "有一個人，堅持照著規矩辦事。"], ["p", "然後經文說："], ["q", "「恰巧波阿斯所說的那至近的親屬經過。」（4:1）"], ["p", "「恰巧」，原文只是一個字：看哪。"], ["p", "וְהִנֵּה（vehinneh）。"], ["p", "神的名字沒有出現，只看見時機剛剛好。"], ["p", "第二章，路得恰巧到了波阿斯的田。"], ["p", "第四章，那人恰巧經過城門。"], ["p", "神沒有出聲。"], ["p", "可是事情一件一件，對上了。"], ["p", "波阿斯叫住他："], ["q", "「某人哪，你來坐在這裡。」（4:1）"], ["p", "請停在「某人」這兩個字。"], ["p", "原文是 פְּלֹנִי אַלְמֹנִי（peloni ’almoni）。"], ["p", "兩個字押韻，就像中文說「某某人」。"], ["p", "波阿斯當然知道他叫甚麼。"], ["p", "可是敘述者沒有把名字寫下來。"], ["p", "有學者說，這只是古代的匿名。"], ["p", "沒有褒，也沒有貶。"], ["p", "也有學者說，這是安靜的對照。"], ["p", "等一下你就會看見為甚麼。"], ["p", "這兩種說法，我們都保留。"], ["p", "不寫名字，是敘述者的選擇。"], ["p", "但這不是定罪。"], ["p", "經文沒有一個字責備這個人。"], ["p", "波阿斯又請了十位長老坐下。"], ["p", "然後他開口，先談的是地，不是路得。"], ["q", "「從摩押地回來的拿俄米，現在要賣我們族兄以利米勒的那塊地」（4:3）"], ["p", "讀到這裡，我們才知道。"], ["p", "空空地回來的拿俄米，名下還有一塊地。"], ["p", "只是一個老寡婦，沒有丈夫，沒有兒子。"], ["p", "律法早為這樣的人，預備了一條路。"], ["q", "「你的弟兄若漸漸窮乏，賣了幾分地業，他至近的親屬就要來把弟兄所賣的贖回。」（利 25:25）"], ["p", "地是神的，人只是寄居的。"], ["p", "贖回，是不讓一個家從應許裡消失。"], ["p", "波阿斯說話很有分寸。"], ["q", "「我想當贖那塊地的是你，其次是我，以外再沒有別人了。」（4:4）"], ["p", "他把選擇權，完整地交出去。"], ["p", "你若肯贖就贖，若不肯就告訴我。"], ["p", "那人一口答應："], ["q", "「我肯贖。」（4:4）"], ["p", "原文多加了一個「我」，語氣加重。"], ["p", "אָנֹכִי אֶגְאָל（’anokhi ’eg’al）。"], ["p", "以人的算盤看，這是一筆好買賣。"], ["p", "拿俄米年老，沒有繼承人。"], ["p", "地贖回來，多半就併入他自己的產業。"], ["p", "他答應得很快。"], ["p", "因為他看見的，是一塊地。"], ["p", "然後，波阿斯說出了後半句。"], ["q", "「你從拿俄米手中買這地的時候，也當娶死人的妻摩押女子路得，使死人在產業上存留他的名。」（4:5）"], ["p", "這一節，原文有一個有名的異讀。"], ["p", "「也當娶」，希伯來原文寫的是「也從路得那裡」。"], ["p", "動詞寫的是「我買」，讀的是「你買」。"], ["p", "學者有幾種讀法，和合本照的是與第十節平行的那一種。"], ["p", "可是不管哪一種讀法，結果都一樣。"], ["p", "地和路得，被綁在一起了。"], ["p", "買這塊地的人，要扛起一個寡婦。"], ["p", "還要為死人生一個兒子。"], ["p", "地將來，也歸那個孩子。"], ["p", "那人立刻算清楚了。"], ["q", "「這樣我就不能贖了，恐怕於我的產業有礙。」（4:6）"], ["p", "「有礙」原文是 אַשְׁחִית（’ashchit）。"], ["p", "直譯是：免得我毀了我自己的產業。"], ["p", "他出錢出力，最後卻是替別人的家買。"], ["p", "他也許還有自己的妻兒要顧。"], ["p", "弟兄姊妹，這裡我們必須說清楚。"], ["p", "這個人沒有違法。"], ["p", "他也沒有欺負任何人。"], ["p", "申命記本來就容許人說「我不願意」。"], ["p", "經文沒有罵他。"], ["p", "講台也不可以把他講成壞人。"], ["p", "我們每一個人，也常常這樣算。"], ["p", "這樣對我不利。"], ["p", "這樣我的時間、我的錢、我的將來，會被拖住。"], ["p", "說「我不能」的人，不一定是壞人。"], ["p", "可是經文要我們看一個對照。"], ["q", "他保住了產業，經文卻沒有留下他的名字。"], ["p", "他最怕的，是自己的產業受損。"], ["p", "他保住了。"], ["p", "可是他的名字，沒有留下來。"], ["p", "這就是 321 說的「有己」。"], ["p", "有己，不一定是作惡。"], ["p", "有己，常常只是很合理地，先顧自己。"], ["p", "一個人可以完全合法，卻錯過了愛。"], ["q", "第二件事：你們今日作見證。"], ["p", "那人不贖了，接下來怎麼辦？"], ["p", "敘述者停下來，為我們解釋一個習俗。"], ["q", "「從前，在以色列中要定奪什麼事，或贖回，或交易，這人就脫鞋給那人。」（4:7）"], ["p", "為甚麼一隻鞋可以作證據？"], ["p", "古代的人，腳踏上一塊地，就是取得那塊地。"], ["p", "把鞋交出去，等於說："], ["p", "這塊地，我不再踏上去了。"], ["p", "這是一個看得見的簽名。"], ["p", "有人會想起申命記。"], ["p", "不肯盡本分的人，寡婦要脫他的鞋。"], ["p", "還要吐唾沫在他臉上。"], ["p", "他的家，要被稱為「脫鞋之家」。"], ["p", "可是請你仔細看，這裡不一樣。"], ["p", "脫鞋的是他自己，不是寡婦。"], ["p", "沒有唾沫，沒有惡名。"], ["q", "「你自己買吧！」（4:8）"], ["p", "一句話，一隻鞋。"], ["p", "他把責任，交到願意的人手中。"], ["p", "敘述者沒有讓這個人受辱。"], ["p", "放手，可以有尊嚴。"], ["p", "接手，也不必踩著別人。"], ["p", "弟兄姊妹，家族處理產業的時候。"], ["p", "教會交接服事的時候。"], ["p", "也需要這樣透明、體面的程序。"], ["p", "不拖延，不私下，也不羞辱說「我不能」的人。"], ["p", "然後，波阿斯轉向長老和眾民。"], ["q", "「你們今日作見證，凡屬以利米勒和基連、瑪倫的，我都從拿俄米手中置買了」（4:9）"], ["p", "請注意他念出了三個名字。"], ["p", "以利米勒，基連，瑪倫。"], ["p", "第一章，這三個名字是三座墳。"], ["p", "拿俄米說不出口，只說：我是空的。"], ["p", "第四章，有人在全城面前，大聲念出來。"], ["p", "是為了存留。"], ["p", "接著是第十節。"], ["q", "「又娶了瑪倫的妻摩押女子路得為妻，好在死人的產業上存留他的名，免得他的名在本族本鄉滅沒。」（4:10）"], ["p", "讀到這裡，我們才第一次知道。"], ["p", "路得，是瑪倫的妻。"], ["p", "她被放回一個家裡，有了位置。"], ["p", "經文還是叫她「摩押女子路得」。"], ["p", "沒有抹掉她的出身。"], ["p", "神接納她，不需要她假裝自己不是摩押人。"], ["p", "可是她不再是田邊撿穗子的外人。"], ["p", "她是在城門前，被公開迎娶的妻子。"], ["p", "「滅沒」原文是 יִכָּרֵת（yikkaret）。"], ["p", "被剪除，被剪掉。"], ["p", "這兩節，一頭一尾是同一句話。"], ["p", "עֵדִים אַתֶּם הַיּוֹם（‘edim ’attem hayyom）。"], ["p", "你們今日是見證人。"], ["p", "為甚麼要眾人作見證？"], ["p", "因為愛不只是心裡的感動。"], ["p", "愛也需要公開的承諾。"], ["p", "波阿斯把自己交在見證人面前。"], ["p", "同一件事，兩個人。"], ["p", "一個看見帳目，一個看見人。"], ["p", "那位親屬怕自己的產業受損。"], ["p", "波阿斯在乎死人的名字不被剪除。"], ["q", "無己的人付代價，為死人存留名字。"], ["p", "這就是「無己」。"], ["p", "無己，不是沒有產業，不是沒有算盤。"], ["p", "波阿斯是大財主，他當然會算。"], ["p", "他算完以後，還是選擇了人。"], ["p", "321 說：人比事重要，關係比東西重要。"], ["p", "不要為了東西，破壞關係。"], ["p", "在城門口，這句話有了一張臉。"], ["p", "這使我們想起另一位。"], ["p", "那位不以稱我們為弟兄為恥的主。"], ["q", "「他為我們捨了自己，要贖我們脫離一切罪惡」（多 2:14）"], ["p", "我們說「這使我們想起」，不說更多。"], ["p", "新約沒有說波阿斯是誰的影子。"], ["p", "我們也不去猜鞋子、猜長老。"], ["p", "可是至近的親屬這個身分。"], ["p", "叫我們想起那位成了我們弟兄的主。"], ["p", "祂不是保住自己的。"], ["p", "祂是倒空了自己。"], ["p", "城門前的眾人，不只作見證，還開口祝福。"], ["q", "「願耶和華使進你家的這女子，像建立以色列家的拉結、利亞二人一樣。」（4:11）"], ["p", "「建立」原文是 בָּנוּ（banu），建造。"], ["p", "和「兒子」בֵּן（ben）聲音很像。"], ["p", "拉結和利亞，都是從異地嫁來的。"], ["p", "長老們用以色列的建國之母，來祝福一個摩押女子。"], ["p", "沒有人再問她從哪裡來。"], ["p", "只問神要藉她建立甚麼。"], ["p", "他們又提到一個名字：她瑪。"], ["q", "「使你的家像她瑪從猶大所生法勒斯的家一般。」（4:12）"], ["p", "她瑪也是無子的寡婦。"], ["p", "猶大家不肯盡弟兄的本分。"], ["p", "她冒險，為亡夫立後。"], ["p", "猶大最後承認：她比我更有義。"], ["p", "伯利恆的長老沒有把它藏起來。"], ["p", "他們好像在說："], ["p", "神曾經從那樣的破口，建立了我們。"], ["p", "神也必從這個摩押寡婦，建立你的家。"], ["q", "屬神的家，不是靠出身乾淨蓋起來的，是靠神的恩典蓋起來的。"], ["q", "第三件事：拿俄米得孩子了。"], ["p", "第十三節，節奏忽然變快了。"], ["q", "「於是，波阿斯娶了路得為妻，與她同房。耶和華使她懷孕生了一個兒子。」（4:13）"], ["p", "弟兄姊妹，全卷八十五節。"], ["p", "敘述者只親口說了兩次，神做了甚麼。"], ["p", "第一次，是第一章第六節。"], ["p", "耶和華眷顧自己的百姓，賜糧食與他們。"], ["p", "第二次，就在這裡。"], ["p", "耶和華使她懷孕。"], ["p", "其餘的時候，神都藏著。"], ["p", "藏在「恰巧」裡，藏在一個人的慈愛裡。"], ["p", "可是在一頭一尾，敘述者把簾子拉開。"], ["p", "開頭給的，是糧食。"], ["p", "結尾給的，是生命。"], ["p", "原文直譯是：耶和華給了她懷孕。"], ["p", "懷孕，被寫成一份禮物。"], ["p", "路得在摩押十年，沒有孩子。"], ["p", "經文沒有解釋原因。"], ["p", "也從來沒有說，那是懲罰。"], ["p", "所以，這一節要小心講。"], ["p", "它不是保證：只要信，神就一定給你孩子。"], ["p", "也不是說：沒有孩子，就是神不恩待你。"], ["p", "它說的是，生命是神賜的。"], ["p", "在等候中的人，神也看見。"], ["p", "接著，伯利恆的婦人們出現了。"], ["p", "還記得第一章嗎？"], ["q", "「這是拿俄米嗎？」（1:19）"], ["p", "就是這同一群婦人。"], ["p", "那時拿俄米對她們說："], ["q", "「我滿滿地出去，耶和華使我空空地回來。」（1:21）"], ["p", "四章之後，她們回答她了。"], ["p", "她們沒有說：你看，你以前錯了。"], ["p", "也沒有說：早告訴你要有信心。"], ["p", "她們說：耶和華是應當稱頌的！"], ["p", "回應哀歌的，不是責備，是頌讚。"], ["p", "頌讚的對象，也不是波阿斯。"], ["p", "是耶和華。"], ["p", "這裡的「至近的親屬」，指的是誰？"], ["p", "有人說是波阿斯。"], ["p", "可是緊接的經文，主詞都是那個孩子。"], ["p", "從上下文看，最自然是指這個嬰孩。"], ["p", "全卷講了那麼多次「至近的親屬」。"], ["p", "最後一次，竟然指一個剛出生的孩子。"], ["p", "婦人們接著說："], ["q", "「他必提起你的精神，奉養你的老」（4:15）"], ["p", "「提起你的精神」，原文是 מֵשִׁיב נֶפֶשׁ（meshiv nefesh）。"], ["p", "直譯是：使你的生命歸回。"], ["p", "同一個「歸回」，從第一章一路走到這裡。"], ["p", "拿俄米的身體，在第一章就回來了。"], ["p", "她的生命，到這一天才真正回來。"], ["p", "然後，是全卷最翻轉的一句話。"], ["q", "「有這兒婦比有七個兒子還好！」（4:15）"], ["p", "兒子就是依靠，兒子就是福氣。"], ["p", "七個兒子，是人能想像的最大的福。"], ["p", "可是婦人們公開說："], ["p", "一個愛你的摩押媳婦，勝過七個兒子。"], ["p", "這是全卷第一次明說，路得愛拿俄米。"], ["p", "這句話，把傳宗接代的價值。"], ["p", "翻轉成愛的價值。"], ["p", "弟兄姊妹，我們華人很熟悉那種壓力。"], ["p", "生了沒有？是男的還是女的？"], ["p", "也許你只有女兒。"], ["p", "也許你們結婚多年，一直沒有孩子。"], ["p", "也許你被「香火」兩個字，壓得抬不起頭。"], ["p", "今天這一節，不是要再加給你一個重擔。"], ["p", "它是要把重擔拿下來。"], ["p", "神看重的，不是兒子的數目。"], ["p", "是愛的真實。"], ["p", "接著，第十六節。"], ["q", "「拿俄米就把孩子抱在懷中，作他的養母。」（4:16）"], ["p", "那雙手，在摩押埋葬了丈夫和兩個兒子。"], ["p", "現在，抱著一個嬰孩。"], ["p", "失去的，仍然是失去的。"], ["p", "神的安慰，不是抹掉傷痛。"], ["p", "是在傷痛旁邊，放下一個新的生命。"], ["p", "然後鄰舍的婦人說："], ["q", "「拿俄米得孩子了！」（4:17）"], ["p", "給孩子起名的，不是父親，也不是母親。"], ["p", "是鄰舍的婦人。"], ["p", "一個人的苦難，被一群人看見。"], ["p", "一個人的復原，也由一群人一起慶祝。"], ["p", "她們給他起名叫俄備得。"], ["p", "עוֹבֵד（‘oved），意思是：事奉的人。"], ["p", "然後，敘述者忽然把鏡頭拉遠。"], ["q", "「這俄備得是耶西的父，耶西是大衛的父。」（4:17）"], ["p", "讀到這裡，我們才發現。"], ["p", "這不只是一個寡婦的家務事。"], ["p", "這是王的家譜。"], ["p", "然後就是最後五節，一份家譜。"], ["p", "從法勒斯，寫到大衛。"], ["p", "請你注意，家譜裡沒有拿俄米。"], ["p", "沒有路得，也沒有瑪倫。"], ["p", "可是讀到這裡的人，都知道她們在哪裡。"], ["p", "那位付代價、為別人存留名字的人。"], ["p", "自己的名字，被寫進了王的家譜。"], ["p", "那位怕產業受損的人，完全不見了。"], ["p", "路得記最後一句是："], ["q", "「那時，以色列中沒有王，各人任意而行。」（士 21:25）"], ["p", "路得記原文最後一個字是：大衛。"], ["p", "同一個年代，同一座伯利恆。"], ["p", "人在最黑的時候各行其是。"], ["p", "神卻一代一代，把王預備出來。"], ["p", "一千多年以後，馬太把這份家譜接下去。"], ["p", "還加上了這裡沒有寫的名字。"], ["q", "「撒門從喇合氏生波阿斯；波阿斯從路得氏生俄備得；俄備得生耶西；」（太 1:5）"], ["p", "一個迦南的妓女，一個摩押的寡婦。"], ["p", "被寫進了彌賽亞的家譜。"], ["p", "這是新約自己作的連結。"], ["p", "大衛的子孫，耶穌基督，就是從這條路來的。"], ["p", "弟兄姊妹，我們回到那兩張紙。"], ["p", "那張寫滿名字的地契。"], ["p", "每一個人都很合理，都保住了自己的東西。"], ["p", "今天沒有人記得他們。"], ["p", "那張只有十個名字的家譜。"], ["p", "每一個名字背後，都有人為別人付了代價。"], ["p", "所以一直有人記得。"], ["q", "保住自己的，名字會被忘記；為別人存留名字的，被神記住。"], ["p", "今天回家，有三件事。"], ["p", "第一，請你想一想。"], ["p", "最近一次，你說「這樣對我不利」，是為了甚麼？"], ["p", "是為了一塊地，還是為了一個人？"], ["p", "第二，找出你的那一個「2」。"], ["p", "你身邊有沒有一個拿俄米？"], ["p", "一位喪偶的長輩，一個被遺忘的家人。"], ["p", "這個禮拜，去為他做一件事。"], ["p", "不為自己的名，為他的名。"], ["p", "第三，如果你正在等候。"], ["p", "等一個孩子，等一個家，等一個答案。"], ["p", "請你記得第十四節。"], ["p", "神今日，沒有撇下你。"], ["p", "主耶穌說，要因你們的名記錄在天上歡喜。"], ["p", "我們的名字，不必刻在城門上。"], ["p", "讓耶穌作王，讓祂得著一切的榮耀。"], ["p", "我們一起低頭禱告。"], ["p", "親愛的天父，謝謝你在最黑的年代，沒有撇下拿俄米。"], ["p", "謝謝你藏在恰巧裡，也藏在人的慈愛裡。"], ["p", "主啊，我們承認，我們常常先算自己的產業。"], ["p", "求你給我們勇氣，像波阿斯那樣，為別人付代價。"], ["p", "也求你安慰正在等候、正在流淚的人。"], ["p", "讓他們知道，你今日沒有撇下他們。"], ["p", "謝謝你差來那位真正的至近的親屬，主耶穌基督。"], ["p", "祂贖了我們，把我們這些外人，寫進你的家。"], ["p", "奉主耶穌基督的名禱告，阿們。"]]}}, "issues": [{"id": "ISS00_1", "t": "路得記是誰寫的？甚麼時候寫成？為甚麼在希伯來聖經裡不在路得記後面？", "r": "1:1；4:7、17--22；士 21:25；撒上 16:1", "ch": [1, 4], "why": "翻開中文聖經，路得記緊接在路得記後面，很自然；可是一位讀過希伯來聖經目錄的弟兄會發現，猶太人的聖經把路得記放在第三部分「聖卷」，和路得記隔得很遠。也有人問：書上沒有作者的名字，我們怎麼知道它可靠？講台若把傳統說法講成定論，聽的人一查資料就失去信任；若把年代問題講得太細，又會讓人以為路得記只是學術題目。這一題要講清楚：哪些是經文自己告訴我們的，哪些是後人的推論。", "pos": [["【一】經文問的是甚麼", "", "<p>路得記沒有署名，也沒有交代成書的日子。經文自己只留下三個線索。第一，開頭說：「當士師秉政的時候」（1:1）——<strong>故事發生在士師的年代，寫書的人卻是回頭去看那個年代。<\/strong>第二，4:7 停下來向讀者解釋一個舊習俗：「從前，在以色列中要定奪什麼事，或贖回，或交易，這人就脫鞋給那人。」（4:7）會這樣解釋，表示寫書的時候，這個習俗已經不通行了。第三，全卷最後一個名字是大衛：「俄備得生耶西；耶西生大衛。」（4:22）<\/p><p>所以這一題其實有三個問題：<strong>誰寫的？甚麼時候寫成？為甚麼不同的聖經把它放在不同的位置？<\/strong><\/p>"], ["撒母耳所寫（猶太傳統）", "", "<p>巴比倫塔木德（〈末門篇〉）記載一個古老的傳統：撒母耳寫了他自己的書、路得記和路得記。這個說法有它的道理：撒母耳正是膏大衛的先知，「我差遣你往伯利恆人耶西那裡去」（撒上 16:1）；一卷以「耶西生大衛」作結的書，出自撒母耳之手，很合情理。<\/p><p><strong>難處：<\/strong>經文本身沒有這樣說。而且大衛受膏時還沒有作王，撒母耳也在大衛登基之前就去世了（撒上 25:1）；一卷書若要讓讀者一看到「大衛」就知道他是誰，似乎要等到大衛已經廣為人知以後。這個傳統值得尊重，但不能當作經文的定論。<\/p>"], ["寫於大衛之後（王國早期）", "", "<p>許多學者認為，本書寫於大衛作王之後，可能在所羅門的時代或稍後。理由是：4:7「從前」表示寫書的人和故事之間隔了相當的時間；4:17、22 以大衛作結，表示大衛的名字已經家喻戶曉；家譜停在大衛，沒有提到所羅門，又像是寫在王國早期。全卷的希伯來文也被不少人認為屬於古典的散文風格。<\/p><p><strong>難處：<\/strong>家譜停在大衛，也可能只是因為本書要回答的就是「大衛從哪裡來」，不一定表示寫書的人不認識所羅門；語言風格的判斷，學者之間也有不同意見。<\/p>"], ["被擄歸回之後成書", "", "<p>另一派認為，本書在被擄歸回之後才寫成或定稿。理由是：書中有幾個字被認為帶著較晚期的語言色彩；4:7 的解釋表示寫書時離故事已經很遠；而且一卷以「摩押女子」為主角、肯定她被接納的書，正好可以和以斯拉、尼希米時代處理異族通婚的經文（拉 10:3；尼 13:23）放在一起讀。<\/p><p><strong>難處：<\/strong>所謂「晚期用字」在早期文獻裡也找得到例子；而「回應以斯拉、尼希米」是從書的用途推出年代，容易先有結論再找證據。路得記全卷沒有一句提到聖殿、被擄或歸回。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：作者與年代並陳，不作定論；經文能確定的是——故事發生在士師的年代，寫成在大衛的名字已經人人知道之後。<\/strong>撒母耳說、大衛之後說、被擄後說各有理由，也各有難處；這些都不影響本書的可信與權威。聖經的權威來自神的默示，不來自我們能不能叫出作者的名字。<\/p><p>正典的位置也並陳。<strong>希伯來正典<\/strong>把路得記放在「聖卷」，是「五卷節期書卷」之一（另外四卷是雅歌、耶利米哀歌、傳道書、以斯帖記），傳統上在七七節（五旬節）誦讀——因為故事從「動手割大麥的時候」（1:22）走到「收完了大麥和小麥」（2:23），正是收割的季節。有些希伯來抄本把它排在箴言之後，讓「才德的婦人誰能得著呢」（箴 31:10）緊接著路得這位「賢德的女子」（3:11）。<strong>七十士譯本<\/strong>則依故事的年代，把它放在路得記之後，我們的中文聖經也沿用這個次序。<\/p><p>兩種排列都在幫我們讀：放在路得記之後，讓我們看見「沒有王」（士 21:25）的年代怎樣走到「大衛」（4:22）；放在聖卷之中，讓我們在收割的節期，記得神怎樣在一個寡婦的家裡收割恩典。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>不該。舊約有許多書卷都沒有署名，神選擇讓作者隱藏起來，好叫我們的眼睛停在書裡的那一位神身上。路得記本身就是一本「神藏起來」的書：敘述者只在 1:6 和 4:13 兩處直接說神做了甚麼；連作者的名字，也一起藏起來了。<\/p><p>你不必先解決年代問題才能讀路得記。<strong>你需要確定的只有一件事：這卷書所見證的神，在最黑的年代沒有撇下祂的百姓。<\/strong>作者是誰可以存疑；「耶和華是應當稱頌的！因為今日沒有撇下你」（4:14），不必存疑。<\/p>"]], "con": [], "say": "本講義的立場：作者與年代並陳——塔木德的撒母耳說、大衛之後說、被擄後說各有理由與難處，不作定論；經文能確定的是故事在士師的年代，成書在大衛已經人人知道之後。希伯來正典把它放在聖卷，是五卷節期書卷之一，在七七節誦讀；七十士譯本依年代放在路得記之後。兩種次序都在幫我們讀這卷書。", "care": "這一題最容易傷到兩種人：一種是剛開始接觸學術資料、心裡動搖的年輕人，講台若把傳統講成鐵板一塊，他一查就以為聖經被拆穿了；另一種是單純信靠的長輩，講台若把各家學說講得太細，他會以為讀聖經要先讀學位。講的時候，先肯定問問題是好的，再分清「經文說的」和「學者推論的」。會後若有人仍有疑問，可以私訊同工或小組長，一起慢慢讀，不必一次解決。"}, {"id": "ISS00_2", "t": "路得記為甚麼被寫下來？是大衛的家譜、外邦人的接納，還是慈愛的神學？", "r": "4:17--22；1:8、16；2:20；3:10；4:13--14；太 1:5；撒上 22:3--4；拉 10:3；尼 13:23", "ch": [1, 2, 3, 4], "why": "一卷書的目的，決定它被怎樣講。若以為路得記只是「大衛的家譜」，講台會只看第 4 章最後五節；若以為它是「外邦人的接納」，講台會把它講成一篇社會議題；若以為它是「婆媳相處的範本」或「美麗的愛情故事」，就完全離開了經文。學者對本書的寫作目的提出了好幾種看法，各有根據。講台若只挑一種、否定其他，會讓會眾看不見這卷書的豐富；若完全不談，會眾又只帶走一個溫馨故事，看不見神。", "pos": [["【一】經文問的是甚麼", "", "<p>路得記沒有像約翰福音那樣明說「記這些事要叫你們信」。我們只能從它怎樣開始、怎樣結束、反覆用甚麼字，去看它要說甚麼。它的結尾是一份家譜：「俄備得生耶西；耶西生大衛。」（4:22）它的主角一直被稱為「摩押女子路得」（1:22；2:2、21；4:5、10）。它最重要的兩個字，一個是 חֶסֶד（慈愛、恩待；見 1:8；2:20；3:10），一個是「至近的親屬／贖」（גֹּאֵל）。而神的作為只被敘述者直接說了兩次（1:6；4:13），其餘的時候都藏在「恰巧」與人的善行裡。<\/p><p>所以問題是：<strong>這卷書主要是為了交代大衛的來歷、肯定外邦人的接納、描繪神的慈愛，還是見證神隱藏的護理？<\/strong><\/p>"], ["大衛家譜的見證", "", "<p>這一說認為，路得記的目的是說明大衛的祖先，並且見證大衛的家是在神的手中預備的。故事結束在「耶西是大衛的父」（4:17），再用一份十代的家譜把法勒斯接到大衛（4:18--22）。大衛曾把父母託給摩押王照顧（撒上 22:3--4），他家族裡的摩押血統，路得記給了一個交代：那不是羞恥，而是神的恩典。<\/p><p><strong>難處：<\/strong>如果目的只是家譜，前面四章的細節——拾穗、翅膀、衣襟、城門——就成了很長的引言。大衛的名字直到 4:17 才第一次出現，表示作者要我們先走完這段路，才看見那個結局。<\/p>"], ["外邦人的接納（可能回應異族通婚問題）", "", "<p>這一說注意到全卷不斷強調路得的出身，而她卻被伯利恆接納、被稱為「賢德的女子」（3:11）、進入大衛的家譜。有學者認為，本書是在以斯拉、尼希米處理異族通婚（拉 10:3；尼 13:23）的時代，提出另一個角度：一個真心歸向耶和華的外邦人，應當被接納。<\/p><p><strong>難處：<\/strong>這一說建立在被擄後成書的年代上，而年代本身還沒有定論。路得記全卷也沒有一句話在反駁律法，或辯論通婚政策；把它讀成政治文件，容易蓋過它安靜的敘事。本講義對這一說並陳，不裁判。<\/p>"], ["慈愛（חֶסֶד）的神學與神隱藏的護理", "", "<p>這一說認為，路得記的核心是「慈愛」：拿俄米求神「恩待你們，像你們恩待已死的人與我一樣」（1:8）——求神照人的樣子待人；到了 2:20，「他不斷地恩待活人死人」；到了 3:10，被稱讚有慈愛的竟是那個外邦女子。神的慈愛透過人的慈愛被看見，而神的手藏在「恰巧」（2:3；4:1）裡。最後，婦人們稱頌的不是波阿斯，是耶和華（4:14）。<\/p><p><strong>難處：<\/strong>這一說最能涵蓋全卷，但若只講「慈愛」的抽象主題，容易忽略本書那個很具體的終點：大衛。神學主題需要落在歷史上。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：幾種寫作目的並陳，不裁判哪一種是唯一的答案；它們不是互相排斥，而是疊在一起的。<\/strong>路得記可以同時交代大衛的來歷、肯定一個歸向耶和華的外邦人、描繪神的慈愛、見證神隱藏的手。一卷四章的書，可以有一個以上的心意。<\/p><p>講台上最要守住的，是這幾種讀法共同的焦點：<strong>不是路得，也不是波阿斯，而是那位「沒有撇下你」的神（4:14）。<\/strong>家譜說的是祂預備王；接納說的是祂敞開門；慈愛說的是祂的心；「恰巧」說的是祂的手。新約把這份家譜接下去：「波阿斯從路得氏生俄備得」（太 1:5）——這是新約自己作過的連結，講台可以放心說：神在一個外邦寡婦的捨己裡，預備了大衛，也預備了大衛的子孫。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>這件事不會削弱你的信心，反而會擴大你讀聖經的眼光。學者看見的不同目的，其實是同一卷書的不同面；就像一塊寶石，從幾個角度看都在發光。<\/p><p>你可以從自己最需要的那一面進來：若你正在空的季節，就從「慈愛」讀起；若你覺得自己是外人，就從「接納」讀起；若你看不見神，就從「恰巧」讀起。<strong>但無論從哪一面進來，最後都要走到 4:14 的那一句稱頌。<\/strong>讀完路得記，若你只記得一個美麗的故事，請再讀一次；若你記得的是那位不撇下人的神，你就讀懂了。<\/p>"]], "con": [], "say": "本講義的立場：大衛家譜的見證、外邦人的接納（包括有學者認為是回應以斯拉、尼希米時代的異族通婚問題）、慈愛的神學、神隱藏的護理，幾種寫作目的並陳，不裁判，彼此疊在一起而不互相排斥。它們共同的焦點不是路得或波阿斯，而是那位「沒有撇下你」的神（4:14）。", "care": "這一題最容易被拿來作政治或族群辯論：有人用「外邦人的接納」攻擊某些群體，有人反過來用以斯拉記否定外籍配偶。講的時候不要影射任何國家、族群或教會的政策。團契裡有新住民、外籍配偶、移工，也有在異鄉工作的華人，這兩邊的人都要聽得到神的接納。會後若有人因自己的出身感到被排斥，請私訊同工或小組長，陪他讀 1:16 與 4:14，不急著談政策。"}, {"id": "ISS00_3", "t": "波阿斯是基督的預表嗎？預表的界線在哪裡？", "r": "2:20；3:9--13；4:4--10、14；太 1:5；路 3:32；賽 41:14；來 2:11--17；多 2:14；路 24:27", "ch": [2, 3, 4], "why": "這是路得記全卷最重要、也最常越界的一題。許多信徒從小聽過「波阿斯就是耶穌」，講台上也常有人把打穀場講成十字架、六簸箕講成六日創造、脫鞋講成某種屬靈儀式。聽的人覺得很奇妙，回家卻不知道怎樣自己讀聖經——因為那些連結只有講員想得出來。另一頭，也有人因為反對寓意解經，乾脆說路得記與基督無關，結果把主耶穌在以馬忤斯路上講解「經上所指著自己的話」的那種讀法，也一起關在門外。這一題要畫出一條清楚、可以傳下去的界線。", "pos": [["【一】經文問的是甚麼", "", "<p>新約兩次提到波阿斯，都在家譜裡：「波阿斯從路得氏生俄備得」（太 1:5）；「俄備得是波阿斯的兒子」（路 3:32）。<strong>新約沒有一處說波阿斯預表基督。<\/strong><\/p><p>可是路得記自己有一個很重的字：至近的親屬（גֹּאֵל）。它在 2:20 第一次出現，在 3:13 一節之內出現四次，在 4:6 被那位親屬拒絕，在 4:14 又出現一次（多半是指那個嬰孩）。舊約先知也用同一個字稱呼神自己：「你的救贖主就是以色列的聖者」（賽 41:14）。新約則說基督「稱他們為弟兄也不以為恥」（來 2:11），「他為我們捨了自己，要贖我們脫離一切罪惡」（多 2:14）。<\/p><p>所以問題是：<strong>我們可以從波阿斯講到基督嗎？可以講到甚麼程度？界線在哪裡？<\/strong><\/p>"], ["寓意解經（波阿斯＝基督，細節逐項對應）", "", "<p>這是教父與清教徒傳統中常見的讀法：波阿斯是基督，路得是外邦教會，拿俄米是以色列，那位不肯贖的親屬是律法，田間是世界，打穀場是十字架或審判，大麥是福音，六簸箕是六日或某種完全，脫鞋是放棄權利……每一個細節都找到一個屬靈意義。它出於愛主的心，想在全本聖經裡看見基督。<\/p><p><strong>難處：<\/strong>這樣讀沒有經文的控制。同一個細節，不同的講員可以講出完全不同的意義；講完之後，會眾記得的是講員的巧思，而不是經文。更嚴重的是，它會把波阿斯和路得真實的處境——一個外邦寡婦的貧窮、一個人付上的代價——變成密碼，失去了故事本身的分量。<\/p>"], ["預表的節制讀法（身分與行動的相似，不猜細節）", "", "<p>這一派認為，「至近的親屬」不是講員想出來的連結，而是全本聖經自己一路發展的身分：律法規定至近的親屬要贖回窮乏弟兄的地業（利 25:25）；先知稱神為以色列的救贖主（賽 41:14）；新約說基督「凡事該與他的弟兄相同」（來 2:17），成為血肉之體，要「釋放那些一生因怕死而為奴僕的人」（來 2:15）。波阿斯身上看得見這個身分的輪廓：他是親屬，他有權利，他願意付代價，他為死人存留名字。<\/p><p><strong>難處：<\/strong>界線不容易守。講員一高興，「身分的相似」很快就滑回「細節的對應」；而且波阿斯是一個真實的人，他也有限度——他自己說「還有一個人比我更近」（3:12），他得等城門前的程序。這個讀法需要講員自我節制。<\/p>"], ["純歷史讀法（只是大衛的祖先，與基督無關）", "", "<p>這一派反對任何基督論的讀法：路得記是一段歷史，說明大衛的祖先；從波阿斯講到基督，是把新約的觀念讀進舊約。<\/p><p><strong>難處：<\/strong>這會把主耶穌自己的讀法關在門外——祂「從摩西和眾先知起，凡經上所指著自己的話都給他們講解明白了」（路 24:27）。而且馬太把路得的名字寫進彌賽亞的家譜（太 1:5），新約已經把這段歷史接到基督身上。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採「預表的節制讀法」。講台可以說：「至近的親屬這個身分，使我們想起那位成了我們弟兄、付上代價贖回我們的主。」不可以說：「打穀場預表十字架」「六簸箕代表……」「脫鞋象徵……」。<\/strong>「預表」這個詞，本講義只用在新約自己作過的連結上；波阿斯，我們說「這使我們想起」。<\/p><p>講台有三個檢驗：<strong>第一，新約有沒有作過這個連結？第二，是身分與行動的相似，還是細節的猜謎？第三，講完之後，人記得的是基督，還是講員的巧思？<\/strong>三個檢驗都過，才放心講。<\/p><p>這條界線還有一層牧養的意義。路得記最寶貴的不是「找到基督藏在哪裡」，而是看見一個人怎樣像基督那樣付代價愛人。那位親屬說「恐怕於我的產業有礙」（4:6），波阿斯卻說「你們今日作見證」（4:9）。<strong>我們被那一位真正的贖回者贖回，也被呼召去成為別人的「至近的親屬」<\/strong>——這正是「耶穌是我的榜樣」。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>不該，而且會讓你的信心更穩。若基督只能靠講員的巧思才在舊約出現，那你的信心就靠著講員；但若基督是藉著全本聖經自己的線索——一個字、一個身分、一份家譜——被看見，你自己打開聖經也能看見祂。<\/p><p>你也不會失去甚麼。打穀場不必是十字架，那一夜仍然寶貴；六簸箕不必有密碼，它仍然告訴我們：一個人不讓另一個人空手回去（3:17）。<strong>經文照它本來的樣子，就已經夠讓我們看見神的心了。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：新約沒有說波阿斯預表基督，只把他列在家譜裡（太 1:5；路 3:32）。採預表的節制讀法：「至近的親屬」這個身分使我們想起那位成了我們弟兄、付上代價贖回我們的主；不把打穀場、六簸箕、脫鞋逐項寓意化。三個檢驗：新約有沒有作過這個連結？是身分的相似還是細節的猜謎？講完之後人記得的是基督，還是講員？", "care": "這一題最容易讓兩種人受傷。一種是從小聽寓意講法長大的長輩，若講台嘲笑那些讀法，他會覺得自己多年的屬靈經歷被否定——要肯定那份想在聖經裡看見基督的心，只是把方法校正。另一種是單身、正在為婚姻禱告的姊妹，若把「波阿斯＝基督」與「等候一位像波阿斯的人」混在一起，她會把信仰和婚戀期待綁在一起。講的時候，把焦點放在「我們被贖」與「我們去贖人」。有疑問的人，會後請私訊同工或小組長。"}, {"id": "ISS00_4", "t": "「摩押人不可入耶和華的會」（申 23:3），摩押女子路得怎麼能成為大衛的曾祖母？", "r": "1:4、16、22；2:6、10；4:10、13、17；申 23:3--4；尼 13:1--3；賽 56:3、6--7；弗 2:19", "ch": [1, 2, 4], "why": "細心的讀者一定會碰到這一題：申命記明明說摩押人「雖過十代，也永不可入耶和華的會」，路得卻嫁進以色列，成為大衛的曾祖母。有人因此說聖經自相矛盾；有人說「恩典來了，律法就不算數了」；也有人反過來用這節經文說某些族群天生較低。團契的弟兄姊妹散居台灣、馬來西亞、中國、新加坡、紐西蘭，會眾裡有新住民、外籍配偶、移工，也有身在異鄉的華人——這一題講偏了，有人會被標籤，也有人會以為神的聖潔可以隨便放下。", "pos": [["【一】經文問的是甚麼", "", "<p>律法說：「亞捫人或是摩押人不可入耶和華的會；他們的子孫，雖過十代，也永不可入耶和華的會。」（申 23:3）並且說明理由：「因為你們出埃及的時候，他們沒有拿食物和水在路上迎接你們」（申 23:4）。尼希米的時代，百姓讀到這段律法，「就與一切閒雜人絕交」（尼 13:3）。<\/p><p>路得記卻一再提醒我們她的出身：「摩押女子路得」（1:22；2:2、21；4:5、10），監管收割的僕人說「是那摩押女子」（2:6），她自己也說「我既是外邦人」（2:10）。結果她被波阿斯娶為妻，「耶和華使她懷孕生了一個兒子」（4:13），這兒子是大衛的祖父（4:17）。<\/p><p>所以問題是：<strong>路得被接納，是違背了申命記，還是申命記本來就留了空間？神的聖潔與神的恩典，在這裡怎樣同時成立？<\/strong><\/p>"], ["只禁摩押男子（拉比傳統）", "", "<p>猶太拉比的傳統有一句話：「摩押男子，不是摩押女子。」理由是申 23:4 給的原因——沒有拿食物和水在路上迎接以色列——是男人的責任；雇巴蘭咒詛以色列的也是摩押的男人。所以這條禁令只針對男子，路得是女子，不在其內。<\/p><p><strong>難處：<\/strong>在文法上，「摩押人」通常指整個民族，不容易只限男性；而且民 25:1 引誘以色列的正是摩押女子。這個讀法解決了路得的問題，卻不容易從經文本身得到證明。<\/p>"], ["「入耶和華的會」指公共集會，不是婚姻", "", "<p>這一說認為，「入耶和華的會」指的是參與以色列的公共治理或敬拜集會，有特定的資格與職分；它不等於一個人不能嫁給以色列人、住在以色列中間。路得記從來沒有說路得「入會」，只說她歸向了耶和華、嫁給了波阿斯。<\/p><p><strong>難處：<\/strong>這一說要和尼希米記的用法調和——尼希米時代的百姓顯然把這段律法用在更廣的生活上（尼 13:1--3）。「會」的範圍到底多大，學者並沒有共識。<\/p>"], ["恩典勝過禁令（路得是例外，也是預告）", "", "<p>這一說認為，路得是神恩典的例外，也是神將來要成就之事的預告。先知已經說：「與耶和華聯合的外邦人不要說：耶和華必定將我從他民中分別出來。」（賽 56:3）並且應許：「因我的殿必稱為萬民禱告的殿。」（賽 56:7）到了新約：「你們不再作外人和客旅，是與聖徒同國，是神家裡的人了」（弗 2:19）。<\/p><p><strong>難處：<\/strong>這一說若講得不小心，會推成「律法不算數了」「神的聖潔要求可以放下」。神的恩典不是取消祂的聖潔，而是在聖潔之中開了一條路。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：三說並陳，不裁判細節；共同的落點是——路得不是以「摩押人」的身分被接納，是以「你的國就是我的國，你的神就是我的神」（1:16）的身分被接納。神的聖潔沒有放鬆，神的恩典也沒有關門。<\/strong><\/p><p>請留意經文的寫法：它一直叫她「摩押女子路得」，一次也沒有把她的出身抹掉。<strong>神接納她，不需要她假裝自己不是摩押人；但她被接納，是因為她已經投靠在「耶和華－以色列神的翅膀下」（2:12）。<\/strong>拿俄米勸她跟著嫂子回到「她所拜的神」那裡（1:15），她卻選擇了耶和華。這不是族群的問題，是歸屬的問題。<\/p><p>所以本講義的一句話是：<strong>神不看你從哪裡來，看你歸向誰。<\/strong>這句話同時拒絕兩種錯誤：不可用「摩押」「外邦人」講任何族群的高低、把人排在門外；也不可用路得來說「信甚麼都一樣」「神的要求不算數」。我們不從「十代」推算任何數字；我們只看見，在士師最黑暗的年代，神讓一個摩押女子，走進了王的家譜。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>這件事應該使你更認識神：祂的律法是真的，祂的恩典也是真的；祂從來沒有在這兩者之間二選一。聖經沒有把這個難處藏起來——申命記和路得記都留在同一本聖經裡，讓我們誠實地面對。<\/p><p>如果你是一位在異鄉的人，身分證上的國籍、口音、膚色讓你常常覺得自己是外人，請聽路得說：「我既是外邦人，怎麼蒙你的恩」（2:10）。<strong>神沒有要你抹掉你從哪裡來；祂只問你，要歸向誰。<\/strong>而教會，應當是那塊讓外人拾得到穗子的田。<\/p>"]], "con": [], "say": "本講義的立場：申 23:3 的難處並陳三說——只禁摩押男子、「入會」指公共集會、恩典勝過禁令——不裁判細節。共同的落點：路得不是以「摩押人」的身分被接納，是以「你的神就是我的神」（1:16）的身分被接納；經文一直稱她「摩押女子路得」，沒有抹掉她的出身。神不看你從哪裡來，看你歸向誰。", "care": "這一題最容易刺傷新住民、外籍配偶、移工與他們的孩子，也可能刺傷在海外生活、常被當外人的華人。講的時候絕不用「摩押」比喻任何現今的民族或國家，不開族群玩笑，不說「某些人本來就比較……」。同時也要溫柔地說清楚：被接納的關鍵是歸向神，不是抹掉文化。會後若有人分享被排斥的經歷，先聆聽，不急著勸他「要饒恕」；請私訊同工或小組長，陪他找到一個能接住他的小組。"}, {"id": "ISS00_5", "t": "神隱藏的手：「恰巧」是巧合、命定，還是神的護理？", "r": "2:3；4:1；1:6；2:2、12、20；4:13；箴 16:9；創 50:20；傳 9:11；羅 8:28", "ch": [1, 2, 3, 4], "why": "「她恰巧到了……波阿斯那塊田裡」（2:3）是全卷最常被引用的一句，也最常被講歪。有人說這只是運氣；有人說神早已寫好每一步，人怎麼選都一樣；更常見的是成功神學的版本：「只要跟隨神，就會遇到你的貴人、有錢的波阿斯。」講台若講成命定論，受苦的人會以為神故意安排了他的苦；講成成功神學，還在等候的人會懷疑自己是不是不夠屬靈。這一題要講清楚：經文說「恰巧」，到底要我們看見甚麼。", "pos": [["【一】經文問的是甚麼", "", "<p>和合本「恰巧」出現兩次：「她恰巧到了以利米勒本族的人波阿斯那塊田裡」（2:3）；「恰巧波阿斯所說的那至近的親屬經過」（4:1）。2:3 原文是 וַיִּקֶר מִקְרֶהָ，原文直譯「她的機遇遇上了」——同一個字根用了兩次，聽起來像是在強調：這純粹是碰上的。<\/p><p>可是同一卷書裡，敘述者只直接說了兩次神做了甚麼：「耶和華眷顧自己的百姓，賜糧食與他們」（1:6），「耶和華使她懷孕生了一個兒子」（4:13）。其餘的時候，神沒有說話，沒有異象，沒有天使。而拿俄米一聽見波阿斯的名字，就說：「願那人蒙耶和華賜福」（2:20）。<\/p><p>所以問題是：<strong>作者用「恰巧」，是要我們以為這只是運氣，還是要我們在「恰巧」裡看見神？如果是神，那人的選擇還算不算數？<\/strong><\/p>"], ["只是巧合（世界照機遇運行）", "", "<p>這一說照字面讀：路得只是剛好走進那塊田，就像傳道書說的：「所臨到眾人的是在乎當時的機會。」（傳 9:11）世界有很多偶然，不必每一件事都屬靈化。這一說提醒我們不要牽強附會，把每一次停車位都講成神蹟。<\/p><p><strong>難處：<\/strong>這樣讀，會錯過作者的反諷。整卷書從 1:6「耶和華眷顧」寫到 4:13「耶和華使她懷孕」，又讓拿俄米在 2:20 立刻認出神的慈愛；作者用「恰巧」，正是要讀者讀到這裡心裡說：「這不是巧合。」<\/p>"], ["命定論（每一步都預先寫好，人只是照著走）", "", "<p>這一說強調神的主權：路得走進哪一塊田、那位親屬何時經過，都是神早已定好的；人的選擇不影響結果。他們引用「籤放在懷裡，定事由耶和華」（箴 16:33）。<\/p><p><strong>難處：<\/strong>路得記一路寫的是人真實的選擇：俄珥巴選擇回去，路得選擇留下（1:14）；路得選擇去拾穗（2:2）；波阿斯選擇比律法多給（2:15--16）；那位親屬選擇不贖（4:6）。若一切都只是劇本，這些選擇就沒有分量，波阿斯的慈愛也就談不上慈愛。命定論更會讓受苦的人以為：三座墳也是神「寫好」要給拿俄米的。<\/p>"], ["神的護理（神藉著日常與人的選擇做工）", "", "<p>這一說認為，「恰巧」是從人的角度說的，神的手藏在裡面。神不取消人的選擇，而是藉著人的選擇、日常的腳步、甚至人的錯誤，成就祂的心意：「人心籌算自己的道路；惟耶和華指引他的腳步。」（箴 16:9）約瑟也說：「從前你們的意思是要害我，但神的意思原是好的」（創 50:20）。<\/p><p><strong>難處：<\/strong>護理是回頭看才看得清楚的。走在路上的時候，路得並不知道那是誰的田；若講台把護理講成「你現在就要看懂神在做甚麼」，反而給人壓力。護理也不等於保證每一件事都有美好的結局。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：「恰巧」是神的護理——不是巧合，不是命定論，也不是成功神學。<\/strong>作者用人的眼睛寫「恰巧」，用神的眼睛寫全卷；神不取消人的選擇，而是在人的選擇裡做工。路得選擇去，波阿斯選擇善待，神的手在這兩個選擇之間。<\/p><p>請留意路得「恰巧」到了哪裡：她是在「收割的人身後拾取麥穗」（2:3）——在一個窮人、寄居的人、寡婦才去的位置，做最卑微的工作。<strong>神的護理，是在最低的地方被看見的，不是在成功的地方。<\/strong>所以本講義拒絕成功神學：路得記沒有說「跟隨神就會遇到你的貴人、有錢的對象」；路得跟隨神之前已經埋葬了丈夫，跟隨神之後先去拾穗。神的護理不是讓人免去苦難，而是在苦難裡沒有撇下人。<\/p><p>這也正是「聖靈是我的引導」在路得記的樣子：全卷沒有異象、沒有聲音，<strong>引導藏在日常的腳步裡。<\/strong>我們不必等到看懂才走；我們只要像路得一樣，忠心地走今天的那一步。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>這件事應該安慰你。如果你此刻看不見神，路得記告訴你：看不見，不等於神不在。一位一句話都沒有說的神，一直在做工，從饑荒做到嬰孩，從摩押做到伯利恆。<\/p><p>但也請你不要用「恰巧」去計算神。不要把每一次順利都當成神的獎賞，也不要把每一次不順都當成神的懲罰。<strong>你今天也許還在拾穗，還沒有看見城門前的那一天；但請相信，那位在路得的「恰巧」裡做工的神，也在你的日常裡。<\/strong>回頭的那一天，你會說：「耶和華是應當稱頌的！」（4:14）<\/p>"]], "con": [], "say": "本講義的立場：「恰巧」（2:3；4:1）是神的護理——不是巧合，不是命定論，也不是成功神學。作者用人的眼睛寫「恰巧」，用神的眼睛寫全卷；神不取消人的選擇，而是在人的選擇與日常的腳步裡做工。路得是在拾取麥穗這最卑微的工作裡遇見神的護理。神的護理不是保證成功，而是在苦難裡不撇下人。", "care": "這一題最容易刺傷正在等候的人：長年單身的弟兄姊妹、找不到工作的人、在異鄉打拼的移工。講台一說「神會為你安排一個波阿斯」，他們聽到的是「你還沒等到，是你不夠屬靈」。也要小心正在喪親的人，命定論的講法會讓他以為神「安排」了他的痛。講的時候把焦點放在神的同在，不放在結果。會後若有人說「我怎麼一直沒有恰巧」，不要急著保證結局，陪他禱告，並請私訊同工或小組長持續關心。"}, {"id": "ISS00_6", "t": "打穀場的一夜：第三章應該怎樣讀、怎樣講？", "r": "3:1--18；1:9；2:12；4:10；結 16:8；箴 31:10；申 25:5--6", "ch": [3], "why": "第三章是全卷的轉捩點，也是最常被講歪的一章。有的講台渲染那一夜的性暗示，把經文講成曖昧的故事；有的講台錯誤地把它講成求偶技巧——「女生要主動」「要懂得製造機會」；也有的講台乾脆跳過，好像這一章令人尷尬。三種講法都會傷人：渲染讓經文失去聖潔，技巧化讓單身的人受壓，迴避讓會眾自己在網路上找到更糟的解讀。這一章必須好好講，用守護式的講法講。", "pos": [["【一】經文問的是甚麼", "", "<p>拿俄米對路得說：「女兒啊，我不當為你找個安身之處，使你享福嗎？」（3:1）她吩咐路得沐浴抹膏、下到場上，等波阿斯睡下，「就進去掀開他腳上的被，躺臥在那裡，他必告訴你所當做的事」（3:4）。路得照著做了。夜半，波阿斯驚醒，問：「你是誰？」路得回答：「我是你的婢女路得。求你用你的衣襟遮蓋我，因為你是我一個至近的親屬。」（3:9）<\/p><p>經文寫得很含蓄，也交代得很清楚：波阿斯說「我本城的人都知道你是個賢德的女子」（3:11）；他起誓要照律法的次序辦理（3:12--13）；路得「人彼此不能辨認的時候就起來了」（3:14）；她帶著六簸箕大麥回家（3:15）。<\/p><p>所以問題是：<strong>「腳上的被」「躺臥」有沒有性暗示？拿俄米的計畫是信心還是操縱？「用你的衣襟遮蓋我」是甚麼意思？講台應該怎樣講這一夜？<\/strong><\/p>"], ["含蓄暗示的讀法（經文刻意留下張力）", "", "<p>部分學者注意到，「腳上的被」（מַרְגְּלוֹת）的字面意思是「腳的地方」；「掀開」「躺臥」在其他經文裡有時帶著含蓄的意思；夜晚、打穀場、吃喝之後「心裡歡暢」（3:7），都讓這一幕充滿張力。他們認為，作者是刻意寫得模稜兩可，讓讀者感受到那一夜的危險。<\/p><p><strong>難處：<\/strong>看見張力是一回事，渲染是另一回事。經文刻意交代了結果——賢德、起誓、天未亮就起來——作者留下張力，是為了讓我們看見兩個人怎樣在張力中守住本分，而不是讓講台去想像經文沒有寫的事。<\/p>"], ["求婚／求贖的讀法（衣襟是立約的語言）", "", "<p>這一說認為，這一夜的核心是 3:9 那一句請求。「用衣襟搭在身上」是舊約立約娶妻的語言：「便用衣襟搭在你身上，遮蓋你的赤體；又向你起誓，與你結盟」（結 16:8）。路得不是在引誘，而是在一個私下、不讓她蒙羞的場合，正式請求波阿斯照律法履行至近親屬的本分。而且「衣襟」與 2:12 的「翅膀」原文是同一個字 כָּנָף——波阿斯為她禱告求神用翅膀遮蔽她，她就請他成為那個禱告的答案。<\/p><p><strong>難處：<\/strong>這個讀法最貼近經文，但若講台只講「這是古代的求婚禮儀」，可能淡化了拿俄米的計畫確實冒了險；路得一個外邦寡婦，夜裡到男人睡覺的地方，她的名譽與安全都在危險中。<\/p>"], ["計畫的評價：信心的行動，還是人的操縱？", "", "<p>還有一層爭議落在拿俄米身上。有人說她是信心的行動——她在 1:9 求神讓兒婦「得平安」，現在親手去找「安身之處」（3:1），是信心落實在行動裡；也有人說她是操縱——用人的辦法逼一個男人表態。<\/p><p><strong>難處：<\/strong>兩種評價都比經文說得多。敘述者沒有稱讚、也沒有責備她的方法。若講成模範，會眾會以為可以照抄；若講成操縱，又會傷害一位剛剛從喪親之痛裡抬起頭、想為媳婦做點事的婆婆。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採守護式講法——不渲染、不迴避；只用經文原句，不擴寫、不想像任何身體細節。落點是兩個人在危險的夜裡都守住了本位。<\/strong>「腳上的被」的意思並陳：字面是「腳的地方」，有學者讀出含蓄的暗示；但經文交代的結果，就是講台的界線：賢德（3:11）、起誓照律法（3:13）、天未亮就起來（3:14）。拿俄米的計畫，經文沒有評論，本講義也不評為模範或操縱。<\/p><p>這一夜最亮的一筆是：<strong>路得改了劇本。<\/strong>拿俄米說「他必告訴你所當做的事」（3:4），路得卻自己開口，而且開口第一句是「我是你的婢女」——她回到本位；第二句是「求你用你的衣襟遮蓋我，因為你是我一個至近的親屬」——<strong>她不是在求一個男人，是在求一位贖回的人履行神律法裡的本分。<\/strong>波阿斯也守住本位：「只是還有一個人比我更近」（3:12），他不搶別人的權利，不走捷徑。<\/p><p>所以第三章不是婚戀教材：不講「女生要主動」，不給求偶技巧，也不拿來論斷任何婚前的界線——那是其他經文的工作。全章的落點在 3:18：「你只管安坐等候，看這事怎樣成就，因為那人今日不辦成這事必不休息。」<strong>這使我們想起：真正的安息，是有一位不肯休息的贖回者，替我們把事辦成。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>不該。聖經不怕寫人在危險裡的樣子，因為它要讓我們看見：神的百姓在那樣的夜裡，可以守得住。這一章沒有讓聖經變得不潔，反而讓我們看見，在路得記那個人人「任意而行」的年代，有兩個人選擇了照律法、照本分而行。<\/p><p>如果你曾經在這一章讀到令你不安的東西，你可以放心：經文自己已經把結論說清楚了。<strong>它要你記住的不是那一夜的氣氛，而是那一句「求你用你的衣襟遮蓋我」——一個人投靠在神的翅膀下，也求神的百姓成為她的遮蓋。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：第三章採守護式講法——不渲染、不迴避，只用經文原句，不擴寫身體細節。「腳上的被」字面是「腳的地方」，有學者讀出含蓄暗示，但經文交代了結果：賢德、起誓照律法、天未亮就起來。3:9 是求婚／求贖的請求；兩個人都守住了本位。這一章不是婚戀教材，落點是 3:18 交託之後的安靜。", "care": "這一章最容易傷到三種人：正在為婚姻禱告的單身弟兄姊妹（被施壓「要主動」或「要等」）、曾經受過性傷害的人（被渲染的講法再刺一次），以及青少年（被曖昧的講法帶偏）。講的時候語氣平穩，不開玩笑，不用眼神或停頓製造暗示；兒童與青少年場合，只講 3:9 與 3:18。會後若有人分享相關的傷害，不追問細節、不要求原諒；請私訊同工或小組長單獨關心，必要時協助尋求專業協助。"}, {"id": "ISS00_7", "t": "苦難中的哀歌：拿俄米可以說「全能者使我受了大苦」嗎？", "r": "1:13、20--22；2:20；4:14--17；詩 13:1；詩 22:1；伯 42:7；太 27:46；詩 62:8", "ch": [1, 2, 4], "why": "拿俄米在第 1 章一再說是神使她受苦，還要大家改叫她「瑪拉」。許多講台把她講成「埋怨神的負面榜樣」，拿她和路得對比：一個苦毒，一個信心。可是會眾席上正坐著剛失去配偶的長者、流產的母親、長期照顧病人而心力交瘁的家人；他們聽完只學會一件事：在教會裡不可以說真話。另一頭，也有人把哀歌美化成「苦難都是祝福」，叫人趕快感恩。這一題要問：經文自己怎樣看待拿俄米的話。", "pos": [["【一】經文問的是甚麼", "", "<p>拿俄米一再把她的苦歸給神：「耶和華伸手攻擊我」（1:13）；「全能者使我受了大苦」（1:20）；「我滿滿地出去，耶和華使我空空地回來。耶和華降禍與我；全能者使我受苦」（1:21）——單單 1:20–21 兩節，她就四次以神為主詞。1:21「降禍與我」原文是 עָנָה בִי，原文直譯「作見證攻擊我」，像法庭上的用語；和合本的譯法近於七十士譯本「使我降卑」一類的讀法。<\/p><p>值得注意的是經文<strong>沒有說<\/strong>的：敘述者沒有一句責備她；伯利恆的婦人沒有反駁她；神沒有斥責她。下一節，敘述者只說：「正是動手割大麥的時候。」（1:22）<\/p><p>所以問題是：<strong>一個信神的人，可以對神說這樣的話嗎？這是背道、是不信，還是一種信心？<\/strong><\/p>"], ["控訴與苦毒的讀法（她的話是錯的）", "", "<p>這一說認為，拿俄米的話顯示她的屬靈光景低落：她只看見自己失去的，看不見身邊的路得；她把苦難歸咎於神，要人改叫她「瑪拉」，是讓苦毒定義了自己。講台應該用她來提醒人：遇到苦難不要像她那樣。<\/p><p><strong>難處：<\/strong>這一說比經文說得多。經文從來沒有責備拿俄米的哀歌；若敘述者要我們把她當作負面教材，他大可加一句評語，就像路得記常做的那樣，但他沒有。更嚴重的是，這樣講會叫受苦的人閉口，讓他們以為神只能承受好聽的話。<\/p>"], ["哀歌的讀法（誠實的哭訴是信心的一種形式）", "", "<p>這一說把拿俄米的話放在聖經哀歌的傳統裡：「耶和華啊，你忘記我要到幾時呢？」（詩 13:1）「我的神，我的神！為什麼離棄我？」（詩 22:1）約伯說了許多更重的話，神最後卻說他的朋友「議論我不如我的僕人約伯說的是」（伯 42:7）。主耶穌在十字架上也用詩篇第 22 篇呼喊（太 27:46）。拿俄米沒有離開神，她是對著神哭；她沒有說「神不存在」，她說的是「全能者」——她仍然相信神掌權，所以才向祂說。<\/p><p><strong>難處：<\/strong>這一說若講得不平衡，會把哀歌美化，好像人說的每一句話都對。拿俄米說「空空地回來」，其實路得就在她身邊；她的結論不完整。哀歌是可以的，但哀歌不是最後一句話。<\/p>"], ["主權神學的讀法（她說的是正確的神學命題）", "", "<p>這一說強調：拿俄米沒有把苦難歸給命運或別神，而是承認一切都在全能者的手中。她的話在神學上是對的——神是掌權的主，「賞賜的是耶和華，收取的也是耶和華」（伯 1:21）。<\/p><p><strong>難處：<\/strong>這一說若推得太遠，會變成「每一次喪偶、不孕都是神直接降下的懲罰」——這正是路得記沒有說的。經文沒有解釋三個男人為甚麼死，也沒有說那是審判。拿俄米是在痛苦中說話，不是在寫系統神學；把她的哭聲變成教義條文，同樣是聽錯了她。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：拿俄米的話是哀歌，不是背道；哀歌是信心的一種形式。<\/strong>她沒有離開神，她是對著神哭——這使我們想起詩篇的哀歌，「在他面前傾心吐意」（詩 62:8）。講台不可以用「埋怨」「消極」「不信」來定性她，也不可以叫哀哭的人「不要埋怨、要喜樂」；同時也不可以把哀歌美化成「苦難都是祝福」。<\/p><p>經文自己怎樣回應她？<strong>不是用一篇責備，而是用一片大麥田。<\/strong>她說自己是空的，敘述者緊接著說「正是動手割大麥的時候」（1:22）——田已經熟了。到了路得拾穗回家的那個晚上，她說出了「願那人蒙耶和華賜福，因為他不斷地恩待活人死人」（2:20）；她的處境還沒改變，她的觀點先改變了。最後回應她的，是同一群婦人、同一座城：「耶和華是應當稱頌的！因為今日沒有撇下你」（4:14），「有這兒婦比有七個兒子還好」（4:15）。<\/p><p><strong>神可以承受我們誠實的話；神也比我們的結論更大。<\/strong>拿俄米的哀歌不是故事的結局，卻是神願意聽完的一段話。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>這件事應該讓你放心：你可以帶著真實的眼淚來到神面前。信心不是假裝不痛；信心是痛的時候，仍然對著神說話，而不是轉身離開。拿俄米說了最重的話，神沒有離開她，反而在她的路上放了一塊田、一個名字、一個嬰孩。<\/p><p>如果你現在就在 1:21，請你知道：你不必立刻走到 4:14。<strong>你可以先像拿俄米一樣，把空了的心誠實地說出來；也請容許神，像那位敘述者一樣，在你看不見的地方告訴你：「正是動手割大麥的時候。」<\/strong><\/p>"]], "con": [], "say": "本講義的立場：拿俄米的話是哀歌，不是背道；哀歌是信心的一種形式——她沒有離開神，是對著神哭。經文沒有責備她，1:22 緊接著說「正是動手割大麥的時候」，最後回應她的是 4:14--15。講台不用「埋怨」「不信」定性她，不叫受苦的人「不要埋怨、要喜樂」，也不把哀歌美化。神可以承受我們誠實的話，神也比我們的結論更大。", "care": "這一題最容易刺傷正在哀哭的人：喪偶的長者、失去孩子的父母、長年不孕的夫妻、長照家庭裡疲憊的照顧者。講的時候不要說「拿俄米就是太負面」，也不要說「你要感恩，苦難都是祝福」。可以邀請會眾用一句話寫下自己的哀歌，交給神。會後若有人在哭，不對正在流淚的人說「你要有信心」，先陪他坐著；請私訊同工或小組長持續關心，長期無望感者協助尋求專業協助。"}, {"id": "ISS00_8", "t": "這些爭議該不該影響一個人的信心？", "r": "1:16；2:20；3:4、9；4:5、14、17--22；申 23:3；太 1:5；提後 3:16；羅 15:4", "ch": [1, 2, 3, 4], "why": "路得記只有八十五節，爭議卻不少：作者與年代、寫作目的、波阿斯與預表、申 23:3 與摩押女子、「恰巧」與護理、打穀場的一夜、拿俄米的哀歌，還有 2:20「他」指誰、4:5「也當娶」的異讀。有些信徒聽到這麼多「學者不同意見」，心裡開始不安：是不是聖經其實靠不住？另一些人則說「這些都不重要，被感動就好」，從此不再用心讀。這一題是全卷所有議題的收尾，要幫會眾分清楚：哪些是可以存疑的，哪些是可以站穩的。", "pos": [["【一】經文問的是甚麼", "", "<p>本卷講義在每一章都列出了不同的讀法。例如 2:20「他不斷地恩待活人死人」的「他」，可以指耶和華，也可以指波阿斯；3:4「腳上的被」的意思，學者有不同解讀；4:5「也當娶」，希伯來原文本身有「寫的」與「讀的」不同（Ketiv／Qere），和合本採的是改讀；申 23:3 與路得的關係，至少有三種說法。<\/p><p>可是同一卷書裡，也有許多事從來沒有人爭議：一個摩押寡婦說「你的神就是我的神」（1:16）；一位親屬付了代價，為死人存留名字（4:10）；婦人們說「耶和華是應當稱頌的！因為今日沒有撇下你」（4:14）；這個家生出了大衛（4:17），新約又把路得寫進主耶穌的家譜（太 1:5）。<\/p><p>所以問題是：<strong>面對聖經裡的爭議，我們應當怎樣持守信心？<\/strong><\/p>"], ["懷疑的讀法（有爭議就表示不可靠）", "", "<p>這一說認為，若學者對作者、年代、字義都有不同意見，就表示聖經的內容不確定，信仰也就建立在不穩的地基上。<\/p><p><strong>難處：<\/strong>這一說把「我們理解上的不確定」等同於「經文本身的不可靠」。學者爭議的，大多是細節的解讀與背景的推論，而不是故事的核心。任何一份古代文獻都有解讀的爭議；爭議的存在，正表示人認真地讀它，而不是它已經被推翻。<\/p>"], ["迴避的讀法（爭議不重要，被感動就好）", "", "<p>這一說認為，一般信徒不需要知道這些爭議，講台只要講溫暖的故事、讓人被感動就夠了；談太多學問反而讓人失去單純的信心。<\/p><p><strong>難處：<\/strong>迴避會讓會眾毫無準備。有一天他們自己讀到申 23:3，或在網路上看到第三章被渲染的講法，就會以為教會隱瞞了甚麼。更重要的是，「被感動就好」的讀法，最容易把路得記讀成愛情故事或婆媳範本——正是本卷最要防備的誤用。<\/p>"], ["謙卑而站穩的讀法（分清可存疑與可確定）", "", "<p>這一說認為，面對爭議要做兩件事：在經文沒有說清楚的地方謙卑，承認我們不知道；在經文說清楚的地方站穩，不讓細節的爭議動搖核心。「聖經都是神所默示的」（提後 3:16），而「從前所寫的聖經都是為教訓我們寫的，叫我們因聖經所生的忍耐和安慰可以得著盼望」（羅 15:4）。<\/p><p><strong>難處：<\/strong>這需要講台下功夫，也需要會眾有耐心；哪些是「核心」、哪些是「細節」，有時也需要分辨。但這條路最誠實，也最能把信心傳給下一代。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：爭議應該讓我們更謙卑、更用心讀經，不應該讓我們動搖對神的信靠。在經文沒有說清楚的地方並陳各家；在經文說清楚的地方站穩。<\/strong><\/p><p>本卷可以存疑、並陳的有：作者與年代（議題「路得記是誰寫的？甚麼時候寫成？為甚麼在希伯來聖經裡不在路得記後面？」）、寫作目的的主次、2:20「他」的指涉、3:4 字義的範圍、4:5 的異讀、申 23:3 三說的細節。<\/p><p>本卷可以站穩、不必存疑的有：<strong>神在士師最黑暗的年代沒有撇下祂的百姓；一個歸向耶和華的外邦人被接納；慈愛藉著人付上代價而臨到；神的手藏在日常的「恰巧」裡；空的被填滿，沒有王的年代生出了王的祖先；而新約把這份家譜接到了主耶穌身上（太 1:5）。<\/strong><\/p><p>本講義並陳爭議，不是要讓人困惑，而是要讓人看見：我們不是靠解決所有問題才信，而是因為認識那位「今日沒有撇下你」的神（4:14），才有勇氣面對問題。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>不該動搖，卻應該讓你成長。你不需要成為學者才能信；但你也不必害怕學者的問題。一個人可以說「這一節我還不確定」，同時說「這位神我確定」。拿俄米在第 1 章有很多不明白，路得在打穀場上也不知道明天會怎樣；她們都沒有等到全部明白，才把自己交給神。<\/p><p>讀完路得記，若你仍有問題，那很好，請帶著問題繼續讀。<strong>但請你帶著這一句離開：「你的神就是我的神。」（1:16）——爭議可以留在書房，這一句要帶回家。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：爭議應該讓我們更謙卑、更用心讀經，而不是動搖對神的信靠。經文沒有說清楚的地方並陳各家，例如作者年代、2:20「他」的指涉、4:5 的異讀、申 23:3 三說；經文說清楚的地方站穩：神沒有撇下祂的百姓，歸向祂的外邦人被接納，慈愛藉著付代價的人臨到，這份家譜接到了主耶穌身上。", "care": "這一題最容易傷到兩種人：剛接觸學術資料、信心動搖的年輕人，以及習慣「講台說了就算」、一聽到爭議就不安的長輩。講的時候，先肯定提問是信心的一部分，不嘲笑任何一方；也不要一次丟出所有爭議，讓人消化不了。會後若有人說「我讀了反而更不確定」，不要責備他，邀請他加入讀經小組，慢慢陪他讀；有需要請私訊同工或小組長，一起找合適的資料。"}, {"id": "ISS01_1", "t": "以利米勒往摩押是罪嗎？三個男人的死是神的懲罰嗎？", "r": "1:1--5；創 12:10；撒上 22:3；路 13:2--5；約 9:2--3", "ch": [1, 4], "why": "這是路得記第一章最常被問、也最常被講錯的一題。不少講台一開口就說：「以利米勒不信神，離開應許之地下摩押，所以一家男人都死了。」這樣講很順口，好像替經文找到了因果；可是坐在台下的，可能有一位剛在異鄉送走丈夫的姊妹，有一對出國打工、孩子卻病逝的夫妻。他們聽到的不是解經，是判決。若這一題不講清楚，路得記的第一章就變成一篇警告信息，而不是一個神不撇下人的故事。", "pos": [["【一】經文問的是甚麼", "", "<p>經文只用五節，交代了一連串的事實：「國中遭遇饑荒」（1:1），一家四口「往摩押地去寄居」（1:1），後來「以利米勒死了」（1:3），兩個兒子娶了摩押女子，「在那裡住了約有十年」（1:4），最後「瑪倫和基連二人也死了」（1:5）。<\/p><p>原文 1:1 說他們去「寄居」（לָגוּר֙，暫住的外人），1:2 卻說「就住在那裡」（וַיִּֽהְיוּ־שָֽׁם，直譯「他們就在那裡了」）——從暫住變成定居。所以問題有兩層：<strong>離開伯利恆是不是一個錯誤的決定？就算是，經文有沒有把三個人的死當作這個決定的後果？<\/strong><\/p>"], ["罪與懲罰說（離開應許之地，所以遭報）", "", "<p>主張：古代猶太傳統（亞蘭文意譯本與拉比註釋）認為以利米勒是城中的富戶，在饑荒時棄百姓而去，所以受罰；兩個兒子的名字瑪倫、基連聽起來像「病弱」「衰竭」，又娶了摩押女子，於是一個一個死去。「寄居」變成「住下」，也顯出他們越走越遠。<\/p><p><strong>難處：<\/strong>經文從頭到尾沒有寫一句因果句，沒有「因為」，也沒有「耶和華的怒氣」。全卷敘述者只親口寫了兩次神的作為：1:6 賜糧食，4:13 使她懷孕，兩次都是恩典。亞伯蘭也曾因饑荒寄居外地：「因饑荒甚大，亞伯蘭就下埃及去」（創 12:10）；大衛後來還把父母託給摩押王：「求你容我父母搬來，住在你們這裡」（撒上 22:3）。若寄居外地就是罪，這些人都要一併定罪。<\/p>"], ["沉默的敘事說（經文只記事實，不作評價）", "", "<p>主張：敘述者刻意不評論以利米勒，只記錄事實。饑荒是真實的，一家人要活下去；死亡也是真實的，古代人壽命短、疾病多。讀者不應把自己的道德判斷塞進經文的空白裡。<\/p><p><strong>難處：<\/strong>完全不評價，也可能錯過經文的筆觸。「寄居」與「住在那裡」的對照、「約有十年」的時間長度、1:6「要從摩押地歸回」的方向，都讓讀者感覺到這一家離開了神百姓的群體。經文沒有判罪，卻也沒有把離開說成小事。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：離開伯利恆是一個代價很大的決定，但經文沒有說三個男人的死是神的懲罰，講台也不可以這樣說。<\/strong>可以說的是：一家人在饑荒中作了一個求生的選擇，從「寄居」慢慢變成「住下」，最後只「剩下」一個寡婦。不可以說的是：「因為他們下摩押，所以死了。」<\/p><p>主耶穌親自拒絕過這種推論。有人告訴祂加利利人遇害的事，祂說：「你們以為這些加利利人比眾加利利人更有罪，所以受這害嗎？我告訴你們，不是的！」（路 13:2--3）門徒問瞎眼的人是誰犯了罪，祂說：「也不是這人犯了罪，也不是他父母犯了罪，是要在他身上顯出神的作為來。」（約 9:3）路得記第一章的重點不在「誰錯了」，而在 1:6：<strong>她聽見耶和華眷顧自己的百姓。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你的家也經歷過離鄉、失去親人，你不必從這段經文讀出神在審判你。經文寫下「剩下拿俄米」，不是為了定她的罪，是為了讓我們看見，<strong>故事從一個被剩下的人開始，神卻沒有剩下她不管。<\/strong>你可以誠實檢討自己過去的選擇，但不要把每一座墳都算成神的帳單。<\/p>"]], "con": [], "say": "本講義的立場：離開伯利恆是代價很大的選擇，經文用「寄居」到「住在那裡」的筆觸讓人感覺到距離，卻沒有寫一句因果句。講台不可把三個男人的死講成神的懲罰；主耶穌拒絕這種推論（路 13:2--3；約 9:3）。本章的焦點在 1:6：神眷顧祂的百姓。", "care": "這一題最容易刺傷三種人：在海外工作或移民期間失去配偶、孩子的家庭；為了生計離開原來教會、心裡本來就有愧疚的人；以及長年照顧病人、最後仍送走親人的長者。講的時候，不要用「你們看，離開神的地方就……」這種句子。若有人會後私訊說：「是不是因為我們當年出國，所以他走了？」不要急著給答案，先陪他哭，再告訴他：經文沒有這樣說，主耶穌也沒有這樣說。會後請私訊同工或小組長持續關心，必要時協助尋求哀傷輔導。"}, {"id": "ISS01_2", "t": "饑荒臨到「糧食之家」——是神的管教，還是自然的災難？", "r": "1:1、6；申 11:16--17；撒下 21:1；創 26:1；太 5:45", "ch": [1], "why": "「伯利恆」的意思是「糧食之家」，偏偏在這裡鬧饑荒。這個諷刺讓很多人立刻聯想到路得記的循環：百姓離棄神，神就降災。於是講台常說：「饑荒是因為以色列人拜偶像。」這話可能對，也可能越過經文。今天的弟兄姊妹遇到經濟崩盤、疫情、旱災、生意失敗，也會問同樣的問題：這是神在管教我，還是天災人禍？若講台把可能講成肯定，受災的人會多背一層罪疚；若一概說「與神無關」，又把神從歷史裡請了出去。", "pos": [["【一】經文問的是甚麼", "", "<p>1:1 說：「當士師秉政的時候，國中遭遇饑荒。」（1:1）經文沒有交代原因。1:6 卻交代了饑荒怎樣結束：「她在摩押地聽見耶和華眷顧自己的百姓，賜糧食與他們。」（1:6）<\/p><p>地名本身是一個字謎：בֵּית לֶחֶם（伯利恆），「糧食之家」沒有糧食；1:6「賜糧食」的「糧食」正是同一個 לֶחֶם。問題是：<strong>敘述者為甚麼不寫饑荒的原因，卻寫明是神使饑荒結束？<\/strong><\/p>"], ["約的管教說（饑荒是士師時代背約的後果）", "", "<p>主張：摩西早已警告，事奉別神的後果是「耶和華的怒氣向你們發作，就使天閉塞不下雨，地也不出產」（申 11:17）。士師時代正是一再背約的年代，1:1 的「當士師秉政的時候」就是把讀者放回那個背景。1:6 的「眷顧」也暗示先前神曾轉臉。<\/p><p><strong>難處：<\/strong>經文刻意沒有說。大衛年間的饑荒，是「大衛就求問耶和華」之後，神才說明原因（撒下 21:1）；路得記沒有這樣的啟示。讀者若自己補上原因，就是替神說了神沒有說的話。<\/p>"], ["自然災難說（迦南地本來就常有饑荒）", "", "<p>主張：迦南地靠雨水耕種，雨季一不穩就有饑荒。族長時代也是如此：「那地有一次饑荒；這時又有饑荒」（創 26:1），經文並沒有把以撒的饑荒說成審判。主耶穌也說天父「降雨給義人，也給不義的人」（太 5:45）。<\/p><p><strong>難處：<\/strong>若只說「自然現象」，就和舊約整體的信念不合：舊約一貫相信雨水和收成在神手中。1:6 明說是耶和華「賜糧食」；如果結束饑荒的是神，饑荒就不是神管不到的地方。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：經文刻意不寫饑荒的原因，卻寫明饑荒的結束——這個筆法本身就是答案。<\/strong>在全國的層面，士師時代的背約是真實的背景，講台可以提到申命記的警告，邀請整個群體省察；但在個人的層面，不可從「我遭遇饑荒」推出「我犯了某罪」。<\/p><p>路得記把焦點從「誰造成的」挪到「神甚麼時候眷顧」。拿俄米不是先弄清楚饑荒的原因才回家，她是「聽見」神眷顧，就起身歸回（1:6）。<strong>這是一個人在不明白原因的時候，仍然朝著神轉身的樣子。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你不必先為自己的困境找到神學解釋，才能回到神面前。也許有一天神會讓你明白，也許不會。但你可以像拿俄米一樣，留意「耶和華眷顧自己的百姓」的消息，然後起身。<strong>神沒有把原因交給我們，卻把回家的路交給了我們。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：經文不寫饑荒的原因，只寫神使饑荒結束（1:6）。群體可以照申命記的警告省察，但個人不可從災難推論自己的罪。焦點不是「誰的錯」，而是在不明白的時候仍朝神轉身。", "care": "這一題要特別顧到正在經濟困境中的人：失業的中年弟兄、疫情後生意倒閉的老闆、因天災失去收成的農家，以及靠匯款養家的移工。講的時候不要說「經濟不好是因為你奉獻不夠」或「這是神在管教你」。若有人主動問自己是否被管教，可以陪他一起禱告、一起省察，但把結論留給神。會後請私訊同工或小組長，由他們關心實際需要，必要時把教會的急難救助管道告訴他，讓「賜糧食」的神透過肢體被看見。"}, {"id": "ISS01_3", "t": "摩押女子嫁給以色列人：與申 23:3 的禁令衝突嗎？", "r": "1:4；申 23:3--6；申 7:1--3；拉 9:1--2；太 1:5", "ch": [1, 4], "why": "讀過申命記的人，讀到「這兩個兒子娶了摩押女子為妻」（1:4），都會停下來：律法不是說摩押人不可入耶和華的會嗎？以斯拉、尼希米的時代還因此要百姓離絕外邦妻子。這一題若輕輕帶過，會讓人以為路得記否定了律法；若講得太硬，又會把在座的外籍配偶、異國婚姻家庭標成「不合律法」。全卷的議題「「摩押人不可入耶和華的會」（申 23:3），摩押女子路得怎麼能成為大衛的曾祖母？」已經處理大方向，這裡只處理第一章自己提出的問題：這兩樁婚姻本身。", "pos": [["【一】經文問的是甚麼", "", "<p>1:4 只說：「這兩個兒子娶了摩押女子為妻，一個名叫俄珥巴，一個名叫路得」（1:4）。原文 נָשִׁים֙ מֹֽאֲבִיּ֔וֹת「摩押的女人」，沒有任何評語。<\/p><p>相關的律法有兩處：一是禁止與迦南七族通婚，「不可與他們結親」（申 7:3）；二是「亞捫人或是摩押人不可入耶和華的會」（申 23:3）。問題是：<strong>瑪倫、基連的婚姻違反了哪一條？申 23:3 講的「入會」，和婚姻是同一件事嗎？<\/strong><\/p>"], ["違反律法說（這兩樁婚姻本身就是錯）", "", "<p>主張：以斯拉時代的首領指責百姓「沒有離絕……亞捫人、摩押人」，「為自己和兒子娶了這些外邦女子為妻」（拉 9:1--2），可見後來的以色列人認為娶摩押女子違背了律法的精神。瑪倫、基連住在摩押十年，娶當地女子，正是同化的開始。<\/p><p><strong>難處：<\/strong>申 7:1--3 列出的是迦南七族，沒有摩押。申 23:3 講的是「入耶和華的會」，經文沒有明說包含婚姻。而且波阿斯在城門前公開稱路得為「瑪倫的妻」（4:10），眾民和長老接著為她祝福（4:11），經文沒有一處把這樁婚姻當作罪。<\/p>"], ["申 23:3 只禁摩押男子說（拉比傳統）", "", "<p>主張：申 23:4 給的理由是「他們沒有拿食物和水在路上迎接你們」，這是男人的責任；所以拉比說「摩押男子，不是摩押女子」，女子嫁入以色列並不違法。<\/p><p><strong>難處：<\/strong>從文法看，「摩押人」通常指全民族，不只指男子。這個讀法很早就有，也合乎路得記的結局，卻不容易從申命記本文直接證明。<\/p>"], ["「入會」另有所指說（指公共集會，不指婚姻）", "", "<p>主張：「耶和華的會」多半指以色列聚集敬拜、議事的會眾；不准「入會」指不能在這個群體中擔任代表或參與某些公共職分，並不等於不能嫁給以色列人。<\/p><p><strong>難處：<\/strong>尼 13:1--3 引用同一條律法後，「就與一切閒雜人絕交」，可見後代至少在某些時期把它擴大到社群往來與婚姻；這個說法要和尼希米記的用法調和。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：三說並陳，不裁判細節；第一章的經文沒有把這兩樁婚姻當作罪，講台也不必替經文定罪。<\/strong>但申 23:3 的難處是真的，不能用「愛就夠了」一筆勾銷——神的聖潔沒有放鬆。<\/p><p>共同的落點是：路得後來不是以「摩押人」的身分被接納，而是以「你的神就是我的神」（1:16）的身分被接納；經文卻一直稱她「摩押女子路得」，沒有抹掉她的出身。馬太更把她寫進家譜：「波阿斯從路得氏生俄備得」（太 1:5）。<strong>神不看你從哪裡來，看你歸向誰。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你的婚姻是跨國、跨文化的，不要從這一節讀出神不悅納你的家。經文要問的不是你的出身，而是你們一家歸向誰。另一方面，信徒也不要用路得記來推翻聖經對婚姻信仰的教導；<strong>路得被接納的關鍵，正是她先說了「你的神就是我的神」。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：申 23:3 有三種讀法（只禁摩押男子、「入會」指公共集會、恩典勝過禁令），本講義並陳不裁判；第一章沒有把兩樁婚姻當作罪。路得以「你的神就是我的神」被接納，經文卻沒有抹掉她「摩押女子」的出身。", "care": "這一題最需要保護的，是教會裡的外籍配偶與異國婚姻家庭：嫁到台灣的越南、印尼姊妹，在馬來西亞、新加坡跨族通婚的夫妻，在紐西蘭與當地人結婚的華人。講台上不要說「外邦婚姻是悲劇的開始」，也不要拿國籍開玩笑。若有慕道的外籍配偶在場，請把焦點放在「神接納歸向祂的人」。會後若有人因家人反對異國婚姻而受傷，請私訊同工或小組長陪伴，聽他說，而不是急著評論他的婚姻。"}, {"id": "ISS01_4", "t": "俄珥巴回去錯了嗎？", "r": "1:8--15；路 9:62；太 10:37", "ch": [1], "why": "俄珥巴常被講成路得的反面：一個「回頭看」的人、一個「愛世界」的人，有時還被拿來比作「手扶著犁向後看的」。這樣講很有戲劇張力，卻冤枉了一個照著婆婆勸告去做的年輕寡婦。更麻煩的是，講台若這樣對比，家中有人離開教會、或自己選擇留在本國照顧父母的人，會覺得自己就是俄珥巴。這一題的重點，是看清楚經文怎樣描寫她，又為甚麼要把她放在路得旁邊。", "pos": [["【一】經文問的是甚麼", "", "<p>拿俄米三次叫兩個兒婦回去（1:8、11、12）。第一次，她為她們祝福：「願耶和華恩待你們，像你們恩待已死的人與我一樣！」（1:8）——她承認兩個媳婦都有 חֶסֶד（慈愛）。第三次之後，「俄珥巴與婆婆親嘴而別，只是路得捨不得拿俄米」（1:14）。<\/p><p>然後拿俄米說：「你嫂子已經回她本國和她所拜的神那裡去了」（1:15）。問題是：<strong>俄珥巴的回去，是背棄，還是順從？經文用她來作甚麼？<\/strong><\/p>"], ["反面人物說（她選了舊生活與別神）", "", "<p>主張：俄珥巴回到「她所拜的神」那裡，這不是中性的事。主耶穌說：「手扶著犁向後看的，不配進神的國。」（路 9:62）路得的委身越是光彩，俄珥巴的退回就越是可惜。古代猶太傳說甚至說她後來成了歌利亞的祖先。<\/p><p><strong>難處：<\/strong>那個傳說沒有經文根據。經文寫的是：她哭了兩次，她用親嘴告別，她照婆婆三次的勸告回去。拿俄米親口為她祝福，經文沒有一句責備她。把她當作「背道者」，等於說聽從婆婆的勸告是罪。<\/p>"], ["合理選擇說（她做了常人會做的事）", "", "<p>主張：俄珥巴還年輕，回娘家、再嫁、在本國生活，是拿俄米替她想好的出路：「願耶和華使你們各在新夫家中得平安！」（1:9）她的選擇合情合理，甚至是孝順的。<\/p><p><strong>難處：<\/strong>若只說「合理」，就忽略了 1:15 那句沉重的話：她回去的不只是本國，還有「她所拜的神」。經文確實讓讀者感覺到兩條路的分別，只是沒有替我們宣判。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：俄珥巴不是反面人物。她是照著拿俄米的勸告回去的，是一個有慈愛、也有眼淚的人；經文把她放在路得旁邊，不是為了定她的罪，而是要顯出路得的選擇超乎常理。<\/strong><\/p><p>原文的對照很清楚：俄珥巴「親嘴」（וַתִּשַּׁ֤ק），路得「捨不得」（דָּ֥בְקָה，緊緊黏住）。一個是正常的告別，一個是不肯放手。<strong>俄珥巴做的是人之常情，路得做的是捨己。<\/strong>講台要讚美的是路得的捨己，不是貶低俄珥巴的常情。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你家裡有人沒有跟你一起走信仰的路，不要急著把他當成「回頭的人」。經文對俄珥巴的沉默，是一種尊重；她的故事在 1:15 停了，但神的故事沒有停。<strong>我們可以為她難過，但不需要替神寫結局。<\/strong>你可以做的，是繼續為那個人禱告，像拿俄米一樣，求耶和華恩待他。<\/p>"]], "con": [], "say": "本講義的立場：俄珥巴是照拿俄米的勸告回去的，經文沒有責備她；她用親嘴告別，路得卻「捨不得」。經文用她來顯出路得的捨己超乎常理，不是把她當反面人物。講台讚美路得，不貶低俄珥巴。", "care": "這一題最容易刺傷兩種人：一是家中有人不信主、或離開教會的父母，聽到「俄珥巴回去了」就想到自己的孩子；二是選擇留在本國照顧年邁父母、沒有跟配偶移民或沒有加入某個事工的人，被別人說「你不夠委身」。講台上不要說「你要作路得，不要作俄珥巴」。小組分享時，若有人為家人流淚，不要安慰他「他總有一天會回來」，也不要評論那位家人，只要陪他禱告。會後請私訊同工或小組長持續關心。"}, {"id": "ISS01_5", "t": "拿俄米勸兒婦回到「她所拜的神那裡去」，對嗎？", "r": "1:15；1:13；書 24:15；士 11:24", "ch": [1], "why": "讀到 1:15，很多人會嚇一跳：一個以色列人，竟然勸媳婦回到摩押的神那裡去？有人因此批評拿俄米信心軟弱、沒有見證；也有人把她講成高明的佈道者，說她是故意「試驗」路得。兩種講法都很常見，也都讓人不安。這一題關係到我們怎樣看待一個在苦難中說了不完全的話的信徒，也關係到我們怎樣面對家中長輩說「信也沒有用，你回去吧」。", "pos": [["【一】經文問的是甚麼", "", "<p>拿俄米說：「看哪，你嫂子已經回她本國和她所拜的神那裡去了，你也跟著你嫂子回去吧！」（1:15）原文 אֱלֹהֶ֑יהָ 可以譯「她的神」或「她的眾神」；摩押人拜的是基抹，路得記記載耶弗他也說過「你的神基抹」（士 11:24）。<\/p><p>說這話以前，拿俄米剛說完：「耶和華伸手攻擊我。」（1:13）問題是：<strong>她的勸告是信心失敗，還是另有用意？經文怎樣看待她這句話？<\/strong><\/p>"], ["信心失敗說（拿俄米不該勸人回到別神那裡）", "", "<p>主張：以色列人蒙召作列國的見證，拿俄米卻親口把兒婦推回偶像那裡。這顯出她在苦難中失去了方向，至少在這一刻，她沒有把耶和華當作值得跟隨的神。<\/p><p><strong>難處：<\/strong>經文沒有評論她的話，神也沒有責備她。她的處境必須一起讀：丈夫、兩個兒子都死了，她自認為「耶和華伸手攻擊我」，跟著她只會一起受苦。她勸兒婦回去，是為了她們能「各在新夫家中得平安」（1:9），出發點是愛。<\/p>"], ["刻意試驗說（她故意擺出代價，試驗路得的心）", "", "<p>主張：拿俄米像約書亞一樣把選擇擺在人面前：「今日就可以選擇所要事奉的」（書 24:15）。她說出回去的路，正是要讓路得清楚表明委身。<\/p><p><strong>難處：<\/strong>經文沒有暗示她有這個計畫；1:13、20--21 的語氣是悲傷，不是策略。把她講成高明的佈道者，等於替她美化，也容易教人用「激將法」對待慕道的人。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：拿俄米的勸告出於愛，也是不完全的；經文沒有責備她，也沒有替她辯護，只是如實記下。<\/strong>她看見的是自己的空，看不見神正在她身邊做的事。<\/p><p>最值得注意的是：路得正是在聽完「回去吧」之後，說出了全卷最美的委身：「你的神就是我的神」（1:16）。<strong>神的工作沒有被一個苦中信徒的話擋住；反而在那句話的背景上，路得的信心顯得格外清楚。<\/strong>原文 שׁוּב（回去）在這裡反覆出現，拿俄米叫她「回去」，她卻說「不要催我回去」。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你也許曾在最低潮的時候，對別人說過不完全、甚至不像信徒的話。這段經文告訴你：神沒有因此放棄你，也沒有因此停止祂的工作。<strong>你的軟弱攔不住神的恩典，反而常常成為恩典顯明的背景。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：拿俄米勸兒婦回去，是出於愛也是不完全的話；經文沒有責備，也沒有美化。路得正是聽完「回去吧」之後說出「你的神就是我的神」——神的工作沒有被一個苦中信徒的話擋住。", "care": "這一題要顧到兩種人。一是在苦難中說過「信神有甚麼用」的長輩信徒，他們可能已經很自責，講台不要用「拿俄米失敗了」加重他們的羞愧。二是新信徒或慕道友，家人勸他「不要信了，回來拜祖先吧」，他正在掙扎。對前者，要說神仍然看顧；對後者，要陪伴，不要催逼他立刻與家人決裂。會後若有人提到家中的宗教壓力，請私訊同工或小組長了解處境，陪他想一個既尊重家人、又不放棄信仰的作法。"}, {"id": "ISS01_6", "t": "「你的神就是我的神」：是對婆婆的孝道，還是對神的委身？", "r": "1:16--17；2:11；太 10:37；路 9:23", "ch": [1, 2], "why": "1:16 是路得記最美的一節，也是華人教會最常被誤用的一節。婚禮上常有人朗讀，婆媳講座裡也常有人說：「媳婦就要像路得一樣跟隨婆婆。」這樣用，經文就變成孝道條款，被用來要求年輕的媳婦順從，甚至忍受不合理的對待。另一方面，也有人把這節只講成「歸信耶和華」，把人與人之間的情感抽掉。這一題要回答：路得到底是在委身給誰？", "pos": [["【一】經文問的是甚麼", "", "<p>路得說：「不要催我回去不跟隨你。你往哪裡去，我也往那裡去；你在哪裡住宿，我也在那裡住宿；你的國就是我的國，你的神就是我的神。」（1:16）接著她起誓：「你在哪裡死，我也在那裡死，也葬在那裡。」（1:17）<\/p><p>原文最後兩句只有四個字：עַמֵּךְ עַמִּי וֵאלֹהַיִךְ אֱלֹהָי——「你的百姓，我的百姓；你的神，我的神。」次序是從人、到住處、到百姓、到神，最後以耶和華的名起誓。問題是：<strong>這是一個媳婦對婆婆的孝心，還是一個人對神的委身？兩者是甚麼關係？<\/strong><\/p>"], ["孝道說（路得是好媳婦的榜樣）", "", "<p>主張：路得在丈夫死後不離開婆婆，供養她、跟隨她，是孝道的極致。波阿斯也稱讚她：「凡你向婆婆所行的……這些事人全都告訴我了。」（2:11）所以今天的媳婦應當效法路得。<\/p><p><strong>難處：<\/strong>路得留下來，恰恰是「不聽」婆婆的勸告——拿俄米三次叫她回去。若 1:16 是順從條款，路得應該回去才對。而且她的話不停在「你」，而停在「你的神」，並且以「耶和華」起誓；這不是一般的家族義務，是跨越國族與神明的轉移。<\/p>"], ["純屬歸信說（重點只在耶和華，婆婆只是媒介）", "", "<p>主張：1:16 的高峰是「你的神就是我的神」，這是一個外邦人歸信耶和華的宣告；婆婆只是她認識神的管道，重點在神，不在人。<\/p><p><strong>難處：<\/strong>經文明明把人和神綁在一起：「你往哪裡去，我也往那裡去」。路得不是在抽象地選擇一位神，她是跟隨一個已經空了的婆婆，進入她的百姓。把人抽掉，就失去了經文的溫度，也失去了「愛神」與「愛人」在這裡的交織。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：1:16 是對神的委身，透過一段具體的關係表達出來；終點是「你的神就是我的神」，不是「媳婦要聽婆婆的」。<\/strong>路得是在一個人身上認識了一位神，然後把自己交給那位神，也交給神的百姓。<\/p><p>所以這節不能變成孝道條款，也不能把關係抽掉。主耶穌說：「愛父母過於愛我的，不配作我的門徒」（太 10:37）——委身的最高對象是神；但路得的委身，正是以捨己愛一個人的方式活出來的。這使我們想起主說的：「若有人要跟從我，就當捨己」（路 9:23）。321 說關係的次序是先與神、再與人；<strong>路得的次序是在愛人裡找到了神，而在神裡面，她愛人愛得更深。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果有人曾經用這節經文要求你忍耐一段不健康的關係，請你知道：路得的委身是自由的、出於愛的，而且是對神的。神不要你用經文綁住自己，也不要你用經文綁住別人。<strong>你跟隨的終點是神，不是任何一個人的權威。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：1:16 是透過一段關係表達的、對神的委身，終點是「你的神就是我的神」，不是孝道條款。路得留下來，恰恰是沒有照婆婆的勸告回去；她以耶和華起誓。講台不可用這節要求媳婦順從婆婆。", "care": "這一題最容易刺傷正在婆媳關係中受苦的媳婦，尤其是語言不通、沒有娘家支援的外籍配偶，常被說「你看路得多孝順」。也可能刺傷婆婆一方：獨居、喪偶、覺得被媳婦冷落的長者。講台不要拿這節要求任何一方。若有人在關係中遭受言語或身體的傷害，安全優先，不要勸她「忍耐，學路得」。會後請私訊同工或小組長個別關心，必要時協助尋求家庭輔導或社工、法律協助。"}, {"id": "ISS01_7", "t": "路得起誓「願耶和華重重地降罰與我」——信徒可以這樣起誓嗎？", "r": "1:17；撒上 20:13；太 5:34--37；雅 5:12；申 6:13", "ch": [1], "why": "主耶穌說「什麼誓都不可起」，雅各書也說「最要緊的是不可起誓」，路得卻在全卷最美的一段話後面，加上一句聽起來很重的誓言。有些弟兄姊妹因此困惑：信徒可以起誓嗎？在法庭上宣誓、婚禮上立誓、公職就任時宣誓，算不算違背主的話？華人文化又常有「發毒誓」的習慣，「如果我騙你，天打雷劈」。這一題若不講清楚，有人會把誓言看得太輕，也有人會因此不敢在婚約上說出承諾。", "pos": [["【一】經文問的是甚麼", "", "<p>路得說：「你在哪裡死，我也在那裡死，也葬在那裡。除非死能使你我相離！不然，願耶和華重重地降罰與我。」（1:17）原文 כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִי֙ וְכֹ֣ה יֹסִ֔יף，直譯「願耶和華這樣待我，並且加倍」，是舊約常見的起誓公式。約拿單對大衛也這樣說：「我不告訴你使你平平安安地走，願耶和華重重地降罰與我。」（撒上 20:13）<\/p><p>問題是：<strong>這個起誓在路得的口中有甚麼意義？新約禁止起誓，是不是連這樣的誓也禁止了？<\/strong><\/p>"], ["全面禁止說（信徒任何誓都不可起）", "", "<p>主張：主耶穌的話很清楚：「什麼誓都不可起」，「你們的話，是，就說是；不是，就說不是」（太 5:34、37）。雅各也說「無論何誓都不可起」（雅 5:12）。歷史上一些教會傳統因此拒絕在法庭宣誓。<\/p><p><strong>難處：<\/strong>舊約是神自己吩咐百姓「指著他的名起誓」（申 6:13）；保羅也說「我呼籲神給我的心作見證」（林後 1:23）；希伯來書說神「指著自己起誓」（來 6:13）。若起誓本身是罪，這些經文就難以解釋。主耶穌針對的，是當時人用不同的誓把話分成「可信」與「不可信」。<\/p>"], ["可以起誓說（莊重的誓言合乎聖經）", "", "<p>主張：在莊重的場合，以神為見證立誓，是把話放在神面前負責；婚約、法庭、就職宣誓都屬於這一類。路得的誓正是榜樣。<\/p><p><strong>難處：<\/strong>這一說容易被拿來替隨口發誓辯護。華人文化裡的「發毒誓」，常常是用咒詛加強可信度，正是主耶穌要糾正的心態：平常的話不算數，加了誓才算數。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：1:17 的重點不在起誓的形式，而在路得第一次說出了「耶和華」的名。<\/strong>一個摩押女子，在委身的高峰，用以色列的神作她誓言的見證，這是她「你的神就是我的神」的第一個行動。她把自己交在耶和華手中，連死都不能使她回頭。<\/p><p>對今天的信徒，主耶穌的教導是：讓平常的話就可信，不需要用咒詛來加強。在婚禮、法庭、就職這類莊重場合，在神面前說出承諾，並不違背主的話；違背的是把誓言當作操控、或把沒有起誓的話當作可以不守。<strong>路得的誓不是嘴上的狠話，是她用往後一生去兌現的話。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你曾經發過誓卻沒有守住，不要以為神從此不再聽你的話。神看重的是心，不是公式；你可以在神面前誠實認罪，重新開始。如果你正要在婚禮上立誓，也不必害怕：<strong>那是在神面前說「是」，而神會幫助你活出這個「是」。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：1:17 是舊約常見的起誓公式，重點是路得第一次以「耶和華」的名作見證。主耶穌要信徒的平常話就可信（太 5:37），不需以咒詛加強；在莊重場合於神面前立下承諾，並不違背主的話。", "care": "這一題要小心幾種人：曾經在婚禮上立誓、後來婚姻破裂的人，聽到「誓言」二字就心痛；曾被家族、職場或不健康團體逼著發誓的人，至今仍活在恐懼裡；還有習慣隨口發毒誓、自己也沒察覺的人。講台不要說「違背誓言的人必遭報應」。對離婚或婚姻受傷的人，先陪伴，不要評斷。若有人因過去被迫發的誓而害怕，請私訊同工或小組長陪他禱告，告訴他：在基督裡，他不再被那樣的咒詛捆綁。"}, {"id": "ISS01_8", "t": "拿俄米說「全能者使我受了大苦」，是在控告神嗎？", "r": "1:13、20--22；伯 42:7；詩 13:1；哀 3:32--33", "ch": [1, 4], "why": "這一題幾乎每次講到第一章都會被問。很多講台把拿俄米當作「埋怨神」的負面例子，說她「消極」「不信」，然後勉勵會眾「無論如何都要喜樂」。這樣講，正在受苦的人會覺得自己連哭都不可以。全卷的議題「苦難中的哀歌：拿俄米可以說「全能者使我受了大苦」嗎？」已經立下大原則，這裡處理第一章本身的經文：她到底說了甚麼？經文怎樣回應她？", "pos": [["【一】經文問的是甚麼", "", "<p>回到伯利恆，婦女們問：「這是拿俄米嗎？」（1:19）她說：「不要叫我拿俄米〔就是甜的意思〕，要叫我瑪拉〔就是苦的意思〕，因為全能者使我受了大苦。」（1:20）又說：「我滿滿地出去，耶和華使我空空地回來。」（1:21）<\/p><p>原文 1:21「耶和華降禍與我」作 עָ֣נָה בִ֔י，直譯「作見證攻擊我」，像法庭上的證人；和合本近於七十士譯本「使我降卑」一類的讀法。她用的稱呼 שַׁדַּי（全能者），是族長時代的神名。問題是：<strong>她是在控告神、背離神，還是在神面前哀哭？<\/strong><\/p>"], ["埋怨不信說（她的話是負面的榜樣）", "", "<p>主張：她把所有的苦都歸到神身上，要人改叫她「苦」，又說自己「空空地」回來——可是路得就站在她身邊。她看不見神的供應，只看見自己的損失，這是苦毒的心。<\/p><p><strong>難處：<\/strong>經文從頭到尾沒有責備她：敘述者沒有，伯利恆的婦人沒有，神也沒有。約伯記的結尾，神責備的不是向祂哀訴的約伯，而是替神辯護的朋友：「你們議論我不如我的僕人約伯說的是。」（伯 42:7）<\/p>"], ["誠實哀歌說（她是在神面前說真話）", "", "<p>主張：她沒有離開神，她是對著神哭；她承認神掌權，所以才把苦難放在神面前。這與詩篇的哀歌一致：「耶和華啊，你忘記我要到幾時呢？」（詩 13:1）哀歌是信心的一種形式。<\/p><p><strong>難處：<\/strong>她的結論確實不完全：她說自己「空空地」，卻忽略了身邊捨不得她的路得。講台若只說「她是對的」，可能把她的結論當成神學真理。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：拿俄米的話是哀歌，不是背道；講台不可用「埋怨」「消極」「不信」定性她。<\/strong>她的神學是對的——她承認全能者掌權；她的結論是不完全的——她還看不見神正在做的事。<\/p><p>經文用兩個方式回應她，而不是責備她。第一，緊接著的下一句：「正是動手割大麥的時候」（1:22）——她說自己是空的，敘述者讓我們看見田已經熟了。第二，到了 2:20，同一個人說：「願那人蒙耶和華賜福，因為他不斷地恩待活人死人。」<strong>神沒有駁倒她，神是用恩典慢慢改寫了她的結論。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你現在說得出口的，只有「神啊，我好苦」，那就這樣說吧。神可以承受你誠實的話。祂「並不甘心使人受苦，使人憂愁」（哀 3:33）。<strong>神也比你的結論更大；你今天說「空」，祂可能已經讓大麥熟了。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：拿俄米的話是哀歌，不是背道；經文沒有責備她。她承認全能者掌權，結論卻還看不見神的作為。經文以 1:22「正是動手割大麥的時候」和 2:20 的祝福回應她。講台不叫受苦的人「不要埋怨」。", "care": "這一題最需要保護的，是正在喪親、久病、失業、婚姻破裂中的人，以及長期照顧病人的家屬。講台上不要說「拿俄米錯在埋怨」，也不要對流淚的人說「你要有信心」「要喜樂」。小組裡若有人說出對神的怨，不要急著糾正他的神學，先陪他一起把話說完，甚至陪他一起向神哭。會後請私訊同工或小組長個別關心；若長期失眠、失去生活功能，請協助他尋求專業協助。"}, {"id": "ISS01_9", "t": "沒有孩子、三個寡婦：經文怎樣看待無子與喪偶？", "r": "1:4--5、11--13；4:13--15；撒上 1:5--6；詩 68:5；雅 1:27", "ch": [1, 4], "why": "1:4 說兩對夫妻「在那裡住了約有十年」，經文沒有提到任何孩子；1:5 之後，三個女人都成了寡婦。華人社會對不孕和喪偶並不溫柔：「是不是上輩子做了甚麼」「沒有兒子將來誰養你」，連教會裡也有人說「多禱告，神就會給你孩子」。這一題若處理不好，台下的不孕夫妻、流產過的姊妹、獨居的寡婦，會覺得聖經也站在指責她們的一邊。", "pos": [["【一】經文問的是甚麼", "", "<p>經文沒有直接說路得不孕，只說住了「約有十年」，後來「剩下拿俄米，沒有丈夫，也沒有兒子」（1:5）。拿俄米對兒婦說：「我年紀老邁，不能再有丈夫」（1:12）。第四章才寫：「耶和華使她懷孕生了一個兒子」（4:13）。<\/p><p>在古代以色列，寡婦和沒有兒子的人沒有土地保障，是社會最脆弱的一群。問題是：<strong>經文怎樣看待這三個女人的處境？不孕與喪偶是神的審判，還是神看顧的對象？<\/strong><\/p>"], ["審判說（不孕與早寡是神不喜悅的記號）", "", "<p>主張：舊約把兒女看作神的賜福：「兒女是耶和華所賜的產業」（詩 127:3）；反過來，沒有兒女、早年喪偶就被視為不蒙福，甚至是罪的結果。這一家離開應許之地，所以斷了後代。<\/p><p><strong>難處：<\/strong>經文描寫哈拿時說「耶和華不使哈拿生育」（撒上 1:5），同一節卻說丈夫「愛哈拿」，經文沒有把她的不孕當作罪的懲罰。主耶穌也拒絕把瞎眼歸咎於罪（約 9:3）。路得記本身沒有一句因果句。<\/p>"], ["純屬偶然說（生育與死亡只是自然現象）", "", "<p>主張：不孕和早逝是醫學和環境的問題，與神無關；講台不必在這裡談神學，只要表達同情就好。<\/p><p><strong>難處：<\/strong>路得記明說「耶和華使她懷孕」（4:13），舊約一貫認為生命在神手中。若說與神完全無關，就無法解釋 4:13，也讓受苦的人失去「神看見我」的安慰。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：經文看見寡婦和不孕的人，卻不審判她們；神是看顧她們的神，不是指控她們的神。<\/strong>詩篇說神「作寡婦的伸冤者」（詩 68:5）；雅各說「看顧在患難中的孤兒寡婦」是清潔的虔誠（雅 1:27）。路得記整本書，就是神透過一塊田、一個親屬、一座城，去看顧兩個寡婦的故事。<\/p><p>4:13 的懷孕不是給所有不孕者的公式承諾；全卷的高潮也不是生了一個兒子，而是婦人們說的：「有這兒婦比有七個兒子還好！」（4:15）<strong>一個人的價值，從來不在於有沒有生育；神從沒有把任何一個寡婦、任何一個沒有孩子的人算為被剩下的。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你正在等候孩子，或者已經不再等了；如果你剛送走配偶，或者已經獨自生活多年——請你知道，經文沒有把你放在審判之下。神看見你，像祂看見拿俄米和路得。<strong>祂可能不照你求的方式回答，但祂不會撇下你。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：經文看見寡婦與不孕者，卻不審判她們；神是寡婦的伸冤者（詩 68:5）。4:13 的懷孕不是給每個不孕者的公式承諾；全卷的高潮是「有這兒婦比有七個兒子還好」（4:15），人的價值不在生育。", "care": "這一題最容易刺傷的是：多年不孕、做過多次人工生殖的夫妻，流產或失去孩子的父母，以及剛喪偶或獨居的長者。講台不要說「多禱告神就會給你孩子」，也不要在母親節、父親節只表揚有孩子的家庭。小組裡不要追問「你們怎麼還不生」。對喪偶的長者，除了屬靈的安慰，也要問實際需要：就醫、長照、三餐。會後請私訊同工或小組長個別陪伴，必要時協助尋求哀傷或生育相關的專業協助。"}, {"id": "ISS02_1", "t": "「恰巧」到了波阿斯的田：是巧合，還是神預定路得走進那塊田？", "r": "2:3；2:2；4:1；箴 16:9；傳 9:11；羅 8:28", "ch": [2, 4], "why": "2:3 的「恰巧」是路得記最有名的兩個字。有人說這是巧合，聖經只是誠實地記錄運氣；有人說這是神預定好的每一步；更常見的講法是：「只要你跟隨神，神就會讓你恰巧遇到你的貴人。」最後這種講法很受歡迎，卻把護理講成了成功神學，讓那些一直沒有「恰巧」的人覺得被神忘記。全卷的議題「神隱藏的手：「恰巧」是巧合、命定，還是神的護理？」已立下原則，這裡處理 2:3 本身。", "pos": [["【一】經文問的是甚麼", "", "<p>路得先對拿俄米說：「容我往田間去，我蒙誰的恩，就在誰的身後拾取麥穗。」（2:2）然後經文說：「她恰巧到了以利米勒本族的人波阿斯那塊田裡。」（2:3）<\/p><p>原文 וַיִּקֶר מִקְרֶהָ，直譯「她的機遇遇上了」，同一個字根連用兩次，像說「巧上加巧」。同樣的字根在撒上 6:9 譯作「偶然遇見的」。問題是：<strong>敘述者用「恰巧」，是要說這是偶然，還是用一種含蓄的方式指向神？如果是神，路得還有沒有自己的選擇？<\/strong><\/p>"], ["純屬巧合說（經文就是說運氣好）", "", "<p>主張：敘述者用的是一般描寫偶然的字。傳道書說：「所臨到眾人的是在乎當時的機會。」（傳 9:11）路得記沒有異象、沒有神的聲音，只是如實寫出一件湊巧的事。<\/p><p><strong>難處：<\/strong>路得記全卷是一連串禱告被回應的故事：1:8 拿俄米求神恩待，2:12 波阿斯求神賞賜，2:20 拿俄米說「他不斷地恩待活人死人」。4:1 那位親屬又「恰巧」經過（和合本的譯法，原文作「看哪」）。這樣的「巧合」連在一起，敘述者顯然要讀者會心一笑：這不是巧合。<\/p>"], ["命定說（神預定了路得走的每一步）", "", "<p>主張：「人心籌算自己的道路；惟耶和華指引他的腳步。」（箴 16:9）神掌管萬事，路得走進波阿斯的田，是神在永恆裡定好的，她的腳步只是在執行神的計畫。<\/p><p><strong>難處：<\/strong>經文強調的是路得的主動：她提出要去（2:2），她從早晨做到如今（2:7）。把這說成「一切早已定好」，容易讓人把人的責任和勞苦抹掉；再推一步，就成了「跟隨神就會遇到有錢的貴人」的成功神學。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：「恰巧」是敘述者含蓄的幽默——從人的角度看是偶然，讀者卻被邀請看見神隱藏的手。這是神的護理，不是命定論，也不是成功神學。<\/strong>神沒有取消路得的選擇，而是在她的選擇和勞苦之中工作。<\/p><p>值得注意的是：神的護理是在路得「拾取麥穗」的時候被看見的——那是當時最卑微的工作，是窮人與寄居者撿別人剩下的。<strong>神不是在她成功的時候出現，是在她彎腰的時候出現。<\/strong>我們曉得「萬事都互相效力，叫愛神的人得益處」（羅 8:28），但那益處不一定是地上的好機會，而是神自己的同在與慈愛。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你可能回頭看，一生中有幾次「恰巧」，也可能覺得自己的生命從來沒有過這樣的轉機。不要拿別人的「恰巧」來量自己。<strong>神的手常常是事後才看得見的；你今天在田裡彎腰撿穗子，也是在祂的眼前。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：「恰巧」（2:3）是敘述者含蓄的筆法：人看是偶然，讀者被邀請看見神隱藏的護理。這不是命定論，因為路得主動提出、辛勤勞動；也不是成功神學，因為神的手是在她最卑微的拾穗裡被看見的。", "care": "這一題最容易刺傷正在等待的人：單身多年、為婚姻禱告的弟兄姊妹；長期失業、投了很多履歷沒有回音的人；在異鄉打工、看不到出路的移工。講台不要說「只要跟隨神，就會遇到你的貴人」，也不要把別人的好運當作見證，暗示沒有好運的人信心不夠。小組分享「恰巧」的經歷時，也要讓說「我還沒有看見」的人有說話的空間。會後請小組長私訊陪伴，關心實際需要。"}, {"id": "ISS02_2", "t": "拾穗之律與今天的社會救助：教會有沒有「留下田角」的責任？", "r": "2:2--3、15--16；利 19:9--10；申 24:19--22；加 2:10；雅 2:15--16", "ch": [2], "why": "路得能去拾穗，是因為以色列的律法要求地主不可把田收割乾淨，要留給窮人和寄居的。今天的教會讀到這裡，常有兩種反應：一種說這是古代農業社會的規定，今天交給政府的社會福利就好；另一種把它直接搬成社會運動的口號。華人教會在不同國家，社會制度差別很大，有的國家福利完整，有的教會本身就是窮人唯一的支援。這一題要問的是：拾穗之律今天對教會還有沒有約束力？", "pos": [["【一】經文問的是甚麼", "", "<p>律法說：「在你們的地收割莊稼，不可割盡田角，也不可拾取所遺落的。」（利 19:9）「若忘下一捆，不可回去再取，要留給寄居的與孤兒寡婦。」（申 24:19）路得正是這三種人的合體：寄居的、寡婦、窮人。<\/p><p>拾穗之律有一個特點：窮人不是坐著領救濟，而是自己下田勞動。路得說：「容我往田間去」（2:2）。問題是：<strong>這條律法的精神在今天要怎樣實行？是個人的責任、教會的責任，還是社會制度的責任？<\/strong><\/p>"], ["教會內部優先說（照顧好信徒的家就夠了）", "", "<p>主張：新約說「有了機會就當向眾人行善，向信徒一家的人更當這樣」（加 6:10）。教會的資源有限，應該先照顧自己的肢體；社會救助是政府的事。<\/p><p><strong>難處：<\/strong>拾穗之律的對象明明寫著「寄居的」，路得是外邦人；律法要保護的正是不屬於自己群體的人。加 6:10 的「更當」是次序，不是界線，前半句仍是「向眾人行善」。<\/p>"], ["社會制度說（教會應推動公共政策）", "", "<p>主張：拾穗之律是一個國家的制度，不只是個人的善心；所以今天的教會應當倡議社會福利、最低工資、移工權益等公共政策。<\/p><p><strong>難處：<\/strong>路得記裡的拾穗是在一塊一塊私人田地上實行的，靠的是每個地主的順服與慈愛；波阿斯吩咐的是自己的僕人、自己的田。教會可以為公義發聲，但若只談制度，卻不在自己的「田」裡留穗，就失去了經文的力量。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：教會有「留下田角」的責任，而這責任首先落在每個信徒和每個教會自己的「田」上——預算、時間、生意、職場、家中的空房間。<\/strong>拾穗之律有三個精神值得保留：刻意留下（不是有剩才給）、保留尊嚴（讓人以勞動得糧）、不分內外（寄居的也在其中）。<\/p><p>保羅與使徒們約定：「只是願意我們記念窮人」（加 2:10）。雅各也提醒，只說「願你們穿得暖，吃得飽」卻不給所需用的，「這有什麼益處呢？」（雅 2:16）<strong>321 說人比事重要；一間教會的預算表，就是她的田角留了多少的證據。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你不必等教會有一個大計畫，才開始留田角。你可以從自己的「田」開始：每個月刻意留一部分，給一位需要的人；在公司裡為弱勢的同事留一個機會。<strong>神看的是你有沒有刻意留下，不是你留下多少。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：教會有「留下田角」的責任，而這責任先落在每個信徒和教會自己的「田」上。拾穗之律的三個精神要保留：刻意留下、保留尊嚴、不分內外（利 19:9--10；申 24:19）。", "care": "這一題要顧到接受幫助的人。華人很重面子，正在領救助的會友，聽到台上講「窮人」可能覺得被指著說。講台不要公開點名受助者，也不要把他們當作見證的道具。設計幫助時，盡量像拾穗一樣保留尊嚴：提供工作機會、讓人參與服事，而不只是發放。對移工、新住民，要考慮他們的工時與語言。會後若有人私訊說家中有困難，請同工保密處理，並把教會的急難救助管道清楚告訴他。"}, {"id": "ISS02_3", "t": "「願耶和華與你們同在」：職場裡可以這樣說話嗎？", "r": "2:4；2:9、15--16；詩 129:8；西 3:17；彼前 3:15", "ch": [2], "why": "波阿斯一到田裡，第一句話就是「願耶和華與你們同在」，工人們回答「願耶和華賜福與你」。很多基督徒老闆和上班族讀到這裡都很嚮往，也很困惑：在今天多元宗教的公司裡，可以這樣說話嗎？在中國，信仰的公開表達有限制；在新加坡、馬來西亞，同事來自不同宗教；在台灣、紐西蘭，也有人覺得在職場談信仰不專業。這一題要回答：信仰語言在職場的位置在哪裡？", "pos": [["【一】經文問的是甚麼", "", "<p>經文說：「波阿斯正從伯利恆來，對收割的人說：『願耶和華與你們同在！』他們回答說：『願耶和華賜福與你！』」（2:4）這是一個雙向的祝福，老闆先祝福工人，工人回應老闆。<\/p><p>接下來，波阿斯的信仰更多是用行動表達的：吩咐僕人「不可欺負你」（2:9），讓她喝僕人打來的水，叫人從捆裡抽出穗子「留在地下任她拾取」（2:16）。問題是：<strong>波阿斯的話是值得效法的職場模式，還是古代以色列特殊文化下的問候？今天應該怎樣實行？<\/strong><\/p>"], ["職場分開說（信仰語言留在教會）", "", "<p>主張：今天的職場是多元的，老闆用宗教語言對員工說話，可能造成壓力，甚至違反公司規定或當地法律。專業的態度是把信仰放在心裡，用工作表現見證。<\/p><p><strong>難處：<\/strong>若信仰只能放在心裡，就和經文的整體精神不合：「無論做什麼，或說話或行事，都要奉主耶穌的名」（西 3:17）。從詩篇看，「願耶和華賜福」正是當時收割時公開說的問候（詩 129:8 反過來說，過路的人不肯這樣祝福錫安的仇敵），可見信仰語言本來就在田間、在工作的場合裡。<\/p>"], ["大膽表明說（每個場合都要明白見證）", "", "<p>主張：波阿斯是老闆，他公開用耶和華的名祝福工人；今天的基督徒老闆也應當在公司裡帶禱告、辦查經，讓信仰成為公司文化。<\/p><p><strong>難處：<\/strong>波阿斯在權力的上位，他的話之所以可信，是因為他的行動先保護了最弱的人。若老闆用權力要求員工參加宗教活動，信仰語言就成了另一種壓迫。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：波阿斯的問候是一個模式，但重點不在用了甚麼宗教字眼，而在三個次序：祝福先於指令、關係先於業績、行動支撐話語。<\/strong>他先祝福人，再問工作；他的話有分量，是因為他的田裡沒有人被欺負。<\/p><p>今天在不同國家的處境下，信徒需要智慧：有時可以直接說「願神祝福你」，有時只能說「我為你禱告」，有時連這也不方便，就讓公平、慷慨、保護弱者的行動說話。彼得說，有人問你們盼望的緣由，「就要常作準備，以溫柔、敬畏的心回答各人」（彼前 3:15）。<strong>信仰語言不是用來標示自己，是用來祝福別人。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你不必因為在職場不能公開禱告，就覺得自己的信仰不夠勇敢。你也不必因為說了一句祝福，就擔心被嘲笑。<strong>讓你的同事先從你身上看見「不可欺負」的保護和「留在地下」的慷慨，你的話自然會被聽見。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：波阿斯的問候（2:4）是值得效法的模式，重點在祝福先於指令、關係先於業績、行動支撐話語。在不同處境下需要智慧；身在權力位置的人尤其不可用信仰語言施壓，要讓保護弱者的行動先說話。", "care": "這一題要顧到在信仰受限制或不友善環境工作的弟兄姊妹，例如在中國的公司、在多元宗教的職場，他們可能因為無法公開表明信仰而有罪疚感，講台不要說「不敢開口就是羞恥福音」。也要提醒作老闆、主管的信徒：不要用信仰要求員工加班或參加活動。小組裡可以讓大家分享在職場的具體處境，一起想智慧的作法。若有人因信仰在職場受到不公平對待，請同工私訊關心，必要時協助了解勞工權益。"}, {"id": "ISS02_4", "t": "「我已經吩咐僕人不可欺負你」：一個外邦單身女子在田間有多危險？", "r": "2:8--9、15--16、22；利 19:33--34；申 24:17", "ch": [2, 3], "why": "讀到「不可欺負你」，很多人只當作波阿斯的好心，輕輕帶過。可是拿俄米在 2:22 又特別叮嚀「不叫人遇見你在別人田間」，可見田間對一個外邦寡婦並不安全。這卷書的時代背景是路得記——士 19–21 正是女性遭受暴力的黑暗篇章。今天也有許多外籍家庭幫傭、移工、在異鄉打工的單身女子，面對職場騷擾和暴力的危險。這一題若迴避，教會就看不見她們；若渲染，又會把經文講成驚悚故事。", "pos": [["【一】經文問的是甚麼", "", "<p>波阿斯說：「我已經吩咐僕人不可欺負你」（2:9），原文 לְבִלְתִּ֣י נָגְעֵ֑ךְ，直譯「不可碰你」。2:15 又吩咐「不可羞辱她」，2:16「不可叱嚇她」。拿俄米聽了說：「你跟著他的使女出去，不叫人遇見你在別人田間，這才為好。」（2:22）<\/p><p>2:22 的「遇見」原文是 יִפְגְּעוּ־בָ֖ךְ，有「衝撞、侵犯」的意思，和 1:16「不要催我」的 תִּפְגְּעִי 是同一個字根。問題是：<strong>經文是否暗示路得面對真實的人身危險？波阿斯的保護說明了甚麼？<\/strong><\/p>"], ["一般善意說（不必讀出暴力的暗示）", "", "<p>主張：波阿斯的話只是一個好雇主的關照，「不可欺負」「不可羞辱」指的是不要趕她走、不要罵她。把這裡讀成性暴力的危險，是把現代的憂慮塞進經文。<\/p><p><strong>難處：<\/strong>如果只是一般的善意，波阿斯不需要三次吩咐，拿俄米也不需要在晚上特別叮嚀「別人田間」的危險。原文「碰」這個字，在舊約中也可以指傷害或侵犯。路得記的時代是士師的時代，讀者剛讀完士 19–21 的悲劇。<\/p>"], ["真實危險說（經文看見弱勢女性的處境）", "", "<p>主張：一個沒有丈夫、沒有族人、又是外邦人的年輕女子，在收割季節獨自進入男人工作的田間，是極度脆弱的。波阿斯和拿俄米都清楚這一點，所以一個建立保護，一個提醒防範。<\/p><p><strong>難處：<\/strong>這一說若講過頭，容易渲染危險，把田間的男人都講成潛在的加害者，或把路得講成只能被保護的受害者。經文其實也強調路得的主動與勤勞（2:7）。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：經文清楚看見一個外邦單身女子在田間的危險，而波阿斯用他的權力建立了具體的保護結構。<\/strong>他不只叫路得「小心」，而是吩咐他的僕人——他改變的是加害可能發生的環境，而不是只要求弱者自己防範。<\/p><p>他的保護有四個層面：命令男僕「不可碰你」、讓她「常與我使女們在一處」（2:8）、讓她喝僕人打來的水、在吃飯時讓她坐在收割的人旁邊。律法本來就說：「若有外人在你們國中和你同居，就不可欺負他。」（利 19:33）本講義沿用路得記講義的議題「路得記充滿暴力，女性的遭遇一章比一章悲慘——這樣的經文該怎樣讀、怎樣講？」所立的原則：經文看見受害的人，講台也要看見。<strong>路得記的伯利恆裡，有一個女子沒有人保護；路得記的伯利恆裡，有一個人說「我已經吩咐」。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你曾在職場或異鄉受過欺負，請你知道：經文沒有忽略你這樣的人，神也沒有。保護你不是你一個人的責任，是有權柄的人應當承擔的責任。<strong>神在路得記裡站在被保護的人那一邊。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：經文看見外邦單身女子在田間的真實危險（2:9、22），波阿斯用權力建立具體保護：命令男僕、讓她與使女同在、給她水和食物。保護的責任在有權柄的人，不在弱者自己。講台不渲染，也不迴避。", "care": "這一題可能觸動曾經遭受職場性騷擾、性暴力的人，包括外籍家庭幫傭、工廠移工、獨自在外打工的年輕女性。講的時候不要描述暴力細節，不要說「女生自己要小心」來把責任推給受害者，也不要要求受害者原諒。若有人會後私訊說出自己的經歷，不追問細節，先相信她、陪伴她，並協助她尋求專業協助與法律管道。教會本身也要檢視：我們有沒有保護會友的機制？"}, {"id": "ISS02_5", "t": "「我既是外邦人」：教會怎樣接待新住民、外籍配偶與移工？", "r": "2:10；2:6；利 19:33--34；申 10:18--19；弗 2:19；來 13:2", "ch": [2, 1], "why": "路得俯伏在地問：「我既是外邦人，怎麼蒙你的恩？」這句話今天在很多人心裡迴響：嫁到台灣的越南、印尼姊妹，在馬來西亞、新加坡工作的外籍勞工，移民到紐西蘭、自己也成了「外邦人」的華人。教會常常想接待，卻不知道怎麼做：是讓他們學我們的語言、融入我們的聚會，還是另外成立外語團契？這一題若處理不好，接待會變成同化，或變成隔離。", "pos": [["【一】經文問的是甚麼", "", "<p>「路得就俯伏在地叩拜，對他說：『我既是外邦人，怎麼蒙你的恩，這樣顧恤我呢？』」（2:10）原文有一個雙關：「顧恤」是 לְהַכִּירֵ֔נִי（認得我），「外邦人」是 נָכְרִיָּֽה（陌生的女子），兩個字字母相近——直譯是「你怎麼會認得一個陌生人？」<\/p><p>經文同時不斷提醒讀者她的身分：監工說她是「那摩押女子」（2:6）。問題是：<strong>路得被接納的方式，對今天的教會接待外來者有甚麼啟示？<\/strong><\/p>"], ["同化接待說（接納就是讓他們成為我們）", "", "<p>主張：路得說「你的國就是我的國」，她學了以色列的方式、進入以色列的百姓。所以教會接待外來者，就是幫助他們學好語言、適應文化，最後完全成為我們的一份子。<\/p><p><strong>難處：<\/strong>經文自始至終稱她為「摩押女子路得」，從沒有把她的出身抹掉；神接納她，不需要她假裝自己不是摩押人。同化式的接待，常在不知不覺中要求外來者放棄自己的語言與文化，才配被看見。<\/p>"], ["分開事工說（為他們另設外語聚會）", "", "<p>主張：外來者有不同的語言、工時與需要，另外成立外語團契或移工事工，最能有效服事他們。<\/p><p><strong>難處：<\/strong>這是實際而必要的作法，但若只停在這裡，就可能變成隔離：他們永遠是「事工對象」，不是「家人」。路得記的結局是全城的長老和眾民在城門前為她祝福（4:11），她進入的是整個群體。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：接待的目標是成為一家人，而不是同化或隔離；接待的起點是「認得」——先看見那個陌生的人。<\/strong>外語聚會可以是橋梁，但不能是終點；學習語言可以是幫助，但不能是門檻。<\/p><p>律法說：「和你們同居的外人，你們要看他如本地人一樣，並要愛他如己，因為你們在埃及地也作過寄居的。」（利 19:34）波阿斯的接待也很具體：保護她的安全、給她水、讓她一同吃飯。保羅說：「你們不再作外人和客旅，是與聖徒同國，是神家裡的人了」（弗 2:19）。<strong>神不看你從哪裡來，看你歸向誰；教會也不該看人從哪裡來，而看我們有沒有把他認得。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你是教會裡的外來者，請你知道：你的出身不需要被抹掉，才配被神接納。如果你是接待的一方，也請記得：我們都曾是寄居的。<strong>在基督裡，沒有人是永遠的外邦人。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：接待的目標是成為一家人，不是同化，也不是隔離；起點是「認得」陌生人（2:10）。經文一直稱她「摩押女子路得」，沒有抹掉她的出身。外語聚會是橋梁不是終點，語言是幫助不是門檻（利 19:34；弗 2:19）。", "care": "這一題最需要保護的，是正坐在聚會裡的新住民、外籍配偶與移工。教會裡有些話很刺人：「你是怎麼嫁過來的？」「你們那裡很窮吧？」講台和小組都不要拿國籍、口音、膚色開玩笑。安排聚會時，考慮移工的休假日與工時；小組可以準備翻譯或簡單的雙語資料。不要把外來者只當作事工對象，請他們參與服事。會後若有人私訊說在教會感到被排斥，請同工認真聆聽，並在同工會中檢討接待方式。"}, {"id": "ISS02_6", "t": "「願你滿得他的賞賜」：人的善行會得神的賞賜嗎？這和恩典衝突嗎？", "r": "2:12；2:11；弗 2:8--10；來 11:6；路 6:35；林前 3:8", "ch": [2, 3], "why": "波阿斯祝福路得：「願耶和華照你所行的賞賜你」，聽起來像是行善換福報。華人文化很熟悉「善有善報」，民間信仰也講積功德，有些教會則講「奉獻越多，神就祝福越多」。另一方面，強調恩典的弟兄姊妹又對「賞賜」二字很敏感，覺得一提賞賜就是律法主義。這一題要問：路得記的「賞賜」是甚麼意思？它和「得救本乎恩」怎樣並存？", "pos": [["【一】經文問的是甚麼", "", "<p>波阿斯說：「願耶和華照你所行的賞賜你。你來投靠耶和華－以色列神的翅膀下，願你滿得他的賞賜。」（2:12）原文「賞賜你」是 יְשַׁלֵּ֥ם（償還、使之完全），「滿得他的賞賜」是 מַשְׂכֻּרְתֵּ֜ךְ שְׁלֵמָ֗ה，直譯「你完全的工價」。<\/p><p>可是同一句話也說，她是來「投靠」（לַחֲס֥וֹת）神的翅膀下。問題是：<strong>路得得到的，是她行善換來的報酬，還是她投靠的那位神白白給的恩典？兩者能不能同時成立？<\/strong><\/p>"], ["報償說（善行會換得神的祝福）", "", "<p>主張：經文明說「照你所行的」，用的是工價的字眼。舊約一貫教導神按人所行的報應人，「憐憫貧窮的，就是借給耶和華；他的善行，耶和華必償還」（箴 19:17）。路得的孝行與委身，換來了波阿斯與後來的婚姻。<\/p><p><strong>難處：<\/strong>保羅說：「做工的得工價，不算恩典，乃是該得的」（羅 4:4），而人在神面前得救，「不是出於行為」（弗 2:9）。若把這節講成交易，就會推出「奉獻越多、福氣越多」的成功神學；而且波阿斯祝福的是神的賞賜，不是地上的財富。<\/p>"], ["否定賞賜說（談賞賜就是律法主義）", "", "<p>主張：恩典的福音不需要「賞賜」的觀念；一提賞賜，人就會為了得報酬而行善，失去愛的純粹。<\/p><p><strong>難處：<\/strong>新約多次講賞賜：神「賞賜那尋求他的人」（來 11:6），「各人要照自己的工夫得自己的賞賜」（林前 3:8），主耶穌也說愛仇敵的人「賞賜就必大了」（路 6:35）。否定賞賜，就否定了神是喜悅並回應祂兒女的父。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：路得的得救與被接納，出於她所投靠的那位神的恩典；神也確實喜悅、回應出於信心的行為——賞賜是父親的喜悅，不是工資帳單。<\/strong>同一句話裡，「照你所行的」和「投靠……翅膀下」並列：她的行為不是買票，是投靠的結果。<\/p><p>更奇妙的是神賞賜她的方式：波阿斯在 2:12 求神用「翅膀」遮蔽她，到了 3:9，路得對他說「用你的衣襟遮蓋我」——原文同是 כָּנָף。<strong>波阿斯成了他自己禱告的答案。<\/strong>神的賞賜常常不是從天上掉下來，而是差一個人來。保羅說：「我們原是他的工作……為要叫我們行善」（弗 2:10）——善行是恩典的果子，不是恩典的價錢。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你行善多年卻仍在受苦，不要以為神忘了。神「並非不公義，竟忘記你們所做的工」（來 6:10）。祂的賞賜也許不是你期待的形式，但祂看見了。如果你覺得自己不配，也請記得：<strong>路得也說「我既是外邦人」，賞賜從來都是從投靠開始的。<\/strong><\/p>"]], "con": [], "say": "
