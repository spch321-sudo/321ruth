停下來的字。<\/strong>冠詞加完成式動詞，作關係子句：「那個回來的（女子）」。照語法它可以指拿俄米，但緊接在「摩押女子路得，她的兒婦」之後，最自然是指路得；2:6 僕人也說「是那摩押女子，跟隨拿俄米從摩押地回來的」（2:6）。<strong>一個從未住過伯利恆的人，被稱為「回來的」——對她來說，שׁוּב 已經從「回家」變成「歸向」。<\/strong><\/p><p>「正是動手割大麥的時候」是時間的標記，不必另作寓意。<\/p>", "exp": "<p><strong>拿俄米說她是空的；敘述者用最後一句話告訴我們：田已經熟了。<\/strong><\/p><p>第 1 章以「歸回」作結：「拿俄米和她兒婦摩押女子路得，從摩押地回來到伯利恆，正是動手割大麥的時候」（1:22）。這句話很平淡，像一個日期。可是放在 1:21 後面，它就是一個溫柔的回答。<strong>拿俄米剛說完「空空地」，經文就讓我們看見滿田的大麥。<\/strong><\/p><p>敘述者沒有反駁她，只是把鏡頭轉向她看不見的地方。第一，她不是一個人回來，「摩押女子路得」就在她身邊。拿俄米說她空了，可是她身邊有一個人，到第 4 章會被說成「有這兒婦比有七個兒子還好」（4:15）。第二，她們回來的時間正好：收割才剛開始，而且要一路收到「直到收完了大麥和小麥」（2:23）。<\/p><p>經文第一次叫她「摩押女子路得」。這個稱號會一直跟著她，神沒有抹掉她的出身；她就是帶著這個身分，被稱為「那回來的」。<\/p><p>第 1 章的字是「歸」。拿俄米的身體回來了，心還停在 1:21；路得從沒來過，卻真正歸向了神。<strong>你也許正說著「我是空的」，可是神也許已經把一個人放在你身邊，把一片田放在你眼前。<\/strong>你還不必立刻感覺到滿，只要先回到神的百姓中間。<\/p><p class=\"xref\">〔舊約〕利 23:10（利未記講義第 23 章）〔新約〕太 1:5<\/p>"}], "2": [{"a": 1, "z": 1, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וּֽלְנָעֳמִ֞י מוֹדַ֣ע לְאִישָׁ֗הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִמִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּשְׁמ֖וֹ בֹּֽעַז׃<\/p>", "lit": "<p>「至於拿俄米，她丈夫那邊有一位親族，是一個有能力、有產業的人，出於以利米勒的家族；他的名字是波阿斯。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>親族<\/td><td>מוֹדַע<\/td><td>moda‘<\/td><td>H4129<\/td><td>Qere 讀作親族、親戚（箴 7:4 同字，和合本譯作「親人」）；Ketiv 寫作 מידע，可讀為「相識的人」；兩者同出字根 יָדַע「知道」<\/td><\/tr><tr><td>大財主<\/td><td>גִּבּוֹר חַיִל<\/td><td>gibbor chayil<\/td><td>H1368／H2428<\/td><td>★ 直譯「有 חַיִל 的勇士」：能力、產業、品格兼有；3:11 路得被稱為「賢德的女子」，用的是同一個 חַיִל<\/td><\/tr><tr><td>親族中（家族）<\/td><td>מִמִּשְׁפַּחַת<\/td><td>mimmishpachat<\/td><td>H4940<\/td><td>宗族、家族；本章兩次（2:1、3），為 2:20「至近的親屬」鋪路<\/td><\/tr><tr><td>以利米勒<\/td><td>אֱלִימֶלֶךְ<\/td><td>’elimelekh<\/td><td>H458<\/td><td>「我的神是王」；人已死在摩押，名字卻一直被提起<\/td><\/tr><tr><td>波阿斯<\/td><td>בֹּעַז<\/td><td>bo‘az<\/td><td>H1162<\/td><td>字義不確定；全卷出現二十次，第一次就以「名字」被介紹出來<\/td><\/tr><\/table>", "gram": "<p><strong>本節是敘述者的插話：故事暫停，先讓讀者知道一件角色還不知道的事。<\/strong><\/p><p>原文以 וּלְנָעֳמִי（ulena‘omi，「至於拿俄米」）起頭，把表所屬的介詞片語（「屬拿俄米的」）提到句首，打斷 1:22 到 2:2 的敘事。這是希伯來敘事常用的「讀者先知」：<strong>讀者比角色多知道一點，就會屏息看著路得走向那塊田。<\/strong><\/p><p>「親族」Ketiv 作 מידע、Qere 作 מוֹדַע，兩者同出 יָדַע（知道），意義相去不遠。גִּבּוֹר חַיִל 在路得記多指「大能的勇士」（士 6:12；11:1）；本卷用在一位田主身上，重點是分量與品格，不是戰功。<\/p>", "exp": "<p><strong>路得還沒有出門，神已經在田的那一頭預備好一個人。<\/strong><\/p><p>第 1 章結束在兩個寡婦走進伯利恆，「正是動手割大麥的時候」（1:22）。第 2 章一開頭，敘述者沒有先讓路得說話，先把一個名字放在桌上：波阿斯。拿俄米說「耶和華使我空空地回來」（1:21）；她看自己是空的，<strong>敘述者卻悄悄告訴我們：她並不像她以為的那樣孤單。<\/strong><\/p><p>這人是「大財主」，原文 גִּבּוֹר חַיִל。חַיִל 是一個很寬的字：力量、財產、才幹、品格。到了第 3 章，同一個字落在路得身上：「你是個賢德的女子」（3:11）。<strong>一個有地的以色列男人，一個沒有地的摩押寡婦，被同一個字形容。<\/strong>經文量人的尺，不是出身，也不是存款，是品格。<\/p><p>他還屬於「以利米勒的家族」。以利米勒的名字意思是「我的神是王」，在一個「沒有王」的年代，這個名字像一句沒有說完的話。<\/p><p>我們常在最空的時候，以為身邊沒有人。<strong>你還沒看見的，不等於神還沒預備。<\/strong><\/p><p class=\"xref\">〔舊約〕士 6:12；士 11:1 → 321路得記講義第 6、11 章<\/p>"}, {"a": 2, "z": 2, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּאמֶר֩ ר֨וּת הַמּוֹאֲבִיָּ֜ה אֶֽל־נָעֳמִ֗י אֵֽלְכָה־נָּ֤א הַשָּׂדֶה֙ וַאֲלַקֳטָּ֣ה בַשִׁבֳּלִ֔ים אַחַ֕ר אֲשֶׁ֥ר אֶמְצָא־חֵ֖ן בְּעֵינָ֑יו וַתֹּ֥אמֶר לָ֖הּ לְכִ֥י בִתִּֽי׃<\/p>", "lit": "<p>「摩押女子路得對拿俄米說：讓我去田裡吧，好在穗子中間拾取，跟在那位我會在他眼中找到恩的人後面。她對她說：去吧，我的女兒。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>摩押女子<\/td><td>הַמּוֹאֲבִיָּה<\/td><td>hammo’aviyyah<\/td><td>H4125<\/td><td>「那摩押女子」；本章三次（2:2、6、21），經文從不抹掉她的出身<\/td><\/tr><tr><td>容我往……去<\/td><td>אֵלְכָה־נָּא<\/td><td>’elekhah-nna’<\/td><td>H3212／H4994<\/td><td>願望式加「請」：「讓我去吧」，是請求，不是通知<\/td><\/tr><tr><td>拾取<\/td><td>וַאֲלַקֳטָּה<\/td><td>va’alaqotah<\/td><td>H3950<\/td><td>Piel：一穗一穗地撿；本章「拾取」共十二次，是全章的節拍<\/td><\/tr><tr><td>恩<\/td><td>חֵן<\/td><td>chen<\/td><td>H2580<\/td><td>★ 恩惠、好感；本章三次（2:2、10、13），三次都出自路得的口：盼望、驚訝、感謝<\/td><\/tr><tr><td>在誰的眼中<\/td><td>בְּעֵינָיו<\/td><td>be‘einav<\/td><td>H5869<\/td><td>★ 直譯「在他的眼睛裡」；路得記主追蹤「眼中」的回聲<\/td><\/tr><tr><td>女兒<\/td><td>בִתִּי<\/td><td>vitti<\/td><td>H1323<\/td><td>「我的女兒」；拿俄米用這個稱呼回應，本章另有 2:8、22<\/td><\/tr><\/table>", "gram": "<p><strong>「我蒙誰的恩」，原文直譯是「在誰的眼中找到恩」。<\/strong><\/p><p>אֶמְצָא־חֵן בְּעֵינָיו（’emtsa’-chen be‘einav）是舊約固定的說法：「惟有挪亞在耶和華眼前蒙恩」（創 6:8）；哈拿說「願婢女在你眼前蒙恩」（撒上 1:18）。<strong>恩在別人的眼睛裡，不在自己手上。<\/strong><\/p><p>這個「眼睛」接上路得記的主追蹤：從「行耶和華眼中看為惡的事」（士 2:11），走到「各人任意而行」（士 21:25）——原文直譯是各人行自己眼中看為正的。路得記第 2 章三次說「在……眼中蒙恩」——2:2、10、13，<strong>同一個字從「自己的眼」搬到了「別人的眼」。<\/strong><\/p>", "exp": "<p><strong>路得記的人只看自己的眼睛；路得只求在別人的眼睛裡找到恩典。<\/strong><\/p><p>這一步是路得自己提出的。她知道以色列的律法為窮人留了一條路：「不可割盡田角，也不可拾取所遺落的」（利 19:9）；她也知道，律法給了權利，不保證地主給好臉色。所以她說：我去，看誰肯讓我跟在他後面。<\/p><p>原文的「容我往田間去」帶著一個「請」字。一個摩押女子在婆婆的城裡，連出門撿麥穗都先問一聲。<strong>這不是軟弱，是她知道自己的本位。<\/strong><\/p><p>拿俄米只回了一句：「女兒啊，你只管去。」（2:2）話很短。她還在 1:21 的痛裡，我們不必責備她話少；<strong>一個剛說完「全能者使我受了大苦」的人，還能叫一聲「女兒」，那已經是愛。<\/strong><\/p><p>驕傲說：我眼中看為對就是對；謙卑說：我願意等候別人眼中的恩典。<strong>謙卑不是看輕自己，是不再把自己當作標準。<\/strong><\/p><p class=\"xref\">〔舊約〕利 19:9--10 → 321利未記講義第 19 章；申 24:19 → 321申命記講義第 24 章；士 21:25 → 321路得記講義第 21 章<\/p>"}, {"a": 3, "z": 3, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֵּ֤לֶךְ וַתָּבוֹא֙ וַתְּלַקֵּ֣ט בַּשָּׂדֶ֔ה אַחֲרֵ֖י הַקֹּצְרִ֑ים וַיִּ֣קֶר מִקְרֶ֔הָ חֶלְקַ֤ת הַשָּׂדֶה֙ לְבֹ֔עַז אֲשֶׁ֖ר מִמִּשְׁפַּ֥חַת אֱלִימֶֽלֶךְ׃<\/p>", "lit": "<p>「她去了，她來了，她在田裡跟在收割的人後面拾取。她的機遇遇上了：那是屬波阿斯的那一分田，他是出於以利米勒家族的。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>恰巧（到了）<\/td><td>וַיִּקֶר<\/td><td>vayyiqer<\/td><td>H7136<\/td><td>★ 「遇上、碰到」；與下一字同字根，重疊使用<\/td><\/tr><tr><td>恰巧（機遇）<\/td><td>מִקְרֶהָ<\/td><td>miqreha<\/td><td>H4745<\/td><td>「她的機遇」；撒上 6:9 非利士人說「偶然遇見的」也是這個字<\/td><\/tr><tr><td>那塊田<\/td><td>חֶלְקַת הַשָּׂדֶה<\/td><td>chelqat hassadeh<\/td><td>H2513／H7704<\/td><td>田的「一分」：伯利恆城外的大田分成各家的地段<\/td><\/tr><tr><td>收割的人<\/td><td>הַקֹּצְרִים<\/td><td>haqqotsrim<\/td><td>H7114<\/td><td>分詞複數：正在收割的工人<\/td><\/tr><tr><td>拾取<\/td><td>וַתְּלַקֵּט<\/td><td>vattelaqqet<\/td><td>H3950<\/td><td>Piel 敘述式；路得的工作，最卑微的一種<\/td><\/tr><\/table>", "gram": "<p><strong>「恰巧」原文是重疊的說法 וַיִּקֶר מִקְרֶהָ（vayyiqer miqreha），直譯「她的機遇遇上了」。作者為甚麼這樣寫？<\/strong><\/p><ul><li>純屬偶然說：作者只是記下一件碰巧的事，沒有神學用意。<\/li><li>含蓄反語說：作者刻意用最「世俗」的字，像眨一眨眼——讀者已在 2:1 知道波阿斯是誰；同一個字在撒上 6:9 是用來排除神的手的。<\/li><li>命定說：神事先定死了路得的每一步，「恰巧」只是表象。<\/li><\/ul><blockquote><p><strong>本講義判斷：第二說最貼近文本。<\/strong>敘述者全卷只親口說兩次神的作為（1:6；4:13），其餘都讓神藏在人的腳步裡。「恰巧」是含蓄的見證，不是命定論的公式；路得真實地選擇，神真實地帶領。<\/p><\/blockquote>", "exp": "<p><strong>神沒有出聲，卻在一個人撿麥穗的路上做工。<\/strong><\/p><p>這一節的動詞一個接一個：她去了、來到、拾取。普通得不能再普通——沒有異象，沒有夢，沒有使者。然後敘述者說：「她恰巧到了以利米勒本族的人波阿斯那塊田裡。」（2:3）<\/p><p>原文的「恰巧」用了兩次同一個字根，好像作者故意把「碰巧」說得很重。<strong>作者用一個最不屬靈的字，講一件最屬靈的事。<\/strong><\/p><p>這裡要守住兩條界線。第一，這不是命定論：路得沒有被推著走，是她自己出門、自己走進一塊田；神的護理沒有取消她的選擇。第二，這不是成功神學：她不是因為敬虔就「遇到貴人」，她是彎著腰，在收割的人後面撿別人掉下的東西。<strong>神的護理，是在最卑微的工作裡被看見的。<\/strong><\/p><p>「人心籌算自己的道路；惟耶和華指引他的腳步。」（箴 16:9）你生命裡的「剛好」，不必每一件都解讀成神蹟，也不必都當成運氣。<strong>忠心走好今天這一步，把「恰巧」留給神。<\/strong><\/p><p class=\"xref\">〔舊約〕撒上 6:9；箴 16:9；得 4:1（和合本全卷第二次「恰巧」，原文作「看哪」）<\/p>"}, {"a": 4, "z": 7, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וְהִנֵּה־בֹ֗עַז בָּ֚א מִבֵּ֣ית לֶ֔חֶם וַיֹּ֥אמֶר לַקּוֹצְרִ֖ים יְהוָ֣ה עִמָּכֶ֑ם וַיֹּ֥אמְרוּ ל֖וֹ יְבָרֶכְךָ֥ יְהוָֽה׃ וַיֹּ֤אמֶר בֹּ֨עַז֙ לְנַעֲר֔וֹ הַנִּצָּ֖ב עַל־הַקּֽוֹצְרִ֑ים לְמִ֖י הַנַּעֲרָ֥ה הַזֹּֽאת׃ וַיַּ֗עַן הַנַּ֛עַר הַנִּצָּ֥ב עַל־הַקּוֹצְרִ֖ים וַיֹּאמַ֑ר נַעֲרָ֤ה מֽוֹאֲבִיָּה֙ הִ֔יא הַשָּׁ֥בָה עִֽם־נָעֳמִ֖י מִשְּׂדֵ֥ה מוֹאָֽב׃ וַתֹּ֗אמֶר אֲלַקֳטָה־נָּא֙ וְאָסַפְתִּ֣י בָֽעֳמָרִ֔ים אַחֲרֵ֖י הַקּוֹצְרִ֑ים וַתָּב֣וֹא וַֽתַּעֲמ֗וֹד מֵאָ֤ז הַבֹּ֨קֶר֙ וְעַד־עַ֔תָּה זֶ֛ה שִׁבְתָּ֥הּ הַבַּ֖יִת מְעָֽט׃<\/p>", "lit": "<p>「看哪，波阿斯從伯利恆來，對收割的人說：耶和華與你們同在。他們對他說：願耶和華賜福你。……這是誰的少女？……是一個摩押少女，就是那跟拿俄米從摩押田野回來的。她說：請讓我拾取，並在捆中收聚，跟在收割的人後面。她就來了，站著，從早晨直到現在；她在屋裡坐的，只有一點點。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>看哪<\/td><td>וְהִנֵּה<\/td><td>vehinneh<\/td><td>H2009<\/td><td>把鏡頭轉向來人：讀者與路得一同看見波阿斯走進田<\/td><\/tr><tr><td>與你們同在<\/td><td>עִמָּכֶם<\/td><td>‘immakhem<\/td><td>H5973<\/td><td>「耶和華與你們」——無動詞的問安，可作祝願，也可作宣告<\/td><\/tr><tr><td>賜福<\/td><td>יְבָרֶכְךָ<\/td><td>yevarekhkha<\/td><td>H1288<\/td><td>Piel 未完成式作祝願；本章「賜福」三次（2:4、19、20）<\/td><\/tr><tr><td>誰家的<\/td><td>לְמִי<\/td><td>lemi<\/td><td>H4310<\/td><td>直譯「屬於誰」：問的是她的家屬與歸屬，不只是名字<\/td><\/tr><tr><td>打捆<\/td><td>בָעֳמָרִים<\/td><td>va‘omarim<\/td><td>H6016<\/td><td>在「捆」中間：比一般拾穗多一步，2:15 波阿斯才准許<\/td><\/tr><tr><td>坐一會兒<\/td><td>שִׁבְתָּהּ<\/td><td>shivtah<\/td><td>H3427<\/td><td>「她的坐」；本節最難的一句，見 gram<\/td><\/tr><\/table>", "gram": "<p><strong>2:7 末句是全卷最難的一句：זֶה שִׁבְתָּהּ הַבַּיִת מְעָט（zeh shivtah habbayit me‘at），逐字是「這／她的坐／那屋／少」。<\/strong><\/p><ul><li>和合本與 WEB：「除了在屋子裡坐一會兒」——田邊有遮蔭的棚子，她只歇了片刻。<\/li><li>改讀說：七十士譯本作「她在田裡連一點也沒有歇」，可能讀的是不同的底本。<\/li><li>請求未決說：她請求「在捆中」拾取（2:7），超出慣例，所以一直「站著」等候田主回覆。<\/li><\/ul><blockquote><p><strong>本講義判斷：和合本的讀法可取，第三說有助理解。<\/strong>不論哪一種讀法，僕人要說的是同一件事：這女子勤快，從早晨到現在幾乎沒有停過。<\/p><\/blockquote>", "exp": "<p><strong>伯利恆的田裡，一句問安就讓人知道這是甚麼樣的地方。<\/strong><\/p><p>波阿斯一進田，第一句話不是查工，是「願耶和華與你們同在！」工人回答：「願耶和華賜福與你！」（2:4）這可能是當時田間常用的問安（參詩 129:8），卻不是空洞的儀式。<strong>在一個「各人任意而行」的年代，有一塊田，老闆與工人用神的名彼此祝福。<\/strong>屬神的體系，不先從會幕開始，先從一塊田的上下關係開始。<\/p><p>接著他問：「那是誰家的女子？」（2:5）原文直譯「她屬於誰」。古代的女人總要歸屬於某個人：父親、丈夫、家族。僕人的回答兩次提到摩押——「是那摩押女子，跟隨拿俄米從摩押地回來的」（2:6）。<strong>她屬於誰？好像不屬於任何人。<\/strong><\/p><p>可是僕人也替她作了見證：她先開口請求，然後從早晨一直站到現在。她求的甚至比慣例多一點——「在捆中」拾取。她不是偷，也不是搶，是請求，然後等候。<\/p><p>今天很多人走進教會，第一個感覺也是：我屬於誰？<strong>一句「願耶和華與你同在」，常常是陌生人在這裡留下來的第一個理由。<\/strong><\/p><p class=\"xref\">〔舊約〕士 17:7；士 19:1（伯利恆的另外兩個故事）→ 321路得記講義第 17、19 章<\/p>"}, {"a": 8, "z": 9, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וַיֹּאמֶר֩ בֹּ֨עַז אֶל־ר֜וּת הֲל֧וֹא שָׁמַ֣עַתְּ בִּתִּ֗י אַל־תֵּלְכִי֙ לִלְקֹט֙ בְּשָׂדֶ֣ה אַחֵ֔ר וְגַ֛ם לֹ֥א תַעֲבוּרִ֖י מִזֶּ֑ה וְכֹ֥ה תִדְבָּקִ֖ין עִם־נַעֲרֹתָֽי׃ עֵינַ֜יִךְ בַּשָּׂדֶ֤ה אֲשֶׁר־יִקְצֹרוּן֙ וְהָלַ֣כְתִּ אַחֲרֵיהֶ֔ן הֲל֥וֹא צִוִּ֛יתִי אֶת־הַנְּעָרִ֖ים לְבִלְתִּ֣י נָגְעֵ֑ךְ וְצָמִ֗ת וְהָלַכְתְּ֙ אֶל־הַכֵּלִ֔ים וְשָׁתִ֕ית מֵאֲשֶׁ֥ר יִשְׁאֲב֖וּן הַנְּעָרִֽים׃<\/p>", "lit": "<p>「波阿斯對路得說：你不是聽見了嗎，我的女兒？不要到別的田裡去拾取，也不要從這裡過去，就這樣緊貼著我的少女們。你的眼睛要看著他們收割的田，跟在她們後面。我不是已經吩咐少年人不可碰你嗎？你渴了，就到器皿那裡，喝少年人打上來的水。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>聽我說<\/td><td>הֲלוֹא שָׁמַעַתְּ<\/td><td>halo’ shama‘at<\/td><td>H3808／H8085<\/td><td>直譯「你不是聽見了嗎？」——溫和而確定的吩咐<\/td><\/tr><tr><td>常……在一處<\/td><td>תִדְבָּקִין<\/td><td>tidbaqin<\/td><td>H1692<\/td><td>★ 緊貼、黏住；與 1:14「捨不得」同一字 דָּבַק；本章三次（2:8、21、23）<\/td><\/tr><tr><td>你的眼睛<\/td><td>עֵינַיִךְ<\/td><td>‘einayikh<\/td><td>H5869<\/td><td>「眼睛」在本章的另一處：叫她把眼睛定在這塊田<\/td><\/tr><tr><td>欺負<\/td><td>נָגְעֵךְ<\/td><td>nog‘ekh<\/td><td>H5060<\/td><td>★ 直譯「碰你」；指侵犯、傷害<\/td><\/tr><tr><td>打來<\/td><td>יִשְׁאֲבוּן<\/td><td>yish’avun<\/td><td>H7579<\/td><td>汲水；通常是女人與外人替人打水，這裡反過來<\/td><\/tr><\/table>", "gram": "<p><strong>「不可欺負你」，原文 לְבִלְתִּי נָגְעֵךְ（levilti nog‘ekh），直譯「不可碰你」。<\/strong><\/p><p>נָגַע 可以是輕輕觸摸，也可以是傷害、侵犯（創 26:11「凡沾著這個人，或是他妻子的，定要把他治死」用同一個字）。一個單身的外邦女子在收割的男工之間，危險是真實的；波阿斯先用命令把危險擋住。<\/p><p>另一個顛倒：舊約裡常是女子或寄居的人替人打水（創 24:19–20 利百加為僕人與駱駝打水）；這裡卻是以色列的少年人打水，給一個摩押女子喝。<strong>恩典在這裡把位置倒了過來。<\/strong><\/p>", "exp": "<p><strong>波阿斯給的第一份恩典，不是糧食，是安全。<\/strong><\/p><p>他叫路得「女兒」，然後連下三道吩咐：不要往別人田裡去、不要離開這裡、要常與我使女們在一處。「常在一處」原文是 דָּבַק，就是 1:14「路得捨不得拿俄米」的那個字。<strong>她黏住了婆婆，現在有人為她找一個可以黏住的地方。<\/strong><\/p><p>接著他說：「我已經吩咐僕人不可欺負你」（2:9）。這一句不是客套。路得記最後幾章，伯利恆的另一個女子在基比亞的街上，「終夜凌辱她，直到天色快亮」（士 19:25），沒有一個人保護她。<strong>同一個年代，同一個伯利恆，這一次有人先開口，把門關上。<\/strong><\/p><p>然後是水。在烈日下的麥田，口渴不是小事。波阿斯讓她喝「僕人打來的水」——一個撿穗子的外邦人，被當成自己的工人看待。<\/p><p>今天教會裡也有許多「路得」：新住民、外籍配偶、移工、獨自來到城市的年輕人。他們最先需要的，常常不是一篇講道，是一個安全的位置。<strong>保護弱者不是額外的善行，是屬神百姓的本分。<\/strong><\/p><p class=\"xref\">〔舊約〕士 19:25 → 321路得記講義第 19 章；利 19:33--34 → 321利未記講義第 19 章<\/p>"}, {"a": 10, "z": 10, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַתִּפֹּל֙ עַל־פָּנֶ֔יהָ וַתִּשְׁתַּ֖חוּ אָ֑רְצָה וַתֹּ֣אמֶר אֵלָ֗יו מַדּוּעַ֩ מָצָ֨אתִי חֵ֤ן בְּעֵינֶ֨יךָ֙ לְהַכִּירֵ֔נִי וְאָּנֹכִ֖י נָכְרִיָּֽה׃<\/p>", "lit": "<p>「她就面伏於地，俯身下拜，對他說：為甚麼我在你眼中找到恩，使你認出我來，而我是一個外邦女子？」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>俯伏在地叩拜<\/td><td>וַתִּשְׁתַּחוּ אָרְצָה<\/td><td>vattishtachu ’artsah<\/td><td>H7812／H776<\/td><td>俯身到地：極深的敬意與感激<\/td><\/tr><tr><td>恩<\/td><td>חֵן<\/td><td>chen<\/td><td>H2580<\/td><td>★ 本章第二次「在……眼中蒙恩」<\/td><\/tr><tr><td>你的眼<\/td><td>בְּעֵינֶיךָ<\/td><td>be‘eineikha<\/td><td>H5869<\/td><td>「在你眼中」：路得記主追蹤的翻轉<\/td><\/tr><tr><td>顧恤<\/td><td>לְהַכִּירֵנִי<\/td><td>lehakkireni<\/td><td>H5234<\/td><td>★ Hiphil「認出、注意到、看重」；2:19「顧恤你的」同字<\/td><\/tr><tr><td>外邦人<\/td><td>נָכְרִיָּה<\/td><td>nokhriyyah<\/td><td>H5237<\/td><td>★ 陌生人、外人；與上一字同用 נ־כ־ר 三個字母<\/td><\/tr><\/table>", "gram": "<p><strong>本節是全章最巧的一個雙關：לְהַכִּירֵנִי（lehakkireni，「認出我」）與 נָכְרִיָּה（nokhriyyah，「外邦女子」）。<\/strong><\/p><ul><li>同字根說：兩字同出 נָכַר，本義是「端詳一個陌生的東西」，一端發展成「認出」，另一端成了「陌生」。<\/li><li>同音異根說：辭典分立兩個字根（H5234、H5237），只是字母相同，作者借音造出雙關。<\/li><\/ul><blockquote><p><strong>本講義判斷：不必在字源上定案，雙關是確定的。<\/strong>聽眾耳中聽見的是：「你怎麼會『認』一個『不認識』的人？」中文可以這樣翻：為甚麼你看見了一個沒有人看見的人？<\/p><\/blockquote>", "exp": "<p><strong>路得問的不是「我值得嗎」，是「你為甚麼看見我」。<\/strong><\/p><p>她俯伏在地叩拜。這不是誇張的禮貌，是一個寄人籬下的人，突然被人當人看時的反應。她說：「我既是外邦人，怎麼蒙你的恩，這樣顧恤我呢？」（2:10）<\/p><p>原文有一個漂亮的雙關：「顧恤我」是 לְהַכִּירֵנִי，「外邦人」是 נָכְרִיָּה，兩個字用的是同樣的字母。<strong>她說：我是一個沒有人會認得的人，你為甚麼認得我？<\/strong>恩典最深的地方，不在給了多少穗子，在於被看見。<\/p><p>這是本章第二次「在……眼中蒙恩」。2:2 是她出門前的盼望；2:10 是盼望成真之後的驚訝。她沒有說「我本來就該得」，也沒有說「我很勤快」。<strong>她越蒙恩，越把自己放低。<\/strong><\/p><p>這也是我們每一個人在神面前的姿態。我們原是「在以色列國民以外……是局外人」（弗 2:12），神卻認得我們。被神看見的人，最自然的回應不是表現，是俯伏。<\/p><p>一位新住民姊妹第一次被弟兄姊妹叫出名字，可能會像路得一樣說不出話。<strong>記住一個陌生人的名字，可能是你這週能做的最像神的一件事。<\/strong><\/p><p class=\"xref\">〔舊約〕申 10:18--19 → 321申命記講義第 10 章〔新約〕弗 2:12、19<\/p>"}, {"a": 11, "z": 12, "star": 3, "grk": "<p dir=\"rtl\" lang=\"he\">וַיַּ֤עַן בֹּ֨עַז֙ וַיֹּ֣אמֶר לָ֔הּ הֻגֵּ֨ד הֻגַּ֜ד לִ֗י כֹּ֤ל אֲשֶׁר־עָשִׂית֙ אֶת־חֲמוֹתֵ֔ךְ אַחֲרֵ֖י מ֣וֹת אִישֵׁ֑ךְ וַתַּֽעַזְבִ֞י אָּבִ֣יךְ וְאִמֵּ֗ךְ וְאֶ֨רֶץ֙ מֽוֹלַדְתֵּ֔ךְ וַתֵּ֣לְכִ֔י אֶל־עַ֕ם אֲשֶׁ֥ר לֹא־יָדַ֖עַתְּ תְּמ֥וֹל שִׁלְשֽׁוֹם׃ יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑ךְ וּתְהִ֨י מַשְׂכֻּרְתֵּ֜ךְ שְׁלֵמָ֗ה מֵעִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר־בָּ֖את לַחֲס֥וֹת תַּֽחַת־כְּנָפָֽיו׃<\/p>", "lit": "<p>「波阿斯回答她說：被告訴了，全都告訴了我：自從你丈夫死後，你向婆婆所行的一切；你怎樣離開你的父親、你的母親和你出生之地，走到一個你昨天、前天都不認識的民中。願耶和華償還你所作的；願你的工價是完全的，從耶和華－以色列的神那裡；你是來投靠在祂的翅膀底下。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>全都告訴我了<\/td><td>הֻגֵּד הֻגַּד<\/td><td>hugged huggad<\/td><td>H5046<\/td><td>不定詞獨立形加強語氣：「確確實實地被告訴了」<\/td><\/tr><tr><td>離開<\/td><td>וַתַּעַזְבִי<\/td><td>vatta‘azvi<\/td><td>H5800<\/td><td>★ 離棄、撇下；與 2:20「不斷地」（原文「沒有撇下」）同一個 עָזַב<\/td><\/tr><tr><td>賞賜（償還）<\/td><td>יְשַׁלֵּם<\/td><td>yeshallem<\/td><td>H7999<\/td><td>Piel：補足、償還；與下文「滿得」同字根<\/td><\/tr><tr><td>滿得（完全的）<\/td><td>שְׁלֵמָה<\/td><td>shelemah<\/td><td>H8003<\/td><td>★ 完全的、滿足的；對照 1:21「空空地」<\/td><\/tr><tr><td>投靠<\/td><td>לַחֲסוֹת<\/td><td>lachasot<\/td><td>H2620<\/td><td>尋求庇護；詩篇常用的字<\/td><\/tr><tr><td>翅膀<\/td><td>כְּנָפָיו<\/td><td>kenafav<\/td><td>H3671<\/td><td>★ 祂的翅膀；3:9「衣襟」原文同一字 כָּנָף<\/td><\/tr><\/table>", "gram": "<p><strong>「翅膀」כָּנָף（kanaf）的圖像從哪裡來？<\/strong><\/p><ul><li>母鳥說：如詩篇「你要投靠在他的翅膀底下」（詩 91:4），神像母鳥護雛。<\/li><li>聖所說：約櫃上基路伯的翅膀，「翅膀的蔭下」指神的同在之處。<\/li><li>衣襟說：כָּנָף 也指衣服的邊角，展開衣襟是保護與立約的動作（結 16:8；得 3:9）。<\/li><\/ul><blockquote><p><strong>本講義判斷：本節以第一說為主。<\/strong>「投靠」是詩篇的投靠語言；但作者顯然留了伏筆——第 3 章同一個字回來，變成波阿斯的衣襟。<\/p><\/blockquote>", "exp": "<p><strong>波阿斯沒有把焦點放在自己身上，他把路得指向神的翅膀。<\/strong><\/p><p>他先說他聽見了甚麼：「自從你丈夫死後，凡你向婆婆所行的……這些事人全都告訴我了」（2:11）。原文「告訴」連說兩次，像是說：整個伯利恆都在講你。<strong>路得在城裡沒有地位，卻有了名聲。<\/strong><\/p><p>「離開父母和本地」的「離開」是 עָזַב。這使我們想起創世記：「人要離開父母，與妻子連合」（創 2:24），同樣是「離開」與 דָּבַק「連合」；也想起神呼召亞伯蘭「離開本地、本族、父家」（創 12:1）。<strong>一個摩押寡婦，走了亞伯拉罕走過的路。<\/strong><\/p><p>然後他禱告：「願耶和華照你所行的賞賜你」（2:12）。「滿得」原文 שְׁלֵמָה，「完全的」。拿俄米說耶和華使她「空空地」回來；波阿斯求神使她的媳婦「滿」。<strong>這是全卷第一次有人為這個空的家，求一個滿。<\/strong><\/p><p>原文「賞賜」雖是 מַשְׂכֻּרְתֵּךְ「你的工價」，這賞賜卻不是工錢。她是「來投靠」的人，是躲到翅膀底下的小鳥，不是來領薪水的工人。<strong>投靠的人，所得的一切都是恩典。<\/strong><\/p><p>這禱告最美的是後續：到了第 3 章，路得會對他說：那就用你的「衣襟」——同一個 כָּנָף——遮蓋我。<strong>神回答禱告，常常是差那禱告的人自己去。<\/strong><\/p><p class=\"xref\">〔舊約〕詩 36:7；詩 57:1；詩 91:4〔新約〕太 23:37<\/p>"}, {"a": 13, "z": 13, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַ֠תֹּאמֶר אֶמְצָא־חֵ֨ן בְּעֵינֶ֤יךָ אֲדֹנִי֙ כִּ֣י נִֽחַמְתָּ֔נִי וְכִ֥י דִבַּ֖רְתָּ עַל־לֵ֣ב שִׁפְחָתֶ֑ךָ וְאָנֹכִי֙ לֹ֣א אֶֽהְיֶ֔ה כְּאַחַ֖ת שִׁפְחֹתֶֽיךָ׃<\/p>", "lit": "<p>「她說：願我在你眼中找到恩，我主；因為你安慰了我，因為你對著你婢女的心說話；而我，連作你婢女中的一個都不如。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>願……蒙恩<\/td><td>אֶמְצָא־חֵן<\/td><td>’emtsa’-chen<\/td><td>H4672／H2580<\/td><td>★ 本章第三次「在……眼中蒙恩」<\/td><\/tr><tr><td>我主<\/td><td>אֲדֹנִי<\/td><td>’adoni<\/td><td>H113<\/td><td>「我的主人」：對尊長的敬稱，非神名<\/td><\/tr><tr><td>安慰<\/td><td>נִחַמְתָּנִי<\/td><td>nichamtani<\/td><td>H5162<\/td><td>Piel：安慰、使心得舒解<\/td><\/tr><tr><td>說……話<\/td><td>דִבַּרְתָּ<\/td><td>dibbarta<\/td><td>H1696<\/td><td>「你說了」；與下一列連成固定片語<\/td><\/tr><tr><td>心<\/td><td>לֵב<\/td><td>lev<\/td><td>H3820<\/td><td>★ 「對著心說話」：說到人心裡去<\/td><\/tr><tr><td>使女<\/td><td>שִׁפְחָתֶךָ<\/td><td>shifchatekha<\/td><td>H8198<\/td><td>婢女、女僕：最低的家中僕人<\/td><\/tr><\/table>", "gram": "<p><strong>「願在你眼前蒙恩」是祈願，還是道謝？<\/strong><\/p><ul><li>祈願說：和合本、WEB 都作「願」：她求恩繼續臨到。<\/li><li>道謝說：未完成式可當現在式，意思是「你真是待我太好了」，是一句謙恭的謝辭。<\/li><\/ul><blockquote><p><strong>本講義判斷：兩者合一。<\/strong>這是當時的禮貌套語，撒上 1:18 哈拿用同一句；既是感謝，也是謙卑地把自己再交託出去。<\/p><\/blockquote><p>「慈愛的話安慰我的心」原文是 דִבַּרְתָּ עַל־לֵב（dibbarta ‘al-lev），直譯「你對著心說話」。約瑟對哥哥們「用親愛的話安慰他們」（創 50:21），神說「要對耶路撒冷說安慰的話」（賽 40:2），用的都是這個片語。<\/p>", "exp": "<p><strong>路得把自己一次比一次放低，波阿斯的話卻一直說到她的心裡。<\/strong><\/p><p>這是本章第三次「在……眼中蒙恩」。2:2 是盼望，2:10 是驚訝，2:13 是感謝。三次一次比一次低：2:10 她說「我既是外邦人」，這裡她說「我雖然不及你的一個使女」——<strong>連當最低的女僕都不夠格。<\/strong><\/p><p>可是她不是在自卑。她說：「你還用慈愛的話安慰我的心。」（2:13）原文直譯「你對著我的心說話」。波阿斯的話不只進了她的耳朵，進了她的心。<strong>一個在異鄉喪夫、天天彎腰撿穗的女人，最缺的不是糧食，是有人對著她的心說話。<\/strong><\/p><p>這一段給今天的關係一個樣子。驕傲激起驕傲：你強，我就更強。謙卑卻帶動謙卑：波阿斯放下地主的身分去看見一個外人，路得也沒有把恩典當成理所當然。<strong>兩個人都回到本位，結果是雙方都被祝福。<\/strong><\/p><p>你上一次「對著別人的心說話」是甚麼時候？一句真誠的安慰，可能比一袋米更長久地留在人的心裡。<\/p><p class=\"xref\">〔舊約〕創 50:21 → 321創世記講義第 50 章；撒上 1:18；賽 40:2<\/p>"}, {"a": 14, "z": 16, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַיֹּאמֶר֩ לָ֨ה בֹ֜עַז לְעֵ֣ת הָאֹ֗כֶל גֹּ֤שִֽׁי הֲלֹם֙ וְאָכַ֣לְתְּ מִן־הַלֶּ֔חֶם וְטָבַ֥לְתְּ פִּתֵּ֖ךְ בַּחֹ֑מֶץ וַתֵּ֨שֶׁב֙ מִצַּ֣ד הַקּֽוֹצְרִ֔ים וַיִּצְבָּט־לָ֣הּ קָלִ֔י וַתֹּ֥אכַל וַתִּשְׂבַּ֖ע וַתֹּתַֽר׃ וַתָּ֖קָם לְלַקֵּ֑ט וַיְצַו֩ בֹּ֨עַז אֶת־נְעָרָ֜יו לֵאמֹ֗ר גַּ֣ם בֵּ֧ין הָֽעֳמָרִ֛ים תְּלַקֵּ֖ט וְלֹ֥א תַכְלִימֽוּהָ׃ וְגַ֛ם שֹׁל־תָּשֹׁ֥לּוּ לָ֖הּ מִן־הַצְּבָתִ֑ים וַעֲזַבְתֶּ֥ם וְלִקְּטָ֖ה וְלֹ֥א תִגְעֲרוּ־בָֽהּ׃<\/p>", "lit": "<p>「到了吃飯的時候，波阿斯對她說：靠近到這裡來，吃些餅，把你的那塊餅蘸在醋裡。她就在收割的人旁邊坐下，他把烘過的穗子遞給她；她吃了，飽足了，還留下了。她起來要拾取，波阿斯吩咐他的少年人說：連在捆中間她也可以拾取，你們不可羞辱她；還要從捆裡為她抽出些來，留下讓她拾取，不可呵斥她。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>到這裡來<\/td><td>גֹּשִׁי הֲלֹם<\/td><td>goshi halom<\/td><td>H5066／H1988<\/td><td>「靠近，到這裡」：把她從田邊叫到飯桌旁<\/td><\/tr><tr><td>醋<\/td><td>בַּחֹמֶץ<\/td><td>bachomets<\/td><td>H2558<\/td><td>酸酒調成的蘸醬，收割工人消暑解渴之用<\/td><\/tr><tr><td>遞給（他）<\/td><td>וַיִּצְבָּט<\/td><td>vayyitsbat<\/td><td>H6642<\/td><td>第三人稱陽性單數：原文是「他」遞，見 gram<\/td><\/tr><tr><td>吃飽了<\/td><td>וַתִּשְׂבַּע<\/td><td>vattisba‘<\/td><td>H7646<\/td><td>★ 飽足；動詞全卷只此一次，2:18「吃飽了所剩的」用同字根的名詞；對照 1:21「空空地」<\/td><\/tr><tr><td>抽出<\/td><td>שֹׁל־תָּשֹׁלּוּ<\/td><td>shol-tashollu<\/td><td>H7997<\/td><td>不定詞獨立形加強：「一定要抽出來」，刻意地掉<\/td><\/tr><tr><td>羞辱<\/td><td>תַכְלִימוּהָ<\/td><td>takhlimuha<\/td><td>H3637<\/td><td>使蒙羞；2:16 又加「不可叱嚇」תִגְעֲרוּ<\/td><\/tr><\/table>", "gram": "<p><strong>是誰把烘了的穗子遞給她？<\/strong><\/p><ul><li>工人說：和合本作「他們把烘了的穗子遞給她」，理解為工人們一同分給她。<\/li><li>波阿斯說：原文 וַיִּצְבָּט 是陽性單數「他遞」，上下文唯一的陽性單數主詞是波阿斯——田主親手為撿穗的人布菜。<\/li><\/ul><blockquote><p><strong>本講義判斷：原文最自然是波阿斯本人。<\/strong>這一筆使場面更清楚：主人沒有只吩咐別人，他自己服事。<\/p><\/blockquote><p>也要守住界線：經文沒有把餅和醋當作聖餐的暗號，講台不必替它加上意義。<\/p>", "exp": "<p><strong>波阿斯給的，比律法要求的多。<\/strong><\/p><p>律法說：收割時「若忘下一捆，不可回去再取，要留給寄居的與孤兒寡婦」（申 24:19）。波阿斯做了三件律法沒有要求的事。第一，請她坐在收割的人旁邊吃飯——她從田邊被請到桌邊。第二，原文說是「他」親手把穗子遞給她。第三，吩咐僕人「從捆裡抽出些來，留在地下任她拾取」（2:16）——<strong>不是忘了掉的，是故意掉的。<\/strong><\/p><p>他還給了她一樣更細的東西：尊嚴。「不可羞辱她」「不可叱嚇她」。他不是把糧食丟給她，是讓她照樣「拾取」。<strong>她仍然靠自己的雙手工作，只是地上的穗子多了。<\/strong>好的幫助，不讓人覺得自己是乞丐。<\/p><p>然後是一句很短的話：「她吃飽了，還有餘剩的。」（2:14）全卷說「吃飽」，只在這一章（2:14、18）。第 1 章的空，第一次被一頓午飯填了一角。<\/p><p>聖經是我的準則——但準則告訴我們的是「至少要做到哪裡」。愛不會停在最低標準。對職場的同事、對教會的弱者，<strong>問的不是「我需要做到哪裡」，是「我還可以多留下甚麼」。<\/strong><\/p><p class=\"xref\">〔舊約〕申 24:19 → 321申命記講義第 24 章；利 23:22〔新約〕林後 8:9<\/p>"}, {"a": 17, "z": 19, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וַתְּלַקֵּ֥ט בַּשָּׂדֶ֖ה עַד־הָעָ֑רֶב וַתַּחְבֹּט֙ אֵ֣ת אֲשֶׁר־לִקֵּ֔טָה וַיְהִ֖י כְּאֵיפָ֥ה שְׂעֹרִֽים׃ וַתִּשָּׂא֙ וַתָּב֣וֹא הָעִ֔יר וַתֵּ֥רֶא חֲמוֹתָ֖הּ אֵ֣ת אֲשֶׁר־לִקֵּ֑טָה וַתּוֹצֵא֙ וַתִּתֶּן־לָ֔הּ אֵ֥ת אֲשֶׁר־הוֹתִ֖רָה מִשָּׂבְעָֽהּ׃ וַתֹּאמֶר֩ לָ֨הּ חֲמוֹתָ֜הּ אֵיפֹ֨ה לִקַּ֤טְתְּ הַיּוֹם֙ וְאָ֣נָה עָשִׂ֔ית יְהִ֥י מַכִּירֵ֖ךְ בָּר֑וּךְ וַתַּגֵּ֣ד לַחֲמוֹתָ֗הּ אֵ֤ת אֲשֶׁר־עָשְׂתָה֙ עִמּ֔וֹ וַתֹּ֗אמֶר שֵׁ֤ם הָאִישׁ֙ אֲשֶׁ֨ר עָשִׂ֧יתִי עִמּ֛וֹ הַיּ֖וֹם בֹּֽעַז׃<\/p>", "lit": "<p>「她在田裡拾取直到晚上，把所拾取的打了，約有一伊法大麥。她扛起來進城，婆婆看見她所拾取的；她又拿出她吃飽後所留下的給了婆婆。婆婆對她說：你今天在哪裡拾取？你在哪裡做工？願那認出你的人蒙福。她就把跟誰做工告訴婆婆說：我今天跟他做工的那人，名字是波阿斯。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>打了<\/td><td>וַתַּחְבֹּט<\/td><td>vattachbot<\/td><td>H2251<\/td><td>用棍子拍打，把穀粒從穗上打下來<\/td><\/tr><tr><td>一伊法<\/td><td>כְּאֵיפָה<\/td><td>ke’efah<\/td><td>H374<\/td><td>乾量單位，學者多估計約二十多公升（一說更多），夠兩個人吃上好些日子<\/td><\/tr><tr><td>大麥<\/td><td>שְׂעֹרִים<\/td><td>se‘orim<\/td><td>H8184<\/td><td>大麥；窮人的糧食，最早收割<\/td><\/tr><tr><td>所剩的<\/td><td>הוֹתִרָה<\/td><td>hotirah<\/td><td>H3498<\/td><td>Hiphil「留下」；與 2:14「還有餘剩的」同字<\/td><\/tr><tr><td>在哪裡<\/td><td>אֵיפֹה<\/td><td>’efoh<\/td><td>H375<\/td><td>「哪裡？」——與「伊法」聲音幾乎相同<\/td><\/tr><tr><td>顧恤你的<\/td><td>מַכִּירֵךְ<\/td><td>makkirekh<\/td><td>H5234<\/td><td>★ 「那認出你的人」；與 2:10「顧恤我」同字<\/td><\/tr><\/table>", "gram": "<p><strong>兩個聲音相近的字：2:17 的 אֵיפָה（’efah，「伊法」）與 2:19 的 אֵיפֹה（’efoh，「在哪裡」）。<\/strong><\/p><p>有學者聽出這裡的文字遊戲：路得扛回一個「伊法」，拿俄米劈頭就問「伊佛？」（在哪裡）。不論作者是否有意，場面是生動的：<strong>袋子太大，婆婆第一個反應是驚訝。<\/strong><\/p><p>另外，2:19 末句的語序把「波阿斯」放在全節最後一個字：שֵׁם הָאִישׁ……הַיּוֹם בֹּעַז（「那人的名字……今天……波阿斯」）。敘述者讓路得最後才說出名字，懸念留到最後一秒。<\/p>", "exp": "<p><strong>一天的拾穗，一伊法的大麥，一個名字。<\/strong><\/p><p>路得一直撿到晚上，再把穗子一下一下打成穀粒。她不是撿了一點就回家，<strong>恩典沒有取消她的勞苦。<\/strong>結果是「約有一伊法大麥」（2:17）——一個撿穗的人一天很難得到這麼多。<\/p><p>她扛著回城，還把中午「吃飽了所剩的」帶回給婆婆（2:18）。這個細節很溫柔：<strong>她在別人的桌上吃飽了，第一個想到的是家裡那個還沒吃的人。<\/strong><\/p><p>拿俄米一連問了兩個問題：「你今日在哪裡拾取麥穗，在哪裡做工呢？」然後不等回答，就先祝福：「願那顧恤你的得福。」（2:19）這是她回到伯利恆以後，第一次口中出現祝福。「顧恤」原文 מַכִּירֵךְ，就是 2:10「你怎麼認得我」的那個字。<strong>她還不知道是誰，已經知道有人「看見」了她的媳婦。<\/strong><\/p><p>路得把名字留到最後才說：「我今日在一個名叫波阿斯的人那裡做工。」（2:19）讀者早就知道了，拿俄米這時才知道。下一節，她的整個人要轉過身來。<\/p><p>我們也常在一天的勞苦之後，才回頭看見神放在路上的名字。<strong>每天晚上問一問：今天，神透過誰看見了我？<\/strong><\/p>"}, {"a": 20, "z": 20, "star": 3, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּ֨אמֶר נָעֳמִ֜י לְכַלָּתָ֗הּ בָּר֥וּךְ הוּא֙ לַיהוָ֔ה אֲשֶׁר֙ לֹא־עָזַ֣ב חַסְדּ֔וֹ אֶת־הַחַיִּ֖ים וְאֶת־הַמֵּתִ֑ים וַתֹּ֧אמֶר לָ֣הּ נָעֳמִ֗י קָר֥וֹב לָ֨נוּ֙ הָאִ֔ישׁ מִֽגֹּאֲלֵ֖נוּ הֽוּא׃<\/p>", "lit": "<p>「拿俄米對她的兒婦說：願他蒙耶和華賜福，祂沒有撇下祂的慈愛，向著活人，也向著死人。拿俄米又對她說：這人與我們相近，他是我們的贖回者之一。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>恩待（慈愛）<\/td><td>חַסְדּוֹ<\/td><td>chasdo<\/td><td>H2617<\/td><td>★ 「他的慈愛」：立約的忠誠、超過本分的愛；全卷三次（1:8；2:20；3:10）<\/td><\/tr><tr><td>不斷地（沒有撇下）<\/td><td>עָזַב<\/td><td>‘azav<\/td><td>H5800<\/td><td>直譯「沒有撇下」；本章另見 2:11「離開」、2:16「留在地下」<\/td><\/tr><tr><td>活人死人<\/td><td>הַחַיִּים……הַמֵּתִים<\/td><td>hachayyim … hammetim<\/td><td>H2416／H4191<\/td><td>活人＝拿俄米與路得；死人＝以利米勒、瑪倫、基連<\/td><\/tr><tr><td>本族的人<\/td><td>קָרוֹב<\/td><td>qarov<\/td><td>H7138<\/td><td>「近的」：血緣上的近親<\/td><\/tr><tr><td>至近的親屬<\/td><td>מִגֹּאֲלֵנוּ<\/td><td>miggo’alenu<\/td><td>H1350<\/td><td>★ גֹּאֵל 全卷第一次出現：「我們的贖回者之一」；有權也有責任贖回產業與人<\/td><\/tr><\/table>", "gram": "<p><strong>「他不斷地恩待活人死人」的「他」是誰？<\/strong><\/p><ul><li>耶和華說：關係子句 אֲשֶׁר 最自然接最近的名詞「耶和華」；創 24:27 有幾乎相同的片語指神：「他不斷地以慈愛誠實待我主人」（創 24:27）。<\/li><li>波阿斯說：被祝福的是「那人」，善待死人的家屬正是他的作為；撒下 2:5 大衛祝福基列‧雅比人，同樣是「願耶和華賜福」接著人的厚待。<\/li><\/ul><blockquote><p><strong>本講義判斷：原文最自然指耶和華。<\/strong>而神的慈愛正是藉著波阿斯臨到——兩者不衝突。拿俄米看見的是人的善待，認出的是神的不撇下。<\/p><\/blockquote>", "exp": "<p><strong>全卷的樞紐：同一個人、同一位神，從控訴變成祝福。<\/strong><\/p><p>剛回到伯利恆的時候，拿俄米說：「耶和華降禍與我；全能者使我受苦。」（1:21）今天晚上她說：「願那人蒙耶和華賜福，因為他不斷地恩待活人死人。」（2:20）中間只隔了一天的拾穗、一伊法的大麥，和一個名字。<strong>她的處境還沒有改變——丈夫沒有回來，兒子沒有回來——她的觀點先改變了。<\/strong><\/p><p>我們不必回頭責備她第 1 章的話。哀歌是信心的一種形式，她從頭到尾都是對著耶和華說話。現在，同一張口說出了祝福。<\/p><p>「不斷地」原文是「沒有撇下」。這個 עָזַב 在本章出現三次：路得「離開」父母（2:11），波阿斯叫僕人把穗子「留在地下」（2:16），神「沒有撇下」祂的慈愛（2:20）。<strong>人撇下了自己的，好讓別人得著；神卻從來沒有撇下。<\/strong><\/p><p>然後拿俄米說出全卷最重要的一個字：「是一個至近的親屬」——גֹּאֵל，贖回者。<strong>這是 חֶסֶד（慈愛）與 גֹּאֵל（贖回者）第一次在同一節相遇。<\/strong>前半卷是「空」，後半卷是「贖」，2:20 是轉身的那一步。<\/p><p>這使我們想起那位成了我們弟兄、付上代價贖回我們的主（來 2:11–17）。你今天也許還在 1:21，<strong>但神的慈愛沒有撇下活人，也沒有忘記死人。<\/strong><\/p><p class=\"xref\">〔舊約〕創 24:27 → 321創世記講義第 24 章；利 25:25 → 321利未記講義第 25 章〔新約〕來 2:11--17；多 2:14<\/p>"}, {"a": 21, "z": 23, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּ֖אמֶר ר֣וּת הַמּוֹאֲבִיָּ֑ה גַּ֣ם כִּי־אָמַ֣ר אֵלַ֗י עִם־הַנְּעָרִ֤ים אֲשֶׁר־לִי֙ תִּדְבָּקִ֔ין עַ֣ד אִם־כִּלּ֔וּ אֵ֥ת כָּל־הַקָּצִ֖יר אֲשֶׁר־לִֽי׃ וַתֹּ֥אמֶר נָעֳמִ֖י אֶל־ר֣וּת כַּלָּתָ֑הּ ט֣וֹב בִּתִּ֗י כִּ֤י תֵֽצְאִי֙ עִם־נַ֣עֲרוֹתָ֔יו וְלֹ֥א יִפְגְּעוּ־בָ֖ךְ בְּשָׂדֶ֥ה אַחֵֽר׃ וַתִּדְבַּ֞ק בְּנַעֲר֥וֹת בֹּ֨עַז֙ לְלַקֵּ֔ט עַד־כְּל֥וֹת קְצִֽיר־הַשְּׂעֹרִ֖ים וּקְצִ֣יר הַֽחִטִּ֑ים וַתֵּ֖שֶׁב אֶת־חֲמוֹתָֽהּ׃<\/p>", "lit": "<p>「摩押女子路得說：他還對我說：你要緊貼著屬我的少年人，直到他們收完屬我的全部莊稼。拿俄米對她的兒婦路得說：好，我的女兒，你要跟著他的少女們出去，免得人在別的田裡侵犯你。她就緊貼著波阿斯的少女們拾取，直到大麥收割和小麥收割都完了；她仍與她的婆婆同住。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>緊隨（常在一處）<\/td><td>תִּדְבָּקִין<\/td><td>tidbaqin<\/td><td>H1692<\/td><td>★ דָּבַק 本章第二、三次（2:21、23）；從 1:14 一路延續<\/td><\/tr><tr><td>僕人（少年人）<\/td><td>הַנְּעָרִים<\/td><td>hanne‘arim<\/td><td>H5288<\/td><td>陽性複數：路得轉述成「少年人」<\/td><\/tr><tr><td>使女<\/td><td>נַעֲרוֹתָיו<\/td><td>na‘arotav<\/td><td>H5291<\/td><td>陰性複數：拿俄米改口為「他的使女們」<\/td><\/tr><tr><td>遇見（侵犯）<\/td><td>יִפְגְּעוּ<\/td><td>yifge‘u<\/td><td>H6293<\/td><td>碰上、襲擊；不只是「被看見」，是「被欺負」<\/td><\/tr><tr><td>大麥和小麥<\/td><td>הַשְּׂעֹרִים……הַחִטִּים<\/td><td>hasse‘orim … hachittim<\/td><td>H8184／H2406<\/td><td>兩季收割，約七週<\/td><\/tr><\/table>", "gram": "<p><strong>波阿斯說「我使女們」（2:8），路得轉述成「我的僕人」（2:21），拿俄米又改回「他的使女」（2:22）。<\/strong><\/p><ul><li>泛稱說：陽性複數 הַנְּעָרִים 可以泛指全體工人，路得沒有說錯。<\/li><li>外人說：路得是外地人，不完全明白田間的分寸，轉述時把重點放錯了。<\/li><li>保護說：拿俄米聽出危險，特意改成「他的使女」，要她留在女工中間。<\/li><\/ul><blockquote><p><strong>本講義判斷：第一說解釋字面，第三說解釋拿俄米。<\/strong>不必把路得講成天真；重點是拿俄米已經從自己的痛裡抬起頭，開始像母親一樣為媳婦想。<\/p><\/blockquote>", "exp": "<p><strong>盼望有了名字之後，日子還是要一天一天過。<\/strong><\/p><p>路得告訴婆婆，波阿斯叫她「緊隨我的僕人」，直到收完莊稼（2:21）。敘述者在這裡又叫她「摩押女子路得」——<strong>她蒙了恩，出身卻沒有被抹掉。神接納她，不需要她假裝自己不是摩押人。<\/strong><\/p><p>拿俄米的回答很實際：「你跟著他的使女出去，不叫人遇見你在別人田間，這才為好。」（2:22）「遇見」原文 פָּגַע 是「襲擊、侵犯」。一位曾說「全能者使我受了大苦」的婆婆，現在開始保護她的媳婦。<strong>這是拿俄米的第二步：先是祝福，然後是看顧。<\/strong><\/p><p>最後一節是一段長長的時間：「直到收完了大麥和小麥。」（2:23）大約七個星期。沒有新的相遇，沒有新的對話，只有天天去田裡。<strong>路得的忠心不是一天的熱情，是一整季的重複。<\/strong><\/p><p>還有一句很輕的話：「路得仍與婆婆同住。」（2:23）她可以搬到更好的地方，她沒有。1:16 說的「你在哪裡住宿，我也在那裡住宿」，在這裡安靜地兌現。<\/p><p>收割季結束了，波阿斯還沒有開口。第 3 章要從這個「等」開始。<strong>信心不只在高峰，也在一個看不出進展的季節裡，照樣去田裡。<\/strong><\/p><p class=\"xref\">〔舊約〕得 1:14、16；士 19:25 → 321路得記講義第 19 章<\/p>"}], "3": [{"a": 1, "z": 2, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּ֥אמֶר לָ֖הּ נָעֳמִ֣י חֲמוֹתָ֑הּ בִּתִּ֞י הֲלֹ֧א אֲבַקֶּשׁ־לָ֛ךְ מָנ֖וֹחַ אֲשֶׁ֥ר יִֽיטַב־לָֽךְ׃ וְעַתָּ֗ה הֲלֹ֥א בֹ֨עַז֙ מֹֽדַעְתָּ֔נוּ אֲשֶׁ֥ר הָיִ֖ית אֶת־נַעֲרוֹתָ֑יו הִנֵּה־ה֗וּא זֹרֶ֛ה אֶת־גֹּ֥רֶן הַשְּׂעֹרִ֖ים הַלָּֽיְלָה׃<\/p>", "lit": "<p>「她的婆婆拿俄米對她說：我的女兒，我豈不要為你尋找一個安歇之處，使你得著好處嗎？現在，波阿斯——你曾與他的使女們在一起的那人——豈不是我們的親人嗎？看哪，他今夜要在打穀場上簸大麥。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>安身之處<\/td><td>מָנוֹחַ<\/td><td>manoach<\/td><td>H4494<\/td><td>安歇之處、可以停下來的地方；1:9 拿俄米為媳婦求的「平安」是同根的 מְנוּחָה<\/td><\/tr><tr><td>找<\/td><td>אֲבַקֶּשׁ<\/td><td>’avaqqesh<\/td><td>H1245<\/td><td>Piel 第一人稱：「我要去尋找」——禱告的人親自起身<\/td><\/tr><tr><td>享福<\/td><td>יִיטַב<\/td><td>yitav<\/td><td>H3190<\/td><td>「使你好」；本章「好」的一條線：3:7「心裡歡暢」、3:10「更大」、3:13「就由他吧」都屬這一族字<\/td><\/tr><tr><td>親族<\/td><td>מֹדַעְתָּנוּ<\/td><td>moda‘tanu<\/td><td>H4130<\/td><td>「我們的相識、親人」，與 יָדַע（知道）同根；本章「知道」的線從這裡開始<\/td><\/tr><tr><td>女兒<\/td><td>בִּתִּי<\/td><td>bitti<\/td><td>H1323<\/td><td>我的女兒；本章五次（3:1、10、11、16、18），婆媳成了母女<\/td><\/tr><tr><td>簸<\/td><td>זֹרֶה<\/td><td>zoreh<\/td><td>H2219<\/td><td>揚場；趁晚風把糠吹走，所以在夜裡<\/td><\/tr><\/table>", "gram": "<p><strong>3:1 的「安身之處」回應 1:9 的禱告。<\/strong>1:9 拿俄米祝福兩個兒婦：願耶和華使你們得 מְנוּחָה（menuchah，平安、安歇）；3:1 她說：我要為你尋找 מָנוֹחַ（manoach）。兩個字同出 נוּחַ（nuach，停下、安歇）。<strong>當年的主詞是「耶和華」，現在的主詞是「我」。<\/strong><\/p><p><strong>問題：拿俄米的計畫是信心，還是操縱？<\/strong><\/p><ul><li>信心說：她在 2:20 看見神的慈愛沒有斷，就起身配合。<\/li><li>操縱說：她安排了一個有風險的夜晚，想替神把事情推快。<\/li><li>敘述保留說：經文沒有評語，只寫出她的動機是「使你享福」。<\/li><\/ul><blockquote><p><strong>本講義判斷：<\/strong>經文沒有把她立為模範，也沒有責備她。它讓我們看見一個哀哭過的人重新為別人盤算，而計畫的結局，交在波阿斯的品格與律法的次序裡。<\/p><\/blockquote>", "exp": "<p><strong>在 1:9，拿俄米求神給媳婦安歇；在 3:1，她自己起身去找。<\/strong><\/p><p>第 1 章的拿俄米說自己是空的，連名字都不要了。到了第 3 章開頭，她第一次主動為別人盤算。她叫路得「女兒」，問的是：「我不當為你找個安身之處，使你享福嗎？」（3:1）「安身之處」原文 מָנוֹחַ（manoach），與她在摩押路上為兩個兒婦求的那份「平安」（1:9）同根。當年她說「願耶和華使你們……得平安」，現在她說「我要去找」。<strong>禱告沒有被收回，禱告的人站了起來。<\/strong><\/p><p>她為甚麼起來？因為她在第 2 章末了看見：「他不斷地恩待活人死人」（2:20），而且那人「是一個至近的親屬」（2:20）。神的慈愛先臨到，她的盤算才出現。這個次序很要緊：不是人先動、逼神配合；是神先動，人醒過來。<\/p><p>「波阿斯不是我們的親族嗎？」（3:2）她說「我們的」，把自己和摩押媳婦放在同一個家裡，話裡沒有一點婆媳的距離。<\/p><p>經文沒有評論她的方法，下一段會看見這個計畫確實有風險。但她的動機寫得很清楚：原文直譯是「使你得著好處」——好處是路得的，不是她自己的。<strong>一個被苦難掏空的人，開始為別人的好處打算，這本身就是恢復的記號。<\/strong>哀歌沒有讓她離開神；神的慈愛讓她重新有力氣去愛人。<\/p><p class=\"xref\">〔舊約〕得 1:9；2:20<\/p>"}, {"a": 3, "z": 4, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וְרָחַ֣צְתְּ וָסַ֗כְתְּ וְשַׂ֧מְתְּ שִׂמְלֹתַ֛יִךְ עָלַ֖יִךְ וְיָרַ֣דְתְּ הַגֹּ֑רֶן אַל־תִּוָּדְעִ֣י לָאִ֔ישׁ עַ֥ד כַּלֹּת֖וֹ לֶאֱכֹ֥ל וְלִשְׁתּֽוֹת׃ וִיהִ֣י בְשָׁכְב֗וֹ וְיָדַ֨עַתְּ֙ אֶת־הַמָּקוֹם֙ אֲשֶׁ֣ר יִשְׁכַּב־שָׁ֔ם וּבָ֛את וְגִלִּ֥ית מַרְגְּלֹתָ֖יו וְשָׁכָ֑בְתְּ וְהוּא֙ יַגִּ֣יד לָ֔ךְ אֵ֖ת אֲשֶׁ֥ר תַּעַשִֽׂין׃<\/p>", "lit": "<p>「你要沐浴、抹膏，把你的衣服穿在身上，下到打穀場去；不要讓那人認出你，直到他吃喝完了。到他躺下的時候，你要知道他躺的地方，就進去，掀開他腳那裡，躺下；他必告訴你所當做的事。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>沐浴<\/td><td>וְרָחַצְתְּ<\/td><td>verachatst<\/td><td>H7364<\/td><td>洗；與「抹膏」「換衣」連用，撒下 12:20 大衛結束居喪時是同樣三個動作<\/td><\/tr><tr><td>抹膏<\/td><td>וָסַכְתְּ<\/td><td>vasakht<\/td><td>H5480<\/td><td>用油抹身；居喪的人不抹（撒下 14:2）<\/td><\/tr><tr><td>衣服<\/td><td>שִׂמְלֹתַיִךְ<\/td><td>simlotayikh<\/td><td>H8071<\/td><td>Qere 複數「你的衣服」；Ketiv 寫作單數<\/td><\/tr><tr><td>認出<\/td><td>תִּוָּדְעִי<\/td><td>tivvade‘i<\/td><td>H3045<\/td><td>Niphal「使自己被知道」；3:14「不可使人知道」是同一個動詞<\/td><\/tr><tr><td>腳上的被<\/td><td>מַרְגְּלֹתָיו<\/td><td>margelotav<\/td><td>H4772<\/td><td>★ 字面「他腳的地方」；本章四次（3:4、7、8、14），聖經他處只見於但 10:6，指「腳」<\/td><\/tr><\/table>", "gram": "<p><strong>本段有 Ketiv／Qere。<\/strong>3:3「衣服」寫的是單數 שמלתך，讀的是複數 שִׂמְלֹתַיִךְ；3:3「下到」寫作 וירדתי、3:4「躺臥」寫作 ושכבתי，字尾像第一人稱「我下去」「我躺」，讀出形是第二人稱 וְיָרַדְתְּ、וְשָׁכָבְתְּ。不少學者認為所寫的字尾是古老的第二人稱陰性形式，本來就是「你」。本講義照讀出形。<\/p><p><strong>問題：「掀開他腳上的被」有性暗示嗎？<\/strong><\/p><ul><li>字面說：מַרְגְּלוֹת 是「腳的地方」，與「頭的地方」相對；她掀開的是他腳邊的覆蓋，躺在那裡。<\/li><li>含蓄說：有學者認為敘述者刻意用了含糊的字眼，夜、吃喝、躺臥，造成張力。<\/li><\/ul><blockquote><p><strong>本講義判斷：不渲染，也不迴避。<\/strong>經文製造了張力，也親手解開它：3:11 稱她「賢德的女子」，3:13 波阿斯起誓照律法辦理，3:14 天未亮她就起來。講台只用經文原句。<\/p><\/blockquote>", "exp": "<p><strong>拿俄米的吩咐分成兩半：前一半是路得要做的事，後一半是「他必告訴你」。<\/strong><\/p><p>「你要沐浴抹膏，換上衣服」（3:3）。這三個動作在舊約另一處也連在一起：大衛的孩子死後，他「沐浴，抹膏，換了衣裳」（撒下 12:20），從居喪中起來；居喪的人是「不要用膏抹身」的（撒下 14:2）。所以這句話最先要說的，不是外表，而是<strong>路得可以脫下寡婦的日子了<\/strong>。這一夜，拿俄米要她以一個可以再嫁的人的身分，去見那位至近的親屬。<\/p><p>接著拿俄米說：「卻不要使那人認出你來」（3:3），要等到他吃喝完了。打穀場上人多，這樣的請求不能當眾提出，只能私下說。<\/p><p>第 4 節是全章最容易被講歪的一句。經文只說「掀開他腳上的被，躺臥在那裡」（3:4），字面是「他腳的地方」。敘述者沒有多寫，講台也不必多寫。<strong>經文刻意含蓄，我們就照它的含蓄來讀。<\/strong><\/p><p>真正值得留意的是最後一句：「他必告訴你所當做的事。」（3:4）這個計畫有冒險，但它把下一步交在波阿斯的品格上——拿俄米在第 2 章已經看見這個人怎樣待一個外邦寡婦。這不是設局，是讓一位敬畏神的人有機會作決定。我們替別人盤算的時候，也要問：我是在逼人就範，還是在給人一個行善的機會？<\/p><p class=\"xref\">〔舊約〕撒下 12:20；14:2；創 38:14（創世記講義第 38 章）<\/p>"}, {"a": 5, "z": 6, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּ֖אמֶר אֵלֶ֑יהָ כֹּ֛ל אֲשֶׁר־תֹּאמְרִ֥י אֵלַ֖י אֶֽעֱשֶֽׂה׃ וַתֵּ֖רֶד הַגֹּ֑רֶן וַתַּ֕עַשׂ כְּכֹ֥ל אֲשֶׁר־צִוַּ֖תָּה חֲמוֹתָֽהּ׃<\/p>", "lit": "<p>「她對她說：凡你對我所說的，我都要做。她就下到打穀場，照她婆婆所吩咐她的一切去做。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>吩咐（說）<\/td><td>תֹּאמְרִי<\/td><td>tom’ri<\/td><td>H559<\/td><td>「你所說的」；3:11 波阿斯回應路得是同一句<\/td><\/tr><tr><td>對我<\/td><td>אֵלַי<\/td><td>’elai<\/td><td>H413<\/td><td>讀而不寫：Qere 補讀，Ketiv 沒有寫<\/td><\/tr><tr><td>遵行<\/td><td>אֶעֱשֶׂה<\/td><td>’e‘eseh<\/td><td>H6213<\/td><td>我要做；3:11「我必照著行」也是這個字<\/td><\/tr><tr><td>吩咐<\/td><td>צִוַּתָּה<\/td><td>tsivvattah<\/td><td>H6680<\/td><td>Piel：命令、囑咐<\/td><\/tr><tr><td>場<\/td><td>הַגֹּרֶן<\/td><td>haggoren<\/td><td>H1637<\/td><td>打穀場；本章四次（3:2、3、6、14）<\/td><\/tr><\/table>", "gram": "<p><strong>3:5 有一個「讀而不寫」的字。<\/strong>經文寫的是 כֹּל אֲשֶׁר־תֹּאמְרִי אֶעֱשֶׂה（「凡你所說的，我必做」），馬所拉傳統在中間補讀 אֵלַי（’elai，「對我」）。這是 Qere 補上、Ketiv 沒有寫的字，3:17 還有一次。意思不變，只是更貼近口語。<\/p><p>這一句在 3:11 幾乎原封不動地回來：波阿斯對路得說 כֹּל אֲשֶׁר־תֹּאמְרִי אֶעֱשֶׂה־לָּךְ。<strong>路得對婆婆說的話，波阿斯對路得說了一遍。<\/strong><\/p><p>第 6 節是敘事的總提：先說「她照著做了」，第 7–15 節再細說——而細說裡，她做了一件婆婆沒有吩咐的事（3:9）。<\/p>", "exp": "<p><strong>「凡你所吩咐的，我必遵行。」（3:5）這不是一句孝道口號，是一個信任的回答。<\/strong><\/p><p>路得在第 1 章說過：「你的神就是我的神」（1:16）。她跟著拿俄米回來，不是因為婆婆有權命令她，是因為她選擇了拿俄米的神。所以第 5 節的順服，根基在第 1 章。她明白這個計畫是要為這個家找一位贖回的親屬，就肯冒這個險。<\/p><p>這一句很容易被講成「媳婦就該聽婆婆的」，經文並不支持這種講法。第一，拿俄米在 1:8–15 一再勸兩個兒婦回去，路得沒有照做；第二，到了打穀場，路得開口說的話也不在婆婆的劇本裡（3:9）。<strong>她順服，但不是傀儡；她信任，仍然用自己的心面對神。<\/strong><\/p><p>第 6 節說她「照她婆婆所吩咐她的而行」（3:6）。敘述者先給總結，再倒帶給我們看細節。這種寫法讓讀者先放心：接下來的事，都在這個家為了「安身之處」所作的盤算裡，不是一個女子私自的冒險。<\/p><p>今天的家庭裡，婆媳之間最難的往往是信任。路得的順服之所以美，是因為它是自由的。<strong>被愛的人才甘心順服；被逼的人只會服從。<\/strong>這使我們想起，主耶穌要的也不是服從的手腳，而是一顆信得過祂的心。<\/p>"}, {"a": 7, "z": 8, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וַיֹּ֨אכַל בֹּ֤עַז וַיֵּשְׁתְּ֙ וַיִּיטַ֣ב לִבּ֔וֹ וַיָּבֹ֕א לִשְׁכַּ֖ב בִּקְצֵ֣ה הָעֲרֵמָ֑ה וַתָּבֹ֣א בַלָּ֔ט וַתְּגַ֥ל מַרְגְּלֹתָ֖יו וַתִּשְׁכָּֽב׃ וַיְהִי֙ בַּחֲצִ֣י הַלַּ֔יְלָה וַיֶּחֱרַ֥ד הָאִ֖ישׁ וַיִּלָּפֵ֑ת וְהִנֵּ֣ה אִשָּׁ֔ה שֹׁכֶ֖בֶת מַרְגְּלֹתָֽיו׃<\/p>", "lit": "<p>「波阿斯吃了、喝了，他的心就好了，便去躺在穀堆的盡頭。她就悄悄地來，掀開他腳的地方，躺下。到了半夜，那人驚顫，彎過身來；看哪，有一個女人躺在他腳的地方。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>心裡歡暢<\/td><td>וַיִּיטַב לִבּוֹ<\/td><td>vayyitav libbo<\/td><td>H3190／H3820<\/td><td>「他的心好了」；士 19:6、9 伯利恆的岳父勸女婿「暢快你的心」是同一說法<\/td><\/tr><tr><td>麥堆<\/td><td>הָעֲרֵמָה<\/td><td>ha‘aremah<\/td><td>H6194<\/td><td>穀堆；主人睡在旁邊看守收成<\/td><\/tr><tr><td>悄悄地<\/td><td>בַלָּט<\/td><td>ballat<\/td><td>H3909<\/td><td>秘密地、輕輕地；撒上 24:4 大衛「悄悄地」割下掃羅的衣襟，也是這個字<\/td><\/tr><tr><td>驚醒<\/td><td>וַיֶּחֱרַד<\/td><td>vayyecherad<\/td><td>H2729<\/td><td>戰兢、驚動<\/td><\/tr><tr><td>翻過身來<\/td><td>וַיִּלָּפֵת<\/td><td>vayyillafet<\/td><td>H3943<\/td><td>Niphal：彎身、轉身；士 16:29 參孫「抱住」柱子是同一個字根<\/td><\/tr><tr><td>不料<\/td><td>וְהִנֵּה<\/td><td>vehinneh<\/td><td>H2009<\/td><td>「看哪」；鏡頭換成波阿斯的眼睛<\/td><\/tr><\/table>", "gram": "<p><strong>「心裡歡暢」原文 וַיִּיטַב לִבּוֹ（vayyitav libbo），「他的心好了」。<\/strong>路得記第 19 章，伯利恆的岳父一再留女婿，說「暢快你的心」（士 19:6），原文同一說法；接著基比亞的匪徒也是在眾人「心裡正歡暢的時候」（士 19:22）圍住房子。<strong>同一個伯利恆、同一種吃喝後的夜，路得記走向暴力，路得記走向保護。<\/strong><\/p><p>「悄悄地」בַלָּט 也值得一提：大衛「悄悄地」割下掃羅外袍的衣襟（撒上 24:4），「衣襟」原文正是 כָּנָף。這使我們想起，路得的後裔大衛在山洞裡站在另一種張力上，也選擇了不伸手。<\/p><p>3:8 的 וְהִנֵּה 把視角交給波阿斯：他半夜醒來，只知道「有女子」，還不知道是誰。<\/p>", "exp": "<p><strong>這兩節的鏡頭很節制：吃、喝、躺下；她悄悄地來；到了半夜，那人驚醒。<\/strong><\/p><p>波阿斯「吃喝完了，心裡歡暢」（3:7）。收割季是一年辛勞的結束，打穀場上的吃喝是感恩的日子。他「睡在麥堆旁邊」（3:7），守著一年的收成。敘述者沒有說他醉了，也沒有說他做錯甚麼。<\/p><p>路得「便悄悄地來掀開他腳上的被，躺臥在那裡」（3:7）。她照著拿俄米的話一步一步做，經文也幾乎照抄第 4 節的動詞。<strong>經文寫多少，我們就讀多少。<\/strong>這不是迴避，是尊重這段經文自己選擇的分寸。<\/p><p>「到了夜半，那人忽然驚醒，翻過身來，不料有女子躺在他的腳下。」（3:8）中文的「不料」，原文是「看哪」，讀者被放進波阿斯的眼睛裡。黑夜、穀堆旁、一個認不出來的人影——這是一個可能出事的時刻。<\/p><p>讀過路得記的人記得，第十九章也有一個從伯利恆開始、在暴力中結束的夜晚。<strong>同樣是夜，同樣有一個女子在男人的權勢之下，路得記要我們看見：敬畏神的人在沒有人看見的時候怎樣行。<\/strong>真正的品格，不在白天的田間，而在半夜驚醒的那一刻。我們的本相，也常在沒有人看見的時候才顯出來。<\/p><p class=\"xref\">〔舊約〕士 19:6、22（路得記講義第 19 章）；撒上 24:4<\/p>"}, {"a": 9, "z": 9, "star": 3, "grk": "<p dir=\"rtl\" lang=\"he\">וַיֹּ֖אמֶר מִי־אָ֑תּ וַתֹּ֗אמֶר אָנֹכִי֙ ר֣וּת אֲמָתֶ֔ךָ וּפָרַשְׂתָּ֤ כְנָפֶ֨ךָ֙ עַל־אֲמָ֣תְךָ֔ כִּ֥י גֹאֵ֖ל אָֽתָּה׃<\/p>", "lit": "<p>「他說：你是誰？她說：我是路得，你的婢女。你要把你的衣襟展開在你的婢女身上，因為你是贖回的人。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>你是誰<\/td><td>מִי־אָתּ<\/td><td>mi-’at<\/td><td>H4310／H859<\/td><td>3:16 拿俄米開口也是這一句（和合本譯作「怎麼樣了」）<\/td><\/tr><tr><td>婢女<\/td><td>אֲמָתֶךָ<\/td><td>’amatekha<\/td><td>H519<\/td><td>婢女；2:13 她自稱「使女」（最低一等的侍女），這裡換成可以被娶進家中的身分<\/td><\/tr><tr><td>遮蓋（展開）<\/td><td>וּפָרַשְׂתָּ<\/td><td>uparasta<\/td><td>H6566<\/td><td>展開；結 16:8「用衣襟搭在你身上」是同一個動詞<\/td><\/tr><tr><td>衣襟<\/td><td>כְנָפֶךָ<\/td><td>khenafekha<\/td><td>H3671<\/td><td>★ 衣襟、翅膀；2:12「神的翅膀」是同一個字 כָּנָף（英文 WEB 前作 wings，此作 corner of your garment，看不出是同一字）<\/td><\/tr><tr><td>至近的親屬<\/td><td>גֹאֵל<\/td><td>go’el<\/td><td>H1350<\/td><td>★ 贖回的人（Qal 分詞）；全卷主追蹤，路得第一次親口說出<\/td><\/tr><\/table>", "gram": "<p><strong>「衣襟」與 2:12 的「翅膀」原文同一個字 כָּנָף（kanaf）。<\/strong>2:12 波阿斯祝福她投靠神的 כְּנָפָיו（「他的翅膀」）；3:9 她說：那就請你展開你的 כָּנָף。結 16:8 神說「便用衣襟搭在你身上」，緊接著「與你結盟，你就歸於我」，是立約娶妻的語言；申 22:30「掀開他父親的衣襟」也用 כָּנָף 指婚姻的遮蓋。<\/p><p><strong>問題：這是求婚，還是求贖？<\/strong><\/p><ul><li>求婚說：結 16:8 的用法很清楚，這是請他娶她。<\/li><li>求贖說：她給的理由是「你是至近的親屬」，要的是贖回者為以利米勒家盡本分。<\/li><\/ul><blockquote><p><strong>本講義判斷：兩者在她的話裡綁在一起。<\/strong>她請求婚姻，理由卻不是個人的感情，而是贖回的責任；她把「娶寡婦」與「贖產業」這兩件律法上本來分開的事，交在同一個人手裡。<\/p><\/blockquote>", "exp": "<p><strong>「你是誰？」這是全卷最要緊的一個問題，路得的回答也是全卷最勇敢的一句話。<\/strong><\/p><p>她沒有說「我是摩押女子」，也沒有說「我是瑪倫的遺孀」。她說：「我是你的婢女路得。」（3:9）在 2:13 她說自己「不及你的一個使女」（2:13），用的是 שִׁפְחָה，最低一等的侍女；這裡她用 אָמָה，一個可以被娶進家中的身分。<strong>她沒有抬高自己，也沒有貶低自己；她站在請求者的本位上。<\/strong><\/p><p>然後她改了拿俄米的劇本。婆婆說：「他必告訴你所當做的事」（3:4）；路得卻先開口：「求你用你的衣襟遮蓋我，因為你是我一個至近的親屬。」（3:9）<\/p><p>「衣襟」原文 כָּנָף，就是波阿斯祝福她時說的「翅膀」：「你來投靠耶和華－以色列神的翅膀下」（2:12）。那一天他為她禱告；這一夜她對他說：請你展開你的翅膀。<strong>波阿斯成了他自己禱告的答案。<\/strong>神回答禱告，常常是差那個禱告的人自己去。<\/p><p>她給的理由也很要緊：「至近的親屬」原文 גֹאֵל，「贖回的人」。她求的不是一個男人的愛慕，而是一位贖回者履行神律法裡的本分，叫以利米勒的家不至斷絕。<strong>她不是在為自己找出路，是在為一個家求救贖。<\/strong><\/p><p>這使我們想起主耶穌的話：祂多次願意聚集百姓，「好像母雞把小雞聚集在翅膀底下」（太 23:37）。投靠神翅膀下的人，也被呼召去作別人的遮蓋。<\/p><p class=\"xref\">〔舊約〕得 2:12；結 16:8；申 22:30（申命記講義第 22 章）〔新約〕太 23:37<\/p>"}, {"a": 10, "z": 10, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַיֹּ֗אמֶר בְּרוּכָ֨ה אַ֤תְּ לַֽיהוָה֙ בִּתִּ֔י הֵיטַ֛בְתְּ חַסְדֵּ֥ךְ הָאַחֲר֖וֹן מִן־הָרִאשׁ֑וֹן לְבִלְתִּי־לֶ֗כֶת אַחֲרֵי֙ הַבַּ֣חוּרִ֔ים אִם־דַּ֖ל וְאִם־עָשִֽׁיר׃<\/p>", "lit": "<p>「他說：我的女兒，願你蒙耶和華賜福！你使你後來的慈愛比先前的更美，因為你沒有去追隨少年人，無論是貧窮的或是富足的。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>賜福<\/td><td>בְּרוּכָה<\/td><td>beruchah<\/td><td>H1288<\/td><td>被祝福的（Qal 被動分詞）；2:20 拿俄米為波阿斯說的是同一個形式<\/td><\/tr><tr><td>更大<\/td><td>הֵיטַבְתְּ<\/td><td>hetavt<\/td><td>H3190<\/td><td>Hiphil：「你使……更好」；3:1「使你享福」是同一個字根<\/td><\/tr><tr><td>恩<\/td><td>חַסְדֵּךְ<\/td><td>chasdekh<\/td><td>H2617<\/td><td>★ 你的慈愛；全卷三次，最後一次被稱讚的是這個外邦女子<\/td><\/tr><tr><td>末後的<\/td><td>הָאַחֲרוֹן<\/td><td>ha’acharon<\/td><td>H314<\/td><td>後來的；對照「先前的」<\/td><\/tr><tr><td>少年人<\/td><td>הַבַּחוּרִים<\/td><td>habbachurim<\/td><td>H970<\/td><td>年輕男子；她本可以自由選擇<\/td><\/tr><\/table>", "gram": "<p><strong>問題：「末後的恩」與「先前的恩」各指甚麼？<\/strong><\/p><ul><li>多數解經家：先前的是她向拿俄米、向亡夫的慈愛（2:11）；末後的是她如今不為自己挑選，卻尋求一位能為這個家存留名字的親屬。<\/li><li>另一說：先前的是她離開本地、投靠神的翅膀下（2:12）；末後的是她把這份投靠落實在以色列的律法裡。<\/li><\/ul><blockquote><p><strong>本講義判斷：以第一說為主。<\/strong>經文自己給了理由：「少年人無論貧富，你都沒有跟從」——她的選擇是為了別人。<\/p><\/blockquote><p>חֶסֶד 全卷三次（1:8；2:20；3:10）：拿俄米求神照人的樣子施恩，接著是神的慈愛不斷，最後被稱讚有慈愛的，是摩押女子。<\/p>", "exp": "<p><strong>波阿斯第一句話不是答應，是祝福。他沒有看見一個越界的女子，他看見一份更大的慈愛。<\/strong><\/p><p>「女兒啊，願你蒙耶和華賜福。」（3:10）這和拿俄米為他說的「願那人蒙耶和華賜福」（2:20）是同一個形式。拿俄米為波阿斯祝福，波阿斯為路得祝福；福氣在這個小家裡傳來傳去，源頭都是耶和華。<\/p><p>「你末後的恩比先前更大」（3:10）。「恩」原文 חֶסֶד，是超過義務的忠誠之愛。先前的，是她離開父母和本地、跟隨婆婆（2:11）；末後的，是她把自己的婚姻也交給這個家。她年輕，有選擇，「因為少年人無論貧富，你都沒有跟從」（3:10）。她大可以為自己挑一個合意的人，卻選擇了一位能為以利米勒家盡贖回本分的親屬。<\/p><p>全卷 חֶסֶד 出現三次。第一次，拿俄米求神照兩個媳婦的樣子恩待她們（1:8）；第二次，神的慈愛不斷地臨到活人死人（2:20）；第三次，波阿斯稱讚的是一個摩押女子。<strong>神的慈愛，在人的慈愛裡被看見。<\/strong><\/p><p>這一節也提醒我們：無己不是沒有選擇，而是在有選擇的時候，選了對別人有益的那條路。路得的慈愛之所以「更大」，正因為沒有人能要求她這樣做。<strong>被要求的付出是本分，甘心的付出才是慈愛。<\/strong><\/p>"}, {"a": 11, "z": 11, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וְעַתָּ֗ה בִּתִּי֙ אַל־תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר־תֹּאמְרִ֖י אֶֽעֱשֶׂה־לָּ֑ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל־שַׁ֣עַר עַמִּ֔י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ׃<\/p>", "lit": "<p>「現在，我的女兒，不要懼怕；凡你所說的，我必為你做；因為我百姓的整個城門都知道，你是一個有才德的女子。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>不要懼怕<\/td><td>אַל־תִּירְאִי<\/td><td>’al-tir’i<\/td><td>H408／H3372<\/td><td>否定的勸勉；夜半危險中的第一句安慰<\/td><\/tr><tr><td>本城的人<\/td><td>כָּל־שַׁעַר<\/td><td>kol-sha‘ar<\/td><td>H3605／H8179<\/td><td>直譯「整個城門」；城門是公眾見證的地方，4:1 波阿斯就上到城門<\/td><\/tr><tr><td>知道<\/td><td>יוֹדֵעַ<\/td><td>yodea‘<\/td><td>H3045<\/td><td>本章「知道」的一條線：3:3 不要使他認出、3:14 不可使人知道、3:18 看這事怎樣成就<\/td><\/tr><tr><td>賢德的女子<\/td><td>אֵשֶׁת חַיִל<\/td><td>’eshet chayil<\/td><td>H802／H2428<\/td><td>★ 有才德的女人；2:1 波阿斯是 גִּבּוֹר חַיִל，箴 31:10「才德的婦人」原文同此<\/td><\/tr><\/table>", "gram": "<p><strong>אֵשֶׁת חַיִל（’eshet chayil）是本章的一顆珍珠。<\/strong>חַיִל 是力量、才幹、品格。2:1 稱波阿斯「是個大財主」，原文 גִּבּוֹר חַיִל（gibbor chayil），「有才德的勇士」；3:11 他稱路得為 אֵשֶׁת חַיִל。<strong>同一個 חַיִל，給了富足的地主，也給了貧窮的外邦寡婦。<\/strong><\/p><p>箴 31:10 問「才德的婦人誰能得著呢？」，原文也是 אֵשֶׁת חַיִל。希伯來聖經有些抄本（如列寧格勒抄本）把路得記排在箴言之後：箴言最後一章的問題，下一卷就給了一個名字。箴 31:31 說「願她的工作在城門口榮耀她」，這裡則是「我本城的人」，原文「整個城門」，都知道她。<\/p>", "exp": "<p><strong>半夜的危險裡，波阿斯的第一句話是：「不要懼怕」。<\/strong><\/p><p>路得冒了很大的險。一個外邦寡婦，夜裡在打穀場向一位有地位的人提出請求；若他拒絕，或把事情傳出去，她在伯利恆就無處容身。波阿斯明白這一點，所以他先安慰：「女兒啊，現在不要懼怕」（3:11）。<\/p><p>接著他說：「凡你所說的，我必照著行」（3:11）。這句話幾乎逐字重複路得在第 5 節對婆婆說的話。路得用信任回應拿俄米，波阿斯用同樣的信任回應路得。<strong>一個家裡的信任，就這樣一層一層傳開。<\/strong><\/p><p>然後是全章最清楚的一句評價：「我本城的人都知道你是個賢德的女子。」（3:11）這句話把第 4、7 節留下的張力收了起來。經文對那一夜的定論，是「賢德」。而且這不是波阿斯私下的看法，是「本城的人」、原文「整個城門」的見證——她拾穗的辛勞、她對婆婆的忠誠，人人看在眼裡。<\/p><p>「賢德」原文 חַיִל，正是 2:1 形容波阿斯「大財主」的那個字。<strong>他有財富，她有品格；在神眼中，兩個人站在同樣的高度。<\/strong>摩押女子沒有因為出身被降格，貧窮的寡婦也沒有因為處境被看輕。<\/p><p>一位新住民、一位外籍配偶讀到這一節，應該聽見的是：神看重的不是你從哪裡來，是你歸向誰、怎樣活。<strong>品格，是神所認得的身分。<\/strong><\/p><p class=\"xref\">〔舊約〕得 2:1；箴 31:10、31<\/p>"}, {"a": 12, "z": 13, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וְעַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י גֹאֵ֖ל אָנֹ֑כִי וְגַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽנִּי׃ לִ֣ינִי הַלַּ֗יְלָה וְהָיָ֤ה בַבֹּ֨קֶר֙ אִם־יִגְאָלֵ֥ךְ טוֹב֙ יִגְאָ֔ל וְאִם־לֹ֨א יַחְפֹּ֧ץ לְגָֽאֳלֵ֛ךְ וּגְאַלְתִּ֥יךְ אָנֹ֖כִי חַי־יְהוָ֑ה שִׁכְבִ֖י עַד־הַבֹּֽקֶר׃<\/p>", "lit": "<p>「現在，誠然我是贖回的人；但還有一個贖回的人比我更近。今夜你在這裡過夜；到了早晨，他若贖你，好，就讓他贖；他若不願意贖你，我指著永生的耶和華，我必贖你。你躺到早晨吧。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>實在<\/td><td>אָמְנָם<\/td><td>’omnam<\/td><td>H551<\/td><td>誠然、的確；後面寫而不讀的 אם 就在這裡<\/td><\/tr><tr><td>更近<\/td><td>קָרוֹב<\/td><td>qarov<\/td><td>H7138<\/td><td>近的；利 25:25「至近的親屬」原文就是「近的贖回者」<\/td><\/tr><tr><td>住宿<\/td><td>לִינִי<\/td><td>lini<\/td><td>H3885<\/td><td>你過夜吧；1:16「你在哪裡住宿，我也在那裡住宿」是同一個字<\/td><\/tr><tr><td>盡本分<\/td><td>יִגְאָלֵךְ<\/td><td>yig’alekh<\/td><td>H1350<\/td><td>★ 他贖你；3:13 一節之內 גָּאַל 動詞連用四次<\/td><\/tr><tr><td>就由他吧<\/td><td>טוֹב<\/td><td>tov<\/td><td>H2896<\/td><td>「好」；後世猶太解經中有一說把它當成那位親屬的名字，經文本身只是「好」<\/td><\/tr><tr><td>肯<\/td><td>יַחְפֹּץ<\/td><td>yachpots<\/td><td>H2654<\/td><td>願意、喜悅；贖不贖是他的自由<\/td><\/tr><\/table>", "gram": "<p><strong>3:12 有一個「寫而不讀」的字。<\/strong>經文寫作 כִּי אָמְנָם כִּי אם גֹאֵל אָנֹכִי，中間的 אם 在誦讀時略去；讀出形是 כִּי אָמְנָם כִּי גֹאֵל אָנֹכִי，「誠然，我是贖回的人」。<\/p><p><strong>問題：波阿斯為甚麼不直接答應？<\/strong><\/p><ul><li>律法次序說：贖回權照血緣遠近（利 25:25、48–49），更近的人有優先權，不能跳過。<\/li><li>保護說：若私下作成，日後那位親屬可以爭議，路得與這個家就沒有保障；必須在城門公開辦理。<\/li><li>謙卑說：波阿斯不搶別人的權利，也不把恩情變成佔有。<\/li><\/ul><blockquote><p><strong>本講義判斷：三者並存，以第一說為根。<\/strong>他的愛走在律法的路上，所以第二天可以在城門前光明地完成。<\/p><\/blockquote>", "exp": "<p><strong>波阿斯可以立刻答應，但他沒有；因為在他的心願之前，還有一個人的權利。<\/strong><\/p><p>「我實在是你一個至近的親屬，只是還有一個人比我更近。」（3:12）這句話一點也不浪漫，卻非常美。他承認自己有資格，也承認自己不是第一順位。照律法，贖回的責任屬於「至近的親屬」（利 25:25），越近的越先。波阿斯若在這一夜就作主，他得著了想要的，卻踩過了別人的位分。<strong>他守住自己的本位，也守住別人的本位。<\/strong><\/p><p>第 13 節，「贖」這個動詞一連出現四次：「他若肯為你盡親屬的本分……我必為你盡了本分」（3:13）。這是一句誓言。他「指著永生的耶和華起誓」（3:13），把自己的承諾放在神面前。夜裡私下的請求，被他帶回神的面前，帶回律法的次序裡。<\/p><p>「你今夜在這裡住宿」（3:13），「住宿」就是路得當年對婆婆說「你在哪裡住宿，我也在那裡住宿」（1:16）的同一個字。那時她選擇與婆婆同宿；今夜，她在一個已經起誓要保護她的人看顧之下，留到天亮。<\/p><p>在華人的處境裡，「先講清楚、照程序」有時被嫌麻煩，甚至被看成不夠愛。波阿斯卻讓我們看見：<strong>真正的愛不走捷徑，因為它在乎每一個人在神面前的位置。<\/strong>不要為了事傷害人，也不要為了得著所愛的，踩過別人的權利。<\/p><p class=\"xref\">〔舊約〕利 25:25（利未記講義第 25 章）；申 25:5–10（申命記講義第 25 章）<\/p>"}, {"a": 14, "z": 15, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וַתִּשְׁכַּ֤ב מַרְגְּלוֹתָיוֹ֙ עַד־הַבֹּ֔קֶר וַתָּ֕קָם בְּטֶ֛רֶם יַכִּ֥יר אִ֖ישׁ אֶת־רֵעֵ֑הוּ וַיֹּ֨אמֶר֙ אַל־יִוָּדַ֔ע כִּי־בָ֥אָה הָאִשָּׁ֖ה הַגֹּֽרֶן׃ וַיֹּ֗אמֶר הָ֠בִי הַמִּטְפַּ֧חַת אֲשֶׁר־עָלַ֛יִךְ וְאֶֽחֳזִי־בָ֖הּ וַתֹּ֣אחֶז בָּ֑הּ וַיָּ֤מָד שֵׁשׁ־שְׂעֹרִים֙ וַיָּ֣שֶׁת עָלֶ֔יהָ וַיָּבֹ֖א הָעִֽיר׃<\/p>", "lit": "<p>「她就在他腳的地方躺到早晨，在人還不能認出彼此之前就起來了。他說：不可讓人知道有這女人到打穀場來。他又說：把你身上的披肩拿來，拉住它。她拉住了，他就量了六份大麥，放在她身上；他就進城去了。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>辨認<\/td><td>יַכִּיר<\/td><td>yakkir<\/td><td>H5234<\/td><td>認出；2:10「顧恤」、2:19「顧恤你的」都是這個字根<\/td><\/tr><tr><td>不可使人知道<\/td><td>אַל־יִוָּדַע<\/td><td>’al-yivvada‘<\/td><td>H408／H3045<\/td><td>Niphal：「不要被知道」；呼應 3:3「不要使那人認出你來」<\/td><\/tr><tr><td>外衣<\/td><td>הַמִּטְפַּחַת<\/td><td>hammitpachat<\/td><td>H4304<\/td><td>披肩、外套；賽 3:22「雲肩」是同一個字<\/td><\/tr><tr><td>六簸箕<\/td><td>שֵׁשׁ־שְׂעֹרִים<\/td><td>shesh-se‘orim<\/td><td>H8337／H8184<\/td><td>直譯「六（份）大麥」，原文沒有寫量器<\/td><\/tr><tr><td>進城<\/td><td>הָעִיר<\/td><td>ha‘ir<\/td><td>H5892<\/td><td>城；馬所拉本作「他進城」，和合本照另一讀法作「她進城」<\/td><\/tr><\/table>", "gram": "<p><strong>3:14 的 Ketiv／Qere 只是拼法。<\/strong>「腳的地方」寫作 מרגלתו、讀作 מַרְגְּלוֹתָיו；「還沒」寫作 בטרום、讀作 בְּטֶרֶם。意思不變。<\/p><p><strong>3:15 末尾的主詞有異讀。<\/strong>馬所拉本作 וַיָּבֹא הָעִיר，「他進城去了」（WEB 照此），是波阿斯進城，接下 4:1 他上到城門；不少希伯來抄本與敘利亞文、拉丁通俗譯本讀作「她進城去了」，和合本採這一讀法。兩種讀法都通：路得回家（3:16），波阿斯往城門（4:1）。<\/p><p>「六簸箕」原文只有「六」與「大麥」，沒有量器；不必猜數字的意思，只要知道那是一份她扛得動、又足夠豐富的禮物。<\/p>", "exp": "<p><strong>天還沒亮，她就起來了；這一句是經文自己給的交代。<\/strong><\/p><p>「路得便在他腳下躺到天快亮，人彼此不能辨認的時候就起來了。」（3:14）她在人能彼此認出之前離開。這一夜從頭到尾，經文所記的就是：她在他腳下躺著，他起誓，她在天亮前起來。<strong>經文沒有留下空白要我們去填，它把結論寫得清清楚楚。<\/strong><\/p><p>波阿斯說：「不可使人知道有女子到場上來」（3:14）。這是遮掩嗎？不是。他剛說過全城都知道她是賢德的女子；他要保護的，正是這份名譽，免得閒話替一件清白的事加上不清白的解釋。他也在保護程序：那位更近的親屬還沒有表態，事情必須在城門前公開解決，不能讓私下的一夜先成了定局。<\/p><p>接著他「撮了六簸箕大麥，幫她扛在肩上」（3:15）。這是一份實實在在的禮物，也是一個記號：他不只是嘴上答應。不必把「六」數算成甚麼奧祕，經文要我們看見的，只是一個慷慨而周到的人。<\/p><p>保護一個人的名譽，是愛的一部分。教會裡有人因為被誤會而離開，有人因為別人一句沒有根據的話，從此抬不起頭。<strong>波阿斯教我們：愛人，就是連別人可能受的傷，也替他先想到。<\/strong><\/p>"}, {"a": 16, "z": 18, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַתָּבוֹא֙ אֶל־חֲמוֹתָ֔הּ וַתֹּ֖אמֶר מִי־אַ֣תְּ בִּתִּ֑י וַתַּ֨גֶּד־לָ֔הּ אֵ֛ת כָּל־אֲשֶׁ֥ר עָֽשָׂה־לָ֖הּ הָאִֽישׁ׃ וַתֹּ֕אמֶר שֵׁשׁ־הַשְּׂעֹרִ֥ים הָאֵ֖לֶּה נָ֣תַן לִ֑י כִּ֚י אָמַ֣ר אֵלַ֔י אַל־תָּב֥וֹאִי רֵיקָ֖ם אֶל־חֲמוֹתֵֽךְ׃ וַתֹּ֨אמֶר֙ שְׁבִ֣י בִתִּ֔י עַ֚ד אֲשֶׁ֣ר תֵּֽדְעִ֔ין אֵ֖יךְ יִפֹּ֣ל דָּבָ֑ר כִּ֣י לֹ֤א יִשְׁקֹט֙ הָאִ֔ישׁ כִּֽי־אִם־כִּלָּ֥ה הַדָּבָ֖ר הַיּֽוֹם׃<\/p>", "lit": "<p>「她回到她婆婆那裡，婆婆說：你是誰，我的女兒？她就把那人為她所做的一切告訴她，又說：這六份大麥是他給我的，因為他對我說：你不可空手回到你婆婆那裡。婆婆說：我的女兒，你坐著吧，直到你知道這事怎樣落定；因為那人必不安靜，除非他今天把這事辦完。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>怎麼樣了<\/td><td>מִי־אַתְּ<\/td><td>mi-’at<\/td><td>H4310／H859<\/td><td>直譯「你是誰」；與 3:9 波阿斯的問題同一句<\/td><\/tr><tr><td>空手<\/td><td>רֵיקָם<\/td><td>reqam<\/td><td>H7387<\/td><td>★ 空空地；全卷只兩次：1:21 與本節<\/td><\/tr><tr><td>安坐等候<\/td><td>שְׁבִי<\/td><td>shevi<\/td><td>H3427<\/td><td>坐下吧（命令式）；4:1 波阿斯在城門「坐」，是同一個動詞<\/td><\/tr><tr><td>成就<\/td><td>יִפֹּל<\/td><td>yippol<\/td><td>H5307<\/td><td>直譯「怎樣落下」；結局不在她手裡<\/td><\/tr><tr><td>休息<\/td><td>יִשְׁקֹט<\/td><td>yishqot<\/td><td>H8252<\/td><td>★ 安靜、太平；路得記「國中太平」是同一個字<\/td><\/tr><tr><td>辦成<\/td><td>כִּלָּה<\/td><td>killah<\/td><td>H3615<\/td><td>完成；3:3「吃喝完了」、2:21「收完了」是同一個字<\/td><\/tr><\/table>", "gram": "<p><strong>3:17 又有一個「讀而不寫」的 אֵלַי。<\/strong>經文寫 כִּי אָמַר אַל־תָּבוֹאִי（「因為他說：不可……回去」），Qere 補讀 אֵלַי（「對我」）。值得留意的是：這句話第 15 節沒有記，敘述者把它留到路得口中才說出來，因為它是說給拿俄米聽的。רֵיקָם 全卷只出現兩次，第一次是「耶和華使我空空地回來」（1:21）。<\/p><p><strong>3:18 的「休息」שָׁקַט 是路得記的回聲。<\/strong>路得記四次說「國中太平」（士 3:11、30；5:31；8:28），原文都是 וַתִּשְׁקֹט הָאָרֶץ；基甸以後，這句話再也沒有出現。在路得記，<strong>是那位贖回的人「必不休息」，好叫別人得著安身之處<\/strong>（3:1 מָנוֹחַ）。<\/p>", "exp": "<p><strong>第 3 章以兩個同樣的問題收束：波阿斯問「你是誰？」，拿俄米也問「你是誰？」。<\/strong><\/p><p>和合本把拿俄米的話譯成「女兒啊，怎麼樣了？」（3:16），意思準確；原文卻和 3:9 一樣是「你是誰」。路得出門時是寡婦，回來時已經是一位贖回者起誓要承擔的人。<strong>一夜之間，她的處境還沒改變，她的身分已經不同了。<\/strong><\/p><p>路得帶回大麥，又轉述了一句第 15 節沒有記下的話：「你不可空手回去見你的婆婆。」（3:17）這句話是說給拿俄米聽的。她曾說：「耶和華使我空空地回來」（1:21）；現在有人特別吩咐，不讓她的家「空手」。全卷「空」只出現這兩次。神沒有用責備回應她的哀歌，祂用一份沉甸甸的大麥回應。<\/p><p>然後，那個一向盤算的拿俄米說：「女兒啊，你只管安坐等候，看這事怎樣成就」（3:18）。她不再出主意了，因為她知道：「那人今日不辦成這事必不休息。」（3:18）「休息」原文 שָׁקַט，路得記用來說「國中太平」——那份太平只維持到基甸。在路得記，<strong>是一位贖回的人不肯休息，好叫別人得安息。<\/strong><\/p><p>這使我們想起那位「長遠活著，替他們祈求」（來 7:25）的主。交託不是放棄，是知道有一位比我們更在乎這件事的，正替我們辦成。用心靠聖靈，就坐得住；用腦靠自己，就坐不住。<strong>該做的做完了，就安坐等候。<\/strong><\/p><p class=\"xref\">〔舊約〕士 3:11；8:28（路得記講義第 3、8 章）；賽 30:15〔新約〕來 7:25<\/p>"}], "4": [{"a": 1, "z": 2, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וּבֹ֨עַז עָלָ֣ה הַשַּׁעַר֮ וַיֵּ֣שֶׁב שָׁם֒ וְהִנֵּ֨ה הַגֹּאֵ֤ל עֹבֵר֙ אֲשֶׁ֣ר דִּבֶּר־בֹּ֔עַז וַיֹּ֛אמֶר ס֥וּרָה שְׁבָה־פֹּ֖ה פְּלֹנִ֣י אַלְמֹנִ֑י וַיָּ֖סַר וַיֵּשֵֽׁב׃ וַיִּקַּ֞ח עֲשָׂרָ֧ה אֲנָשִׁ֛ים מִזִּקְנֵ֥י הָעִ֖יר וַיֹּ֣אמֶר שְׁבוּ־פֹ֑ה וַיֵּשֵֽׁבוּ׃<\/p>", "lit": "<p>「波阿斯上到城門，坐在那裡。看哪，波阿斯所說過的那位至近的親屬正經過。他說：轉過來，坐在這裡，某某人。他就轉過來坐下。他又從城裡的長老中取了十個人，說：你們坐在這裡。他們就坐下。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>城門<\/td><td>הַשַּׁעַר<\/td><td>hashsha‘ar<\/td><td>H8179<\/td><td>城門：古代城市的法庭、市場與公共廣場；本章的舞台<\/td><\/tr><tr><td>至近的親屬<\/td><td>הַגֹּאֵל<\/td><td>haggo’el<\/td><td>H1350<\/td><td>★ 分詞作名詞：有權、也有責任贖回近親地業與家的人；全卷主追蹤<\/td><\/tr><tr><td>恰巧<\/td><td>וְהִנֵּה<\/td><td>vehinneh<\/td><td>H2009<\/td><td>「看哪」；和合本譯「恰巧」，與 2:3 的「恰巧」原文不同，效果相同：時機剛好<\/td><\/tr><tr><td>某人<\/td><td>פְּלֹנִי אַלְמֹנִי<\/td><td>peloni ’almoni<\/td><td>H6423／H492<\/td><td>★「某某人」；押韻的套語，撒上 21:2、王下 6:8 用來指「某處」<\/td><\/tr><tr><td>十人<\/td><td>עֲשָׂרָה אֲנָשִׁים<\/td><td>‘asarah ’anashim<\/td><td>H6235／H376<\/td><td>十個人：足以構成公開見證的長老群<\/td><\/tr><tr><td>長老<\/td><td>מִזִּקְנֵי<\/td><td>mizziqne<\/td><td>H2205<\/td><td>「從……長老中」；城中負責判事的人，坐在城門<\/td><\/tr><\/table>", "gram": "<p><strong>「某人哪」（4:1）：波阿斯當然知道他的名字，為甚麼經文不寫？<\/strong><\/p><p>原文 פְּלֹנִי אַלְמֹנִי（peloni ’almoni），是押韻的不定稱呼，相當於中文的「某某人」。<\/p><p><strong>問題<\/strong><\/p><ul><li>說法一：敘述者刻意不寫——這人稍後不願為死人存留名字，經文也就沒有存留他的名字，是一種安靜的對照。<\/li><li>說法二：只是古代敘事常見的匿名，不帶評價；同一片語在撒上 21:2、王下 6:8 只是指「某處」，毫無貶意。<\/li><\/ul><blockquote><p><strong>本講義判斷：兩說都要保留。<\/strong>不寫名字是敘述者的選擇，形成與波阿斯的對照；但這不是定罪，經文沒有一個字責備他。<\/p><\/blockquote>", "exp": "<strong>第 3 章在打穀場的夜裡結束；第 4 章在城門的白天開始。<\/strong>拿俄米說「那人今日不辦成這事必不休息」（3:18），波阿斯就真的「到了城門，坐在那裡」（4:1）。<p>城門是古代城市的公共空間：買賣在這裡成交，糾紛在這裡判斷，長老在這裡坐著。波阿斯在夜裡答應的事，沒有私下處理，而是帶到最公開的地方。<strong>在一個「各人任意而行」（士 21:25）的年代，有一個人堅持在眾人面前、照著規矩辦事。<\/strong><\/p><p>「恰巧」那至近的親屬經過——原文只是「看哪」。敘述者又一次不提神，只讓我們看見時機剛好。第 2 章路得「恰巧」到了波阿斯的田，第 4 章那人「恰巧」經過城門。神沒有出聲，事情卻一件接一件地對上了。<\/p><p>然後是全章最安靜的一筆：「某人哪，你來坐在這裡」（4:1）。原文 פְּלֹנִי אַלְמֹנִי（peloni ’almoni），就是「某某人」。這人沒有做錯甚麼，後面他會合法、坦白地放棄權利。可是讀完全章就會發現：<strong>要為別人存留名字的人，名字被記住了；只想保住自己產業的人，連名字都沒有留下。<\/strong><\/p><p>波阿斯又請十位長老坐下。他不搶、不繞、不私了，先把更近的人請到前面，兌現了 3:12「還有一個人比我更近」。<strong>愛一個人，不等於可以越過次序；真正的慈愛，常常走最透明的路。<\/strong><\/p><p class=\"xref\">〔舊約〕得 3:12、18；士 21:25（路得記講義第 21 章）；撒上 21:2<\/p>"}, {"a": 3, "z": 4, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַיֹּ֨אמֶר֙ לַגֹּאֵ֔ל חֶלְקַת֙ הַשָּׂדֶ֔ה אֲשֶׁ֥ר לְאָחִ֖ינוּ לֶאֱלִימֶ֑לֶךְ מָכְרָ֣ה נָעֳמִ֔י הַשָּׁ֖בָה מִשְּׂדֵ֥ה מוֹאָֽב׃ וַאֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְךָ֣ לֵאמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽיֹּשְׁבִים֮ וְנֶ֣גֶד זִקְנֵ֣י עַמִּי֒ אִם־תִּגְאַל֙ גְּאָ֔ל וְאִם־לֹ֨א יִגְאַ֜ל הַגִּ֣ידָה לִּ֗י וְאֵֽדְעָה֙ כִּ֣י אֵ֤ין זוּלָֽתְךָ֙ לִגְא֔וֹל וְאָנֹכִ֖י אַחֲרֶ֑יךָ וַיֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל׃<\/p>", "lit": "<p>「他對那至近的親屬說：那塊田地，就是屬於我們弟兄以利米勒的，從摩押地回來的拿俄米要賣了。我心裡說：我要揭開你的耳朵，說：你在坐著的人面前、在我百姓的長老面前買下吧。你若要贖，就贖；他若不贖，你要告訴我，好叫我知道，因為除你以外沒有人可以贖，我在你之後。他說：我要贖。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>那塊地<\/td><td>חֶלְקַת הַשָּׂדֶה<\/td><td>cheleqat hassadeh<\/td><td>H2513／H7704<\/td><td>田的一分、一塊地業；讀者到這裡才知道拿俄米名下還有地<\/td><\/tr><tr><td>賣<\/td><td>מָכְרָה<\/td><td>makherah<\/td><td>H4376<\/td><td>Qal 完成式：可讀作「已經賣了」，也可讀作「現在要賣」<\/td><\/tr><tr><td>告訴<\/td><td>אֶגְלֶה אָזְנְךָ<\/td><td>’egleh ’oznekha<\/td><td>H1540／H241<\/td><td>直譯「揭開你的耳朵」：正式告知、公開說明<\/td><\/tr><tr><td>買<\/td><td>קְנֵה<\/td><td>qeneh<\/td><td>H7069<\/td><td>買、取得；本章 קָנָה 一連出現多次，交易的語言<\/td><\/tr><tr><td>贖<\/td><td>תִּגְאַל<\/td><td>tig’al<\/td><td>H1350<\/td><td>★ 本節 גָּאַל 字根密集出現；利 25:25 的權利與責任<\/td><\/tr><tr><td>我肯贖<\/td><td>אָנֹכִי אֶגְאָל<\/td><td>’anokhi ’eg’al<\/td><td>H595／H1350<\/td><td>加重的「我」：「我，我要贖」<\/td><\/tr><\/table>", "gram": "<p><strong>問題<\/strong>：「拿俄米現在要賣」（4:3）——地是已經賣了，還是正要賣？<\/p><ul><li>說法一：饑荒時早已賣出（或典出使用權），現在由至近的親屬向買主贖回。<\/li><li>說法二：מָכְרָה（makherah）是宣告式的完成式，「我現在出售」；和合本「現在要賣」照此。<\/li><\/ul><blockquote><p><strong>本講義判斷：和合本可取，兩說結果相同<\/strong>——利 25:25 的贖回程序啟動了。<\/p><\/blockquote><p>另：「他若不贖」原文是第三人稱 יִגְאַל，許多抄本與古譯本作第二人稱；或是波阿斯轉向長老說話。4:4「好叫我知道」有 Ketiv／Qere 拼法差異（讀作 וְאֵדְעָה），不影響意思。<\/p>", "exp": "<p><strong>波阿斯先談的是地，不是路得。<\/strong><\/p><p>「從摩押地回來的拿俄米，現在要賣我們族兄以利米勒的那塊地」（4:3）。讀者到這裡才知道，空空地回來的拿俄米，名下還有以利米勒的一塊地業；只是一個沒有丈夫、沒有兒子的老寡婦，沒有力氣耕種，也守不住它。律法早為這樣的人預備了一條路：「你的弟兄若漸漸窮乏，賣了幾分地業，他至近的親屬就要來把弟兄所賣的贖回」（利 25:25）。<strong>地是神的，人只是寄居的；贖回，是為了不讓一個家從神的應許裡消失。<\/strong><\/p><p>波阿斯說話很有分寸。他先指出次序：「當贖那塊地的是你，其次是我」（4:4）。他沒有說「讓給我吧」，也沒有用財力逼對方退出，而是把選擇權完整地交出去：你若肯，就贖；若不肯，就告訴我。<\/p><p>那人一口答應：「我肯贖。」（4:4）原文用了加重的「我」。以人的算盤看，這是一筆好買賣：拿俄米年老，沒有繼承人，許多解經家推想，地贖回來以後，多半就併入他自己的產業。<strong>他答應得快，因為他看見的是一塊地。<\/strong><\/p><p>我們對神的事，也常這樣：看得見好處的部分，我們說「我肯」。波阿斯在這裡也教我們一件事：他知道還有後半句沒說，卻不急著搶話，先讓對方把心裡的盤算說出來。<\/p><p class=\"xref\">〔舊約〕利 25:23--25（利未記講義第 25 章）；耶 32:7--8<\/p>"}, {"a": 5, "z": 6, "star": 3, "grk": "<p dir=\"rtl\" lang=\"he\">וַיֹּ֣אמֶר בֹּ֔עַז בְּיוֹם־קְנוֹתְךָ֥ הַשָּׂדֶ֖ה מִיַּ֣ד נָעֳמִ֑י וּ֠מֵאֵת ר֣וּת הַמּוֹאֲבִיָּ֤ה אֵֽשֶׁת־הַמֵּת֙ קָנִ֔יתָה לְהָקִ֥ים שֵׁם־הַמֵּ֖ת עַל־נַחֲלָתֽוֹ׃ וַיֹּ֣אמֶר הַגֹּאֵ֗ל לֹ֤א אוּכַל֙ לִגְאָל־לִ֔י פֶּן־אַשְׁחִ֖ית אֶת־נַחֲלָתִ֑י גְּאַל־לְךָ֤ אַתָּה֙ אֶת־גְּאֻלָּתִ֔י כִּ֥י לֹא־אוּכַ֖ל לִגְאֹֽל׃<\/p>", "lit": "<p>「波阿斯說：在你從拿俄米手中買下這田的日子，也從摩押女子路得——死人的妻——那裡，你買下，為要在死人的產業上興起他的名。那至近的親屬說：我不能為自己贖，免得我毀了我自己的產業。你為你自己贖我所當贖的吧，因為我不能贖。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>也<\/td><td>וּמֵאֵת<\/td><td>ume’et<\/td><td>H4480／H853<\/td><td>MT 作「也從……」；和合本照改讀 וְגַם אֶת「並且（娶）」<\/td><\/tr><tr><td>娶<\/td><td>קָנִיתָה<\/td><td>qanitah<\/td><td>H7069<\/td><td>Qere「你買」；Ketiv 寫作 קניתי「我買」；和合本夾注「原文是買」<\/td><\/tr><tr><td>存留……名<\/td><td>לְהָקִים שֵׁם־הַמֵּת<\/td><td>lehaqim shem-hammet<\/td><td>H6965／H8034／H4191<\/td><td>直譯「興起死人的名」；與申 25:7 同一語言<\/td><\/tr><tr><td>有礙<\/td><td>אַשְׁחִית<\/td><td>’ashchit<\/td><td>H7843<\/td><td>★ Hiphil：毀壞、敗壞；「免得我毀了我的產業」<\/td><\/tr><tr><td>贖我所當贖的<\/td><td>גְּאֻלָּתִי<\/td><td>ge’ullati<\/td><td>H1353<\/td><td>我的贖回權；可以合法轉讓<\/td><\/tr><tr><td>不能<\/td><td>לֹא אוּכַל<\/td><td>lo’ ’ukhal<\/td><td>H3808／H3201<\/td><td>「我不能」，本節頭尾各一次<\/td><\/tr><\/table>", "gram": "<p><strong>問題<\/strong>：4:5 是本卷最重要的異讀，原文到底怎麼讀？<\/p><ul><li>說法一（MT＋Qere）：וּמֵאֵת…קָנִיתָה「也要從摩押女子路得那裡買」——路得也握有地權，買地必須連她一起處理；WEB 照此。<\/li><li>說法二（改讀 וְגַם אֶת＋Qere）：「也當娶死人的妻」——和合本照此，與 4:10 波阿斯自己的話 וְגַם אֶת־רוּת…קָנִיתִי 完全平行。<\/li><li>說法三（Ketiv קניתי）：「我（波阿斯）也要買路得」——波阿斯先宣布自己要娶她，讓地與人分開，對方只買地便得不到好處。<\/li><\/ul><blockquote><p><strong>本講義判斷：以說法二為主，因為有 4:10 的平行；<\/strong>三說的結果一致——地和路得被綁在一起，贖地的人必須為死人存留名字。<\/p><\/blockquote>", "exp": "<p><strong>第 5 節，波阿斯說出後半句；第 6 節，那人改口了。<\/strong><\/p><p>「你從拿俄米手中買這地的時候，也當娶死人的妻摩押女子路得，使死人在產業上存留他的名」（4:5）。這句話把兩條律法接在一起：利 25:25 的「贖地」，和申 25:5–6 的「為死人立後」，後者要叫婦人生的長子「必歸死兄的名下，免得他的名在以色列中塗抹了」（申 25:6）。申命記原本只要求亡夫的兄弟；波阿斯把這份責任放到至近的親屬身上，可能是當時伯利恆的慣例，也可能是他自己的堅持。<strong>買地不再只是買地，而是要扛起一個人、一個家，和一個將來不歸自己名下的兒子。<\/strong><\/p><p>那人立刻算清楚了：「這樣我就不能贖了，恐怕於我的產業有礙」（4:6）。原文直譯是「免得我毀了我自己的產業」。生下的兒子要承瑪倫的名，地將來也歸那孩子；他出錢、出力，最後是替別人的家買。他也許還有自己的妻兒要顧。<\/p><p>這裡必須說清楚：<strong>他沒有違法，也沒有欺負誰。<\/strong>申 25:7–10 本來就容許人不肯；他用的是合法、公開、坦白的方式。經文沒有罵他，講台也不可以把他講成壞人。<\/p><p>經文只是讓我們看見對照：他保住了產業，名字卻沒有留下；波阿斯甘願讓自己的產業受虧，名字卻寫進了王的家譜。<strong>一個人可以完全合法，卻錯過了愛。<\/strong>我們也常說「這樣對我不利」；神不因此定罪，卻溫柔地問：你要保住的，是你的東西，還是一個人？人比東西重要。<\/p><p class=\"xref\">〔舊約〕利 25:25（利未記講義第 25 章）；申 25:5--10（申命記講義第 25 章）〔新約〕可 12:19<\/p>"}, {"a": 7, "z": 8, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וְזֹאת֩ לְפָנִ֨ים בְּיִשְׂרָאֵ֜ל עַל־הַגְּאוּלָּ֤ה וְעַל־הַתְּמוּרָה֙ לְקַיֵּ֣ם כָּל־דָּבָ֔ר שָׁלַ֥ף אִ֛ישׁ נַעֲל֖וֹ וְנָתַ֣ן לְרֵעֵ֑הוּ וְזֹ֥את הַתְּעוּדָ֖ה בְּיִשְׂרָאֵֽל׃ וַיֹּ֧אמֶר הַגֹּאֵ֛ל לְבֹ֖עַז קְנֵה־לָ֑ךְ וַיִּשְׁלֹ֖ף נַעֲלֽוֹ׃<\/p>", "lit": "<p>「從前在以色列，關於贖回和交換，為要確立一切的事：一個人脫下他的鞋，給他的同伴；這就是在以色列中的證明。那至近的親屬對波阿斯說：你為自己買吧。他就脫下他的鞋。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>從前<\/td><td>לְפָנִים<\/td><td>lefanim<\/td><td>H6440<\/td><td>「在從前」：敘述者為後代讀者解釋一個已經不熟悉的習俗<\/td><\/tr><tr><td>贖回<\/td><td>הַגְּאוּלָּה<\/td><td>hagge’ullah<\/td><td>H1353<\/td><td>贖回權；與 4:6「我所當贖的」同一個字<\/td><\/tr><tr><td>交易<\/td><td>הַתְּמוּרָה<\/td><td>hattemurah<\/td><td>H8545<\/td><td>交換、轉讓<\/td><\/tr><tr><td>脫<\/td><td>שָׁלַף<\/td><td>shalaf<\/td><td>H8025<\/td><td>拔出、脫下；申 25:9 用的是另一個動詞（chalats）<\/td><\/tr><tr><td>鞋<\/td><td>נַעֲלוֹ<\/td><td>na‘alo<\/td><td>H5275<\/td><td>他的鞋；古人以腳踏地表示取得地業（申 11:24）<\/td><\/tr><tr><td>證據<\/td><td>הַתְּעוּדָה<\/td><td>hatte‘udah<\/td><td>H8584<\/td><td>證明、確認；使交易生效的公開手續<\/td><\/tr><\/table>", "gram": "<p><strong>問題<\/strong>：4:7–8 的脫鞋，和申 25:9 的脫鞋是同一件事嗎？<\/p><ul><li>說法一：同一條律法較溫和的執行——不肯盡本分的人都要脫鞋。<\/li><li>說法二：不同的兩件事——申 25:9 是寡婦當著長老脫他的鞋、吐唾沫在他臉上，是公開的羞辱，還要稱他的家為「脫鞋之家」；路得記是那人自己脫鞋交給對方，沒有唾沫、沒有惡名，敘述者也明說這是「或贖回，或交易」的通用手續。<\/li><\/ul><blockquote><p><strong>本講義判斷：說法二。<\/strong>經文用「從前……以此為證據」把它定位成交易憑據，不是懲罰；也沒有讓路得出場。<\/p><\/blockquote>", "exp": "<p><strong>敘述者在這裡停下來，為讀者解釋一個已經消失的習俗。<\/strong><\/p><p>「從前，在以色列中要定奪什麼事，或贖回，或交易，這人就脫鞋給那人」（4:7）。「從前」兩個字告訴我們：寫這卷書的時候，讀者已經不熟悉這個做法了，這也是學者推斷路得記成書較晚的線索之一。<\/p><p>為甚麼一隻鞋可以作證據？在古代，腳踏上一塊地，就是取得那塊地：「凡你們腳掌所踏之地都必歸你們」（申 11:24）。把鞋交給對方，等於說：這塊地我不再踏上去了，權利轉給你。<strong>這是一個看得見的簽名。<\/strong><\/p><p>讀者自然會想起申命記：不肯為哥哥立後的人，寡婦要「脫了他的鞋，吐唾沫在他臉上」（申 25:9）。但這裡有三個不同：脫鞋的是他自己，不是寡婦；沒有唾沫；也沒有「脫鞋之家」的惡名。經文也沒有讓路得出場。<strong>敘述者沒有讓這個人受辱。<\/strong>他公開放棄，波阿斯公開承接，事情辦得乾淨、體面。<\/p><p>「你自己買吧！」（4:8）一句話，一隻鞋，把責任交到願意的人手中。這一幕提醒我們：<strong>放手可以有尊嚴，接手也不必踩著別人。<\/strong>家族處理產業、教會交接服事時，也需要這樣透明、體面的程序——不拖延，不私下，也不羞辱那個說「我不能」的人。<\/p><p class=\"xref\">〔舊約〕申 25:9--10（申命記講義第 25 章）；申 11:24<\/p>"}, {"a": 9, "z": 10, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַיֹּאמֶר֩ בֹּ֨עַז לַזְּקֵנִ֜ים וְכָל־הָעָ֗ם עֵדִ֤ים אַתֶּם֙ הַיּ֔וֹם כִּ֤י קָנִ֨יתִי֙ אֶת־כָּל־אֲשֶׁ֣ר לֶֽאֱלִימֶ֔לֶךְ וְאֵ֛ת כָּל־אֲשֶׁ֥ר לְכִלְי֖וֹן וּמַחְל֑וֹן מִיַּ֖ד נָעֳמִֽי׃ וְגַ֣ם אֶת־ר֣וּת הַמֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣י לְאִשָּׁ֗ה לְהָקִ֤ים שֵׁם־הַמֵּת֙ עַל־נַ֣חֲלָת֔וֹ וְלֹא־יִכָּרֵ֧ת שֵׁם־הַמֵּ֛ת מֵעִ֥ם אֶחָ֖יו וּמִשַּׁ֣עַר מְקוֹמ֑וֹ עֵדִ֥ים אַתֶּ֖ם הַיּֽוֹם׃<\/p>", "lit": "<p>「波阿斯對長老和眾民說：你們今日是見證人：我已經從拿俄米手中買下一切屬以利米勒的，和一切屬基連、瑪倫的。並且摩押女子路得，瑪倫的妻，我也買下她歸我為妻，為要在死人的產業上興起他的名，使死人的名不從他弟兄中間、不從他本地的城門被剪除。你們今日是見證人。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>作見證<\/td><td>עֵדִים<\/td><td>‘edim<\/td><td>H5707<\/td><td>見證人；4:9、10 首尾各一次，把整個宣告包起來<\/td><\/tr><tr><td>置買<\/td><td>קָנִיתִי<\/td><td>qaniti<\/td><td>H7069<\/td><td>「我已經買了」：宣告式完成，話一出口就生效<\/td><\/tr><tr><td>為妻<\/td><td>לְאִשָּׁה<\/td><td>le’ishshah<\/td><td>H802<\/td><td>「作為妻子」：路得不是附帶的財物，是明說的婚約<\/td><\/tr><tr><td>存留<\/td><td>לְהָקִים<\/td><td>lehaqim<\/td><td>H6965<\/td><td>Hiphil：使興起、使立定<\/td><\/tr><tr><td>滅沒<\/td><td>יִכָּרֵת<\/td><td>yikkaret<\/td><td>H3772<\/td><td>Niphal：被剪除；與「立約」（切約）同一字根<\/td><\/tr><tr><td>本鄉<\/td><td>וּמִשַּׁעַר מְקוֹמוֹ<\/td><td>umishsha‘ar meqomo<\/td><td>H8179／H4725<\/td><td>直譯「從他本地的城門」：名字在城門前被保存<\/td><\/tr><\/table>", "gram": "<p><strong>兩節的首尾是同一句：עֵדִים אַתֶּם הַיּוֹם（‘edim ’attem hayyom），「你們今日是見證人」。<\/strong><\/p><p>這是正式的法律宣告，用完成式 קָנִיתִי（qaniti）：說出口就成交。4:10 開頭 וְגַם אֶת־רוּת（vegam ’et-rut）「並且路得」，正是 4:5 和合本所採改讀的根據。<\/p><p>兩處細節值得注意：一、4:9 名字次序是「基連、瑪倫」，和 1:2「瑪倫、基連」相反，原因不明，可能只是交替。二、讀者直到 4:10 才知道路得是瑪倫的妻（1:4 沒有說誰娶誰）。<\/p><p>「買」用在娶妻，反映古代婚約有聘禮與財產的安排，和合本夾注「原文是買」；這不表示路得是貨物——波阿斯明說是「為妻」。<\/p>", "exp": "<p><strong>「你們今日作見證」（4:9），這句話在兩節之內說了兩次，一頭一尾，把整件事框起來。<\/strong><\/p><p>波阿斯一口氣念出三個死人的名字：以利米勒、基連、瑪倫。第 1 章，這三個名字是三座墳；第 4 章，它們在城門前被大聲念出來，為的是「存留」。<strong>拿俄米十年來說不出口的名字，今天有人替她在全城面前說出來。<\/strong><\/p><p>接著我們第一次清楚知道：路得是「瑪倫的妻」（4:10）。第 1 章只說兩個兒子娶了摩押女子。現在她被放回一個家裡，有了位置。經文仍稱她「摩押女子路得」，沒有抹掉她的出身；可是她不再是田邊撿拾的外人，而是在城門前被公開迎娶的妻子。<\/p><p>他說得很清楚：「好在死人的產業上存留他的名，免得他的名在本族本鄉滅沒」（4:10）。<strong>那位親屬怕自己的產業受損；波阿斯在乎死人的名字不被剪除。<\/strong>同一件事，一個看見帳目，一個看見人。<\/p><p>為甚麼要眾人作見證？因為愛不只是心裡的感動，也需要公開的承諾。波阿斯把自己交在見證人面前，往後不能反悔。今天的婚約、奉獻、接下照顧一個人的責任，也是如此：<strong>在神和人面前說出來，承諾才有重量。<\/strong>這使我們想起那位「為我們捨了自己，要贖我們」（多 2:14）的主；但經文在這裡先要我們看見的，是一個人怎樣替別人存留名字。<\/p><p class=\"xref\">〔舊約〕得 1:2--5；申 25:6（申命記講義第 25 章）〔新約〕多 2:14<\/p>"}, {"a": 11, "z": 12, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַיֹּ֨אמְר֜וּ כָּל־הָעָ֧ם אֲשֶׁר־בַּשַּׁ֛עַר וְהַזְּקֵנִ֖ים עֵדִ֑ים יִתֵּן֩ יְהוָ֨ה אֶֽת־הָאִשָּׁ֜ה הַבָּאָ֣ה אֶל־בֵּיתֶ֗ךָ כְּרָחֵ֤ל וּכְלֵאָה֙ אֲשֶׁ֨ר בָּנ֤וּ שְׁתֵּיהֶם֙ אֶת־בֵּ֣ית יִשְׂרָאֵ֔ל וַעֲשֵׂה־חַ֣יִל בְּאֶפְרָ֔תָה וּקְרָא־שֵׁ֖ם בְּבֵ֥ית לָֽחֶם׃ וִיהִ֤י בֵֽיתְךָ֙ כְּבֵ֣ית פֶּ֔רֶץ אֲשֶׁר־יָלְדָ֥ה תָמָ֖ר לִֽיהוּדָ֑ה מִן־הַזֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְךָ֔ מִן־הַֽנַּעֲרָ֖ה הַזֹּֽאת׃<\/p>", "lit": "<p>「在城門的眾民和長老都說：我們是見證人。願耶和華使進入你家的這女子，像拉結和利亞，她們二人建造了以色列家；願你在以法他行出能力，在伯利恆宣揚名聲。願你的家像法勒斯的家，就是她瑪給猶大生的，藉著耶和華從這少女賜給你的後裔。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>建立<\/td><td>בָּנוּ<\/td><td>banu<\/td><td>H1129<\/td><td>★ 建造；全卷唯一的「建立」，與「兒子」בֵּן 音近<\/td><\/tr><tr><td>以色列家<\/td><td>בֵּית יִשְׂרָאֵל<\/td><td>bet yisra’el<\/td><td>H1004／H3478<\/td><td>以色列家：從一個家庭到一個民族<\/td><\/tr><tr><td>亨通<\/td><td>חַיִל<\/td><td>chayil<\/td><td>H2428<\/td><td>能力、德行、財富；2:1「大財主」、3:11「賢德的女子」同一字<\/td><\/tr><tr><td>以法他<\/td><td>בְּאֶפְרָתָה<\/td><td>be’efratah<\/td><td>H672<\/td><td>伯利恆的古名或氏族名（創 35:19；彌 5:2）<\/td><\/tr><tr><td>法勒斯<\/td><td>פֶּרֶץ<\/td><td>perets<\/td><td>H6557<\/td><td>意思是破口、衝出；得名經過見創 38:29<\/td><\/tr><tr><td>她瑪<\/td><td>תָמָר<\/td><td>tamar<\/td><td>H8559<\/td><td>猶大的兒婦；同樣是無子的寡婦，同樣牽涉「弟兄的本分」<\/td><\/tr><\/table>", "gram": "<p><strong>問題<\/strong>：祝福裡為甚麼提到她瑪？那是一段不光彩的往事（創 38）。<\/p><ul><li>說法一：家族的理由——法勒斯是伯利恆這一支猶大人的祖先（4:18；代上 2:4–5）。<\/li><li>說法二：處境的相似——她瑪也是無子的寡婦，猶大家不肯盡弟兄的本分，她冒險為亡夫立後；猶大承認「她比我更有義」（創 38:26）。<\/li><li>說法三：敘事的對照——她瑪靠喬裝，路得在城門前被公開迎娶；猶大推延，波阿斯承擔。<\/li><\/ul><blockquote><p><strong>本講義判斷：三說並存，以第二說最貼近上下文。<\/strong>長老們沒有把祖先的破口藏起來；神的家常是從破口裡被建立的。<\/p><\/blockquote>", "exp": "<p><strong>城門前的人不只作見證，他們開口祝福；祝福裡有三個女人的名字。<\/strong><\/p><p>「願耶和華使進你家的這女子，像建立以色列家的拉結、利亞二人一樣」（4:11）。「建立」原文 בָּנוּ（banu），本義是「建造」，和希伯來文的「兒子」בֵּן（ben）聲音相近。拉結和利亞都是從異地嫁來的，一個蒙愛卻久不生育，一個多生卻不被愛，她們卻成了以色列眾支派的母親。<strong>長老們用以色列的「建國之母」來祝福一個摩押女子。<\/strong>沒有人再問她從哪裡來，只問神要藉她建立甚麼。<\/p><p>他們又祝福波阿斯「在以法他得亨通，在伯利恆得名聲」（4:11）。那位怕產業受損的人沒有留下名字；願意為死人存留名字的人，反被祝福「得名聲」。<\/p><p>第 12 節更大膽：「使你的家像她瑪從猶大所生法勒斯的家一般」（4:12）。她瑪是無子的寡婦，猶大的兒子不肯盡弟兄的本分，猶大自己也推延，她只好冒險。猶大最後承認：「她比我更有義」（創 38:26）。<strong>伯利恆的長老沒有把祖先的醜事藏起來，反而說：神曾從那樣的破口建立我們，也必從這個摩押寡婦建立你的家。<\/strong><\/p><p>注意祝福的主詞：願耶和華使她像拉結、利亞，願耶和華賜你後裔。人能作見證、能祝福，真正「建立」的是神。<strong>屬神的家，不是靠出身乾淨蓋起來的，是靠神的恩典蓋起來的。<\/strong><\/p><p class=\"xref\">〔舊約〕創 29:31--30:24；創 38:26--29（創世記講義第 38 章）；創 35:19；彌 5:2<\/p>"}, {"a": 13, "z": 13, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַיִּקַּ֨ח בֹּ֤עַז אֶת־רוּת֙ וַתְּהִי־ל֣וֹ לְאִשָּׁ֔ה וַיָּבֹ֖א אֵלֶ֑יהָ וַיִּתֵּ֨ן יְהוָ֥ה לָ֛הּ הֵרָי֖וֹן וַתֵּ֥לֶד בֵּֽן׃<\/p>", "lit": "<p>「波阿斯娶了路得，她就作了他的妻子；他進到她那裡，耶和華賜她懷孕，她就生了一個兒子。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>娶<\/td><td>וַיִּקַּח<\/td><td>vayyiqqach<\/td><td>H3947<\/td><td>取、娶；4:2 同一個字「揀選」十位長老<\/td><\/tr><tr><td>同房<\/td><td>וַיָּבֹא אֵלֶיהָ<\/td><td>vayyavo’ ’eleha<\/td><td>H935／H413<\/td><td>直譯「他進到她那裡」：婚姻中同房的含蓄說法<\/td><\/tr><tr><td>使<\/td><td>וַיִּתֵּן<\/td><td>vayyitten<\/td><td>H5414<\/td><td>★「賜給」；主詞是耶和華，與 4:11–12「願耶和華使、賜」的祝福呼應<\/td><\/tr><tr><td>懷孕<\/td><td>הֵרָיוֹן<\/td><td>herayon<\/td><td>H2032<\/td><td>懷胎；同一個名詞另見創 3:16 與何 9:11<\/td><\/tr><tr><td>生<\/td><td>וַתֵּלֶד<\/td><td>vatteled<\/td><td>H3205<\/td><td>生產；本章 יָלַד 字根反覆出現，直到 4:18–22 的家譜<\/td><\/tr><tr><td>兒子<\/td><td>בֵּן<\/td><td>ben<\/td><td>H1121<\/td><td>兒子；回應 1:5「也沒有兒子」<\/td><\/tr><\/table>", "gram": "<p><strong>一節之內五個動詞：娶、作妻、同房、賜、生。<\/strong><\/p><p>第 3 章用了十八節講一個夜晚，這裡用一句話交代婚姻與生育，敘事節奏突然加快：最緊張的已經過去，剩下的是成全。<\/p><p>「耶和華使她懷孕」原文 וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן（vayyitten YHWH lah herayon），直譯「耶和華給了她懷孕」。這是全卷第二次、也是最後一次，敘述者自己說出神的作為（第一次是 1:6）。其餘提到神的地方，都是人物口中的祝福、哀歌或起誓。<\/p><p>路得在摩押多年沒有孩子（1:4–5），經文從未解釋原因，也從未把它說成懲罰；這裡也只說「給了」，沒有說「因為她配得」。<\/p>", "exp": "<p><strong>全卷八十五節，敘述者只親口說了兩次神做了甚麼。第一次是 1:6「耶和華眷顧自己的百姓，賜糧食與他們」；第二次就在這裡：「耶和華使她懷孕生了一個兒子」（4:13）。<\/strong><\/p><p>其餘的時候，神都藏著：藏在「恰巧」裡，藏在波阿斯的慈愛裡，藏在拿俄米的計畫和路得的勇氣裡。可是在故事的一頭一尾，敘述者把簾子拉開，讓我們看見那雙手。<strong>開頭給的是糧食，結尾給的是生命。<\/strong>糧食讓一個家活下來，生命讓一個家有將來。<\/p><p>原文是「耶和華給了她懷孕」，懷孕被寫成一份禮物。路得在摩押多年沒有孩子（1:4–5）。經文沒有解釋原因，也沒有說那是懲罰；它只是安靜地記下：這一次，耶和華給了。<\/p><p>這一節也很樸素。第 3 章那個漫長、緊張的夜，在這裡只用一句話：娶她為妻、與她同房——是在婚約裡、在眾人祝福之後。<strong>經文把婚姻、親密與生育，一起放回神的手中。<\/strong><\/p><p>對長年等候孩子的夫妻，這一節要小心講。它不是保證「只要信，神就一定給你孩子」，也不是說沒有孩子就是神沒有恩待你——兩節之後，婦人們就說，一個愛人的兒婦「比有七個兒子還好」（4:15）。它說的是：<strong>生命從來不是人造出來的，是神賜下的；在等候中的人，神也看見。<\/strong><\/p><p class=\"xref\">〔舊約〕得 1:6；創 30:22（創世記講義第 30 章）；撒上 1:19--20<\/p>"}, {"a": 14, "z": 15, "star": 3, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּאמַ֤רְנָה הַנָּשִׁים֙ אֶֽל־נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛ךְ גֹּאֵ֖ל הַיּ֑וֹם וְיִקָּרֵ֥א שְׁמ֖וֹ בְּיִשְׂרָאֵֽל׃ וְהָ֤יָה לָךְ֙ לְמֵשִׁ֣יב נֶ֔פֶשׁ וּלְכַלְכֵּ֖ל אֶת־שֵׂיבָתֵ֑ךְ כִּ֣י כַלָּתֵ֤ךְ אֲֽשֶׁר־אֲהֵבַ֨תֶךְ֙ יְלָדַ֔תּוּ אֲשֶׁר־הִיא֙ ט֣וֹבָה לָ֔ךְ מִשִּׁבְעָ֖ה בָּנִֽים׃<\/p>", "lit": "<p>「婦人們對拿俄米說：耶和華是應當稱頌的，祂今日沒有使你斷絕至近的親屬；願他的名在以色列中被傳揚。他必成為你那使生命歸回的，奉養你的白髮；因為愛你的兒婦生了他，她對你比七個兒子還好。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>撇下<\/td><td>הִשְׁבִּית<\/td><td>hishbit<\/td><td>H7673<\/td><td>Hiphil：使停止、使斷絕；直譯「沒有使你斷絕」<\/td><\/tr><tr><td>至近的親屬<\/td><td>גֹּאֵל<\/td><td>go’el<\/td><td>H1350<\/td><td>★ 全卷最後一次 גָּאַל：這裡指那嬰孩<\/td><\/tr><tr><td>提起……精神<\/td><td>לְמֵשִׁיב נֶפֶשׁ<\/td><td>lemeshiv nefesh<\/td><td>H7725／H5315<\/td><td>★ 直譯「使生命歸回的」；שׁוּב 回應 1:21「使我空空地回來」<\/td><\/tr><tr><td>奉養<\/td><td>וּלְכַלְכֵּל<\/td><td>ulekhalkel<\/td><td>H3557<\/td><td>供養、扶持；創 45:11 約瑟「奉養」父家用同一字<\/td><\/tr><tr><td>愛慕<\/td><td>אֲהֵבַתֶךְ<\/td><td>’ahevatekh<\/td><td>H157<\/td><td>「她愛你」：全卷在這裡明說路得對拿俄米的愛<\/td><\/tr><tr><td>七個兒子<\/td><td>מִשִּׁבְעָה בָּנִים<\/td><td>mishshiv‘ah banim<\/td><td>H7651／H1121<\/td><td>「比七個兒子」；七是完全數（撒上 2:5）<\/td><\/tr><\/table>", "gram": "<p><strong>問題<\/strong>：4:14「使你無至近的親屬」的「至近的親屬」是誰？<\/p><ul><li>說法一：波阿斯——他剛在城門前盡了贖回的本分。<\/li><li>說法二：那嬰孩——「今日」是孩子出生的日子；緊接的「願這孩子在以色列中得名聲」和 4:15「他必提起你的精神」，主詞都是這孩子。<\/li><\/ul><blockquote><p><strong>本講義判斷：說法二最自然。<\/strong>主詞從 4:14 到 4:15 一路連貫；波阿斯的贖回，在這個孩子身上延續到拿俄米的晚年。<\/p><\/blockquote><p>和合本「沒有撇下你，使你無至近的親屬」是意譯，原文直譯是「沒有使你斷絕至近的親屬」。4:15 原文的語序是「愛你的兒婦……她對你比七個兒子還好」，和合本拆成兩句。<\/p>", "exp": "<p><strong>拿俄米在第 1 章對伯利恆的婦人說：「耶和華使我空空地回來」（1:21）。四章之後，同一群婦人回答了她。<\/strong><\/p><p>她們沒有說「你看，你以前錯了」，也沒有說「早告訴你要有信心」。她們說：「耶和華是應當稱頌的！因為今日沒有撇下你，使你無至近的親屬」（4:14）。<strong>回應哀歌的，不是責備，是頌讚；頌讚的對象不是波阿斯，是耶和華。<\/strong><\/p><p>這裡的「至近的親屬」，最自然是指那個嬰孩。全卷講了這麼多次 גֹּאֵל（go’el），最後被稱為「贖回者」的，竟是一個剛出生、甚麼都還不會做的孩子。他要「提起你的精神」，原文 מֵשִׁיב נֶפֶשׁ（meshiv nefesh），直譯「使你的生命歸回」。<strong>拿俄米的身體在第 1 章就歸回了，她的生命到這一天才真正歸回。<\/strong>同一個 שׁוּב（shuv），從「空空地回來」走到「使生命回來」。<\/p><p>然後是全卷最翻轉的一句：「有這兒婦比有七個兒子還好！」（4:15）在一個以兒子為依靠、以兒子算福氣的社會，婦人們公開說：一個愛你的摩押媳婦，勝過七個兒子。七是完全數，「七個兒子」是古人能想像的最大福氣（撒上 2:5）。<strong>這句話把傳宗接代的價值，翻轉成愛的價值。<\/strong><\/p><p>對今天只有女兒、沒有孩子，或被「香火」壓得抬不起頭的家庭，這一節是釋放：神看重的不是兒子的數目，而是愛的真實。神沒有撇下拿俄米；祂也沒有撇下在等候中流淚的人。<\/p><p class=\"xref\">〔舊約〕得 1:20--21；撒上 1:8；撒上 2:5；創 45:11<\/p>"}, {"a": 16, "z": 17, "star": 3, "grk": "<p dir=\"rtl\" lang=\"he\">וַתִּקַּ֨ח נָעֳמִ֤י אֶת־הַיֶּ֨לֶד֙ וַתְּשִׁתֵ֣הוּ בְחֵיקָ֔הּ וַתְּהִי־ל֖וֹ לְאֹמֶֽנֶת׃ וַתִּקְרֶאנָה֩ ל֨וֹ הַשְּׁכֵנ֥וֹת שֵׁם֙ לֵאמֹ֔ר יֻלַּד־בֵּ֖ן לְנָעֳמִ֑י וַתִּקְרֶ֤אנָֽה שְׁמוֹ֙ עוֹבֵ֔ד ה֥וּא אֲבִי־יִשַׁ֖י אֲבִ֥י דָוִֽד׃<\/p>", "lit": "<p>「拿俄米接過孩子，把他放在自己懷中，作了他的養育者。女鄰舍們給他起名，說：有一個兒子為拿俄米生了！她們就叫他的名字俄備得。他是耶西的父，耶西是大衛的父。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>懷中<\/td><td>בְחֵיקָהּ<\/td><td>vecheqah<\/td><td>H2436<\/td><td>懷抱、胸懷<\/td><\/tr><tr><td>養母<\/td><td>לְאֹמֶנֶת<\/td><td>le’omenet<\/td><td>H539<\/td><td>撫養者、看護者；撒下 4:4「乳母」、民 11:12「養育之父」同字根<\/td><\/tr><tr><td>鄰舍的婦人<\/td><td>הַשְּׁכֵנוֹת<\/td><td>hashshekhenot<\/td><td>H7934<\/td><td>女鄰居們；舊約唯一由鄰舍為孩子起名的記載<\/td><\/tr><tr><td>得孩子了<\/td><td>יֻלַּד־בֵּן<\/td><td>yullad-ben<\/td><td>H3205／H1121<\/td><td>Pual 被動：「有一個兒子被生給（拿俄米）」<\/td><\/tr><tr><td>俄備得<\/td><td>עוֹבֵד<\/td><td>‘oved<\/td><td>H5744<\/td><td>★「事奉的人、僕人」（「事奉」的分詞）<\/td><\/tr><tr><td>大衛<\/td><td>דָוִד<\/td><td>david<\/td><td>H1732<\/td><td>全卷第一次出現大衛的名字<\/td><\/tr><\/table>", "gram": "<p><strong>問題<\/strong>：「拿俄米得孩子了」（4:17）——俄備得算誰的兒子？<\/p><ul><li>說法一：律法上歸瑪倫——4:10 波阿斯娶路得，就是為了「存留死人的名」，因此他也是拿俄米的後裔。<\/li><li>說法二：收養的動作——把孩子放在懷中、膝上，在古代可能是收養或承認的手勢（參創 30:3「生子在我膝下」；48:12）。<\/li><li>說法三：社群的宣告——拿俄米作他的養育者，婦人們宣告她不再是 1:5 那個「沒有兒子」的人。<\/li><\/ul><blockquote><p><strong>本講義判斷：不必只選一個。<\/strong>家譜上他是「波阿斯生俄備得」（4:21），律法上存留瑪倫的名，生活裡由拿俄米抱養；經文的焦點是 1:5「沒有兒子」被翻轉。<\/p><\/blockquote>", "exp": "<p><strong>第 1 章，拿俄米「沒有丈夫，也沒有兒子」（1:5）；第 4 章，她「把孩子抱在懷中」（4:16）。<\/strong><\/p><p>那雙在摩押埋葬了丈夫和兩個兒子的手，現在抱著一個嬰孩。「養母」原文 אֹמֶנֶת（’omenet），是撫養、看顧孩子的人。經文沒有說她從此不再想念瑪倫和基連，失去的仍是失去的；但神給了她一個可以去愛、去照顧的生命。<strong>神的安慰，不是抹掉傷痛，是在傷痛旁邊放下一個新的生命。<\/strong><\/p><p>接著是一件不尋常的事：給孩子起名的，不是父親，也不是母親，是「鄰舍的婦人」（4:17）。她們說：「拿俄米得孩子了！」（4:17）那群在 1:19 驚訝地問「這是拿俄米嗎」的婦人，如今成了她得安慰的見證人。<strong>一個人的苦難被社群看見，一個人的復原也由社群一起慶祝。<\/strong><\/p><p>孩子名叫俄備得，原文 עוֹבֵד（‘oved），意思是「事奉的人」。然後敘述者突然把鏡頭拉遠：「這俄備得是耶西的父，耶西是大衛的父」（4:17）。<strong>讀者這才發現，這不只是一個寡婦的家務事，這是王的家譜。<\/strong><\/p><p>路得記的最後一句是「那時，以色列中沒有王，各人任意而行」（士 21:25）。就在同一個年代，在伯利恆一個老婦人的懷裡，神已經悄悄預備了那位王的祖父。我們看不見的時候，神的工作從來沒有停過；所以在看似最空的日子，我們也可以把焦點放在祂身上，而不是放在環境上。<\/p><p class=\"xref\">〔舊約〕得 1:5、19；士 21:25（路得記講義第 21 章）；撒上 16:1<\/p>"}, {"a": 18, "z": 20, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וְאֵ֨לֶּה֙ תּוֹלְד֣וֹת פָּ֔רֶץ פֶּ֖רֶץ הוֹלִ֥יד אֶת־חֶצְרֽוֹן׃ וְחֶצְרוֹן֙ הוֹלִ֣יד אֶת־רָ֔ם וְרָ֖ם הוֹלִ֥יד אֶת־עַמִּֽינָדָֽב׃ וְעַמִּֽינָדָב֙ הוֹלִ֣יד אֶת־נַחְשׁ֔וֹן וְנַחְשׁ֖וֹן הוֹלִ֥יד אֶת־שַׂלְמָֽה׃<\/p>", "lit": "<p>「這些是法勒斯的後代：法勒斯生了希斯崙，希斯崙生了蘭，蘭生了亞米拿達，亞米拿達生了拿順，拿順生了撒門。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>後代<\/td><td>תּוֹלְדוֹת<\/td><td>toledot<\/td><td>H8435<\/td><td>★「後代、來歷」：創世記貫穿全卷的段落公式（創 2:4；5:1；11:10）<\/td><\/tr><tr><td>生<\/td><td>הוֹלִיד<\/td><td>holid<\/td><td>H3205<\/td><td>Hiphil「使生」：家譜的慣用語<\/td><\/tr><tr><td>法勒斯<\/td><td>פָּרֶץ<\/td><td>parets<\/td><td>H6557<\/td><td>「破口」；她瑪所生（創 38:29），4:12 剛在祝福裡提過<\/td><\/tr><tr><td>亞米拿達<\/td><td>עַמִּינָדָב<\/td><td>‘amminadav<\/td><td>H5992<\/td><td>亞倫的岳父（出 6:23）<\/td><\/tr><tr><td>拿順<\/td><td>נַחְשׁוֹן<\/td><td>nachshon<\/td><td>H5177<\/td><td>曠野中猶大的首領（民 1:7；2:3）<\/td><\/tr><tr><td>撒門<\/td><td>שַׂלְמָה<\/td><td>salmah<\/td><td>H8009<\/td><td>本節拼作 שַׂלְמָה，4:21 拼作 שַׂלְמוֹן，同一人<\/td><\/tr><\/table>", "gram": "<p><strong>問題<\/strong>：這份家譜是逐代完整的嗎？<\/p><ul><li>說法一：逐代完整，每一個名字之間都是直接的父子。<\/li><li>說法二：經過挑選的家譜——希斯崙隨雅各下埃及（創 46:12），拿順已是出埃及後曠野中的首領（民 2:3），中間跨越數百年，只列了兩三代，顯然有省略；古代家譜常這樣排列。<\/li><\/ul><blockquote><p><strong>本講義判斷：說法二。<\/strong>家譜的目的是神學的連結，不是年表；本講義不據此推算年代，也不從「十代」演算任何數字。<\/p><\/blockquote>", "exp": "<p><strong>路得記用一份家譜收尾。對今天的讀者，這可能是全卷最想跳過的部分；對古代讀者，這是全卷最重要的簽名。<\/strong><\/p><p>「法勒斯的後代記在下面」（4:18），這是創世記的老句子。「亞當的後代記在下面」（創 5:1）、「閃的後代記在下面」（創 11:10），每一次出現，都表示神的故事又往前走了一段。<strong>路得記用這個公式告訴我們：伯利恆一個小家的故事，被接回了創世記那條大河裡。<\/strong><\/p><p>家譜從法勒斯算起，不從猶大算起。法勒斯是她瑪所生，是從一段不光彩、卻被神記念的故事裡出來的孩子（創 38:29）。4:12 的祝福剛剛提到他，家譜就從他開始。<\/p><p>這前五代之間，跨過了下埃及、為奴、出埃及、曠野。希斯崙跟著雅各下埃及（創 46:12）；拿順是曠野中「猶大人的首領」（民 2:3）。中間只有寥寥幾代，顯然是經過挑選的名單。它不是給我們推算年代用的，是讓我們看見神的信實：<strong>幾百年過去，許多名字被遺忘，神沒有忘記祂的應許。<\/strong><\/p><p>我們每個人的家譜裡，也有不光彩的名字、斷裂的年代、說不清楚的空白。神能把這些都接起來，接到祂自己的故事裡。<\/p><p class=\"xref\">〔舊約〕創 38:29（創世記講義第 38 章）；創 46:12；民 1:7；代上 2:4--10<\/p>"}, {"a": 21, "z": 22, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וְשַׂלְמוֹן֙ הוֹלִ֣יד אֶת־בֹּ֔עַז וּבֹ֖עַז הוֹלִ֥יד אֶת־עוֹבֵֽד׃ וְעֹבֵד֙ הוֹלִ֣יד אֶת־יִשָׁ֔י וְיִשַׁ֖י הוֹלִ֥יד אֶת־דָּוִֽד׃<\/p>", "lit": "<p>「撒門生了波阿斯，波阿斯生了俄備得，俄備得生了耶西，耶西生了大衛。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>撒門<\/td><td>שַׂלְמוֹן<\/td><td>salmon<\/td><td>H8012<\/td><td>4:20 拼作 שַׂלְמָה；太 1:5 說他從喇合生波阿斯<\/td><\/tr><tr><td>波阿斯<\/td><td>בֹּעַז<\/td><td>bo‘az<\/td><td>H1162<\/td><td>家譜的第七個名字<\/td><\/tr><tr><td>俄備得<\/td><td>עוֹבֵד<\/td><td>‘oved<\/td><td>H5744<\/td><td>「事奉的人」；4:17 鄰舍婦人所起的名<\/td><\/tr><tr><td>耶西<\/td><td>יִשָׁי<\/td><td>yishay<\/td><td>H3448<\/td><td>「伯利恆人耶西」（撒上 16:1）<\/td><\/tr><tr><td>大衛<\/td><td>דָּוִד<\/td><td>david<\/td><td>H1732<\/td><td>家譜的第十個名字，也是全卷最後一個字<\/td><\/tr><\/table>", "gram": "<p><strong>從法勒斯到大衛，剛好十個名字；波阿斯在第七位，大衛在第十位。<\/strong><\/p><p>古代家譜常把重要人物放在第七位與第十位（創 5 以諾第七、挪亞第十；創 11 從閃到亞伯蘭也是十代）。這顯示家譜經過有意識的編排，重點落在波阿斯與大衛。<\/p><p>值得注意的是，家譜寫「波阿斯生俄備得」（4:21），沒有寫瑪倫；4:10 的「存留死人的名」與家譜並不衝突——前者是產業與家名的律法層面，後者是血緣與王室的歷史層面。<\/p><p>馬太福音的家譜在法勒斯到大衛這一段（太 1:3–6）照這份名單抄錄，並且加進了她瑪、喇合、路得三位女性；路 3:32 也列出這一段。<\/p>", "exp": "<p><strong>希伯來原文路得記的最後一個字，是 דָּוִד（david）：大衛。<\/strong><\/p><p>路得記的結尾是「那時，以色列中沒有王，各人任意而行」（士 21:25）；路得記的結尾是「耶西生大衛」（4:22）。七十士譯本和我們的中文聖經把這兩卷書並排放，讀者一翻頁，就從「沒有王」走到「大衛」。<strong>人在最黑的年代各行其是，神卻在同一個年代、同一座伯利恆，一代一代把王預備出來。<\/strong><\/p><p>這份家譜裡沒有拿俄米，沒有路得，也沒有瑪倫；家譜直接寫「波阿斯生俄備得」（4:21）。那位付代價為別人存留名字的人，自己的名字被寫進了王的家譜；那位怕產業受損的親屬，在這裡完全不見了。<\/p><p>一千多年後，馬太把這份家譜接下去，並且加上了這裡沒有的名字：「撒門從喇合氏生波阿斯；波阿斯從路得氏生俄備得」（太 1:5）。<strong>一個迦南的妓女、一個摩押的寡婦，被寫進了彌賽亞的家譜。<\/strong>這是新約自己作的連結：「大衛的子孫，耶穌基督」（太 1:1）就是從這條路來的。<\/p><p>所以路得記不只是一個溫暖的家庭故事。神在拿俄米的空虛、路得的捨己、波阿斯的慈愛裡預備了一位王；最後，祂差來那位真正的王，讓我們這些外人也能被寫進神的家。讓祂作王，是這份家譜留給每一個讀者的邀請。<\/p><p class=\"xref\">〔舊約〕士 21:25（路得記講義第 21 章）；撒上 16:1；代上 2:11--12〔新約〕太 1:1--6；路 3:32<\/p>"}]}, "serm": {"1": {"min": 18, "blocks": [["h", "《你的神就是我的神》"], ["p", "弟兄姊妹平安，今天我們一起讀路得記第一章。"], ["p", "我們先看一張照片。"], ["p", "想像一下，一個機場的出境大廳。"], ["p", "照片上有三個人，推著行李往裡走。"], ["p", "一個中年男人，推著最重的那一車。"], ["p", "兩個少年跟在後面，一人一個背包。"], ["p", "三個人都回過頭來，對著鏡頭笑。"], ["p", "拍照的人，是媽媽。"], ["p", "所以照片裡沒有她。"], ["p", "那一年，日子過不下去，只好出去討生活。"], ["p", "他們說：先去幾年，好了就回來。"], ["p", "然後是第二張照片。"], ["p", "十年後，同一個機場，入境大廳。"], ["p", "這一次，沒有人拍照。"], ["p", "自動門打開，走出來兩個女人。"], ["p", "一個老，一個年輕。"], ["p", "老的那一位，頭髮全白了。"], ["p", "年輕的那一位，推著一台很輕的行李車。"], ["p", "車上的東西不多。"], ["p", "三個男人，一個也沒有回來。"], ["p", "入境大廳外面，站滿了接機的人。"], ["p", "這兩個女人站在門口，看了很久。"], ["p", "誰也沒有來接。"], ["q", "出去的時候是一家人，回來的時候，只剩兩個女人。"], ["p", "弟兄姊妹，路得記第一章，就是這兩張照片。"], ["p", "第一張在伯利恆。"], ["p", "第二張，也在伯利恆。"], ["p", "中間隔了十年，隔了三座墳。"], ["p", "今天的章題，是第十六節的一句話："], ["q", "「你的國就是我的國，你的神就是我的神。」（1:16）"], ["p", "這句話很有名，常常被印在婚禮的卡片上。"], ["p", "可是它第一次被說出來，是在一條寡婦回家的路上。"], ["p", "說話的人，剛剛埋葬了丈夫。"], ["p", "今天我們講三件事。"], ["p", "第一，剩下拿俄米。"], ["p", "第二，你的神就是我的神。"], ["p", "第三，耶和華使我空空地回來。"], ["q", "第一件事：剩下拿俄米。"], ["p", "路得記的第一句話，先講時代。"], ["q", "「當士師秉政的時候，國中遭遇饑荒。」（1:1）"], ["p", "讀過路得記的人，聽到這一句，心會往下沉。"], ["p", "那是怎樣的年代？"], ["p", "路得記最後一節告訴我們："], ["q", "「那時，以色列中沒有王，各人任意而行。」（士 21:25）"], ["p", "國家先亂了，接著田也乾了。"], ["p", "然後鏡頭拉近，到一個小城。"], ["p", "猶大的伯利恆。"], ["p", "伯利恆這個名字，意思是「糧食之家」。"], ["p", "糧食之家，沒有糧食。"], ["p", "有一個人，帶著妻子和兩個兒子出去了。"], ["p", "他的名字叫以利米勒。"], ["p", "意思是「我的神是王」。"], ["p", "一個名叫「我的神是王」的人。"], ["p", "活在一個沒有王的年代。"], ["p", "經文說，他們去「寄居」。"], ["p", "原文 לָגוּר（lagur），是暫時住一住。"], ["p", "可是第二節末了說：「就住在那裡」。"], ["p", "第四節說：「住了約有十年」。"], ["p", "暫住，變成了長住。"], ["p", "這常常不是一個決定。"], ["p", "是一天一天，沒有回頭。"], ["p", "接下來三節，經文寫得很快。"], ["q", "「後來拿俄米的丈夫以利米勒死了，剩下婦人和她兩個兒子。」（1:3）"], ["p", "兩個兒子娶了摩押女子。"], ["p", "一個叫俄珥巴，一個叫路得。"], ["p", "住了約有十年。"], ["p", "經文沒有提到一個孫子。"], ["p", "然後，又是兩座墳。"], ["q", "「瑪倫和基連二人也死了，剩下拿俄米，沒有丈夫，也沒有兒子。」（1:5）"], ["p", "三節經文，三座墳。"], ["p", "請注意一個詞，出現了兩次。"], ["p", "「剩下」。"], ["p", "原文 וַתִּשָּׁאֵר（vattisha’er），是被動式。"], ["p", "拿俄米不是自己選擇留下。"], ["p", "她是被留下的。"], ["p", "苦難最深的地方，常常不是失去。"], ["p", "是失去以後，還要活下去。"], ["p", "你一個人，回到那間太大的房子。"], ["p", "餐桌旁，還擺著四張椅子。"], ["p", "這就是「剩下」。"], ["p", "第五節還有一個細節。"], ["p", "和合本說「沒有兒子」。"], ["p", "原文用的，不是「兒子」這個字。"], ["p", "是「孩子」，יְלָדֶיהָ（yeladeiha）。"], ["p", "這個字，要到第四章才再出現。"], ["q", "「拿俄米就把孩子抱在懷中」（4:16）"], ["p", "第一章失去的那個字。"], ["p", "神在最後一章，還給了她。"], ["p", "講到這裡，我要特別小心。"], ["p", "這一段，常常被講錯。"], ["p", "有人說：他們離開伯利恆，所以出事了。"], ["p", "有人說：兒子娶了外邦女子，所以出事了。"], ["p", "經文連一個「因為」都沒有。"], ["p", "敘述者沒有加一句評語。"], ["p", "沒有說以利米勒對，也沒有說他錯。"], ["p", "神的名字，在第六節以前，一次也沒有出現。"], ["q", "聖經沒有說的因果，講台不可以替神說。"], ["p", "弟兄姊妹，也許你今天就在線上。"], ["p", "你剛剛失去了丈夫，或是太太。"], ["p", "或者你們結婚很多年，一直沒有孩子。"], ["p", "身邊總有人問：是不是哪裡得罪了神？"], ["p", "路得記第一章，沒有這樣說。"], ["p", "它不解釋這三座墳。"], ["p", "它只是把每一個名字寫下來。"], ["p", "被神記得名字的人。"], ["p", "走到哪裡，都還在祂的故事裡。"], ["q", "經文沒有解釋三座墳，只寫下一個被「剩下」的人。"], ["q", "第二件事：你的神就是我的神。"], ["p", "第六節，拿俄米起身了。"], ["p", "她為甚麼要回去？"], ["q", "「因為她在摩押地聽見耶和華眷顧自己的百姓，賜糧食與他們。」（1:6）"], ["p", "請注意，這是全卷第一次出現神的名字。"], ["p", "整卷路得記，敘述者自己說神作了甚麼。"], ["p", "只有兩次。"], ["p", "一次在這裡，神賜糧食。"], ["p", "一次在第四章，神使路得懷孕。"], ["p", "一次給糧食，一次給生命。"], ["p", "其餘的時候，神都藏在人的話語裡。"], ["p", "「眷顧」原文是 פָּקַד（paqad）。"], ["p", "是神親自來察看，親自來照顧。"], ["p", "拿俄米沒有看見伯利恆的麥田。"], ["p", "她只是聽見一個消息。"], ["p", "回轉，常常從一個消息開始。"], ["p", "神還在祂的百姓中間作工。"], ["p", "三個寡婦上路了。"], ["p", "可是走到半路，拿俄米停下來。"], ["p", "她對兩個兒婦說："], ["q", "「你們各人回娘家去吧。願耶和華恩待你們，像你們恩待已死的人與我一樣！」（1:8）"], ["p", "一個失去一切的人。"], ["p", "開口第一句話，是為別人祝福。"], ["p", "「恩待」原文是 חֶסֶד（chesed）。"], ["p", "這是舊約最重的字之一。"], ["p", "不是一時的好心。"], ["p", "是在關係裡，守住到底的忠誠。"], ["p", "這是全卷第一次出現這個字。"], ["p", "它最先用來形容的，是兩個摩押媳婦。"], ["p", "拿俄米接著說："], ["q", "「願耶和華使你們各在新夫家中得平安！」（1:9）"], ["p", "「平安」原文是 מְנוּחָה（menuchah），是安身之處。"], ["p", "拿俄米最想給她們的，是一個家。"], ["p", "讓她們回去，等於讓自己一個人上路。"], ["p", "她選了別人的好處，放下自己的依靠。"], ["p", "三個女人，放聲大哭。"], ["p", "拿俄米連說了三次：回去吧。"], ["p", "她的理由，非常現實。"], ["q", "「我還能生子作你們的丈夫嗎？」（1:11）"], ["p", "按照以色列的習俗，丈夫死了沒有兒子。"], ["p", "要由弟兄娶寡嫂，為死人立後。"], ["p", "她一層一層地算，這是一位母親的算術。"], ["p", "每一步，都算出同一個答案。"], ["p", "跟著我，你們沒有將來。"], ["p", "她三次叫她們：「我女兒們哪」。"], ["p", "這不是婆婆的命令。"], ["p", "是母親的不捨。"], ["p", "然後是第十四節。"], ["q", "「俄珥巴與婆婆親嘴而別，只是路得捨不得拿俄米。」（1:14）"], ["p", "弟兄姊妹，我們常常把俄珥巴講成反面人物。"], ["p", "可是經文沒有一句責備她。"], ["p", "她哭了兩次。"], ["p", "她說過要跟著去。"], ["p", "是拿俄米再三勸她，她才回去。"], ["p", "她作的，正是婆婆要她作的事。"], ["q", "這不是一個好媳婦和一個壞媳婦。"], ["p", "是一個照著勸告回去的人。"], ["p", "和一個超過勸告留下來的人。"], ["p", "路得的不同，在一個字。"], ["p", "「捨不得」原文是 דָּבְקָה（davqah）。"], ["p", "意思是緊緊黏住。"], ["p", "創世記說人要與妻子「連合」，是這個字。"], ["p", "申命記說以色列要「專靠」神，也是這個字。"], ["p", "這是盟約的字。"], ["p", "親嘴是告別，緊貼是不放手。"], ["p", "接著，拿俄米說了一句很刺耳的話："], ["q", "「看哪，你嫂子已經回她本國和她所拜的神那裡去了，你也跟著你嫂子回去吧！」（1:15）"], ["p", "聽起來，好像一個以色列人在勸人拜偶像。"], ["p", "在那個世界，百姓和神是分不開的。"], ["p", "回到摩押，就是回到基抹的權下。"], ["p", "拿俄米沒有把路說得很容易。"], ["p", "她把路的兩頭，都說破了。"], ["p", "只留下一個問題："], ["p", "你要跟隨誰？"], ["p", "現在，我們來聽路得的回答。"], ["p", "請先看她站在哪裡。"], ["p", "她剛剛埋葬了丈夫。"], ["p", "在摩押住了約有十年，沒有孩子。"], ["p", "婆婆已經說清楚了：沒有兒子可以給你。"], ["p", "回伯利恆，沒有任何保障。"], ["p", "在那裡，她是外邦人，是寡婦，是窮人。"], ["p", "嫂子已經回去了。"], ["p", "她要跟隨的，是一個已經空了的婆婆。"], ["p", "路得就在這裡開口。"], ["q", "「不要催我回去不跟隨你。你往哪裡去，我也往那裡去；你在哪裡住宿，我也在那裡住宿」（1:16）"], ["p", "「不要催我回去不跟隨你」，原文裡有一個字 עָזַב（‘azav），就是撇下。"], ["p", "路得說：我不撇下你。"], ["p", "請記住這個字。"], ["p", "到了第二章，拿俄米會說：神不斷地恩待活人死人。"], ["p", "那句話直譯，是神不撇下祂的慈愛。"], ["p", "一個不肯撇下人的媳婦。"], ["p", "帶出了一位不撇下人的神。"], ["p", "接著是最後兩句。"], ["p", "原文只有四個字，沒有動詞。"], ["p", "עַמֵּךְ עַמִּי，你的百姓，我的百姓。"], ["p", "וֵאלֹהַיִךְ אֱלֹהָי，你的神，我的神。"], ["p", "很像神立約的話。"], ["p", "我要作你們的神，你們要作我的子民。"], ["p", "現在，一個摩押女子從人這一邊，說出了這個約。"], ["p", "所以弟兄姊妹，這一節不是孝道條款。"], ["p", "不是在教媳婦要順從婆婆。"], ["p", "這是一個人換了百姓，換了神。"], ["p", "婆婆，是帶她到神面前的那個人。"], ["p", "她最後委身的，是那位神。"], ["p", "下一節證明了這一點。"], ["q", "「你在哪裡死，我也在那裡死，也葬在那裡。」（1:17）"], ["p", "她連墳墓都選好了。"], ["p", "古人最看重的，是葬在本族的地。"], ["p", "路得等於說：就算你死了，我也不回去。"], ["p", "然後她起誓。"], ["q", "「除非死能使你我相離！不然，願耶和華重重地降罰與我。」（1:17）"], ["p", "請注意她呼求的名字。"], ["p", "不是基抹，是耶和華。"], ["p", "這是路得第一次說出以色列神的名字。"], ["p", "一開口，就把自己的一生交在祂手中作擔保。"], ["p", "可是第十八節，很安靜。"], ["q", "「拿俄米見路得定意要跟隨自己去，就不再勸她了。」（1:18）"], ["p", "「定意」原文的意思，是使自己剛強。"], ["p", "路得的剛強，不在戰場上。"], ["p", "在一條寡婦回家的路上。"], ["p", "拿俄米沒有擁抱她，沒有說謝謝。"], ["p", "只是不再說話了。"], ["p", "路得說了全卷最美的一句話。"], ["p", "換來的，是一路的沉默。"], ["p", "真實的委身，常常不是在掌聲裡。"], ["p", "是在沒有回應的路上，繼續走。"], ["p", "還有一件事，我們不能跳過。"], ["p", "經文以後，一直叫她「摩押女子路得」。"], ["p", "神接納她，不需要她假裝自己不是摩押人。"], ["p", "可是申命記也有一條很重的話。"], ["q", "「亞捫人或是摩押人不可入耶和華的會」（申 23:3）"], ["p", "這個難處，聖經沒有叫我們假裝看不見。"], ["p", "解經家有好幾種讀法，我們在議題裡並陳。"], ["p", "可是有一件事很清楚。"], ["p", "路得被接納，不是靠她的出身。"], ["p", "是因為她說了：你的神就是我的神。"], ["p", "神的聖潔沒有放鬆，神的恩典也沒有關門。"], ["q", "神不看你從哪裡來，看你歸向誰。"], ["q", "第三件事：耶和華使我空空地回來。"], ["p", "於是二人同行，來到伯利恆。"], ["p", "出去的時候，是四個人。"], ["p", "回來的時候，是兩個女人。"], ["q", "「她們到了伯利恆，合城的人就都驚訝。」（1:19）"], ["p", "「驚訝」原文是騷動、震動。"], ["p", "一個寡婦回家，整座城都動起來了。"], ["p", "婦女們只說了一句話。"], ["p", "這是拿俄米嗎？"], ["p", "這不一定是嘲笑。"], ["p", "更像是不敢相信。"], ["p", "那個帶著丈夫兒子出去的女人。"], ["p", "怎麼變成這樣了？"], ["p", "這就是入境大廳的那一刻。"], ["p", "門打開了，熟悉的地方，陌生的眼光。"], ["p", "回到老家，有時比留在外地更難。
