本講義的立場：路得被接納出於她所投靠之神的恩典；神也喜悅並回應出於信心的行為。賞賜是父親的喜悅，不是工資帳單。神賞賜她的方式，是讓祝福她的波阿斯成了禱告的答案（2:12；3:9）。講台不可推到成功神學。", "care": "這一題最容易刺傷兩種人。一種是多年忠心服事、奉獻，卻仍然遭遇病痛、失業、家庭破碎的人，他們會問：「我做了那麼多，神的賞賜在哪裡？」講台不要承諾物質的回報，也不要暗示他們受苦是因為做得不夠。另一種是覺得自己太軟弱、甚麼都做不好的人，聽到「照你所行的」就更自卑。對前者，陪他哀哭；對後者，提醒他賞賜從投靠開始。會後請小組長私訊陪伴。"}, {"id": "ISS02_7", "t": "波阿斯比律法給得更多：慷慨可以被要求嗎？", "r": "2:14--16；利 19:9--10；申 15:7--8；林後 9:7；林後 8:12--13", "ch": [2], "why": "波阿斯不只照律法留下田角，還請路得一起吃飯，又吩咐僕人「從捆裡抽出些來」故意留給她。講台很喜歡用這段勉勵會眾「要比律法更多」。問題是，這種勉勵很容易變成壓力：特別奉獻的目標、建堂的認獻、「你們的義若不勝於文士和法利賽人的義」（太 5:20）的催促。有些會友收入微薄，聽到「要像波阿斯一樣慷慨」，只覺得羞愧。這一題要分清楚：哪些是可以教導的本分，哪些只能邀請？", "pos": [["【一】經文問的是甚麼", "", "<p>律法的要求是：「不可割盡田角，也不可拾取所遺落的。」（利 19:9）波阿斯做的超過這些：允許她「就是在捆中拾取麥穗」，並說：「要從捆裡抽出些來，留在地下任她拾取，不可叱嚇她。」（2:16）還讓她「吃飽了，還有餘剩的」（2:14）。<\/p><p>原文 2:16 שֹׁל־תָּשֹׁ֥לּוּ，動詞重疊，意思是「一定要抽出來」。問題是：<strong>波阿斯的慷慨是律法要求的延伸，還是出於自願的恩慈？今天的教會可以要求信徒這樣慷慨嗎？<\/strong><\/p>"], ["可要求說（慷慨是信徒的本分）", "", "<p>主張：律法本身就要求慷慨：「你弟兄中若有一個窮人，你不可忍著心、揝著手不幫補你窮乏的弟兄。總要向他鬆開手」（申 15:7--8）。所以教會可以明確規定奉獻比例、設定認獻目標，督促信徒履行本分。<\/p><p><strong>難處：<\/strong>保羅勸哥林多教會捐獻時說：「各人要隨本心所酌定的，不要作難，不要勉強」（林後 9:7）。波阿斯多給的部分，沒有一條律法規定；若把超過律法的部分也變成規定，慷慨就不再是慷慨，而成了另一種稅。<\/p>"], ["完全自願說（慷慨只看個人的心意）", "", "<p>主張：慷慨的價值正在於自由；任何的教導和提醒都是壓力，教會不應該談錢，只要讓信徒自己決定。<\/p><p><strong>難處：<\/strong>律法確實設定了底線，「不可割盡田角」是命令，不是建議；申 15:7 的「不可忍著心」也是命令。若連底線都不教，信徒就失去了聖經的準則，弱勢者也失去保障。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：聖經的底線可以教導，也應當教導；超過底線的慷慨，只能邀請，不能勒索。<\/strong>律法是底線，不是天花板。波阿斯先守住了底線，再出於恩慈多給；他多給的，是在自己的田裡，用自己的資源，而且是悄悄地給，讓路得不必感到被施捨。<\/p><p>保羅也說：「人若有願做的心，必蒙悅納，乃是照他所有的，並不是照他所無的。」（林後 8:12）<strong>領袖要做的，是像波阿斯一樣自己先在自己的田裡多留，而不是在別人的田裡設定目標。<\/strong>321 說聖經是我的準則：準則保護窮人，也保護給予者的自由。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你的收入不多，請不要因為比不上別人的慷慨而羞愧。神看的是心，不是數字。如果你有能力多給，也請記得：<strong>最好的慷慨，是讓接受的人保有尊嚴，就像波阿斯把穗子「留在地下」，讓路得像平常一樣撿起來。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：聖經的底線（利 19:9；申 15:7--8）可以教導；超過底線的慷慨只能邀請，不能勒索（林後 9:7）。律法是底線不是天花板；領袖要先在自己的田裡多留，並且保留接受者的尊嚴。", "care": "這一題最需要保護的，是經濟困難的會友：靠微薄薪水養家的移工、退休後收入有限的長者、正在還債的年輕家庭。講台不要公開比較奉獻金額，也不要說「奉獻少就是不愛神」。設定特別奉獻目標時，避免讓人覺得不認獻就沒面子。若有人因奉獻壓力而離開或羞愧，請同工私訊關心，讓他知道「照他所有的」就蒙悅納。教會的財務也要透明，讓信徒安心。"}, {"id": "ISS02_8", "t": "「他不斷地恩待活人死人」——這個「他」是耶和華，還是波阿斯？", "r": "2:20；1:8；創 24:27；撒下 2:5", "ch": [2, 3], "why": "2:20 是路得記的樞紐：拿俄米第一次在耶和華的名下重新說出祝福。可是這句話的「他」到底指誰，中英文譯本和註釋書都有分歧。和合本把原文的「他」（הוּא）譯作「那人」，讀起來像是指波阿斯；有些英文譯本則清楚指向耶和華。這不只是文法題：如果是耶和華，這是拿俄米對神的重新信任；如果是波阿斯，這是她對人的感謝。講台若只選一邊，可能錯過經文的豐富。", "pos": [["【一】經文問的是甚麼", "", "<p>和合本：「願那人蒙耶和華賜福，因為他不斷地恩待活人死人。」（2:20）原文是 בָּר֥וּךְ הוּא֙ לַיהוָ֔ה אֲשֶׁר֙ לֹא־עָזַ֣ב חַסְדּ֔וֹ，直譯「他是蒙耶和華賜福的，那沒有撇下他的慈愛……的」。<\/p><p>關係詞 אֲשֶׁר֙（那……的）可以接在「他」（波阿斯）後面，也可以接在「耶和華」後面——在原文裡，「耶和華」正好就在 אֲשֶׁר 的前面。問題是：<strong>「不斷地恩待活人死人」的主詞是誰？<\/strong><\/p>"], ["指耶和華說", "", "<p>主張：「耶和華」是最近的先行詞。創世記有幾乎相同的句子：「耶和華－我主人亞伯拉罕的神是應當稱頌的，因他不斷地以慈愛誠實待我主人。」（創 24:27）原文的片語與 2:20 幾乎相同。這樣讀，1:8 拿俄米求「耶和華恩待你們」，到 2:20 她親口承認耶和華沒有撇下慈愛。<\/p><p><strong>難處：<\/strong>「恩待死人」若指耶和華，意思不容易說明：神怎樣恩待已死的以利米勒和瑪倫？需要解釋為神透過照顧他們的遺孀、保存他們的家名來恩待死人。<\/p>"], ["指波阿斯說", "", "<p>主張：「蒙耶和華賜福」這種句式通常是祝福人的，例如大衛祝福基列雅比人：「你們厚待你們的主－掃羅，將他葬埋。願耶和華賜福與你們！」（撒下 2:5）拿俄米剛聽到波阿斯怎樣待路得，自然是稱讚他。和合本把「他」譯作「那人」，也是這樣理解。<\/p><p><strong>難處：<\/strong>波阿斯才認識路得一天，說他「不斷地」恩待死人，似乎太早；而且「沒有撇下他的慈愛」這個片語，在創 24:27 用在神身上。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：兩說並陳；本講義認為原文最自然的讀法指向耶和華，而神的慈愛正是藉著波阿斯臨到——兩者並不衝突。<\/strong>拿俄米在一天之內看見了兩件事：一個人的恩慈，和恩慈背後那位沒有撇下她的神。<\/p><p>這正是路得記的神學：神在全卷很少直接出手，卻藏在人的 חֶסֶד（慈愛）裡。1:13 拿俄米說「耶和華伸手攻擊我」，2:20 她說耶和華「不斷地恩待」。<strong>她的處境還沒有改變，她的觀點先改變了；而改變她觀點的，是一個名字：波阿斯。<\/strong>這也是為甚麼 2:20 是全卷的樞紐。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你不需要先解決文法問題，才能領受這節經文的安慰。不論「他」指的是神還是人，結果都一樣：神沒有撇下祂的慈愛，而祂常常透過一個人的手把慈愛送到你面前。<strong>今天有人恩待你，請你在感謝他的同時，也看見他背後的那一位。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：「他」可指耶和華或波阿斯，兩說並陳；本講義認為原文最自然指耶和華（參創 24:27 同一片語），而神的慈愛正是藉著波阿斯臨到，兩者不衝突。2:20 是拿俄米從控訴轉為祝福的樞紐。", "care": "這一題本身是文法題，但它觸及一個很深的牧養處境：覺得被神撇下的人。對他們來說，最大的安慰不是答對文法，而是聽見「神沒有撇下祂的慈愛」。講的時候，不要讓文法爭議蓋過安慰。也要提醒正在幫助別人的弟兄姊妹：我們是神慈愛的管道，不是慈愛的來源，不必居功，也不要讓受幫助的人覺得欠了我們。會後若有人私訊說「我覺得神離開了我」，請同工陪他從 1:21 讀到 2:20。"}, {"id": "ISS02_9", "t": "「至近的親屬」是甚麼？古代以色列的家族救助怎樣運作？", "r": "2:20；利 25:23--25、47--49；申 25:5--6；民 35:19；耶 32:7", "ch": [2, 3, 4], "why": "「至近的親屬」這個詞在第 2 章第一次出現，之後成了全卷的主軸，第 3、4 章都繞著它轉。可是今天的讀者對這個制度很陌生，常常把它和「娶寡嫂」的律法混為一談，或者直接跳到「波阿斯就是基督」。這一題若不先講清楚制度本身，第 3 章的請求、第 4 章城門前的交易都會讀不懂；講台也可能不知不覺把它寓意化。", "pos": [["【一】經文問的是甚麼", "", "<p>拿俄米說：「那是我們本族的人，是一個至近的親屬。」（2:20）原文 מִֽגֹּאֲלֵ֖נוּ，「我們的贖回者之一」，字根 גָּאַל（贖回）。這個字在路得記出現二十多次，是全卷的主追蹤。<\/p><p>律法裡的「至近的親屬」至少有三種責任：贖回家族賣掉的地業（利 25:25）；贖回賣身為奴的親人（利 25:47--49）；為被殺的親人追討血債（民 35:19，「報血仇的」也是同一個字）。另外，申 25:5--6 有「弟兄的本分」，用的是另一個字。問題是：<strong>路得記裡的「至近的親屬」包括哪些責任？為甚麼後來會和娶路得連在一起？<\/strong><\/p>"], ["同一制度說（贖地與娶寡婦本來就是一套）", "", "<p>主張：在古代以色列，地業和家名是綁在一起的；贖回死人的地，就必須為死人存留後代，否則地業仍會失去。所以「至近的親屬」的責任自然包括娶寡婦，這也是第 4 章城門前那位親屬的考量。<\/p><p><strong>難處：<\/strong>利未記的贖地律法沒有提到娶寡婦；申命記的「弟兄的本分」只限於「弟兄同居」（申 25:5），波阿斯並不是瑪倫的兄弟。兩個律法在條文上是分開的。<\/p>"], ["慈愛結合說（路得記把兩個律法用慈愛連起來）", "", "<p>主張：贖地和娶寡婦原本是兩個律法，路得記裡的人物出於慈愛，把它們放在一起實行：路得在 3:9 請求的，波阿斯在 4:5 承擔的，都超過了律法字面的要求。<\/p><p><strong>難處：<\/strong>這一說需要推測當時地方的習俗，經文沒有詳細說明；而且第 4 章 4:5 的原文有異讀，解釋起來還有難度。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：「至近的親屬」是古代以色列家族的安全網——那是一種權利，也是一種責任；它的根基是「地是我的」（利 25:23），神不讓祂百姓的家永遠失去產業。<\/strong>路得記把這個制度從法律帶進了慈愛：按條文，波阿斯可以只贖地；按慈愛，他把整個家都承擔起來。至於贖地與娶寡婦的關係，本講義並陳，留到第 4 章 4:5 的異讀詳細處理。<\/p><p>這個身分也使我們想起神自己：「你的救贖主就是以色列的聖者。」（賽 41:14）但本講義遵守議題「波阿斯是基督的預表嗎？預表的界線在哪裡？」所立的界線：講台可以說「至近的親屬這個身分，使我們想起那位成了我們弟兄、贖回我們的主」，不把制度的細節逐項寓意化。<strong>更重要的是，這個制度呼召今天的教會：在神的家裡，我們也要成為彼此的「至近的親屬」。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你也許沒有一個可以依靠的家族，或者你的家族已經四分五裂。路得記告訴你：神設立了安全網，祂自己就是那位救贖主；祂也把你放在一個屬靈的家裡。<strong>你不是沒有至近的親屬的人。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：「至近的親屬」（גֹּאֵל）是家族的安全網，包括贖地、贖人、追討血債，是權利也是責任（利 25:25、47--49）。路得記把它從法律帶進慈愛；贖地與娶寡婦的關係並陳，留待 4:5 處理。這身分使我們想起救贖主，但不逐項寓意化。", "care": "這一題要顧到兩種人。一是沒有家族可以依靠的人：獨自移民的人、孤身在外的移工、沒有子女的長者，他們聽到「至近的親屬」可能更覺孤單，講台要清楚說出教會就是神給他們的家。二是在家族中被期待承擔一切的長子、長女，他們被「你是至近的親屬」壓得喘不過氣，講台不要把波阿斯的承擔變成要求他們犧牲一切的命令。會後請小組長私訊關心，讓教會的肢體一起分擔。"}, {"id": "ISS03_1", "t": "拿俄米的計畫是信心，還是操縱？", "r": "3:1--6、18；1:9；2:20--22；創 38:13--26", "ch": [3, 1, 2], "why": "讀到 3:1--4，常有人皺起眉頭：一位婆婆叫守寡的媳婦沐浴抹膏、在夜裡去一個男人睡覺的地方，這不是設局嗎？也有講台反過來，把拿俄米講成「有智慧的屬靈母親」，鼓勵長輩照樣替年輕人「安排」。兩種講法都越過了經文。講成操縱，會眾學到的是懷疑經文裡每一個主動的人；講成模範，會眾學到的是用計謀替神開路，甚至替別人決定終身。這一題是第 3 章的第一道門，門開錯了，後面的夜就讀歪了。", "pos": [["【一】經文問的是甚麼", "", "<p>拿俄米開口第一句是：「女兒啊，我不當為你找個安身之處，使你享福嗎？」（3:1）「安身之處」原文 מָנוֹחַ（manoach），與她在 1:9 為兩個兒婦祈求的「得平安」是同一個字根。<strong>1:9 她求神去做；3:1 她要親手去做。<\/strong><\/p><p>接著是一連串很細的指示：沐浴、抹膏、換衣、下到場上、不要讓那人認出、看準他睡的地方、掀開腳上的被、躺臥，然後「他必告訴你所當做的事」（3:4）。所以問題是：<strong>這是信心的行動，還是用人的手段逼一個男人表態？經文對她的方法有沒有評價？<\/strong><\/p>"], ["操縱說（冒險設局）", "", "<p>主張：計畫的時間在夜裡，地點在打穀場，時機選在波阿斯吃喝完了、「心裡歡暢」（3:7）的時候，風險顯而易見。有學者把它和創世記第 38 章她瑪的計策並看，認為拿俄米是用一個沒有男人出面的寡婦唯一能用的方法，迫使波阿斯表態。<\/p><p><strong>難處：<\/strong>經文沒有一句責備拿俄米。結果是波阿斯稱讚路得「賢德」（3:11），並且立刻照律法的次序辦理。更重要的是動機：「使你享福」——是為媳婦，不是為自己。若這是操縱，經文的評語方向就完全反了。<\/p>"], ["屬靈模範說（主動為神開路）", "", "<p>主張：拿俄米從「空空地回來」的谷底站起來，主動為媳婦尋找出路，是信心的行動。講台應當鼓勵人照樣積極，不要只是被動等待。<\/p><p><strong>難處：<\/strong>經文同樣沒有稱讚她的方法，而且計畫本身有破綻：她說「他必告訴你所當做的事」（3:4），結果卻是路得自己開口（3:9）。把方法立為模範，會鼓勵人用策略安排別人的婚姻，也把神隱藏的手講成了人的手腕。<\/p>"], ["愛的冒險說（經文記錄，不評方法）", "", "<p>主張：拿俄米的動機是愛，方向是律法裡「至近的親屬」的本分（2:20），方法是那個時代一個無依的寡婦能走的路。敘述者刻意不評論方法，卻仔細記下兩個人在危險的夜裡怎樣守住本位。<\/p><p><strong>難處：<\/strong>這個讀法要求講者忍住，不替經文補上評語，講起來不如前兩說痛快；也要小心不要因此把整個計畫講得毫無風險。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採愛的冒險說。拿俄米的計畫不是操縱，也不是可以照抄的模範；經文的焦點從計畫移到了人。<\/strong>路得改了劇本，用「我是你的婢女」回到本位；波阿斯守住律法的次序，先問更近的親屬；到了最後，連定計畫的拿俄米自己都說：「你只管安坐等候，看這事怎樣成就」（3:18）。<strong>計畫的人，學會了交託。<\/strong><\/p><p>整章的讀法請參考議題「打穀場的一夜：第三章應該怎樣讀、怎樣講？」：不渲染、不迴避，落點是兩個人都守住了本位。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你不必先判斷拿俄米的每一步對不對，才能從這一章得幫助。請看見一件更大的事：第 1 章說「耶和華使我空空地回來」的人，到了第 3 章開始為別人的「安身之處」打算。<strong>一個受過重傷的人重新開始愛人，這本身就是神在她裡面的工作。<\/strong>神沒有等拿俄米的計畫完美才使用她；祂也不需要你的計畫完美。<\/p>"]], "con": [], "say": "本講義的立場：拿俄米的計畫是愛的冒險，動機是為媳婦「找個安身之處」，方向是律法裡至近的親屬的本分；經文沒有評論她的方法，卻記下兩個人都守住了本位。講台不把它講成操縱，也不立為可以照抄的模範；落點是 3:18 的交託。", "care": "這一題容易刺傷兩種人。一種是曾被長輩「安排」婚事、至今心裡有傷的人——講台若把拿俄米講成模範，他們會覺得被要求感謝那些安排。另一種是正為兒女婚事焦急的父母——講台若鼓勵「積極安排」，只會加重孩子的壓力。講的時候把焦點放在 3:18 的交託，而不是計畫的技巧。會後若有人提起被逼婚、被安排的經歷，請他私訊同工或小組長，先好好聽，不急著勸他「體諒長輩」。"}, {"id": "ISS03_2", "t": "「掀開他腳上的被，躺臥在那裡」有性暗示嗎？", "r": "3:4、7--8、14；3:11、13", "ch": [3], "why": "這是整卷路得記最常被問、也最常被講壞的一節。青少年團契讀到這裡會竊笑，成人查經班會尷尬地跳過；有些講員為了吸引注意力加油添醋，另一些講員乾脆假裝經文沒有這幾句。講台若渲染，會把一個敬虔寡婦的請求講成曖昧故事，也傷害在場經歷過性傷害的人；若迴避，會讓認真讀經的人以為聖經有見不得人的地方。這一題必須把原文說清楚，也必須把經文自己交代的結果說清楚。", "pos": [["【一】經文問的是甚麼", "", "<p>3:4 拿俄米吩咐：「掀開他腳上的被，躺臥在那裡」（3:4）；3:7 路得照做：「路得便悄悄地來掀開他腳上的被，躺臥在那裡」（3:7）。「腳上的被」原文 מַרְגְּלֹתָיו（margelotav），字面是「他腳的地方」，全卷出現在 3:4、7、8、14，舊約其他地方只在但以理書出現一次，指身體的「腳」。<\/p><p>希伯來文的「腳」在少數經文可作委婉語，「躺臥」與「知道」也可帶性的含意。所以問題是：<strong>作者是在暗示發生了甚麼，還是在描寫一個含蓄而合宜的請求動作？<\/strong><\/p>"], ["含蓄暗示說（作者故意留白）", "", "<p>主張：作者選用的字眼有雙重意味——夜裡、打穀場、吃喝之後、「腳」、「躺臥」、「認出」；不少學者認為這是刻意製造張力，讓讀者屏息：這一夜會不會出事？<\/p><p><strong>難處：<\/strong>張力不等於事實。經文接著把結果交代得很清楚：波阿斯稱她為「賢德的女子」（3:11），起誓要照律法辦理（3:13），她「躺到天快亮，人彼此不能辨認的時候就起來了」（3:14），而且婚姻是在第 4 章城門前公開成立之後，經文才說「與她同房」（4:13）。若把張力讀成已經發生的事，就和經文自己的交代相反。<\/p>"], ["字面動作說（只是請求的姿勢）", "", "<p>主張：מַרְגְּלוֹת 就是「腳的地方」，掀開衣物、躺在腳下，是僕人或求助者降卑的姿勢；夜裡寒冷，波阿斯醒來發現腳邊有人，正合「不料有女子躺在他的腳下」（3:8）的描寫。<\/p><p><strong>難處：<\/strong>這個讀法有時會把作者刻意留下的緊張感完全抹平，好像這一夜毫無風險；但拿俄米吩咐「不要使那人認出你來」（3:3），波阿斯也說「不可使人知道」（3:14），可見這一夜確實敏感。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：不渲染，也不迴避。<\/strong>原文字面是「腳的地方」；有學者讀出含蓄的暗示，這一點可以誠實說明。<strong>但經文本身交代了結果：沒有越界，兩個人都守住了本位。<\/strong>3:11 的「賢德」、3:13 的起誓、3:14 的天未亮起來，是作者親手寫下的答案。<\/p><p>講台的規則很簡單：<strong>只用經文原句，不擴寫身體細節，不想像經文沒寫的畫面。<\/strong>張力是真的，敬虔也是真的；作者讓我們在張力中看見，這一夜真正發生的是一個請求與一個承諾。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>聖經沒有因為怕尷尬就不寫人的處境，這本身就值得信任。神的話敢把一個深夜、一個打穀場、一個脆弱的寡婦寫進來，也把她怎樣被保護寫進來。<strong>你不必替聖經遮掩，也不必替聖經加料；照著它寫的讀，就夠了。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：「腳上的被」原文字面是「腳的地方」，有學者讀出含蓄暗示，可以誠實說明；但經文交代了結果——3:11 稱她賢德、3:13 波阿斯起誓照律法辦理、3:14 天未亮就起來。講台只用經文原句，不渲染，也不迴避。", "care": "這一題最容易刺傷曾經歷性騷擾、性侵害的人：講員一句玩笑，可能讓他們整場聚會坐立難安。講的時候語氣平穩，不開玩笑、不加形容詞、不讓台下哄笑。在青少年或兒童的場合，只說「她用當時的方式，謙卑地請求他照律法幫助她們」。若有人因這段經文想起自己的傷，會後請私訊同工或小組長；陪談時不追問細節，必要時協助尋求專業協助。"}, {"id": "ISS03_3", "t": "沐浴抹膏、夜裡到打穀場：女性的主動可以嗎？", "r": "3:3、6、9；撒下 12:20；撒下 14:2", "ch": [3, 2], "why": "這一題常在兩個方向被拉扯。一邊說：「看，路得主動，所以姊妹在感情上也要主動出擊。」另一邊說：「女人深夜去找男人，不守婦道，經文只是記錄，不是贊同。」兩種說法都把一個古代寡婦求贖的行動，變成今天男女交往的規則。講台若講成鼓勵，單身姊妹會被施壓；講成責備，又會讓所有在困境裡為家人開口求助的女性覺得羞恥。我們要問的是：經文裡這個「主動」，到底主動在甚麼事上？", "pos": [["【一】經文問的是甚麼", "", "<p>拿俄米吩咐：「你要沐浴抹膏，換上衣服，下到場上，卻不要使那人認出你來」（3:3）。這三個動作在舊約可以標示「結束居喪」：大衛在孩子死後，「沐浴，抹膏，換了衣裳」（撒下 12:20）；約押要婦人裝作居喪，就叫她「不要用膏抹身」（撒下 14:2）。<\/p><p>路得照做了，卻在最關鍵的一刻說出拿俄米沒有教她的話：「求你用你的衣襟遮蓋我，因為你是我一個至近的親屬」（3:9）。所以問題是：<strong>路得的主動，是女性在感情上的主動，還是一個寡婦在律法裡為家族求贖的主動？今天可以怎樣應用？<\/strong><\/p>"], ["婚戀主動說（姊妹也可以主動）", "", "<p>主張：路得在婚姻的事上邁出第一步，經文沒有責備，反而得了祝福；所以今天的姊妹不必只是被動等待，可以主動表達心意。<\/p><p><strong>難處：<\/strong>這樣讀把「至近的親屬」整個律法框架拿掉了。路得在 3:9 說的理由不是「我喜歡你」，而是「因為你是我一個至近的親屬」；她求的是贖回，不是約會。把它變成交往策略，就是把路得記當成婚戀教材，正是本卷最要避免的偏差。<\/p>"], ["越矩說（記錄不等於贊同）", "", "<p>主張：古代女子深夜獨自到男人睡處，於禮不合；經文只是如實記錄，讀者不該從中學習。<\/p><p><strong>難處：<\/strong>經文的評價剛好相反：波阿斯說「願你蒙耶和華賜福」（3:10），又說「我本城的人都知道你是個賢德的女子」（3:11）。敘述者也沒有任何責備。若說她越矩，就和經文裡唯一的評語相衝突。<\/p>"], ["求贖說（在本位上的請求）", "", "<p>主張：沐浴抹膏換衣，是表示居喪期結束、可以再嫁；夜裡到場上，是在不讓她和波阿斯公開蒙羞的前提下提出請求。路得的主動，是一個沒有男人可以替她出面的寡婦，在神的律法裡為死去的丈夫和婆婆的家開口。<\/p><p><strong>難處：<\/strong>這個讀法需要講者花時間解釋古代的禮俗與律法，講起來比較費力；而且不能從中推出今天任何一種具體的交往做法。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採求贖說。路得的主動是「在本位上的請求」：她以「我是你的婢女」降卑，以「你是我一個至近的親屬」請求一位贖回的人履行神律法裡的本分。<\/strong>經文稱讚的不是她的大膽，是她的慈愛（3:10）與賢德（3:11）。<\/p><p>所以這段經文不能拿來說「女生要主動」，也不能拿來說「女人開口就是不守本分」。它教導的是：<strong>在困境中照著神的話向人求助，不是羞恥；為別人的家開口，是慈愛。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你是一位需要開口求助的人——為年老的父母、為孩子、為自己——路得給你的不是一套技巧，而是一份許可：你可以謙卑地、照著神的心意把需要說出來。神常常藉著一個人的開口，打開另一個人的慈愛。<strong>主動不是靠自己，是在本位上把結果交給神。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：沐浴抹膏換衣多半表示居喪結束；路得的主動是一個無依寡婦在神的律法裡為家族求贖，以「我是你的婢女」降卑、以「你是我一個至近的親屬」請求。經文稱讚的是她的慈愛與賢德，不是交往技巧；不可推成「女生要主動」，也不可說她越矩。", "care": "這一題最容易刺傷單身多年、正在為婚姻禱告的姊妹：講台若說「你要像路得一樣主動」，等於暗示她們單身是因為不夠積極。也會刺傷在困境中曾經開口求助、卻被人說閒話的寡婦或單親媽媽。講的時候不要拿任何一位會友的婚姻狀況舉例。會後若有姊妹說「我也想主動，可是……」，請先聽她的心，不給建議清單；需要時請私訊同工或小組長陪她禱告。"}, {"id": "ISS03_4", "t": "「求你用你的衣襟遮蓋我」是求婚嗎？", "r": "3:9；2:12；結 16:8；申 25:5；利 25:25", "ch": [3, 2, 4], "why": "3:9 是第 3 章的高峰，也是本章章題。問題是：路得這句話到底是在求甚麼？若只說「她在求婚」，整件事就變成一段愛情故事，「至近的親屬」的律法意義消失了；若只說「她在求他贖地」，又忽略了經文用的是婚約的語言，而且第 4 章確實以婚姻收場。講台的講法決定了會眾看見的是浪漫，還是慈愛。這一題必須把「衣襟」這個字和它在聖經裡的分量講清楚。", "pos": [["【一】經文問的是甚麼", "", "<p>原文是 וּפָרַשְׂתָּ כְנָפֶךָ עַל־אֲמָתְךָ，直譯「把你的衣襟展開在你的婢女身上」。「衣襟」כָּנָף（kanaf）就是 2:12 波阿斯祝福她時說的「翅膀」：「你來投靠耶和華－以色列神的翅膀下」（2:12）。<strong>波阿斯求神用翅膀遮蔽她；路得請他用自己的「翅膀」遮蓋她——他成了他自己禱告的答案。<\/strong><\/p><p>以西結書用同樣的說法描寫神與以色列立約：「便用衣襟搭在你身上，遮蓋你的赤體；又向你起誓，與你結盟，你就歸於我」（結 16:8）。而路得說的理由是：「因為你是我一個至近的親屬」（3:9）。所以問題是：<strong>這是求婚，還是求贖？兩者是甚麼關係？<\/strong><\/p>"], ["求婚說（婚約的語言）", "", "<p>主張：「展開衣襟」在古代近東與以西結書都是娶妻、立約的動作；波阿斯的回答「凡你所說的，我必照著行」（3:11），以及第 4 章的婚姻，都顯示這是一個明確的求婚。<\/p><p><strong>難處：<\/strong>若只讀成求婚，就解釋不了路得給的理由為甚麼不是感情，而是「至近的親屬」；也解釋不了波阿斯為甚麼立刻提到「還有一個人比我更近」（3:12）。這不是一般的婚姻，是在律法框架裡的婚姻。<\/p>"], ["求贖說（請他履行至近親屬的本分）", "", "<p>主張：路得求的是 גֹאֵל（go’el，贖回者）的保護：贖回以利米勒的地業（利 25:25），並為死去的瑪倫存留後代（參申 25:5）。「衣襟」是保護的意思，重點在家族的救助。<\/p><p><strong>難處：<\/strong>這個讀法若把婚姻的意思完全抽掉，就和以西結書的用法、和第 4 章「娶了路得為妻」（4:13）不合。路得求的保護，確實是透過婚姻來完成的。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：兩者並陳，而且不衝突——這是一個以婚約語言提出的求贖。<\/strong>路得請波阿斯以婚姻的方式，承擔至近的親屬的責任：遮蓋她、保護她，也為拿俄米的家存留名字。<strong>她不是在求一個男人愛她，是在求一位贖回的人照神的律法行慈愛。<\/strong><\/p><p>「翅膀」與「衣襟」同一個字，是本章最珍貴的一筆：<strong>神回答禱告的方法，常常是差那個禱告的人自己去。<\/strong>這使我們想起主耶穌說，祂多次願意聚集人「好像母雞把小雞聚集在翅膀底下」。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>這一節不是要你去找一個人來「遮蓋」你，好像婚姻才是人生的答案。它要你看見：人真正需要的遮蓋，是在神的翅膀下；而神常常差一個人，成為那遮蓋臨到的管道。<strong>你可能是那個需要被遮蓋的人，也可能是被差去遮蓋別人的人。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：「求你用你的衣襟遮蓋我」用的是婚約的語言（參結 16:8），理由卻是「你是我一個至近的親屬」；這是以婚姻方式提出的求贖，兩者並陳而不衝突。「衣襟」與 2:12「翅膀」原文同一字 כָּנָף：波阿斯成了他自己禱告的答案。", "care": "這一題容易讓單身、離婚或喪偶的弟兄姊妹覺得：沒有一個人的「衣襟」遮蓋，自己就是不完整的。講的時候要說清楚，路得最終的投靠是「耶和華－以色列神的翅膀下」，婚姻只是神在她身上使用的一條路。也要小心不要把「遮蓋」講成要女性依附男性的教導。會後若有人說「我沒有人遮蓋」，請私訊同工或小組長，讓小組成為他身邊那一圈實際的照顧。"}, {"id": "ISS03_5", "t": "「你末後的恩比先前更大」指的是甚麼？", "r": "3:10；1:8；2:11--12、20", "ch": [3, 1, 2], "why": "波阿斯這句稱讚很短，卻很容易被誤解。有人以為「末後的恩」是路得對波阿斯的愛意，於是又把經文講成浪漫故事；也有人說不清楚「先前」是甚麼，只好一句帶過。其實這一句是全卷 חֶסֶד（慈愛）這條線的轉折點，一個外邦女子被以色列的長者稱讚有慈愛。講台若講不出來，就錯過了路得記最核心的一個字；若講錯，就把慈愛講成了情愛。", "pos": [["【一】經文問的是甚麼", "", "<p>波阿斯說：「女兒啊，願你蒙耶和華賜福。你末後的恩比先前更大；因為少年人無論貧富，你都沒有跟從」（3:10）。「恩」原文 חַסְדֵּךְ（chasdekh，你的慈愛），是 חֶסֶד：立約之愛、忠誠的恩待。直譯「你使你末後的慈愛比起初的更好」。<\/p><p>這個字在全卷出現三次：拿俄米在 1:8 祝福兩個兒婦「願耶和華恩待你們，像你們恩待已死的人與我一樣」（1:8）；拿俄米在 2:20 說那人「不斷地恩待活人死人」（2:20）；到了 3:10，被稱讚有慈愛的是路得。所以問題是：<strong>「先前」的恩是甚麼？「末後」的恩又是甚麼？<\/strong><\/p>"], ["先前＝向婆婆的孝行；末後＝這次的請求", "", "<p>主張：「先前的恩」指 2:11 波阿斯已經聽說的事：「自從你丈夫死後，凡你向婆婆所行的」（2:11）；「末後的恩」指她這一夜的請求——她沒有去找年輕人，而是選擇一位能為以利米勒家贖回產業、存留名字的親屬。<\/p><p><strong>難處：<\/strong>這個讀法最符合上下文，但要小心不要把「末後的恩」講成路得對波阿斯個人的好感，好像她「選中了」波阿斯；經文的理由是「少年人無論貧富，你都沒有跟從」，重點在她沒有為自己挑選。<\/p>"], ["先前＝對拿俄米；末後＝對死去的丈夫", "", "<p>主張：先前的慈愛是對活人（拿俄米），末後的慈愛是對死人（瑪倫）：她請求至近的親屬，是為了讓死人的名在產業上存留，正好呼應 2:20「恩待活人死人」。<\/p><p><strong>難處：<\/strong>這一說很美，但 3:10 沒有直接提到瑪倫；把「末後」限定為對死人，可能讀得比經文多一些。它和第一說其實可以並存。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：先前的慈愛是她捨己跟隨拿俄米（1:16；2:11）；末後的慈愛是她在可以為自己選擇的時候，選擇了一條為拿俄米的家、為死去的丈夫存留名字的路。<\/strong>「少年人無論貧富，你都沒有跟從」說明了關鍵：她本來可以為自己打算，她卻沒有。<\/p><p>這是 חֶסֶד 這條線最美的翻轉：<strong>拿俄米在 1:8 求神照著兩個兒婦待人的樣子恩待她們；到了 3:10，以色列的長者說，這個外邦人的慈愛越來越大。神的慈愛，在人的慈愛裡被看見。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>慈愛不是一次的感動，是越走越深的忠誠。路得不是一開始就完全，她是一步一步走出來的：離開本地、拾穗、回報婆婆、在夜裡開口。<strong>你今天的忠心，也許沒有人看見；但神看見，而且祂能使你「末後的」愛比「先前的」更深。<\/strong>不是更大的成就，是更深的愛。<\/p>"]], "con": [], "say": "本講義的立場：「恩」原文是 חֶסֶד（立約的慈愛）。先前的慈愛是路得捨己跟隨婆婆；末後的慈愛是她不為自己挑選「少年人」，而為拿俄米的家、為死人存留名字請求至近的親屬。這不是情愛的表白，是慈愛的深化。", "care": "這一題容易刺傷在家庭裡長年付出、卻從沒被肯定的人，例如照顧公婆多年的媳婦、長照家屬。講台若只稱讚路得「好偉大」，他們會覺得自己永遠不夠好。講的時候要說，波阿斯的稱讚是在路得最卑微的時候才說出口的；也要提醒：路得的慈愛不是被逼出來的，經文從來沒有要求媳婦一定要這樣做。會後若有人提到照顧家人的疲憊，請私訊同工或小組長，提供實際的喘息與陪伴。"}, {"id": "ISS03_6", "t": "「賢德的女子」與箴言 31 章「才德的婦人」有甚麼關係？", "r": "3:11；2:1；箴 31:10、30--31；箴 12:4", "ch": [3, 2], "why": "許多姊妹聽到「箴言 31 章的婦人」就緊張：天未亮就起來、買田、紡線、照顧全家，好像是一份不可能完成的履歷。若講台把路得講成「箴言 31 章的活樣本」，等於多給姊妹們一張達不到的標準。但這兩處的確用了同一個片語，部分希伯來抄本的次序也把兩卷書放在一起；不講，又錯過了經文本身的對話。這一題要講出兩處的連結，卻不把它變成新的重擔。", "pos": [["【一】經文問的是甚麼", "", "<p>波阿斯說：「我本城的人都知道你是個賢德的女子」（3:11）。「賢德的女子」原文 אֵשֶׁת חַיִל（eshet chayil），與箴言 31 章「才德的婦人誰能得著呢？她的價值遠勝過珍珠」（箴 31:10）是同一個片語。חַיִל 本義是力量、能力、財富、品格，波阿斯在 2:1 被稱為「大財主」，原文就是 גִּבּוֹר חַיִל。<\/p><p>在希伯來聖經的部分抄本傳統裡，路得記緊接在箴言之後。所以問題是：<strong>作者是在說路得就是箴言 31 章所描寫的那位婦人嗎？這個連結要怎樣講？<\/strong><\/p>"], ["正典回答說（路得是箴言 31 章的實例）", "", "<p>主張：箴言 31 章問「誰能得著」，路得記就回答：在伯利恆，一個摩押寡婦就是這樣的人。正典的排列刻意讓兩卷書對話。<\/p><p><strong>難處：<\/strong>部分抄本的次序是後來的正典安排，不一定是作者的用意；而且箴言 31 章描寫的是一位有家業、有僕婢的主母，路得卻是一個在田裡拾穗的窮寡婦。把她當成箴言 31 章的「實例」，會把兩卷書的處境混在一起。<\/p>"], ["品格對照說（同一個 חַיִל，重點在敬畏與慈愛）", "", "<p>主張：兩處的共同點不在成就與能力，而在品格：箴言 31 章的總結是「惟敬畏耶和華的婦女必得稱讚」（箴 31:30）；路得被稱為賢德，是因為她的慈愛（3:10）和她投靠耶和華（2:12）。<\/p><p><strong>難處：<\/strong>這個讀法需要講者把 חַיִל 的多重意思說清楚，否則會眾只會聽見「賢慧」兩個字，又回到華人文化裡「賢妻良母」的框框。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：兩處用的是同一個 אֵשֶׁת חַיִל，這一筆值得講；但重點不在「路得符合箴言 31 章的履歷」，而在「同一個 חַיִל，給了大財主波阿斯，也給了拾穗的窮寡婦路得」。<\/strong>在神眼中，一個身無分文的外邦女子和城裡的大財主有同樣的分量。<\/p><p>「本城的人都知道」，原文是「我百姓的全城門都知道」。箴言 31 章說「願她的工作在城門口榮耀她」（箴 31:31）；路得還沒有在城門口出現，城門的人已經在稱讚她了。<strong>賢德不是一份清單，是被神改變的生命自然散發的見證。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果箴言 31 章讓你喘不過氣，請看路得：她被稱為「賢德」的時候，沒有田、沒有家業、沒有丈夫，只有一顆慈愛的心和一雙拾穗的手。<strong>神看重的不是你做了多少，是你投靠誰、怎樣愛人。<\/strong>箴言 31 章最後一句也是這樣收的：稱讚歸給敬畏耶和華的人。<\/p>"]], "con": [], "say": "本講義的立場：3:11「賢德的女子」與箴 31:10「才德的婦人」原文同為 אֵשֶׁת חַיִל；兩處的共同點是敬畏神與慈愛的品格，不是成就清單。同一個 חַיִל 給了大財主波阿斯，也給了拾穗的窮寡婦路得——不把路得變成又一張達不到的標準。", "care": "這一題最容易刺傷覺得自己「不夠賢慧」的姊妹：職場媽媽、身體軟弱的人、婚姻破碎的人、從未結婚的人。講台若說「做一個箴言 31 章的女人」，等於給她們打分數。講的時候不要比較會友，不要在母親節用這段經文要求姊妹們。也要讓弟兄聽見：חַיִל 一樣是對男人的呼召。會後若有姊妹說「我永遠做不到」，請私訊同工或小組長陪她，從 2:12 的投靠重新開始。"}, {"id": "ISS03_7", "t": "波阿斯為甚麼不直接答應，要先問「更近的親屬」？", "r": "3:12--13；4:1--6；利 25:25", "ch": [3, 4], "why": "讀者讀到 3:12 常常會著急：波阿斯明明願意，為甚麼不馬上答應？是猶豫、是推託，還是怕擔責任？有些講台把這一句講成「好男人要矜持」，有些講成「波阿斯在試驗路得」，都離開了經文。其實這一句正是波阿斯「守住本位」的地方。講台若講不出來，會眾就會以為愛一個人可以不顧次序；講得好，會眾會看見，慈愛和公義在這個人身上是怎樣同時成立的。", "pos": [["【一】經文問的是甚麼", "", "<p>波阿斯說：「我實在是你一個至近的親屬，只是還有一個人比我更近」（3:12）。接著他給出一個明確的承諾：「明早他若肯為你盡親屬的本分，就由他吧！倘若不肯……我必為你盡了本分」（3:13），並且「我指著永生的耶和華起誓」（3:13）。<\/p><p>律法說：「他至近的親屬就要來把弟兄所賣的贖回」（利 25:25），贖回的權利有先後次序。所以問題是：<strong>波阿斯為甚麼不直接答應？他是猶豫，還是守規矩？這對路得是好事嗎？<\/strong><\/p>"], ["猶豫推託說（他不確定自己要不要）", "", "<p>主張：波阿斯年紀比較大，可能擔心路得只是出於婆婆的安排；提出更近的親屬，是留一條退路。<\/p><p><strong>難處：<\/strong>經文的語氣正好相反：他先稱讚路得（3:10--11），再說「凡你所說的，我必照著行」（3:11），最後還起誓（3:13）。一個想推託的人不會在深夜指著永生的耶和華起誓。拿俄米也看得清楚：「那人今日不辦成這事必不休息」（3:18）。<\/p>"], ["守法次序說（他不搶別人的權利）", "", "<p>主張：贖回的權利屬於血緣最近的人，波阿斯若私下答應，就是越過那位親屬的權利，也會讓路得和拿俄米將來在城中受人質疑。他選擇在城門前、照律法的次序公開辦理。<\/p><p><strong>難處：<\/strong>這一說若講得太僵硬，會讓人以為波阿斯只在乎程序；但經文在同一節裡也顯出他的熱心：「倘若不肯……我必為你盡了本分」——他願意，但不搶。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採守法次序說。波阿斯不是猶豫，是守住本位：他願意付代價，卻不越過別人的權利；他愛路得，也尊重神的律法與城裡的秩序。<\/strong>這一句和路得的「我是你的婢女」（3:9）成對——路得降卑地回到本位，波阿斯也守住了本位。<\/p><p>這樣做對路得是保護：婚姻若在暗中成立，她「摩押女子」的身分和夜裡的這件事都可能成為別人議論的把柄；在城門前公開辦妥，她就有了全城的見證（4:9--11）。<strong>真正的慈愛不走捷徑。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>有時候你很想要一件事，也覺得那是好事，神卻讓你等一個早上，讓次序先走完。這不是神在拖延，是祂在保護你和別人。<strong>守住次序的等候，比搶來的成功更有平安。<\/strong>而且你不是一個人在等：有一位比你更急、也更守本分的神，正在替你把事辦成。<\/p>"]], "con": [], "say": "本講義的立場：波阿斯先提「還有一個人比我更近」，不是猶豫推託，是守住律法的次序與本位——他願意付代價，卻不越過別人的權利，並指著永生的耶和華起誓必盡本分。在城門前公開辦理，也保護了路得與拿俄米的名聲。", "care": "這一題容易刺傷兩種人：一種是曾被人用「要照程序」「再等等」拖延、最後不了了之的人，他們會懷疑波阿斯也只是在推託——講的時候要強調 3:13 的起誓和 3:18 的「今日」；另一種是在教會服事中被人搶了位置、越過了次序的人，這一題可能勾起舊傷。會後若有人提起這些經歷，請私訊同工或小組長，先聽，不急著要他「放下」。"}, {"id": "ISS03_8", "t": "「不可使人知道有女子到場上來」：是遮掩，還是保護名譽？", "r": "3:14；3:3、11；4:9--11；林後 8:21", "ch": [3, 4], "why": "有人讀到 3:14 會起疑心：如果甚麼事都沒發生，為甚麼要保密？這不就是心虛嗎？也有人拿這句話替教會裡的「家醜不外揚」辯護：「你看，連波阿斯都說不可使人知道。」兩種講法都很危險。前者懷疑經文自己的交代，後者可能被用來掩蓋真正的傷害。這一題要分清楚：保護一個無辜者的名譽，和掩蓋一件錯事，是完全不同的兩件事。", "pos": [["【一】經文問的是甚麼", "", "<p>經文說：「路得便在他腳下躺到天快亮，人彼此不能辨認的時候就起來了。波阿斯說：『不可使人知道有女子到場上來』」（3:14）。原文 אַל־יִוָּדַע（al-yivvada，不可被人知道），與 3:3 拿俄米吩咐「卻不要使那人認出你來」（3:3）的「認出」是同一個字根 יָדַע。<\/p><p>這句話可能是波阿斯對路得說的，也可能是對身邊的僕人說的，甚至是他心裡的決定。所以問題是：<strong>這是為了遮掩一件不可告人的事，還是為了保護一個無辜者的名譽？<\/strong><\/p>"], ["遮掩說（心虛的保密）", "", "<p>主張：若一切正當，何必天未亮就走、何必叫人不要知道？這句話透露出這一夜並不單純。<\/p><p><strong>難處：<\/strong>經文已經用三件事回答了：波阿斯剛稱她為「賢德的女子」（3:11），剛指著耶和華起誓要照律法辦理（3:13），天亮後立刻到城門公開處理（4:1）。一個要遮掩的人，不會第二天就在城門前、在十位長老面前公開辦理這件婚事。<\/p>"], ["保護名譽說（不讓無辜的人被議論）", "", "<p>主張：一個摩押寡婦夜裡出現在打穀場，不論實情如何，被人看見就會被議論；那位更近的親屬的權利也可能被影響。波阿斯保護的是路得的名聲，也是這件事要在城門前公開、公正處理的程序。<\/p><p><strong>難處：<\/strong>這個讀法若被抽離上下文，可能被人借用來為「家醜不可外揚」辯護。必須說清楚：波阿斯保護的是一個沒有做錯事的人，而且他緊接著就公開處理。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採保護名譽說。波阿斯保護的是一個無辜者的名聲，而不是掩蓋錯事；而且他保密的是那一夜，不是這件事：天亮之後，贖回與婚姻就在城門前公開見證（4:9--11）。<\/strong><\/p><p>這正合保羅說的：「我們留心行光明的事，不但在主面前，就在人面前也是這樣」（林後 8:21）。<strong>保護人的名譽是慈愛；用保密掩蓋傷害是罪。<\/strong>分辨的方法很簡單：保密之後，是走向光明、公正的處理，還是讓受害的人繼續沒有聲音？<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>神看重人的名譽，祂不願意一個無辜的人被流言傷害。如果你曾經被人誤會、被傳言中傷，請知道：在波阿斯身上，我們看見神是怎樣保護一個軟弱的人。<strong>最後替路得說話的，不是流言，是全城的見證。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：「不可使人知道」是保護一個無辜者的名譽，不是掩蓋錯事；波阿斯保密的是那一夜，贖回與婚姻接著就在城門前公開辦理。這一節不可借來替「家醜不外揚」掩蓋傷害——保護名譽走向光明，掩蓋傷害讓受害者噤聲。", "care": "這一題最要小心的，是在教會或家庭中經歷過性侵害、家暴，卻被要求「不要張揚」的人。講台必須清楚說：3:14 不能被用來掩蓋任何傷害；有人受傷時，教會的責任是保護受害者、依法通報、尋求專業協助。也要顧到被流言傷過的人，讓他們知道神看重他們的名譽。會後若有人說出類似經歷，請私訊同工或小組長，不追問細節、不要求原諒，必要時協助尋求專業協助。"}, {"id": "ISS03_9", "t": "路得記可以當作婚戀教材嗎？「等候你的波阿斯」對嗎？", "r": "3:1--18；2:12；1:16；林前 7:7--8；箴 31:30", "ch": [3, 2, 4], "why": "「等候你的波阿斯」是華人教會單身姊妹最常聽到、也最常被刺痛的一句話。青年營、婚前輔導、單身團契，都很喜歡用路得記：姊妹要像路得一樣賢慧，弟兄要像波阿斯一樣有擔當，然後神就會安排。這套講法聽起來很屬靈，卻把一卷講神的慈愛與救贖的書，變成了婚戀成功學。結果，結婚的人以為自己是因為夠好，單身的人以為自己是因為不夠好。這一題必須正面回答。", "pos": [["【一】經文問的是甚麼", "", "<p>路得記確實有一段婚姻：3:9 的請求，4:13 的「波阿斯娶了路得為妻」。但全卷沒有一處描寫兩人的感情，沒有一句「愛」用在路得和波阿斯之間——全卷唯一的「愛」，是婦人們說路得「愛慕」拿俄米（4:15）。<\/p><p>全卷的主角是一位藏在「恰巧」裡、沒有撇下拿俄米的神，最後的高潮是「耶和華是應當稱頌的」（4:14），終點是大衛。所以問題是：<strong>這卷書可以拿來教導婚戀嗎？「等候你的波阿斯」這句話對嗎？<\/strong><\/p>"], ["婚戀範本說（路得與波阿斯是理想伴侶）", "", "<p>主張：路得賢德、忠心、謙卑，波阿斯敬虔、慷慨、守規矩，兩人是聖經中少見的美好婚姻；青年人可以從他們身上學習擇偶與交往的原則。<\/p><p><strong>難處：<\/strong>經文沒有把他們的婚姻當作重點。路得求的是一位至近的親屬（3:9），波阿斯辦的是贖回產業、存留死人的名（4:10）；把它當成婚戀範本，就把律法、慈愛、救贖的主線換成了浪漫的主線。更嚴重的是，「等候你的波阿斯」隱含一個應許：只要你夠好、夠忠心，神就會給你一個好配偶——這個應許經文從來沒有給過。<\/p>"], ["品格教材說（只學品格，不談婚戀）", "", "<p>主張：路得記不是婚戀指南，但路得和波阿斯的品格——慈愛、謙卑、守本位、不走捷徑——是所有人都該學的，不論已婚或單身。<\/p><p><strong>難處：<\/strong>這個讀法比較安全，但若講得只剩下「學習他們的美德」，又會變成另一種道德教訓，焦點落在人身上，看不見那位在暗中工作的神。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：路得記不是婚戀教材，「等候你的波阿斯」不是聖經的話，也不是聖經的應許。<\/strong>這卷書不教人怎樣找到配偶，它讓人看見：神怎樣在最黑的年代，藉著人的慈愛，把一個空了的家填滿，把王預備出來。<\/p><p>路得和波阿斯的品格可以學，但要學的是無己的慈愛，不是交往的技巧。保羅說「各人領受神的恩賜，一個是這樣，一個是那樣」（林前 7:7）——<strong>婚姻與單身都是神的恩賜，都不是成績單。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你單身，而且已經聽「等候你的波阿斯」聽到心累，請放下這句話。你的價值不在你有沒有被人選中，而在你已經「投靠耶和華－以色列神的翅膀下」（2:12）。<strong>路得記要你等候的不是一個人，是那位今日沒有撇下你的神。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：路得記不是婚戀教材，「等候你的波阿斯」既不是經文，也不是神的應許。全卷的主角是在暗中施慈愛的神，高潮是「耶和華是應當稱頌的」。路得與波阿斯可學的是無己的慈愛，不是交往技巧；婚姻與單身都是恩賜，不是成績單。", "care": "這一題最容易刺傷單身多年的姊妹與弟兄、離婚或喪偶的人、婚姻不幸福的人，以及想結婚卻因病、因家庭處境而無法進入婚姻的人。講台上不要說「等候你的波阿斯」，也不要說「弟兄要像波阿斯一樣有錢有品」；不要在台上打趣單身會友。會後若有人說「我是不是哪裡不夠好」，請私訊同工或小組長陪他，先肯定他在神面前的價值，不急著介紹對象。"}, {"id": "ISS04_1", "t": "波阿斯是不是基督的預表？", "r": "4:9--10、14；3:9；太 1:5；路 3:32；來 2:11、14--17；多 2:14；賽 41:14", "ch": [4, 2, 3], "why": "這是第 4 章最常被問的問題，也是全卷最容易講過頭的地方。許多弟兄姊妹從小聽過「波阿斯就是基督，路得就是教會」，再往下推，城門、長老、十個人、那位不肯贖的親屬，每一樣都被配上一個屬靈意思。這樣講很動人，聽的人也很興奮，卻常常讓人記得講員的巧思，忘了經文本身。另一邊，若講台一口否認任何連結，又錯過了「至近的親屬」這個身分在整本聖經裡的重量。這一題要把界線畫清楚。", "pos": [["【一】經文問的是甚麼", "", "<p>4:9--10 波阿斯在城門前說：「凡屬以利米勒和基連、瑪倫的，我都從拿俄米手中置買了」（4:9），「又娶了瑪倫的妻摩押女子路得為妻，好在死人的產業上存留他的名」（4:10）。他是 גֹּאֵל（go’el）：至近的親屬、贖回的人。舊約也用同一個字稱呼神：「你的救贖主就是以色列的聖者」（賽 41:14）。<\/p><p>新約只在兩處提到波阿斯，都在家譜裡：「波阿斯從路得氏生俄備得」（太 1:5）；「俄備得是波阿斯的兒子」（路 3:32）。新約沒有一處說「波阿斯預表基督」。所以問題是：<strong>我們可以把波阿斯講成基督的預表嗎？若可以，界線在哪裡？<\/strong><\/p>"], ["寓意讀法（全面對應）", "", "<p>主張：教父與清教徒傳統中常見這種讀法：波阿斯是基督，路得是外邦的教會，那位更近的親屬是不能救人的律法，城門前的交易是十字架上的救贖。整卷書是一幅福音的圖畫。<\/p><p><strong>難處：<\/strong>這種讀法沒有新約的根據，而且一旦開始，就沒有停止的地方：每一個細節都要找一個意思，講員越有想像力，講出來的就越多。會眾最後記住的是一套密碼，不是經文。更嚴重的是，把那位親屬配成「律法」，等於把一個合法行使權利的人講成反面人物。<\/p>"], ["純歷史讀法（與基督無關）", "", "<p>主張：路得記是大衛祖先的家族故事，作者沒有想到彌賽亞；把波阿斯和基督連起來，是後人加上的。<\/p><p><strong>難處：<\/strong>這忽略了正典的整體：新約親自把波阿斯寫進彌賽亞的家譜（太 1:5），而「贖回者」在舊約是神自己的稱號。完全不提基督，等於說這卷書和福音沒有關係。<\/p>"], ["節制讀法（身分與行動的相似）", "", "<p>主張：不作細節對應，只看「至近的親屬」這個身分：一位有權贖、也願意付代價贖的親人。新約用同樣的語言描寫基督：祂「稱他們為弟兄也不以為恥」（來 2:11），「凡事該與他的弟兄相同」（來 2:17），「為我們捨了自己，要贖我們」（多 2:14）。<\/p><p><strong>難處：<\/strong>這個讀法要求講者處處節制，常常要說「到這裡為止」，不如寓意讀法講得精彩；也需要分清楚「這使我們想起」和「這就是」的差別。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採節制讀法。新約沒有說波阿斯預表基督，本講義也不這樣說；講台可以說：「至近的親屬這個身分，使我們想起那位成了我們弟兄、付上代價贖回我們的主。」<\/strong><\/p><p>不可說城門、長老、交易的細節各有所指，也不逐項寓意化打穀場、六簸箕、脫鞋。三個檢驗：新約有沒有作過這個連結？是身分與行動的相似，還是細節的猜謎？講完之後，人記得的是基督，還是講員的巧思？全卷的原則請看議題「波阿斯是基督的預表嗎？預表的界線在哪裡？」<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你不需要在路得記裡找到藏起來的密碼，才能遇見基督。你只要看見一個人怎樣甘心付代價，為別人存留名字，就會想起那一位為你付上更大代價的主。<strong>而且這不只是讓你感動，也是呼召你：被贖的人，也被差去成為別人的「至近的親屬」。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：新約只把波阿斯列在家譜裡（太 1:5；路 3:32），沒有說他預表基督。本講義只說「至近的親屬」這個身分使我們想起那位成了我們弟兄、付代價贖我們的主（來 2:11--17），不作細節的對應，也不把那位親屬配成反面角色。", "care": "這一題的風險是把查經變成猜謎，讓喜歡「找預表」的人越來越興奮，讓讀不出來的人覺得自己沒有屬靈眼光。講的時候不要說「看不出波阿斯就是基督的人沒有啟示」，也不要嘲笑寓意傳統，只說清楚界線。若小組裡有人堅持某個細節的意思，請帶領者溫和地問：「新約有沒有這樣說？」把焦點帶回基督自己的捨己。會後有疑問的，請私訊同工或小組長一起查考。"}, {"id": "ISS04_2", "t": "「也當娶死人的妻」：贖地和娶寡婦是同一條律法嗎？", "r": "4:5、10；利 25:23--25；申 25:5--10；創 38:8；民 27:8--11", "ch": [4, 3], "why": "讀過摩西五經的人讀到 4:5，常會困惑：利未記說至近的親屬要贖地，申命記說兄弟要娶寡嫂；可是波阿斯不是兄弟，那位親屬也不是，為甚麼買地就一定要娶路得？這個問題若講不清楚，會眾會以為波阿斯在玩文字遊戲，甚至用計逼退對方；若講得太快，又會以為古代以色列的律法就是這樣規定。這一題還牽涉到 4:5 一處重要的抄本異讀；和合本的夾注「原文是買」也提醒我們，原文的動詞不是「娶」，值得說明。", "pos": [["【一】經文問的是甚麼", "", "<p>波阿斯說：「你從拿俄米手中買這地的時候，也當娶〔原文是買；十節同〕死人的妻摩押女子路得，使死人在產業上存留他的名」（4:5）。和合本的夾注已經告訴我們，「娶」原文是「買」，קָנִיתָה（qanitah）。<\/p><p>這一句的原文還有異讀：子音文本（Ketiv）是 קניתי「我買」，讀出形（Qere）是 קָנִיתָה「你買」；開頭的 וּמֵאֵת，直譯是「也從……」，所以照原文可讀成「你從拿俄米手中，也從摩押女子路得手中，買這地」。和合本照的是改讀與 Qere。所以問題是：<strong>贖地（利 25）與娶寡婦（申 25）本來是兩條律法，這裡為甚麼綁在一起？<\/strong><\/p>"], ["合一律法說（贖地本就包括娶寡婦）", "", "<p>主張：在當時伯利恆的習慣裡，至近的親屬贖回死人的地業，也承擔為死人存留後代的責任；兩件事本來就是一套家族救助的做法，波阿斯只是把它說出來。<\/p><p><strong>難處：<\/strong>摩西律法裡找不到明文把兩件事綁在一起：利 25:25 只說贖地，申 25:5 只說「弟兄同居」的兄弟娶寡嫂。若說這是律法明文，就超過了經文。<\/p>"], ["精神延伸說（照律法的精神承擔）", "", "<p>主張：兩條律法有共同的目的——不讓一個家的名字和地業從以色列中消失（申 25:6）。波阿斯把申命記兄弟的責任，按著精神延伸到更遠的親屬；這是慈愛在律法之上的加碼，不是律法的強制。所以那位親屬可以拒絕，不受申 25 的羞辱。<\/p><p><strong>難處：<\/strong>這個讀法要說明，既然不是強制，波阿斯為甚麼用「當」的口吻；也要面對 4:5 原文本身的不確定。<\/p>"], ["異讀說（波阿斯說的是自己要娶）", "", "<p>主張：若照 Ketiv「我買」，4:5 可讀成「你買地的那天，我要娶死人的妻路得，存留死人的名」：波阿斯是在宣布自己的打算，讓那位親屬明白，買了地，將來路得為瑪倫生的兒子會承受這塊地。<\/p><p><strong>難處：<\/strong>Qere 與多數古譯本支持「你買」；4:10 波阿斯說「又娶了……路得為妻」，雖與 Ketiv 的「我買」相合，卻是在那人放棄之後才說的，不能證明他在 4:5 已先宣布。這一說可以並陳，但不宜作為唯一的讀法。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採精神延伸說，並陳異讀。贖地與娶寡婦在摩西律法中是兩條，在路得記裡被波阿斯照著同一個精神合在一起：不讓死人的名從以色列中滅沒。<\/strong>這正是 4:10 的話：「免得他的名在本族本鄉滅沒」（4:10）。<\/p><p>因為這不是明文的強制，那位親屬可以說「我不能贖了」，也沒有受到申命記的羞辱。<strong>波阿斯做的，是律法沒有要求、慈愛卻願意承擔的事。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>4:5 有一個字的異讀，並不影響這卷書的信息：不論讀「你買」或「我買」，結果都是同一件事——有人願意承擔律法沒有強制的責任。<strong>聖經的抄本經過誠實的保存，連不確定的地方都留給我們看；這不是軟弱，是可信的證據。<\/strong><\/p>"]], "con": [], "say": "本講義的立場：贖地（利 25:25）與為死人存留名字（申 25:5--6）在摩西律法中是兩條，波阿斯照同一個精神把它們合在一起，是慈愛在律法之上的承擔，不是明文強制。4:5 原文有 Ketiv「我買」、Qere「你買」之異，和合本照 Qere 與改讀，並陳。", "care": "這一題比較偏知識，風險在於講得太艱澀，讓會眾覺得聖經難懂、抄本不可信。講到異讀時要用平靜的語氣，說明這是學者公開討論的事，不影響任何一條信仰的根基。另外要小心「娶」被理解為「買」女人：要說清楚，這裡的「買」是法律上承擔責任的語言，不是把路得當成貨物。會後若有人對抄本問題感到不安，請私訊同工或小組長，一起慢慢讀。"}, {"id": "ISS04_3", "t": "那位「不能贖」的親屬錯了嗎？", "r": "4:1--8；申 25:5--10；提前 5:8；腓 2:4", "ch": [4], "why": "講台很喜歡把這位親屬講成反面人物：「他自私」「他只要地不要人」「他就是那些只顧自己的基督徒」。這樣講很順，會眾也很容易點頭，卻有兩個問題。第一，經文沒有這樣說；他是在城門前、在長老面前，合法地放棄自己的權利。第二，坐在台下的人，可能正是那些因為家庭、經濟、健康，實在負擔不起一個承諾的人。把他講成壞人，會讓這些人覺得被定罪。這一題要守住的界線是：不把他講成壞人。", "pos": [["【一】經文問的是甚麼", "", "<p>波阿斯先說地的事，那人回答：「我肯贖」（4:4）。波阿斯接著說還要「娶死人的妻摩押女子路得」（4:5），那人就說：「這樣我就不能贖了，恐怕於我的產業有礙。你可以贖我所當贖的，我不能贖了」（4:6）。<\/p><p>「有礙」原文 אַשְׁחִית（’ashchit），是「毀壞、敗壞」：他擔心自己的產業被分薄、將來歸給瑪倫的後代。經文沒有記下他的名字，波阿斯稱他「某人」，原文 פְּלֹנִי אַלְמֹנִי（peloni ’almoni），相當於「某某人」。所以問題是：<strong>他錯了嗎？經文是在責備他嗎？<\/strong><\/p>"], ["自私說（他代表有己的人）", "", "<p>主張：他願意得地，卻不願意承擔寡婦；他保住了自己的產業，卻讓一個家的名字可能滅沒。經文不記他的名字，就是一種審判。<\/p><p><strong>難處：<\/strong>經文沒有一句責備他；城門前的長老沒有責備他；他也沒有受申命記第 25 章對不肯盡本分者的羞辱（申 25:9）。說他犯了罪，就是替經文加上它沒有的判決。而且他說的「恐怕於我的產業有礙」可能是真實的考量：他自己也有家人要負責。<\/p>"], ["合法無罪說（他有權不贖）", "", "<p>主張：贖回權是權利，不是義務；娶寡婦更不是律法對遠親的強制。他在公開的場合、照著程序說明自己不能承擔，並且把權利正式交給波阿斯（4:8），這是誠實而合法的。<\/p><p><strong>難處：<\/strong>若只講到這裡，就聽不見作者刻意安排的對照：一個人保住自己的名分，名字卻沒有留下；另一個人付代價為死人存留名字，名字被寫進了大衛的家譜。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：他沒有錯，他有權不贖；但經文讓我們看見一個安靜的對照。<\/strong>他保住了自己的產業，經文卻沒有留下他的名字；波阿斯為死人存留名字，自己的名字卻被記念到今天。<strong>這是有己與無己的對照，不是好人與壞人的對照。<\/strong><\/p><p>講台不可把他講成壞人，也不可把他當成影射某一類人的標籤。要問的不是「他有多糟」，而是：<strong>在合法、合理的範圍之內，我願不願意為別人多走一步？<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你曾經對一個需要說過「我不能」，而且那是誠實的「不能」，請不要因這段經文定自己的罪。神沒有要你承擔你承擔不起的。<strong>但也請你在神面前安靜地問：有沒有哪一次，我的「不能」其實是「不願」？<\/strong>神不是用罪咎逼你，是用波阿斯的樣子吸引你。<\/p>"]], "con": [], "say": "本講義的立場：那位親屬沒有違法，也沒有被經文責備；他有權不贖，並公開合法地把權利讓給波阿斯。經文讓我們看見的是有己與無己的對照：保住產業的人沒有留下名字，為死人存留名字的人被記念——但講台不可把他講成壞人。", "care": "這一題最容易刺傷正在照顧病人、負債、收入微薄、實在無力承擔更多責任的人，以及曾經拒絕收養、拒絕照顧某位親人而心存愧疚的人。講台若把那位親屬講成自私的代表，他們會覺得自己被點名。講的時候要清楚說「他有權不贖」，並且不要用他來影射會中任何人。會後若有人說「我也說過我不能」，請私訊同工或小組長，先陪他分辨，而不是勸他勉強答應。"}, {"id": "ISS04_4", "t": "脫鞋為證，和申命記 25 章的脫鞋羞辱一樣嗎？", "r": "4:7--8；申 25:7--10", "ch": [4], "why": "讀過申命記的人，一看到「脫鞋」就會想起 25:9 那個在城門前被吐唾沫的人，於是很自然地以為：那位親屬脫鞋，就是在城門前被羞辱。講台若照這個印象講，會把一個合法讓渡權利的人講成被公開羞辱的罪人，正好把他講成了壞人；而若不講，讀者自己也會這樣連起來。所以這一題要把兩段經文並排放，看清楚它們的相同與不同。", "pos": [["【一】經文問的是甚麼", "", "<p>4:7 敘述者特別停下來解釋：「從前，在以色列中要定奪什麼事，或贖回，或交易，這人就脫鞋給那人。以色列人都以此為證據」（4:7）。接著那人對波阿斯說：「你自己買吧！」於是將鞋脫下來了（4:8）。「鞋」原文 נַעֲלוֹ（na‘alo，他的鞋），「證據」原文 הַתְּעוּדָה（hatte‘udah）。<\/p><p>申命記第 25 章也有脫鞋：兄弟不肯娶寡嫂，「他哥哥的妻就要當著長老到那人的跟前，脫了他的鞋，吐唾沫在他臉上」（申 25:9），而且「他的名必稱為脫鞋之家」（申 25:10）。所以問題是：<strong>4:7--8 的脫鞋，是申命記那種羞辱嗎？<\/strong><\/p>"], ["羞辱說（同一個儀式）", "", "<p>主張：兩處都在城門、都在長老面前、都與為死人存留名字有關，也都有脫鞋，所以是同一個儀式；那位親屬被公開羞辱，因為他拒絕了本分。<\/p><p><strong>難處：<\/strong>差別非常清楚：申命記是寡婦脫男人的鞋，路得記是那人自己脫鞋；申命記有吐唾沫，路得記沒有；申命記說「脫鞋之家」是恥辱的名號，路得記說這是「證據」。而且經文沒有讓路得出場，脫鞋的人把鞋交給波阿斯，不是交給寡婦。<\/p>"], ["交易證據說（不同的習俗）", "", "<p>主張：4:7 是一般交易與贖回的證明，好像今天在契約上簽名蓋章：脫下鞋子交給對方，表示把行走、踏上那塊地的權利轉給他。敘述者說「從前」，表示這是寫作時代已經少見的古老習俗，所以要特別解釋。<\/p><p><strong>難處：<\/strong>這一說要面對兩段經文確實有相似的背景：都和為死人存留名字有關，讀者自然會聯想；若完全不提申命記，就無法回答會眾心裡的問題。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採交易證據說。4:7--8 的脫鞋是公開讓渡權利的證明，不是申命記第 25 章的羞辱。<\/strong>敘述者自己就把它稱為「證據」，沒有吐唾沫，沒有恥辱的名號，也沒有寡婦出面。<\/p><p>這正是講台要守住的地方：那位親屬合法地放棄，也被合法地尊重。<strong>城門前的長老見證的，是一次誠實的交接，不是一次公開的審判。<\/strong>同時也不給這個動作加上別的屬靈意思：它就是古代以色列的一種契約手續。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>神的百姓有一套公開、誠實的方式處理權利與責任，這本身就值得我們學習。<strong>說「不能」可以是誠實的，交出權利也可以是有尊嚴的。<\/strong>你不必因為退出一件你承擔不起的事，就覺得自己在眾人面前蒙羞。<\/p>"]], "con": [], "say": "本講義的立場：4:7--8 的脫鞋是古代以色列讓渡權利、確定交易的「證據」，那人自己脫鞋交給波阿斯；與申 25:9 寡婦脫鞋、吐唾沫、稱為「脫鞋之家」的羞辱不同。講台不把它講成羞辱，也不給它加上別的屬靈意思。", "care": "這一題要顧到曾經在家族或教會中被公開羞辱、被當眾「處理」的人：講台若把脫鞋講成羞辱，可能勾起他們的痛苦記憶。也要顧到那些在家族中退出某項責任、至今被親人說閒話的人。講的時候語氣要平和，強調城門前的程序保護了每一方的尊嚴。會後若有人談到被公開羞辱的經歷，請私訊同工或小組長，先陪他說出來，不急著要他原諒。"}, {"id": "ISS04_5", "t": "祝福裡為甚麼提到她瑪？", "r": "4:11--12、18；創 38:8--9、26、29；太 1:3", "ch": [4], "why": "城門前的眾民和長老為波阿斯祝福，提到拉結、利亞，這很容易理解；可是接下來提到她瑪，許多人讀到這裡會愣一下：創世記第 38 章的她瑪，是假扮妓女、從公公猶大懷孕的女人。為甚麼一場婚禮的祝福，要提起這樣一段家族的往事？講台若迴避，會錯過經文的用心；若講成「她瑪的方法可以效法」，又會傷害許多人。這一題要說清楚，祝福裡提她瑪，是在說甚麼。", "pos": [["【一】經文問的是甚麼", "", "<p>眾人說：「願耶和華使進你家的這女子，像建立以色列家的拉結、利亞二人一樣」（4:11），又說：「願耶和華從這少年女子賜你後裔，使你的家像她瑪從猶大所生法勒斯的家一般」（4:12）。<\/p><p>她瑪的故事在創世記第 38 章：猶大的長子死了，次子俄南「知道生子不歸自己，所以同房的時候便遺在地，免得給他哥哥留後」（創 38:9），猶大又不肯把三兒子給她。她最後用非常的方法使猶大承認：「她比我更有義」（創 38:26）。所以問題是：<strong>祝福裡為甚麼要提這個名字？是在稱讚她的方法嗎？<\/strong><\/p>"], ["家族榮耀說（只因為法勒斯）", "", "<p>主張：伯利恆是猶大支派的城，波阿斯是法勒斯的後代（4:18--21）；提到法勒斯，是在說「願你的家像我們的祖先一樣興旺」，她瑪只是順帶提到的母親。<\/p><p><strong>難處：<\/strong>經文特別寫出「她瑪從猶大所生」，不是只說「法勒斯的家」。如果只是為了祖先，不必把她瑪的名字放進來。<\/p>"], ["處境對照說（同樣是為死人存留後代）", "", "<p>主張：她瑪和路得都是寡婦，都遇到親屬沒有為她們盡本分（她瑪是俄南與猶大的推諉；路得是那位更近的親屬合法地放棄），都在一個不尋常的夜晚冒險，最後都為死去的丈夫存留了後代。眾人祝福時提她瑪，正因為兩個故事是同一類：神怎樣在一個幾乎斷了的家裡延續生命。<\/p><p><strong>難處：<\/strong>這個讀法很有力，但講台必須分清楚：她瑪用的是喬裝與欺瞞，處境也牽涉亂倫的禁忌，路得卻在 3:11 被稱為「賢德」；兩者處境相似，道德並不相同。不可把她瑪的方法講成可以效法。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採處境對照說。眾人提她瑪，是因為法勒斯的家本身就是從一個幾乎斷了的家、一個被虧待的寡婦開始的；神在那裡延續了猶大的家，也要在這裡延續以利米勒的家。<\/strong><\/p><p>這一筆並不是稱讚她瑪的方法，而是在說：<strong>神沒有因為一個家族有不光彩的過去就放棄它。<\/strong>家譜接著從法勒斯算起（4:18），一路寫到大衛。馬太福音更把她瑪的名字寫進彌賽亞的家譜：「猶大從她瑪氏生法勒斯和謝拉」（太 1:3）。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你的家也許有不願被提起的故事：婚姻的破裂、長輩的罪、一段被人議論的過去。城門前的祝福告訴你：<strong>神可以從一個不光彩的家史裡，帶出一條恩典的路。<\/strong>你的過去不能決定神對你的家所要做的事。<\/p>"]], "con": [], "say": "本講義的立場：祝福裡提她瑪，是因為法勒斯的家同樣起於一個被虧待、幾乎絕後的寡婦，神在那裡延續了生命；這是處境的對照，不是稱讚她瑪的方法。神不因家族不光彩的過去放棄它——馬太把她瑪寫進了彌賽亞的家譜（太 1:3）。", "care": "這一題最容易刺傷家族裡有亂倫、性暴力、非婚生子等傷痕的人。講台上不要細說創世記第 38 章的細節，不要開玩笑，也不要說「她瑪很厲害」。要說清楚猶大承認自己的不義，受虧待的是她瑪。會後若有人因此想起家中的傷害，請私訊同工或小組長，不追問細節、不要求原諒，必要時協助尋求專業協助；也讓他知道，神的恩典比家史更大。"}, {"id": "ISS04_6", "t": "「耶和華使她懷孕」：在摩押多年沒有孩子之後，這句話對今天不孕的夫妻說甚麼？", "r": "4:13；1:4--5；創 29:31；30:1--2、22；撒上 1:5--6；路 1:6--7；詩 113:9", "ch": [4, 1], "why": "這是全卷最需要溫柔的一題。路得嫁給瑪倫後，一家在摩押「住了約有十年」（1:4），經文沒有提到孩子；嫁給波阿斯之後，「耶和華使她懷孕」。講台若興奮地說「神會打開你的子宮，只要你像路得一樣忠心」，台下每一對長年不孕的夫妻都會被刺一刀：那我們為甚麼還沒有？是不是不夠忠心？若乾脆不講，又錯過了敘述者在全卷只親口說了兩次神做了甚麼、這是其中一次。這一題要講出神的作為，也要保護正在等候的人。", "pos": [["【一】經文問的是甚麼", "", "<p>經文說：「於是，波阿斯娶了路得為妻，與她同房。耶和華使她懷孕生了一個兒子」（4:13）。原文 וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן，直譯「耶和華給了她懷孕」。全卷敘述者親口說神做了甚麼，只有兩次：1:6「耶和華眷顧自己的百姓，賜糧食與他們」，和這一句——<strong>一頭一尾，給了糧食，給了生命。<\/strong><\/p><p>路得在摩押住了約十年（1:4），經文沒有說她有孩子。所以問題是：<strong>這句話是給今天不孕夫妻的應許嗎？如果不是，它對他們說甚麼？<\/strong><\/p>"], ["應許說（神必使忠心的人懷孕）", "", "<p>主張：路得忠心，神就使她懷孕；聖經中撒拉、利百加、拉結、哈拿、伊利莎白都是如此。今天不孕的夫妻只要有信心、繼續禱告，神也必照樣成就。<\/p><p><strong>難處：<\/strong>聖經從來沒有把懷孕當作忠心的報酬。伊利莎白和撒迦利亞「在神面前都是義人……只是沒有孩子」（路 1:6--7）；可見不孕不是不義的記號。把路得的故事變成公式，等於說還沒有孩子的人不夠忠心，這是講台絕不可說的話。<\/p>"], ["主權說（生命在神手中）", "", "<p>主張：這句話的重點不是路得配得，而是生命出於神。雅各對拉結說：「叫你不生育的是神，我豈能代替他作主呢？」（創 30:2）孩子是神的賜予，不是人的成就，也不是人的功勞。<\/p><p><strong>難處：<\/strong>這一說若講得太冷，會讓受苦的夫妻覺得神在「不給」；需要同時講出神看見他們的眼淚，像祂「顧念拉結，應允了她」（創 30:22），也像祂聽了哈拿的禱告。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：4:13 說的是神的作為，不是對每一對夫妻的應許，也不是忠心的報酬。<\/strong>它告訴我們生命出於神；它也告訴我們，這位神在路得在摩押那些空空的日子裡並沒有離開她。<\/p><p>所以這句話對不孕的夫妻說的，不是「你們再忠心一點就會有」，而是：<strong>你們的等候，神看見；你們的眼淚，神記得；你們的價值，不在有沒有孩子。<\/strong>不論神最後給的是孩子，還是另一種的填滿，路得記的結局都是同一句：「耶和華是應當稱頌的！因為今日沒有撇下你」（4:14）。<\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你正在等候一個孩子，這一節不是審判你的經文，也不是逼你再努力一點的經文。神沒有因為你還沒有孩子，就少愛你一點。<strong>祂不撇下拿俄米，也不撇下你。<\/strong>你可以把盼望和眼淚一起帶到祂面前；你也可以接受醫療的幫助，那不是沒有信心。<\/p>"]], "con": [], "say": "本講義的立場：「耶和華使她懷孕」是全卷敘述者親口記下的兩次神的作為之一，說明生命出於神；但它不是對每一對夫妻的應許，也不是忠心的報酬。不孕不是審判（路 1:6--7）；神看見等候者的眼淚，祂沒有撇下他們。", "care": "這一題最容易刺傷長年不孕的夫妻、經歷流產或死產的人、以及選擇或被迫不能生育的人。講台上不要說「只要有信心就會懷孕」，不要在台上宣告「今年某某會得孩子」，也不要問「你們怎麼還沒有」。母親節、兒童奉獻禮的時候尤其要小心。會後若有人流淚，請私訊同工或小組長單獨關心，不追問細節，不對正在流淚的人說「你要有信心」，必要時協助尋求醫療與心理的專業協助。"}, {"id": "ISS04_7", "t": "「有這兒婦比有七個兒子還好」：這句話對華人傳宗接代的觀念說甚麼？", "r": "4:15、14、17；撒上 1:8；撒上 2:5；賽 56:3--5；約 1:12--13", "ch": [4, 1], "why": "在台灣、馬來西亞、新加坡、中國的華人家庭裡，「傳宗接代」「延續香火」至今仍是很重的壓力：沒有兒子的媳婦被婆家冷落，只有女兒的夫妻被親戚追問，不婚不生的子女被說成不孝。路得記第 4 章講「存留死人的名」「生了一個兒子」，很容易被講成支持這套觀念的經文。可是婦人們在同一段裡說了一句在古代社會、也在今天的華人社會都極不尋常的話。講台若漏了這一句，就等於用路得記去加重傳宗接代的壓力，正是講台最要避免的事。", "pos": [["【一】經文問的是甚麼", "", "<p>婦人們對拿俄米說：「他必提起你的精神，奉養你的老，因為是愛慕你的那兒婦所生的。有這兒婦比有七個兒子還好！」（4:15）「七個兒子」在古代是完滿的祝福，哈拿的歌說「不生育的，生了七個兒子」（撒上 2:5）。<\/p><p>這一句的主語很清楚：比七個兒子還好的，不是剛出生的那個男孩，是路得——一個外邦人、一個媳婦、一個女人。「愛慕你」原文 אֲהֵבַתֶךְ，這是全卷唯一一次出現「愛」這個字。所以問題是：<strong>這句話對「一定要有兒子」的觀念說了甚麼？<\/strong><\/p>"], ["強化說（經文的高潮仍是生兒子）", "", "<p>主張：全章的結局是「生了一個兒子」（4:13），婦人們歡呼的也是孩子（4:17），存留名字靠的就是兒子；所以路得記仍然肯定兒子的重要，只是順帶稱讚了媳婦。<\/p><p><strong>難處：<\/strong>這忽略了 4:15 的句子結構：孩子之所以寶貴，「因為是愛慕你的那兒婦所生的」；而婦人們給出的比較是「這兒婦」勝過「七個兒子」。經文在最肯定兒子的時代，把一個女人放在七個兒子之上。<\/p>"], ["翻轉說（愛比血統更重要）", "", "<p>主張：在一個以兒子為一切的社會裡，婦人們說出一句顛覆的話：一個愛你的媳婦，勝過一個家族所能想像最完滿的兒子數目。拿俄米得到的「填滿」，首先是路得的愛，然後才是孩子。這也呼應以利加拿對哈拿說的：「有我不比十個兒子還好嗎？」（撒上 1:8）<\/p><p><strong>難處：<\/strong>這個讀法要小心不要走到另一個極端，好像經文看不起兒子或家庭的延續；神確實藉著這個孩子延續了家譜，直到大衛。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採翻轉說。路得記肯定神延續了這個家，但它把最高的評價給了一個外邦媳婦的愛：「有這兒婦比有七個兒子還好」。<\/strong>這句話必須在講台上被講出來，用來對抗重男輕女與傳宗接代的壓力。<\/p><p>「存留死人的名」在路得記是一個家族在律法裡的盼望，不是今天每一個家庭的義務。以賽亞說，神要使持守祂約的太監「有記念，有名號，比有兒女的更美」（賽 56:5）。<strong>在神的家裡，名字不是靠血統存留，是靠恩典記念。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>如果你只有女兒，如果你沒有孩子，如果你因為沒有生兒子被家人看輕，請把 4:15 讀給自己聽。<strong>在神眼中，你的家沒有欠缺；愛，比七個兒子還好。<\/strong>你的名字不是靠後代存留的，「凡接待他的，就是信他名的人，他就賜他們權柄作神的兒女」（約 1:12）。<\/p>"]], "con": [], "say": "本講義的立場：4:15「有這兒婦比有七個兒子還好」把最高的評價給了一個外邦媳婦的愛，必須講出來，對抗重男輕女與傳宗接代的壓力。「存留死人的名」是古代家族在律法裡的盼望，不是今天每個家庭的義務；在神的家裡，名字靠恩典記念（賽 56:5）。", "care": "這一題最容易刺傷因沒有生兒子而被婆家冷落的媳婦、只有女兒的夫妻、不孕的夫妻、選擇不婚的人，以及被親戚追問「香火」的獨生子女。講台上不要說「神一定會給你一個兒子」，也不要拿某個家庭的孩子數目開玩笑。農曆新年、家族聚會前後講這一段時尤其要小心。會後若有人哭著說「婆婆一直嫌我」，請私訊同工或小組長陪她，必要時與她一起思想怎樣溫和地回應家人。"}, {"id": "ISS04_8", "t": "「拿俄米得孩子了」：俄備得算誰的兒子？", "r": "4:16--17、10、14、21；申 25:6", "ch": [4, 1], "why": "讀到 4:17，許多人會覺得奇怪：孩子明明是路得生的、波阿斯是父親，鄰舍的婦人卻說「拿俄米得孩子了」；4:10 波阿斯說是為瑪倫存留名字，4:21 家譜又說「波阿斯生俄備得」。那俄備得到底算誰的？有些講台把這一句講成「孩子屬於婆婆」，在華人婆媳關係裡，這很容易被拿來要求媳婦把孩子交給婆家；另一些講台乾脆跳過。這一題要說清楚，經文在這個稱呼裡要表達的是甚麼。", "pos": [["【一】經文問的是甚麼", "", "<p>經文說：「拿俄米就把孩子抱在懷中，作他的養母」（4:16）；「鄰舍的婦人說：『拿俄米得孩子了！』就給孩子起名叫俄備得」（4:17）。「養母」原文 לְאֹמֶֽנֶת（le’omenet），是撫養、照顧者的意思，這個字本身不帶收養的法律含義。「得孩子了」原文直譯是「一個兒子為拿俄米生了」。<\/p><p>同時，4:10 說這是為了「在死人的產業上存留他的名」，4:21 說「波阿斯生俄備得」。所以問題是：<strong>俄備得在法律上、家庭上、家譜上，各算誰的兒子？<\/strong><\/p>"], ["法律繼承說（瑪倫的後嗣）", "", "<p>主張：照申命記的精神，「婦人生的長子必歸死兄的名下」（申 25:6），俄備得在法律上承受以利米勒與瑪倫的產業；所以婦人們說「拿俄米得孩子了」，因為以利米勒的家有了繼承人。<\/p><p><strong>難處：<\/strong>家譜明說「波阿斯生俄備得」（4:21），馬太也說「波阿斯從路得氏生俄備得」（太 1:5），並沒有把他算在瑪倫名下。可見法律繼承不是唯一的說法。<\/p>"], ["收養說（拿俄米正式收養）", "", "<p>主張：把孩子抱在懷中，在古代近東可能是收養的動作；所以俄備得成了拿俄米的兒子。<\/p><p><strong>難處：<\/strong>「養母」一詞多指撫養者、保姆，不一定是法律上的收養；經文也沒有說路得把孩子交出去。若讀成收養，容易被用來支持「孩子歸婆家」的觀念。<\/p>"], ["多重歸屬說（一個孩子填滿了每一個人）", "", "<p>主張：俄備得是波阿斯與路得的兒子（4:13、21），在產業上為以利米勒的家存留名字（4:10），在情感上成為拿俄米的安慰與奉養（4:15--16）。婦人們的歡呼不是法律聲明，是對拿俄米的回應：那個說「沒有丈夫，也沒有兒子」的人，現在懷裡抱著一個孩子。<\/p><p><strong>難處：<\/strong>這個讀法需要講者同時講幾層意思，講得不清楚就會變得含糊。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採多重歸屬說。俄備得是波阿斯與路得的兒子，為以利米勒的家存留了名字，也成了拿俄米的安慰。<\/strong>「拿俄米得孩子了」是全卷「空」到「滿」的最後一筆：1:5「剩下拿俄米，沒有丈夫，也沒有兒子」，到 4:16 她把孩子抱在懷中。<\/p><p>這不是在說孩子屬於婆婆，更不是要媳婦把孩子交出去；路得始終是孩子的母親。<strong>這是在說：神用一個孩子，回答了一個老寡婦在第 1 章說出的哀歌。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>拿俄米在第 1 章說「耶和華使我空空地回來」，經文沒有責備她；到第 4 章，神用一個嬰孩回應她。<strong>神可能不照你想的方式填滿你，但祂聽見了你的哀歌。<\/strong>你的空，不是故事的結尾。<\/p>"]], "con": [], "say": "本講義的立場：俄備得是波阿斯與路得的兒子（4:13、21），在產業上為以利米勒的家存留名字（4:10），在情感上成為拿俄米的安慰；「拿俄米得孩子了」是對 1:5 哀歌的回應，不是說孩子歸婆婆，也不可用來要求媳婦把孩子交給婆家。", "care": "這一題要顧到婆媳之間為孩子的教養、照顧權而有衝突的家庭，也要顧到隔代教養的祖父母、因工作把孩子交給長輩帶的父母。講台上不要說「孩子本來就是婆婆的」，也不要指責長輩「搶孩子」。同時要顧到失去孫子女、或兒女不肯讓自己見孫子的長者。會後若有人談到家中的拉扯，請私訊同工或小組長，先分別聽兩邊的心，不急著判誰對誰錯。"}, {"id": "ISS04_9", "t": "家譜為甚麼從法勒斯算起？馬太福音為甚麼加上路得的名字？", "r": "4:18--22、12、17；創 38:29；代上 2:4--15；太 1:3--6；路 3:32--33；士 21:25", "ch": [4, 1], "why": "很多人讀到路得記最後五節就停下來了：一串名字，好像和前面的故事沒有關係。也有人覺得奇怪：家譜為甚麼不從猶大、也不從亞伯拉罕算起，偏偏從法勒斯開始？為甚麼這份家譜裡沒有路得、沒有拿俄米？到了新約，馬太又把路得的名字加回去。講台若跳過家譜，就錯過了全卷的結局；若把家譜拿來推算年代或數字，又違反了不算日子的原則。這一題要讀出家譜自己的信息。", "pos": [["【一】經文問的是甚麼", "", "<p>經文說：「法勒斯的後代記在下面：法勒斯生希斯崙」（4:18），一直到「俄備得生耶西；耶西生大衛」（4:22）。「後代」原文 תּוֹלְדוֹת（toledot），是創世記用來分段的關鍵字。從法勒斯到大衛共十代，波阿斯在第七位，大衛在第十位。<\/p><p>這份家譜只有男人的名字。可是馬太福音說：「撒門從喇合氏生波阿斯；波阿斯從路得氏生俄備得」（太 1:5），又加上「猶大從她瑪氏生法勒斯和謝拉」（太 1:3）。所以問題是：<strong>家譜為甚麼從法勒斯算起？馬太為甚麼要加上這些女人的名字？<\/strong><\/p>"], ["族系紀錄說（只是大衛的祖先資料）", "", "<p>主張：這是猶大支派、大衛家族的官方族譜，和歷代志上第 2 章一致（代上 2:4--15）；從法勒斯開始，因為伯利恆這一支猶大人是法勒斯的後代，伯利恆的族系由他而出。<\/p><p><strong>難處：<\/strong>這說明了資料的來源，卻沒有說明為甚麼要放在路得記的結尾。作者若只要記錄族系，不必在 4:12 讓眾人先提起法勒斯與她瑪。<\/p>"], ["神學收尾說（從被虧待的家到王）", "", "<p>主張：4:12 的祝福「像她瑪從猶大所生法勒斯的家一般」在 4:18 立刻應驗：家譜從法勒斯算起，正是因為法勒斯的家起於一個被虧待、幾乎絕後的寡婦。家譜在大衛結束，回答了路得記的最後一句：「那時，以色列中沒有王，各人任意而行」（士 21:25）。馬太加上她瑪、喇合、路得，是要說明彌賽亞的家譜裡，一直都有神對外人與受苦者的恩典。<\/p><p><strong>難處：<\/strong>要小心不要從「十代」推算任何年代或數字，也不要把每一個名字都講出屬靈意思；家譜的信息在整體的方向，不在數字的密碼。<\/p>"], ["【三】本講義站在哪裡", "", "<p><strong>本講義的判斷：採神學收尾說。家譜從法勒斯算起，回應了城門前的祝福；在大衛結束，回答了路得記「沒有王」的年代。<\/strong>一個摩押寡婦的捨己，被神放進了王的家譜。<\/p><p>路得記自己的家譜沒有寫路得的名字，但讀到這裡的人都知道她在哪裡；<strong>馬太把她的名字寫了回去，這是新約自己作過的連結，講台可以放心說：一個摩押寡婦，在彌賽亞的家譜裡。<\/strong><\/p>"], ["【四】這件事該不該影響你的信心", "", "<p>你可能覺得自己的一生只是一個不起眼的名字，甚至連名字都不會被寫下來。路得記的家譜告訴你：<strong>神在寫一個比你看得見更長的故事，而你的忠心，在祂的家譜裡有位置。<\/strong>拾穗的外邦寡婦沒有想到大衛，更沒有想到基督；神卻記得她。<\/p>"]], "con": [], "say": "本講義的立場：家譜從法勒斯算起，回應 4:12 的祝福——法勒斯的家起於一個被虧待的寡婦；在大衛結束，回答士 21:25「沒有王」。馬太加上她瑪、喇合、路得的名字（太 1:3--5），是新約自己作過的連結：外人與受苦者都在彌賽亞的家譜裡。不從「十代」推算任何數字。", "care": "這一題要顧到不知道自己家譜、被收養、在原生家庭中被除名、或家族史令人羞恥的人：講台若只稱讚「名門之後」，他們會覺得自己沒有份。也要顧到第一代信主、家中無人信主的人。講的時候要強調，神的家譜收納了外人與受苦者。會後若有人提到身世的傷痛，請私訊同工或小組長，陪他讀太 1:5，讓他知道在神的家裡他有名字。"}], "terrain": {"points": [[1.0, 22, 0, "國中遭遇饑荒", null], [1.143, 4, 0, "剩下拿俄米，沒有丈夫，也沒有兒子", "bot"], [1.536, 64, 0, "你的神就是我的神", null], [1.714, 8, 0, "耶和華使我空空地回來", "bot"], [1.857, 38, 0, "恰巧到了", null], [2.179, 70, 0, "投靠耶和華－以色列神的翅膀下", null], [2.464, 80, 0, "是一個至近的親屬", "top"], [2.893, 76, 0, "求你用你的衣襟遮蓋我", null], [3.214, 66, 0, "那人今日不辦成這事必不休息", null], [3.429, 42, 0, "我不能贖了", null], [3.714, 92, 0, "今日沒有撇下你", null], [3.821, 99, 0, "耶西是大衛的父", "top"]]}, "tracks": [{"gk": "גָּאַל", "tr": "ga’al", "gl": "至近的親屬、贖、盡親屬的本分", "code": "H1350", "root": "√גאל（贖回、取回）", "ins": "全卷最重要的一個字。גָּאַל 是「把失去的取回來」：家族裡有人窮乏賣了地，至近的親屬要把地贖回（利 25:25）；有人死了沒有後代，要有人為他存留名字。這個字族在全卷出現二十三次，集中在第 2 章末到第 4 章。它的路線有兩個翻轉：有權贖的那一位，一聽到要付代價，就說「我不能贖了」（4:6）；最後被婦人們稱為「至近的親屬」的，竟是那個剛出生的嬰孩（4:14）。贖回的人不是最有權利的人，是最肯付代價的人。", "stops": [["2:20", "是一個至近的親屬", "top"], ["3:9", "因為你是我一個至近的親屬", ""], ["3:12", "只是還有一個人比我更近", ""], ["3:13", "我必為你盡了本分", ""], ["4:4", "我肯贖", ""], ["4:6", "我不能贖了", "bot"], ["4:14", "今日沒有撇下你，使你無至近的親屬", "top"]]}, {"gk": "שׁוּב", "tr": "shuv", "gl": "歸回、回去、回來", "code": "H7725", "root": "√שוב（轉回）", "ins": "第 1 章的一個字：十三節裡出現了十五次。拿俄米「要從摩押地歸回」，又三次叫兩個兒婦「回去」；俄珥巴回去了，路得說「不要催我回去」。拿俄米自己回來了，卻說「耶和華使我空空地回來」（1:21）——身體回來了，心沒有回來。這個字最後一次出現在 4:15，婦人們說那孩子「必提起你的精神」，原文是「使你的生命歸回的」。拿俄米的腳在第 1 章回到伯利恆，她的生命到第 4 章才回到神那裡。", "stops": [["1:6", "要從摩押地歸回", ""], ["1:8", "你們各人回娘家去吧", ""], ["1:15", "你嫂子已經回她本國和她所拜的神那裡去了", "bot"], ["1:16", "不要催我回去不跟隨你", "top"], ["1:21", "耶和華使我空空地回來", "bot"], ["1:22", "從摩押地回來到伯利恆", ""], ["4:15", "他必提起你的精神", "top"]]}, {"gk": "רֵיקָם", "tr": "reqam", "gl": "空空地、空手（對照：滿、吃飽）", "code": "H7387", "root": "√ריק（空）", "ins": "「空」字在全卷只出現兩次，兩次都很重。第一次是拿俄米：「我滿滿地出去，耶和華使我空空地回來。」（1:21）第二次是波阿斯：「你不可空手回去見你的婆婆。」（3:17）同一個字，第一次是控訴，第二次是回答。兩次之間，全卷一路在「填」：願你滿得他的賞賜（2:12）、她吃飽了還有餘剩（2:14）、把剩下的帶回給婆婆（2:18）。到了 4:15，婦人們說這個媳婦「比有七個兒子還好」。神填滿拿俄米的方法，是一個人一次又一次的慈愛。", "stops": [["1:21", "我滿滿地出去，耶和華使我空空地回來", "bot"], ["2:12", "願你滿得他的賞賜", ""], ["2:14", "她吃飽了，還有餘剩的", ""], ["2:18", "又把她吃飽了所剩的給了婆婆", ""], ["3:17", "你不可空手回去見你的婆婆", "top"], ["4:15", "有這兒婦比有七個兒子還好", "top"]]}, {"gk": "חֶסֶד", "tr": "chesed", "gl": "恩待、慈愛、恩（對照：חֵן 蒙恩）", "code": "H2617", "root": "√חסד（立約的忠誠慈愛）", "ins": "חֶסֶד 是舊約最難翻譯的字之一：不是一時的好心，是對有關係的人持續不放手的忠誠。全卷三次，每次都換了一個主詞。拿俄米求神「恩待你們，像你們恩待已死的人與我一樣」（1:8）——求神照人的樣子待人；拿俄米說那人「不斷地恩待活人死人」（2:20）——原文的「他」可以是耶和華，也可以是波阿斯；波阿斯對路得說「你末後的恩比先前更大」（3:10）——最後被稱讚有慈愛的，是那個外邦人。中間穿插路得三次求「蒙恩」（חֵן，2:2、10、13）。在路得記，神的慈愛是在人的慈愛裡被看見的。", "stops": [["1:8", "像你們恩待已死的人與我一樣", ""], ["2:2", "我蒙誰的恩", ""], ["2:10", "怎麼蒙你的恩", ""], ["2:13", "願在你眼前蒙恩", ""], ["2:20", "因為他不斷地恩待活人死人", "top"], ["3:10", "你末後的恩比先前更大", "top"]]}, {"gk": "כָּנָף", "tr": "kanaf", "gl": "翅膀、衣襟（對照：平安、安身之處、休息）", "code": "H3671", "root": "√כנף（翼、衣角）", "ins": "全卷的珍珠。中文的「翅膀」和「衣襟」，原文是同一個字 כָּנָף。波阿斯為路得禱告，願她「投靠耶和華－以色列神的翅膀下」（2:12）；路得在打穀場對他說：「求你用你的衣襟遮蓋我」（3:9）——那就請你用你的「翅膀」遮蓋我。神回答這個禱告的方法，是差那個禱告的人自己去。這條線也連著「安息」：拿俄米在 1:9 求神讓兒婦「得平安」（מְנוּחָה），在 3:1 要親手為路得「找個安身之處」（מָנוֹחַ）；最後波阿斯「今日不辦成這事必不休息」（3:18）——路得記的「太平」只到基甸為止，在路得記，是那位贖回的人不肯休息，好叫別人得安息。", "stops": [["1:9", "願耶和華使你們各在新夫家中得平安", ""], ["2:12", "你來投靠耶和華－以色列神的翅膀下", "top"], ["3:1", "我不當為你找個安身之處", ""], ["3:9", "求你用你的衣襟遮蓋我", "top"], ["3:18", "那人今日不辦成這事必不休息", ""]]}], "lesson": {"1": {"no": 1, "vol": "《321路得記講義》第一課·路得記第一章", "title": "一個字的改名——饑、別、歸", "chars": 5204, "min": 60, "deep": 8, "dchars": 1984, "tchars": 733, "blocks": [["h", "一、戶政事務所的窗口"], ["p", "弟兄姊妹平安。請大家想像一個畫面。星期一早上，戶政事務所剛開門，抽號碼牌的機器嗶了一聲。一位六十多歲的婦人坐在等候區，手裡捏著一張表格，填了又塗，塗了又填。輪到她了，她走到窗口，把身分證和表格一起推進去。"], ["p", "承辦的年輕人看了一眼，抬起頭說：「阿姨，您要改名？」她點點頭。「原來的名字很好聽啊，是『甜』的意思。新的名字要寫甚麼？」她停了很久，才說出一個字：「苦。」那個年輕人愣住了，手停在鍵盤上，不知道該不該打下去。"], ["p", "當然，現實裡沒有人會真的去改這樣的名字。可是在心裡，我們很多人早就改過了。一場病、一次離婚、一通深夜的電話、一座又一座的墳，我們沒有去戶政事務所，卻在心裡把自己的名字從「甜」改成了「苦」。別人還照舊叫我們的名字，我們心裡卻在說：那不是我了。"], ["p", "路得記第一章，就有一個人站在這樣的窗口。她回到家鄉，合城的人都出來看，婦女們問：「這是拿俄米嗎？」（1:19）她回答：「不要叫我拿俄米，要叫我瑪拉，因為全能者使我受了大苦。」（1:20）拿俄米的意思是「甜」，瑪拉的意思是「苦」。這一課只改一個字，可是整章的路都在這一個字裡。這一課的三個詞是饑、別、歸：一場在糧食之家發生的饑荒，一次在路口的告別，和一趟兩手空空、卻是往神那裡去的歸回。"], ["d", ["我的心裡也早就把自己改名叫「苦」了，可是在教會裡大家都要我看起來很好，我是不是只能繼續假裝？", "不必假裝。請注意，拿俄米是當著全城婦女的面，把「苦」說出來的，經文沒有記下任何人糾正她，也沒有記下神責備她。教會若是神的家，就應該是一個可以說真話的地方。你可以先找一個安全的人，也許是一位小組長，也許是一位信得過的屬靈長輩，對他說一句：「我最近其實很苦。」不必講完全部，只說這一句就好。也可以直接對神說，詩篇有一整類的詩，就是人把苦對神說出來。假裝會把苦關在裡面；說出來，苦才有地方去。神不怕聽見你心裡的新名字，祂要做的，是在後面的日子裡，親自把你的名字改回來。"]], ["h", "二、原文亮光：歸回、捨不得、空空地"], ["p", "這一章有三個希伯來字，認得了，整章的骨架就站起來了。第一個字是 שׁוּב（shuv），「歸回、回去、回來」。這個字在第一章出現了十二次，是全章的主旋律。第六節拿俄米「要從摩押地歸回」；接下來她三次對兒婦說「回去吧」（1:8、11、12）；第十五節拿俄米說俄珥巴「回她本國和她所拜的神那裡去了」；第十六節路得說「不要催我回去」；第二十一節拿俄米說「耶和華使我空空地回來」。"], ["p", "同一個字，方向卻不一樣。有人回娘家，有人回到別神那裡，有人回到伯利恆。這一章問的不是「你回不回去」，是「你往哪裡回去」。人生走到盡頭的時候，每一個人都會往某個地方回，有人回到過去，有人回到自己，有人回到神那裡。"], ["p", "第二個字在第十四節：「只是路得捨不得拿俄米」。「捨不得」原文是 דָּבַק（davaq），意思是黏住、緊緊貼住。這個字我們在創世記讀過：「人要離開父母，與妻子連合」（創 2:24），「連合」就是這個字。路得對拿俄米的委身，用的是聖經形容婚約的字。俄珥巴「親嘴」，那是告別的禮節；路得「黏住」，那是一輩子的決定。兩個人都愛拿俄米，只是一個說再見，一個不肯放手。"], ["p", "第三個字在第二十一節：「耶和華使我空空地回來」。「空空地」原文是 רֵיקָם（reqam），兩手空空、甚麼也沒帶回來。這個字在全卷只出現兩次，第二次在第三章，波阿斯說：「你不可空手回去見你的婆婆。」（3:17）同一個字。拿俄米說神使她空空地回來，到了第三章，有人不讓她的家再空手。現在先把這一筆記在心裡：第一章的「空」，不是這本書的最後一個字。"], ["d", ["拿俄米說「耶和華降禍與我」，我讀到別的譯本好像意思不太一樣，到底原文是甚麼意思？", "這是一個很好的觀察。第二十一節「耶和華降禍與我」，希伯來原文是 עָנָה בִי（anah vi），最直接的讀法是「作見證攻擊我」，好像神在法庭上站出來作對她不利的證人；英文 WEB 譯本就譯作「has testified against me」。和合本的譯法比較接近古代希臘文譯本「使我降卑」一類的讀法。兩種讀法都有根據，意思方向一致：拿俄米覺得神站在她的對面。可是請注意，她仍然稱神為「耶和華」，仍然對著神說話。一個人會說「神在作見證攻擊我」，表示她還相信神在場、神在看。哀歌本身，就是一種沒有放手的信心。"]], ["h", "三、饑與別：糧食之家的饑荒，和三次「回去吧」"], ["p", "第一節一開口，就把我們放回一個很黑的年代：「當士師秉政的時候，國中遭遇饑荒。」（1:1）我們剛讀完路得記，那是「各人任意而行」的年代。路得記沒有帶我們離開那個年代，它帶我們走進同一個年代裡的一個小家。"], ["p", "饑荒發生在哪裡？「在猶大的伯利恆」。伯利恆 בֵּית לֶחֶם（beit lechem）的意思是「糧食之家」。糧食之家，沒有糧食了。這個家的男主人叫以利米勒 אֱלִימֶלֶךְ（elimelekh），意思是「我的神是王」。在一個沒有王的年代，有一個人的名字叫「我的神是王」，他卻帶著妻子和兩個兒子，離開了神的地，往摩押去寄居。"], ["p", "然後是三座墳。第三節以利米勒死了，第四節兩個兒子娶了摩押女子，住了約有十年，第五節兩個兒子也死了。經文用很短的句子講完十年，最後落在一句話：「剩下拿俄米，沒有丈夫，也沒有兒子。」（1:5）請注意，經文沒有說他們為甚麼死，沒有說「因為」。經文只寫下一個詞：「剩下」。很多人在喪禮之後，就是這兩個字。"], ["p", "轉機在第六節。全卷只有兩次，敘述者親口說出神做了甚麼，這是第一次：「她在摩押地聽見耶和華眷顧自己的百姓，賜糧食與他們。」（1:6）神沒有向拿俄米顯現，沒有異象，沒有聲音，只有一個消息從遠方傳來：伯利恆又有糧食了。很多回頭的路，就是從這樣一個不起眼的消息開始的。"], ["p", "於是三個寡婦上路了。走到一半，拿俄米停下來，對兩個媳婦說：「你們各人回娘家去吧。願耶和華恩待你們，像你們恩待已死的人與我一樣！」（1:8）「恩待」原文是 חֶסֶד（chesed），全卷的關鍵字之一，是立約裡忠心到底的愛。拿俄米求神照兩個媳婦對待她的樣子，去對待她們。她在最苦的時候，還在為別人求福。"], ["p", "她勸了三次。她說得很實際：「我還能生子作你們的丈夫嗎？」（1:11）在那個年代，一個沒有丈夫、沒有兒子的女人，在社會上幾乎沒有立足之地。拿俄米不是在趕人，她是在保護她們。她寧願自己一個人回去，也不要拖累兩個年輕人陪她一起空。"], ["p", "第十四節，兩個媳婦又放聲大哭。「俄珥巴與婆婆親嘴而別」。我們常常急著把俄珥巴講成反面人物，可是請看清楚：她是照著婆婆的勸告回去的，她哭了，她親了婆婆，她用了禮節好好告別。經文沒有一句責備她。她作了一個合理的選擇，而路得作了另一個不合理的選擇。"], ["d", ["俄珥巴回去以後怎麼樣了？她是不是就失去了神的祝福？", "經文沒有告訴我們，我們也不要替經文補寫。第十五節拿俄米說她「回她本國和她所拜的神那裡去了」，這句話是事實的陳述，讓我們看見回去的代價：回到摩押，也就是回到摩押的神那裡。這一點很重要，信仰的選擇從來不只是地理的選擇。可是經文對俄珥巴本人沒有下判語，她從此退出了故事。講台上最好的作法，是用她來照出路得選擇的重量，而不是拿她來嚇人。我們身邊也有很多照著合理的勸告、作了合理選擇的人，他們不是我們的敵人，是我們要繼續為他們禱告的人。"]], ["h", "四、歸：你的神就是我的神，和一首誠實的哀歌"], ["p", "拿俄米最後一次勸，這一次是對路得一個人：「你嫂子已經回她本國和她所拜的神那裡去了，你也跟著你嫂子回去吧！」（1:15）然後，一個摩押女子說出了舊約最美的一段話之一：「不要催我回去不跟隨你。你往哪裡去，我也往那裡去；你在哪裡住宿，我也在那裡住宿；你的國就是我的國，你的神就是我的神。」（1:16）"], ["p", "原文最後兩句短得驚人，只有四個字：עַמֵּךְ עַמִּי וֵאלֹהַיִךְ אֱלֹהָי，「你的百姓，我的百姓；你的神，我的神」。沒有動詞，沒有條件，沒有但書。請記得說這話的處境：拿俄米剛剛說完，她沒有兒子可以再給她，她的手是空的。路得不是跟隨一位有前途的婆婆，是跟隨一位空了的婆婆，和她的神。"], ["p", "所以這一節的重心，不在「媳婦應該怎樣對待婆婆」，在最後那一句：「你的神就是我的神」。這是一次主權的轉移。在摩押，人拜的是基抹；路得在路口把自己交給了耶和華。她還加上一個起誓：「除非死能使你我相離！不然，願耶和華重重地降罰與我。」（1:17）一個摩押女子，用以色列神的名起誓。她的信仰告白，第一次說出口，就是在一條看不見回報的路上。"], ["p", "然後是那個窗口。「於是二人同行，來到伯利恆。她們到了伯利恆，合城的人就都驚訝。」（1:19）「驚訝」這個字，是整座城都騷動起來。十年前出去的是一家四口，現在走回來的是兩個女人，一個老了，一個是外國人。婦女們問：「這是拿俄米嗎？」那不只是一個問題，是一聲認不出來的嘆息。"], ["p", "拿俄米的回答，就是那張改名的表格：「我滿滿地出去，耶和華使我空空地回來。耶和華降禍與我；全能者使我受苦。」（1:21）連同第二十節，她連續四次把苦說在神的名下。這是一首哀歌。我們要很小心，不要急著說她「信心不夠」。她沒有離開神，她是對著神哭；她沒有說「沒有神」，她說的是「神為甚麼這樣待我」。詩篇裡有一整類的詩就是這樣禱告的，主耶穌在十字架上也呼喊：「我的神！我的神！為什麼離棄我？」（可 15:34）"], ["p", "還有一個細節，讓人心疼。拿俄米說「空空地回來」的時候，路得就站在她旁邊。她看不見身邊這個人，就是神給她的第一份「滿」。苦會讓人的眼睛變窄，這不是罪，是傷。而神沒有因為她看不見，就收回祂的恩典。"], ["p", "經文怎樣回應她的哀歌？沒有責備，只有一句話，放在第一章最後：「拿俄米和她兒婦摩押女子路得，從摩押地回來到伯利恆，正是動手割大麥的時候。」（1:22）她說自己是空的，敘述者卻讓我們看見，田已經熟了。拿俄米的結論是「空」，神的時間表上寫的是「收割」。這就是這一章給每一位改過名的人的話：你可以誠實地說苦，神也比你的結論更大。"], ["d", ["路得說「你的神就是我的神」，那我嫁進一個信主的家庭，是不是也應該為了家人信主？", "路得的委身不是「因為嫁進這個家，所以跟著信」。請留意時間：她說這句話的時候，丈夫已經死了，婆婆正在勸她離開，她在這個家裡已經沒有任何名分上的義務。她是在可以走的時候選擇不走，在沒有人要求的時候選擇了神。所以這一節不是一個家庭規條，是一個人自己的信仰決定。如果你身在一個信主的家，家人最好的作法不是催逼，而是像拿俄米那樣誠實地活出她和神的關係，連苦也不隱藏。信仰可以在家裡被看見，卻不能被安排。真正的「你的神就是我的神」，要從你自己心裡說出來。"]], ["d", ["我失去親人以後也像拿俄米一樣，覺得神在攻擊我，這樣的禱告神會不會生氣？", "請先聽這一句：第一章的神沒有對拿俄米生氣。全章沒有一句神的責備，敘述者沒有，伯利恆的婦人也沒有。神給她的回應是第二十二節的大麥田，和後面三章一步一步的恩典。你對神說「我覺得你在攻擊我」，這本身就是一個禱告，因為你是在對祂說話，不是轉身離開。詩篇第八十八篇整首都是黑暗，最後一句還是黑暗，神仍然把它放在聖經裡。主耶穌在十字架上也用詩篇第二十二篇呼喊。你可以帶著這句話來，祂接得住。同時，請不要一個人扛，找一位信得過的人陪你，若是哀傷已經影響到睡眠、吃飯和日常生活很久了，也請尋求專業的哀傷輔導，這不是信心不夠。"]], ["h", "五、幾個必須認得的偏差"], ["p", "第一個偏差，是說以利米勒一家往摩押，所以三個男人都死了，是神的懲罰。經文沒有寫「因為」，只寫了「剩下」。主耶穌被問到生來瞎眼的人時說：「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）。這樣講，傷到的是每一位剛送走丈夫或孩子的弟兄姊妹。"], ["p", "第二個偏差，是把第十六節講成孝道條款：「媳婦就應該像路得一樣順從婆婆。」路得的話不是對婆婆的服從，而是對神的委身，她說這話時，婆婆正在叫她走。用這一節去要求媳婦，等於把一個人自由的信仰告白，變成另一個人手上的鞭子。"], ["p", "第三個偏差，是把俄珥巴講成反面人物，說她「愛世界、走回頭路」。她是照著拿俄米的勸告回去的，她哭了，也好好告別了。經文用她來照出路得選擇的重量，沒有用她來警告人。講台把她講壞，聽的人學會的是論斷，不是跟隨。"], ["p", "第四個偏差，是責備拿俄米的哀歌，說她「埋怨神」「太消極」，然後叫受苦的人「不要埋怨，要喜樂」。經文沒有一句責備她，第二十二節用大麥田回應她，到第四章，同一群婦人說：「耶和華是應當稱頌的！因為今日沒有撇下你」（4:14）。哀歌是信心的一種形式，神接得住。"], ["p", "第五個偏差，是用「摩押」來標籤人，好像某個民族天生比較低；或者反過來說，「既然路得都可以，申命記那條律法就不算數了」。申命記確實說「摩押人不可入耶和華的會」（申 23:3），這個難處要老實擺出來。可是經文一直稱她「摩押女子路得」，沒有抹掉她的出身；她被接納，是因為她說了「你的神就是我的神」。"], ["d", ["申命記明明說摩押人不可入耶和華的會，路得後來怎麼還能成為大衛的曾祖母？這不是聖經自相矛盾嗎？", "這是一個老問題，解經家大致有三種看法，我們並列出來。第一種，猶太拉比的傳統認為這條律法只禁摩押男子，因為申命記給的理由是「他們沒有拿食物和水在路上迎接你們」，那是男人的事；難處是「摩押人」在文法上通常指全民族。第二種，「入耶和華的會」指參與以色列公共集會與治理，不等於不能嫁給以色列人；難處是要和尼希米記的用法調和。第三種，路得是恩典勝過禁令的例外，也是一個預告，以賽亞後來說「與耶和華聯合的外邦人」不要以為自己被分別出去；難處是不可以推成律法不算數。本講義並列三說，不在細節上裁判，共同的落點是：路得不是以摩押人的身分被接納，而是以「你的神就是我的神」的身分被接納。詳見議題「「摩押人不可入耶和華的會」（申 23:3），摩押女子路得怎麼能成為大衛的曾祖母？」"]], ["h", "六、兩個華人處境的真實問題"], ["p", "第一個問題：沒有兒子，是不是就沒有依靠？很多華人長輩心裡都有拿俄米的那一句：「我還能生子作你們的丈夫嗎？」在重男輕女、傳宗接代的觀念裡，一位喪偶又沒有兒子的長者，常常覺得自己是「剩下」的。可是這本書最後，伯利恆的婦人們會對拿俄米說，路得「比有七個兒子還好」。全句是「有這兒婦比有七個兒子還好！」（4:15）神給拿俄米的依靠，不是一個兒子，是一個願意說「你在哪裡死，我也在那裡死」的外籍媳婦。教會要成為那些「剩下」的長者的家，長照與陪伴，本身就是福音。"], ["p", "第二個問題：我們怎樣看待嫁進來的外籍媳婦？在台灣、馬來西亞、新加坡，很多家庭裡都有來自別國的媳婦。她們常被叫作「外籍新娘」「外勞」，名字反而沒有人記得。路得記一直叫她「摩押女子路得」，有出身，也有名字。不要因為她的出身就把她當外人，也不要要求她假裝自己不是從那裡來的。也許你家裡那位口音不一樣的媳婦，正是神放在這個家裡，最肯陪你走到底的那一個人。"], ["d", ["我的婆婆一直說我不如她理想中的媳婦，路得記會不會反而讓她更有理由要求我？", "這正是為甚麼我們要小心讀第十六節。路得的話是她自己在路口作的選擇，不是婆婆對她的要求；而且拿俄米在整段對話裡做的，是勸媳婦離開、為媳婦求福，不是要求媳婦留下。如果有人拿路得記來壓你，你可以溫和地指出：拿俄米先說了「願耶和華恩待你們，像你們恩待已死的人與我一樣」，她先看見了媳婦的好。婆媳關係是雙向的。你可以在自己的本位上盡力去愛，但不需要背上「我必須成為路得」的重擔，那不是神給你的軛。若是家裡的要求已經變成長期的羞辱或控制，請私訊同工或小組長，不要一個人忍。"]], ["h", "七、活出321——在空的路口，說出你的神就是我的神"], ["p", "耶穌是我的榜樣：路得在一條看不見回報的路上，選擇不回頭。這使我們想起主耶穌的話：「若有人要跟從我，就當捨己，天天背起他的十字架來跟從我。」（路 9:23）主耶穌自己就是這樣走的，在客西馬尼祂說：「不要照我的意思，只要照你的意思。」（太 26:39）跟隨祂，常常不是走向一條更順的路，而是在路口決定，不論前面是甚麼，我都跟著祂。"], ["p", "聖經是我的準則：第一章沒有給我們一套「受苦時該怎麼說話」的公式，它給我們的是一個真實的例子：拿俄米說出了苦，經文沒有刪掉；俄珥巴回去，經文沒有詛咒；路得留下，經文沒有把她捧成英雄。讓聖經作準則，就是讓經文怎麼說就怎麼說，不替它加上我們的因果和判語。"], ["p", "聖靈是我的引導：第六節，拿俄米只是「聽見」耶和華眷顧祂的百姓。沒有異象，沒有聲音，一個消息就讓她起身。聖靈的引導常常就是這樣安靜：一句話、一個消息、一個想回家的念頭。用心靠聖靈，就是在最苦的時候，仍然願意聽見那一點點神的消息，並且起身。"], ["p", "讓耶穌作王：以利米勒的名字是「我的神是王」，可是在那個沒有王的年代，這個名字好像只剩下名字。到路得說「你的神就是我的神」，這句話才在一個外邦女子身上活出來。讓耶穌作王，不是在順境裡掛一個名，是在空的時候，仍然把自己交在祂手裡。"], ["p", "讓耶穌得著一切的榮耀：讀完第一章，我們很容易只記得「路得好偉大」。可是請看這一章的主詞：是耶和華眷顧祂的百姓，賜糧食與他們；收割季又正好在她們進城的時候開始——神就藏在這樣的時間裡。路得的委身是真的，但榮耀屬於那一位讓她有一個值得委身的對象的神。"], ["p", "建立屬神的體系：一個空了的婆婆，加上一個外邦的媳婦，這是全以色列最弱的一個家。可是神後來就從這個家，建立起大衛的家譜。屬神的體系不是從最強的人開始，是從兩個願意一起往神那裡走的人開始。這就是 235 裡的「2」，屬靈的同伴。教會的小組、陪伴長者的團隊，都可以從這樣的一對開始。"], ["d", ["我很想像路得那樣委身，可是我常常說完就做不到，這樣的委身還算數嗎？", "請先看看路得的委身是怎樣被保守的。第一章她說出了那段話，第二章她每天去田裡拾麥穗，一直到「收完了大麥和小麥」，委身是一天一天活出來的，不是說一次就完成了。所以你說完做不到，不代表那句話是假的，代表你正在一天一天學。更重要的是，我們的委身靠得住，不是因為我們很堅強，是因為那一位先委身於我們的主。保羅說：「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著」（加 2:20）。今天你可以作一件小事：在一天開始的時候，對主說一句「今天，你往哪裡去，我也往那裡去」，然後在這一天裡，找一個具體的地方去實踐它。"]], ["h", "八、四種心，都被帶回伯利恆"], ["p", "驕傲型的心，是那個讀完第一章就開始判斷的人：以利米勒不該去摩押，俄珥巴不夠屬靈，拿俄米太愛抱怨，這首哀歌唱得不對。他很會替經文下判語，卻很少問自己：如果是我站在那個路口，我會說甚麼？經文給他的是這一句：「與喜樂的人要同樂；與哀哭的人要同哭。」（羅 12:15）"], ["p", "恐懼型的心，是那個不敢作決定的人。他看見路得的路沒有保障，就想：萬一我跟了神，結果甚麼都沒有呢？請看第二十二節，她們進城的時候，正是動手割大麥的時候。路得作決定的時候看不見那片田，可是神早就把田預備好了。你不必先看見全部的路，才開始走第一步。"], ["p", "羞恥型的心，是那個覺得自己「空空地回來」很丟臉的人。當年風風光光地出去，如今兩手空空回到教會、回到家鄉，最怕的就是別人問：「這是你嗎？」請記得，拿俄米就是這樣回來的，神仍然讓她回來。伯利恆的門沒有關，收割已經開始。神歡迎回頭的人，從來不先看他手裡帶了多少。"], ["p", "受傷型的心，是那些真的失去了很多的人：失去配偶、失去孩子、失去健康，或是一直盼望卻沒有孩子。你可能像拿俄米一樣，覺得神伸手攻擊你。這一章沒有要你假裝不痛，也沒有說你受苦是因為你做錯了。神沒有對拿俄米生氣，祂在她看不見的地方，已經開始收割。你可以帶著你的傷，慢慢走回伯利恆。"], ["h", "九、這一週，你可以做的幾件事"], ["p", "這一課要交給你的，不是一份要你立刻變喜樂的清單，是一條從「苦」走回神那裡的路。以下五件事，請在散會前把時間、地點、名字填上。"], ["p", "第一，這一週找一個安靜的晚上，自己從頭讀一次路得記第一章，在第二十二節旁邊寫下一句：「我說自己是空的，神說正是收割的時候。」"], ["p", "第二，誠實地寫下你心裡的那個「新名字」：如果你也曾在心裡把自己改名，那個字是甚麼？寫下來，然後把它當作一句禱告，唸給神聽。"], ["p", "第三，找一位你身邊正在「剩下」的人，也許是剛喪偶的長輩，也許是獨自在異鄉的新住民，這一週打一通電話或去探望一次，只陪伴，不講道理。"], ["p", "第四，如果你家裡有一位從別處嫁進來、或從別國來的家人，這一週用她的名字叫她，並且問她一個關於她家鄉的問題，認真聽她說。"], ["p", "第五，在一天的開始，對主說一句：「你往哪裡去，我也往那裡去。」然後在這一天裡，找一個具體的地方去實踐它，晚上寫下那是甚麼。"], ["p", "然後我們一起把四句話說出來。請開口說，不要只在心裡默想。"], ["p", "我宣告：我可以對神說出我的苦，祂接得住我誠實的話。"], ["p", "我宣告：我說自己是空的，神卻已經在我看不見的地方預備了收割。"], ["p", "我宣告：不論前面有沒有保障，你的神就是我的神。"], ["p", "我宣告：我要成為別人身邊那一位不肯離開的人，陪他一起走回伯利恆。"], ["h", "十、結語"], ["p", "這一課從戶政事務所的窗口開始。那位婦人要把名字從「甜」改成「苦」。在路得記裡，拿俄米真的這樣做了，而神沒有跟她爭這個名字。祂沒有說「你不可以叫自己瑪拉」，祂只是在後面三章裡，一步一步地把她的名字改回來。到第四章，伯利恆的婦人說的是：「拿俄米得孩子了！」沒有人再叫她瑪拉。"], ["p", "所以這一課的焦點，不在路得有多偉大，也不在拿俄米說得對不對，而在那一位在饑荒裡眷顧祂百姓、在哀歌之後安排收割的神。祂沒有撇下拿俄米，也不會撇下你。主自己說過：「我總不撇下你，也不丟棄你。」（來 13:5）"], ["p", "我們一起低頭禱告。親愛的天父，謝謝你在糧食之家沒有糧食的時候，仍然眷顧你的百姓。我們當中有人心裡早已把名字改成了「苦」，求你接住我們誠實的話，不讓我們假裝。謝謝你在我們看不見的地方，已經預備了收割。求你給我們路得那樣的心，在空的路口說出「你的神就是我的神」；也求你安慰每一位正在「剩下」的人，讓他們在我們中間找到家。奉主耶穌基督的名禱告，阿們。"], ["h", "十一、小組討論分享：三個化"], ["p", "這一課的成敗，在今天有多少人誠實說出自己心裡的那個字，並且說出一位這一週要去陪伴的「剩下」的人的名字。以下三個化，請組長照次序帶。"], ["m", "帶領說明：本課主軸是「誠實的哀歌，與往神那裡去的歸回」。不判斷任何人的苦是不是神的懲罰，不追問喪親的細節。時間不夠時寧可縮短第一化，第二化不可省略。"], ["m", "優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"], ["s", "第一化｜內化成為觀念（約20分鐘）"], ["m", "目的：把「哀歌是信心的一種形式」「路得委身的是神，不只是婆婆」「神比我們的結論更大」三個觀念放進組員心裡。"], ["n", "1. ★ 你的名字是誰取的？有甚麼意思？用一句話說說你喜不喜歡它。"], ["n", "2. ★★ 俄珥巴親嘴而別，路得「捨不得」（原文是黏住）。用一句話說出這兩個選擇最大的差別在哪裡。"], ["n", "3. ★★★ 拿俄米說「耶和華使我空空地回來」，經文接著說「正是動手割大麥的時候」。你人生中有沒有一段時間，自己覺得是空的，後來才發現神其實已經在預備？說出大約是哪一年。"], ["n", "4. ★ 讀完這一章，你心裡浮現的是一位怎樣的神？用一個詞形容。"], ["m", "帶領提醒：第一題與第三題都可能碰到過世的親人或失落，讓組員慢慢講，不催促，不替他找「神的美意」。有人開始批評以利米勒或俄珥巴，就溫和地帶回「如果是我站在那個路口」。"], ["s", "第二化｜消化成為生命（約35分鐘·本課主軸）"], ["m", "目的：讓每個人誠實說出自己心裡的苦，聽見神在第二十二節的回應，並說出一個要往神那裡走的具體決定。"], ["t", "【看】看見自己"], ["n", "5. ★★★ 如果你心裡也曾把自己改名，那個字是甚麼？寫在紙上。不想說出來的人，可以只說「我有一個字」。"], ["t", "【聽】聽神說話"], ["n", "6. ★★ 全組慢慢讀第二十二節三遍：「從摩押地回來到伯利恆，正是動手割大麥的時候。」各說一句：哪幾個字最打中你？"], ["t", "【想】想通關卡"], ["n", "7. ★★★ 安靜一分鐘，問神：「是甚麼攔住我像路得一樣說『你的神就是我的神』？」是怕沒有保障、是過去的傷，還是覺得神在攻擊我？只說哪一種。"], ["t", "【講】說出口"], ["n", "8. ★★ 對旁邊一位說一句：「我願意把我的苦說給神聽。」或者說：「你往哪裡去，我也往那裡去。」只說一句。"], ["t", "【行】走一步"], ["n", "9. ★★★ 寫下這一週你要獨自對神說出那個字的時間和地點：星期幾、幾點、在哪裡。唸給組員聽，請他們下次問你。"], ["m", "帶領提醒：這一化很可能碰到喪偶、喪子、不孕、流產或長期無望感的組員。不追問細節，不要求他們立刻放下，不對正在流淚的人說「你要有信心」或「要喜樂」。會後請私訊單獨關心；若哀傷已經長期影響睡眠與生活，協助他尋求專業協助。"], ["s", "第三化｜轉化成為生活（約25分鐘）"], ["m", "目的：把這一課搬進這一週的行事曆和關係，讓我們成為別人身邊那一位不肯離開的人。"], ["n", "10. ★★★ 打開行事曆，定下這一週自己讀一次路得記第一章的時間：星期幾、幾點、在哪裡？"], ["n", "11. ★★ 你身邊有沒有一位從別處嫁進來、或從別國來的家人、同事或弟兄姊妹？說出她的名字，以及這一週你要問她的一個問題。"], ["n", "12. ★★ 想一位在你最空的時候沒有離開你的人。說出他的名字，以及這一週你要怎樣謝謝他。"], ["n", "13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、正在「剩下」的那一個人，也許是剛喪偶的長輩、獨居的鄰居，或在異鄉工作的移工。當場說出他的名字和這一週去陪他的日子；見面時不講道理，先陪他、聽他。"], ["n", "14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽，並把三句話寫出來。第一句，三千多年前有一位婦人失去了丈夫和兩個兒子，回到家鄉時說「不要叫我甜，要叫我苦」。第二句，她身邊有一位外國媳婦，在沒有任何保障的時候說「你的神就是我的神」，陪她回家，而她們進城時正好是收割的季節。第三句，我相信的神，接得住人最苦的話，也會在人看不見的地方預備收割。這一週講給一個人聽，下次回來說他的反應。"], ["m", "帶領提醒：要具體到時間、地點、人名，不收「我會找時間」。920 的陪伴不是去勸人信主，是去陪人；對方若正處在喪親的重擊、自傷念頭或長期無望之中，不要獨自處理，回來找組長或牧者。"], ["s", "收尾（5分鐘）"], ["p", "用五分鐘收尾。每人一句話：這一週哪一天，去陪伴哪一位「剩下」的人。只說名字和日子。"], ["p", "然後為三種人指名禱告：一位剛失去配偶或孩子的弟兄姊妹；一位從別國嫁進來、在家裡覺得自己是外人的姊妹；一位心裡已經把自己改名叫「苦」、卻還沒有說出口的人。"], ["p", "散會前確認紙上有三樣：那一個字、那一位要去陪伴的人、自己讀第一章的時間。下次帶著這張紙來。"]]}, "2": {"no": 2, "vol": "《321路得記講義》第二課·路得記第二章", "title": "一份恰巧的履歷——拾、恩、名", "chars": 5252, "min": 60, "deep": 8, "dchars": 1990, "tchars": 729, "blocks": [["h", "一、一份恰巧的履歷"], ["p", "弟兄姊妹平安。這一課一開始，請你先拿出一張紙和一支筆。我們平常寫的履歷，寫的是學歷、經歷、證照、得過甚麼獎，那是一份「我做到了甚麼」的履歷。今天請你寫另一份，題目叫作「恰巧」。請你回想，你這一生最重要的三次「恰巧」，是哪三次？"], ["p", "也許是你恰巧在那一年搬家，搬到一間教會的隔壁。也許是你恰巧錯過了一班車，在月台上遇見一位後來帶你信主的同學。也許是你恰巧被派到一個沒有人想去的部門，卻在那裡認識了你後來的另一半。請寫下年份、地點，和那一個人的名字。"], ["p", "寫完以後，請你看著這三行字，問自己一個問題：那時候，我知道神在裡面嗎？大部分的人會說：不知道。當時只覺得是巧合，是運氣，甚至是倒楣。很多年以後回頭看，才發現那三個「恰巧」連成了一條線，而那條線的另一頭，握在一位神的手裡。"], ["p", "路得記第二章，就是路得的履歷上第一個「恰巧」。第三節說：「她恰巧到了以利米勒本族的人波阿斯那塊田裡。」（2:3）一個外邦寡婦，為了糊口去拾麥穗，她不認識任何人，也不知道哪塊田是誰的，她走進去的那一塊，恰巧就是她婆家的親族。這一課的三個詞是拾、恩、名：一個彎腰拾穗的人，一場比律法更多的恩典，和一個讓拿俄米重新抬頭的名字。"], ["d", ["我寫不出三次「恰巧」，回想起來我的人生好像只有一連串的不順利，神是不是根本沒有在我身上做工？", "請不要因為寫不出來就定自己的罪。路得在第二章的早上，也寫不出任何一次「恰巧」，她只知道家裡沒有糧食，婆婆說自己是空的，她得出去拾穗。她是在當天晚上，聽見拿俄米說「那是我們本族的人」，才知道自己白天走進的是哪一塊田。有些「恰巧」要等很多年才看得懂，有些要等到見主面的那一天。你可以把題目換一個問法：「這一連串的不順利裡，有沒有一個人、一句話、一頓飯，讓我撐過了那一天？」那常常就是神藏起來的手。寫不出來也沒有關係，你可以先寫一句禱告：「主啊，求你讓我看見你在哪裡。」"]], ["h", "二、原文亮光：恰巧、蒙恩、翅膀"], ["p", "這一章有三個希伯來詞，認得了，整章的骨架就站起來了。第一個在第三節：「她恰巧到了」，原文是 וַיִּקֶר מִקְרֶהָ（vayyiqer miqreha），直譯是「她的機遇遇上了」。名詞 מִקְרֶה（miqreh）在撒母耳記上第六章，非利士人用來說「是我們偶然遇見的」（撒上 6:9）。從人的角度看，這就是偶然，就是運氣。"], ["p", "可是敘述者是故意用這個字的。他明明可以寫「耶和華帶她到了」，他卻寫「她的機遇遇上了」，然後讓讀者自己去看見，這個機遇剛剛好，好到不可能只是機遇。神沒有出聲，祂藏在一個人彎腰走進一塊田的腳步裡。"], ["p", "第二個字是 חֵן（chen），「恩」。第二節路得說：「我蒙誰的恩，就在誰的身後拾取麥穗」，原文是「我在誰的眼中蒙恩」。第十節她說「怎麼蒙你的恩」，第十三節她說「願在你眼前蒙恩」，都是同一個片語：在別人的眼中蒙恩。我們剛讀完路得記，那是一個人人「行自己眼中看為對的事」的年代。在同一個年代裡，有一個人不看自己的眼睛，她只求別人的眼睛裡有一點恩典。"], ["p", "第十節還有一個藏起來的文字遊戲。「這樣顧恤我」的「顧恤」，原文 הִכִּיר（hikkir），是「認出、看重」；「外邦人」原文 נָכְרִיָּה（nokhriyyah），是「陌生的、不被認得的人」。兩個字是同一組字母。路得是在說：「你怎麼會認得一個不被認得的人？」這也是每一個外地人心裡的問題。"], ["p", "第三個字在第十二節：「你來投靠耶和華－以色列神的翅膀下」。「翅膀」原文 כָּנָף（kanaf）。這個字可以指鳥的翅膀，也可以指衣服的邊、衣襟。請記住這一筆，到第三章，路得會在一個很危險的夜裡，對波阿斯說：「求你用你的衣襟遮蓋我」（3:9），「衣襟」就是這同一個字。波阿斯在第二章為她禱告，求神用翅膀遮蔽她；第三章，他自己成了那個禱告的答案。"], ["d", ["如果「恰巧」其實是神的安排，那是不是我人生的每一件事，包括我做錯的事，神都早就預定好了？", "這是一個很深的問題，我們先把幾種看法擺出來。一種說「恰巧」只是巧合，神沒有參與；可是整卷的寫法都要我們看見神的手。另一種說神排好了每一個細節，人只是照劇本走；可是經文寫明是路得自己提議出去、自己選擇工作一整天。本講義的看法是：聖經說的是神的護理，「人心籌算自己的道路；惟耶和華指引他的腳步」（箴 16:9）。人是真的在選擇，也要為自己的選擇負責；神是真的在掌管，祂能把人的腳步織進祂的旨意裡。這不是命定論。至於做錯的事，神不是罪的作者，但祂能從人的錯誤裡救出祂的美意。詳見議題「神隱藏的手：「恰巧」是巧合、命定，還是神的護理？」"]], ["h", "三、拾：一個外邦寡婦，彎腰走進田裡"], ["p", "第一節，敘述者先讓我們知道一件路得還不知道的事：「拿俄米的丈夫以利米勒的親族中，有一個人名叫波阿斯，是個大財主。」（2:1）「大財主」原文是 גִּבּוֹר חַיִל（gibbor chayil），在路得記裡這個詞常常譯作「大能的勇士」。它說的不只是錢多，是一個有實力、有分量、有品格的人。讀者知道了，路得還不知道。整章的張力，就在這一點時間差裡。"], ["p", "第二節是路得自己開口要往田間去（2:2）。是她提議的，不是拿俄米派她去的。拿俄米還在第一章的苦裡，路得沒有等婆婆振作起來，先去做她能做的事。拿俄米只回了一句：「女兒啊，你只管去。」很短，很累，但她叫她「女兒」。"], ["p", "拾穗是甚麼？神在摩西的律法裡吩咐：「在你們的地收割莊稼，不可割盡田角，也不可拾取所遺落的。」（利 19:9）又說：「若忘下一捆，不可回去再取，要留給寄居的與孤兒寡婦。」（申 24:19）路得一個人就佔了兩樣：寄居的、寡婦，而且沒有孩子撐起這個家。神早在幾百年前，就在律法裡為她留了一塊田角。"], ["p", "可是律法說要留，不代表每個地主都肯留，更不代表一個外邦女子走進田裡是安全的。我們剛讀完路得記的最後，便雅憫人在示羅「從葡萄園出來，在示羅的女子中各搶一個為妻」（士 21:21）。這就是那個年代田間的真相。路得出門的那一刻，是在冒真實的危險。"], ["p", "然後就是那一句：「她恰巧到了以利米勒本族的人波阿斯那塊田裡。」（2:3）緊接著第四節：「波阿斯正從伯利恆來」。原文開頭有一個「看哪」，好像鏡頭忽然轉過去。一個恰巧，接著另一個恰巧：路得恰巧走進這塊田，波阿斯恰巧在這一天來巡田。神不出聲的時候，祂的時間表最準。"], ["p", "波阿斯一到田裡就說：「願耶和華與你們同在！」工人回答：「願耶和華賜福與你！」（2:4）在一個人人任意而行的年代，有一塊田，老闆和工人彼此用神的名問安。路得走進了一個還記得神的地方。"], ["p", "波阿斯問：「那是誰家的女子？」（2:5）僕人說她是「那摩押女子」，又補了一句：「她從早晨直到如今，除了在屋子裡坐一會兒，常在這裡。」（2:7）恰巧不是在她坐著等的時候發生的，是在她彎著腰工作的時候發生的。"], ["d", ["我每天的工作很平凡，甚至很卑微，真的有可能是神在帶領我嗎？", "路得記第二章給你一個很清楚的答案：神的護理，就是在拾穗的時候被看見的。路得不是在會幕前、不是在異象中，而是在一塊別人的田裡，在收割的人身後，撿人家剩下的麥穗。從早上做到晚上，中間只在屋子裡坐了一會兒。神沒有先把她從拾穗的工作裡救出來，祂是在拾穗的工作裡遇見她。如果你的工作很平凡，請不要小看它。你可以在明天上班的路上，對神說一句：「主啊，今天這塊田，是你帶我來的。」然後認真做好眼前那一件事。神的「恰巧」常常是在人忠心做小事的時候發生的，不是在人等待大事的時候。"]], ["h", "四、恩與名：翅膀下的餅，和一個至近的親屬"], ["p", "波阿斯走向路得，第一句話叫她「女兒啊」。他給她三樣東西：一個位置，不要往別人田裡去；一份保護，「我已經吩咐僕人不可欺負你」；還有一杯水，「可以到器皿那裡喝僕人打來的水」（2:9）。以色列的僕人，替一個摩押女子打水。"], ["p", "路得的反應是俯伏在地：「我既是外邦人，怎麼蒙你的恩，這樣顧恤我呢？」（2:10）她沒有說「這是我應得的」，她問的是「為甚麼是我」。波阿斯的回答很動人：「自從你丈夫死後，凡你向婆婆所行的，並你離開父母和本地，到素不認識的民中，這些事人全都告訴我了。」（2:11）原來她在第一章路口的那個選擇，伯利恆的人都看見了。"], ["p", "然後波阿斯為她禱告：「你來投靠耶和華－以色列神的翅膀下，願你滿得他的賞賜。」（2:12）他沒有說「你來投靠我」。一個有分量的人，會把人的眼光指向神，不指向自己。"], ["p", "路得第三次降卑：「我雖然不及你的一個使女，你還用慈愛的話安慰我的心。」（2:13）「安慰我的心」原文是 דִבַּרְתָּ עַל־לֵב，直譯「對著心說話」。很多人一輩子聽的都是對著腦袋說的話，講道理、下判斷；路得在一塊陌生的田裡，遇見了一個對著她的心說話的人。"], ["p", "到了吃飯的時候，波阿斯叫她：「你到這裡來吃餅，將餅蘸在醋裡。」（2:14）她從田邊被請到了收割的人旁邊，波阿斯親手把烘了的穗子遞給她。「她吃飽了，還有餘剩的。」請記得拿俄米在第一章說「耶和華使我空空地回來」，第二章，同一個家的人，第一次吃飽了，還有剩。"], ["p", "接著是比律法更多的恩典。波阿斯吩咐僕人：「她就是在捆中拾取麥穗，也可以容她，不可羞辱她；並要從捆裡抽出些來，留在地下任她拾取，不可叱嚇她。」（2:15–16）律法只要求留下田角和遺落的，波阿斯卻叫人故意從捆裡抽出來。而且是「任她拾取」，讓她自己撿，保住她的尊嚴。律法是底線，不是天花板；真正的恩典還顧到受的人的臉。"], ["p", "那天晚上，路得打出了「約有一伊法大麥」（2:17），大約二十多公升，夠兩個人吃上好些日子。拿俄米一看就問：「你今日在哪裡拾取麥穗」，還不知道是誰，就先說：「願那顧恤你的得福。」（2:19）"], ["p", "路得說出了那個名字：「我今日在一個名叫波阿斯的人那裡做工。」然後是全卷的樞紐：「願那人蒙耶和華賜福，因為他不斷地恩待活人死人。」拿俄米又說：「那是我們本族的人，是一個至近的親屬。」（2:20）第一章她說「全能者使我受了大苦」；同一個人、同一位神，她從控訴變成了祝福。處境還沒有改變，觀點先改變了，中間只隔了一天的拾穗，和一個名字。"], ["p", "「至近的親屬」原文 גֹּאֵל（go’el），是「贖回的人」。按著神的律法，「你的弟兄若漸漸窮乏，賣了幾分地業，他至近的親屬就要來把弟兄所賣的贖回」（利 25:25）。這個字第一次出現，就和 חֶסֶד（chesed，慈愛）站在同一節裡。慈愛有了一個名字。這使我們想起那一位成了我們弟兄、付上代價贖回我們的主，聖經說祂「凡事該與他的弟兄相同」（來 2:17）。"], ["p", "第二章最後很安靜：路得「直到收完了大麥和小麥」，「仍與婆婆同住」（2:23）。恩典有了名字以後，日子還是要一天一天過。盼望不會讓工作消失，盼望讓工作有了方向。"], ["d", ["「他不斷地恩待活人死人」，這個「他」到底是指耶和華，還是指波阿斯？", "這是第二章最有名的一個文法問題，原文確實兩種讀法都可以。一種讀法是指波阿斯：拿俄米剛祝福「那人」，他恩待活人，就是她們兩個；恩待死人，就是顧念以利米勒的家。另一種讀法是指耶和華：原文「沒有撇下他的慈愛」這個片語（אֲשֶׁר לֹא־עָזַב חַסְדּוֹ），和創世記亞伯拉罕的僕人說的話幾乎一樣：「耶和華－我主人亞伯拉罕的神是應當稱頌的，因他不斷地以慈愛誠實待我主人。」（創 24:27）在那裡，「不斷地以慈愛」的主詞明明是耶和華。本講義的判斷是：原文最自然的讀法是指耶和華，拿俄米重新承認神沒有離棄她；而神的慈愛，正是藉著波阿斯臨到她們的。兩種讀法不衝突，神的慈愛，常常穿著人的衣服來。"]], ["d", ["波阿斯比律法給得更多，那教會是不是也可以要求每個人都要這樣慷慨？", "要分兩頭講。一頭是：律法為窮人、寄居的、寡婦留田角，是神對祂百姓的要求，不是可有可無的善心。教會照顧在患難中的人，雅各書說這是「清潔沒有玷污的虔誠」（雅 1:27），這是底線，不能省。另一頭是：波阿斯從捆裡多抽出來的那一份，經文沒有說是誰命令他的，那是一顆被神的慈愛觸動的心，自然流出來的。慷慨可以被教導、被邀請，卻不能被勒索。講台若用罪疚感逼人奉獻，得到的是錢，失去的是心。比較好的作法，是讓人先看見自己蒙了多少恩，人一旦看見，就會忍不住多抽出一點來。"]], ["h", "五、幾個必須認得的偏差"], ["p", "第一個偏差，是把「恰巧」講成成功神學：只要你跟隨神，就一定會遇到一個改變你命運的人，生意會起來，財富會進來。路得遇見波阿斯的那一天，她是在別人身後撿剩下的麥穗。神的護理是在最卑微的工作裡被看見的，不是保證你脫離卑微的工作。"], ["p", "第二個偏差，是反過來把「恰巧」講成命定論：反正一切都安排好了，我做甚麼都一樣。路得是自己提議出去，自己選擇整天彎腰工作，自己去問波阿斯「為甚麼是我」。神的掌管不取消人的選擇，反而是在人的選擇裡做工。"], ["p", "第三個偏差，是把第二章講成一個戀愛故事的序幕：「女孩子只要勤勞，就會被有條件的男人看上。」這一章沒有一個字在講戀愛，波阿斯叫她「女兒」，為她禱告的是求神的翅膀遮蔽她。把它講成擇偶指南，會傷到一位正在為婚姻禱告的單身姊妹，好像她還沒有遇見，就是她不夠好。"], ["p", "第四個偏差，是用「我既是外邦人」來劃界線，好像教會裡也有「本地人」和「外地人」兩等。路得說這句話，是在謙卑；波阿斯聽見這句話，回應的是保護、餅和祝福。神的百姓對待外人，是讓他們在田裡安全、在桌邊有位置，不是讓他們永遠記得自己是外人。"], ["p", "第五個偏差，是把第十二節的「賞賜」講成功德：你對婆婆好、對人好，神就欠你一份回報。路得自己的反應，是俯伏在地問「怎麼蒙你的恩」。她得著的，從頭到尾都是恩典；波阿斯的祝福，是把她交給神的翅膀，不是替她開一張報酬的帳單。"], ["h", "六、兩個華人處境的真實問題"], ["p", "第一個問題：我們很容易把「恰巧」叫作「緣分」或「命」。華人文化裡，好事叫「有緣」，壞事叫「命不好」，好像人生是一場抽籤。路得記的「恰巧」不是抽籤，是有一位神在暗中走在前面。差別在哪裡？說「命」的人，最後只能接受；認識神的人，可以禱告、可以選擇、可以在壞日子裡繼續彎腰工作，因為他知道握著那條線的手是有慈愛的。下一次你想說「這是緣分」的時候，試著改說：「這是神的恩典，我還在學看懂。」"], ["p", "第二個問題：在我們的田裡拾穗的人，我們怎樣對待？今天在台灣、馬來西亞、新加坡、紐西蘭，有很多外籍看護、移工、新住民，在我們的家裡、工廠、田裡工作。波阿斯對僕人說了三個「不可」：不可欺負她，不可羞辱她，不可叱嚇她。請問我們家裡那一位照顧爺爺奶奶的外籍看護，有沒有一個可以安心喝水、坐下吃飯的地方？我們叫得出她的名字嗎？我們的教會，有沒有一張桌子，是請這樣的人「到這裡來吃餅」的？"], ["d", ["我們教會有很多外籍移工來聚會，可是語言不通、文化也不同，我們真的不知道該怎麼接待，怎麼辦？", "先從波阿斯做的三件小事開始，它們都不需要很好的語言能力。第一，給一個位置：讓他們知道這裡可以留下來，可以有一位同工專門負責迎接。第二，給一份保護：了解他們在工作上最常遇到的困難，例如證件被扣、休假被剝奪，必要時協助他們找到合法的求助管道。第三，給一杯水和一塊餅：一起吃一頓飯，常常比一篇翻譯好的講章更能讓人覺得被接納。也請記得，路得記沒有抹掉她「摩押女子」的身分，教會也不需要要求他們先變成本地人才能被接納。若可以，邀請他們用自己的語言禱告、唱一首家鄉的詩歌，讓他們也是服事的人，不只是被服事的人。"]], ["h", "七、活出321——在別人的田裡，投靠神的翅膀"], ["p", "耶穌是我的榜樣：波阿斯看見一個沒有人認得的外邦女子，給她位置、保護、水和餅，還對著她的心說話。這使我們想起主耶穌，祂「本來富足，卻為你們成了貧窮」（林後 8:9），祂常常停下來，看見那個在人群邊緣、沒有人在意的人。效法祂，就是在我自己的田裡，停下來問一句：「那是誰？」然後走過去。"], ["p", "聖經是我的準則：波阿斯的慷慨不是憑感覺，是從神的律法長出來的。利未記和申命記早就吩咐要為寄居的、孤兒寡婦留下田角，波阿斯先守住了這個底線，然後才多給。讓聖經作準則，就是先問神的話吩咐我甚麼，把底線守住；恩典是在底線之上加的，不是取代底線。"], ["p", "聖靈是我的引導：第二章沒有提到靈，沒有夢，沒有異象。神的引導藏在一個「恰巧」裡，藏在一個人勤勞工作的腳步裡。用心靠聖靈，常常不是等候一個特別的聲音，而是在每天平凡的路上，信祂在前面，然後一步一步走。回頭看的時候，你會發現那些腳步都被祂接住了。"], ["p", "讓耶穌作王：路得在第一章說「你的神就是我的神」，第二章她就投靠在這位神的翅膀下。換了主人，就要換一個躲藏的地方。讓耶穌作王，就是當我無助的時候，第一個奔向的，不是我的存款、我的人脈，而是祂的翅膀。"], ["p", "讓耶穌得著一切的榮耀：讀第二章，很容易只記得「波阿斯好完美」。可是波阿斯自己把榮耀指向神：他對工人說「願耶和華與你們同在」，對路得說「你來投靠耶和華」。拿俄米最後祝福的，也是「蒙耶和華賜福」。一個真正有分量的人，會讓人經過他的時候看見神，而不是停在他身上。"], ["p", "建立屬神的體系：一塊田、一群工人、一位主人、一個外邦的拾穗者，這就是一個小小的屬神體系的樣子：工作裡有神的名，規矩裡有對窮人的保護，桌邊有外人的位置。我們的公司、家庭、小組，都可以這樣建立。920 的「2」，有時候就是那個在我們田邊拾穗、我們還叫不出名字的人。"], ["d", ["我在職場上想像波阿斯一樣用神的名問安，可是公司不是基督徒的地方，這樣做會不會很奇怪？", "波阿斯說「願耶和華與你們同在」，是在一個大家都認識耶和華的文化裡；我們的職場不一定是那樣，所以要學的是他的心，不一定是他的那一句話。他的心有三個特點。第一，他先看見人：他問「那是誰家的女子」，他知道誰在他的田裡工作。第二，他的權力是用來保護人的：他吩咐僕人不可欺負、不可羞辱。第三，他把祝福說出口：他對著人的心說話。你可以從叫得出清潔阿姨、保全大哥的名字開始；在會議上不羞辱人；同事生病時說一句「我會為你禱告」。當別人問你為甚麼這樣做，那就是你說出神的名的時候。"]], ["h", "八、四種心，都被請到桌邊"], ["p", "驕傲型的心，是那個覺得自己就是波阿斯的人：我有能力、有資源，我來施恩給別人。可是請看波阿斯，他給的時候顧著人的臉，叫人「任她拾取」；他禱告的時候把人交給神，不交給自己。經文給驕傲的心這一句：「你有什麼不是領受的呢？」（林前 4:7）我們每一個人，都曾經是在別人田裡拾穗的人。"], ["p", "恐懼型的心，是那個不敢走出門的人。路得出門的時候，不知道會遇見誰，可能被欺負、被趕走、空手回家。恐懼的人會想：等我確定安全了再去。可是第二章的恰巧，是在她走出去以後才發生的。神沒有先給她一張地圖，祂給她一雙願意彎腰的手，和一塊在前面等著她的田。"], ["p", "羞恥型的心，是那個覺得自己只能撿剩下的人：我不配坐在桌邊，能在角落撿一點就好了。路得也是這樣想的，她說「我雖然不及你的一個使女」。可是波阿斯對她說：「你到這裡來吃餅。」神的恩典不是讓你留在田邊撿剩的，是把你請到桌邊，讓你吃飽，還有餘剩。"], ["p", "受傷型的心，是那些曾經在別人的田裡被欺負、被羞辱、被叱嚇的人。也許是在職場、在異鄉、甚至在教會。你心裡可能很難相信，世上真的有一塊田是安全的。第二章沒有要你假裝那些傷沒有發生，波阿斯說「不可欺負你」，正是因為欺負是真的存在的。神看見那些傷，祂也在為你預備一個可以安心喝水的地方。"], ["d", ["我曾經在異鄉或職場被人欺負過，讀到波阿斯保護路得，我心裡反而很難過，為甚麼當時沒有人保護我？", "謝謝你願意說出這份難過，這不是你不夠屬靈，而是那些傷是真的。波阿斯會特別吩咐「不可欺負你」「不可羞辱她」「不可叱嚇她」，正說明在那個年代，欺負一個外邦女子是常有的事。經文沒有假裝世界是安全的。神在律法裡一再吩咐「不可向寄居的和孤兒屈枉正直」（申 24:17），因為祂看見寄居的人會被欺負，祂站在受欺負的人那一邊。當時沒有人保護你，不是因為你不值得被保護，是那些人失職了。你可以把這份難過直接帶到神面前，也可以找一位信得過的人陪你說出來；若那些經驗至今仍讓你害怕、失眠，或曾經涉及性騷擾、暴力，請尋求專業的協助，這是保護自己，不是信心軟弱。"]], ["h", "九、這一週，你可以做的幾件事"], ["p", "這一課要交給你的，不是一套如何遇見好運的方法，是一雙在平凡日子裡看見神的眼睛。以下五件事，請在散會前把時間、地點、名字填上。"], ["p", "第一，這一週找一個晚上，自己從頭讀一次路得記第二章，在第三節「恰巧」旁邊，寫下你人生中最重要的一次「恰巧」，加上年份和地點。"], ["p", "第二，把今天寫的那份「恰巧的履歷」帶回家，在每一行旁邊寫一句感謝的禱告：「主啊，原來那一天你在。」寫完以後，挑一行講給家人聽。"], ["p", "第三，在你的田裡，找出一位你還叫不出名字的人：大樓的保全、公司的清潔人員、家裡的外籍看護。這一週問他的名字，並且記住它。"], ["p", "第四，做一件「從捆裡抽出來」的事：在你本來就該做的之外，多給一點，而且給的方式要顧到對方的臉，讓他不覺得是在接受施捨。"], ["p", "第五，在你最平凡的工作開始前，對神說一句：「主啊，今天這塊田，是你帶我來的。」然後認真做好眼前的那一件事，晚上記下你在哪裡看見了祂。"], ["p", "然後我們一起把四句話說出來。請開口說，不要只在心裡默想。"], ["p", "我宣告：我人生的每一個恰巧，都在神慈愛的手裡。"], ["p", "我宣告：我不是只配撿剩下的人，神請我到桌邊吃飽。"], ["p", "我宣告：我要投靠耶和華的翅膀下，不投靠我自己的聰明。"], ["p", "我宣告：我要在我的田裡，讓拾穗的人安全、被看見、被叫出名字。"], ["h", "十、結語"], ["p", "這一課從一份「恰巧的履歷」開始。請你再看一次你寫下的那三行字。路得的履歷上，第二章只寫了一行：某年，大麥收割季，恰巧到了波阿斯的田。她那天早上不知道，那一行字後面，接著的是一個家的贖回，和一位王的家譜。你那三行字後面，接著的也不是你看得見的全部。"], ["p", "所以這一課的焦點，不在波阿斯有多好，也不在路得有多勤勞，而在那一位藏在恰巧裡、不斷地恩待活人死人的神。祂在律法裡為寡婦留下田角，在田裡為外人預備水和餅，在拿俄米的口裡重新放進一句祝福。詩人說：「我一生一世必有恩惠慈愛隨著我」（詩 23:6）。"], ["p", "我們一起低頭禱告。親愛的天父，謝謝你在我們不知道的時候，已經走在我們前面。謝謝你把我們人生裡那些看起來偶然的日子，都織進你慈愛的手裡。求你讓我們像路得一樣，願意彎腰做眼前平凡的工作；也像波阿斯一樣，在自己的田裡看見那些沒有人認得的人。求你安慰那些曾經在別人的田裡受傷的人，讓他們在你的翅膀下找到安息。奉主耶穌基督的名禱告，阿們。"], ["h", "十一、小組討論分享：三個化"], ["p", "這一課的成敗，在今天有多少人寫下了自己的一次「恰巧」，並且說出一位這一週要叫出名字、要去善待的「拾穗的人」。以下三個化，請組長照次序帶。"], ["m", "帶領說明：本課主軸是「神藏在恰巧裡，恩典比律法更多」。不把「恰巧」講成好運或命定，不把本章講成戀愛故事。時間不夠時寧可縮短第一化，第二化不可省略。"], ["m", "優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"], ["s", "第一化｜內化成為觀念（約20分鐘）"], ["m", "目的：把「恰巧裡有神的護理」「恩典顧到人的尊嚴」「盼望有了名字」三個觀念放進組員心裡。"], ["n", "1. ★ 你這一生最重要的一次「恰巧」是哪一次？說出年份、地點，和那一個人的名字。"], ["n", "2. ★★ 路得三次說「在你眼中蒙恩」。用一句話說出，「求別人眼中的恩」和「做自己眼中看為對的事」最大的差別在哪裡。"], ["n", "3. ★★★ 拿俄米在第一章說「全能者使我受了大苦」，第二章那天晚上卻說「願那人蒙耶和華賜福」。你最近一次從抱著苦到說出祝福，是哪一天、為了哪一件事？"], ["n", "4. ★ 讀完這一章，你心裡浮現的是一位怎樣的神？用一個詞形容。"], ["m", "帶領提醒：第一題可能有人說出的「恰巧」其實是一場失落，例如一場車禍或一次離婚，讓他慢慢講，不急著替他解釋成神的美意。有人開始講成「遇到對的人」的愛情故事，就溫和地帶回「神在哪裡」。"], ["s", "第二化｜消化成為生命（約35分鐘·本課主軸）"], ["m", "目的：讓每個人誠實面對自己是站在田邊撿剩的、還是被請到桌邊的人，並說出一位要像波阿斯那樣去善待的人。"], ["t", "【看】看見自己"], ["n", "5. ★★★ 在紙上寫下：在你的人生這一季，你比較像拾穗的路得，還是有田的波阿斯？寫一句為甚麼。"], ["t", "【聽】聽神說話"], ["n", "6. ★★ 全組慢慢讀第十二節三遍：「你來投靠耶和華－以色列神的翅膀下，願你滿得他的賞賜。」各說一句：哪幾個字最打中你？"], ["t", "【想】想通關卡"], ["n", "7. ★★★ 安靜一分鐘，問神：「是甚麼攔住我投靠你的翅膀下？」是不敢走出門、是覺得自己只配撿剩的，還是習慣先靠自己？只說哪一種。"], ["t", "【講】說出口"], ["n", "8. ★★ 對旁邊一位說一句：「神請我到桌邊吃飽。」或者說：「那一次恰巧，原來是你。」只說一句。"], ["t", "【行】走一步"], ["n", "9. ★★★ 寫下這一週你要問出名字的那一位「拾穗的人」：他在哪裡、哪一天、你要怎麼開口。唸給組員聽，請他們下次問你。"], ["m", "帶領提醒：這一化可能碰到曾在職場、異鄉或家中被欺負、羞辱，甚至遭受性騷擾或性暴力的組員，也可能有在異鄉工作、長期覺得無望的移工。不追問細節，不要求原諒加害者，不對正在流淚的人說「你要有信心」。會後請私訊單獨關心，必要時協助尋求專業協助或合法的求助管道。"], ["s", "第三化｜轉化成為生活（約25分鐘）"], ["m", "目的：把這一課搬進這一週的行事曆和關係，讓我們自己的田成為拾穗的人安全的地方。"], ["n", "10. ★★★ 打開行事曆，定下這一週自己讀一次路得記第二章的時間：星期幾、幾點、在哪裡？"], ["n", "11. ★★ 這一週你要做一件「從捆裡抽出來」的事，是甚麼？給誰？怎樣給，才能顧到他的臉？"], ["n", "12. ★★ 想一位曾經在你人生中「對著你的心說話」的人。說出他的名字，以及這一週你要怎樣謝謝他。"], ["n", "13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你的田邊、你還不太認識的那一個人，也許是一位外籍看護、一位新來的同事，或一位剛來教會的新住民。當場說出他的名字或他在哪裡，以及這一週約他吃一頓飯的日子；見面時先聽他說他的家鄉。"], ["n", "14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽，並把三句話寫出來。第一句，三千多年前有一位外國寡婦，為了養活婆婆去田裡撿人家剩下的麥穗，她恰巧走進了一位親族的田。第二句，那位田主給她保護、水和餅，還故意多留麥穗給她，並且為她禱告，求神用翅膀遮蔽她。第三句，我相信人生裡的「恰巧」不是運氣，是一位有慈愛的神，在我們看不見的地方走在前面。這一週講給一個人聽，下次回來說他的反應。"], ["m", "帶領提醒：要具體到時間、地點、人名，不收「我會找時間」。920 是去認識、善待人，不是去施捨或傳教壓力；對方若正處在被剝削、受暴或長期無望的處境中，不要獨自處理，回來找組長或牧者，一起協助他找到合法、專業的幫助。"], ["s", "收尾（5分鐘）"], ["p", "用五分鐘收尾。每人一句話：這一週哪一天，要去叫出哪一位「拾穗的人」的名字。只說名字或地點，和日子。"], ["p", "然後為三種人指名禱告：一位在異鄉工作、覺得自己不被看見的移工或新住民；一位正在做一份很卑微的工作、覺得神很遠的弟兄姊妹；一位回頭看人生，只看見一連串不順利的人。"], ["p", "散會前確認紙上有三樣：那一份恰巧的履歷、那一位要去叫出名字的人、自己讀第二章的時間。下次帶著這張紙來。"]]}, "3": {"no": 3, "vol": "《321路得記講義》第三課·路得記第三章", "title": "披在肩上的外套——求、遮、等", "chars": 5190, "min": 60, "deep": 8, "dchars": 1909, "tchars": 740, "blocks": [["h", "一、寒流夜裡的一件外套"], ["p", "弟兄姊妹平安。想像一下一個寒流來襲的晚上。你在路邊等人等了很久，或者在公車站等一班遲遲不來的末班車。風從領口灌進去，你把手縮進袖子裡，整個人越縮越小。這時候，有一個人走過來，甚麼也沒說，把他自己的外套脫下來，披在你肩上。"], ["p", "那件外套還是暖的。你抬頭看他，他只穿著一件薄薄的襯衫，卻說：「我不冷。」那一刻你知道，暖過來的不只是肩膀。有人看見了你的冷，而且願意自己冷一點，讓你不冷。很多人一輩子記得這樣的一件外套，記得的不是布料，是那個披上來的人。"], ["p", "路得記第三章，就是一件外套的故事。路得在半夜對一位至近的親屬說：「求你用你的衣襟遮蓋我」（3:9）。這句話很容易被讀歪，有人讀成浪漫，有人讀成曖昧。可是讀完全章，你會發現這一章的中心不是男女之間的事，是一個空了的家，求一位有權贖回的人把她們遮蓋起來。這一課的三個詞是求、遮、等：拿俄米替媳婦求一個安身之處，路得求一位至近的親屬展開衣襟，最後兩個女人學會安坐等候。"], ["d", ["我讀到第三章打穀場那一段總覺得尷尬，在小組裡要怎麼讀，才不會讓大家不自在？", "這個尷尬很正常，也說明你尊重經文。可以試三件事。第一，照經文原句讀，不加想像，也不開玩笑；經文寫得收斂，我們就讀得收斂。第二，把焦點放在經文自己強調的地方：路得說出口的那一句請求、波阿斯的祝福、他守住的次序，以及天未亮她就安全離開。第三，若有人追問「那一夜到底發生了甚麼」，可以誠實說：經文刻意沒有寫細節，卻刻意寫了結果，全城的人都知道她是賢德的女子，波阿斯起誓要照律法辦理。我們讀聖經，就在經文停下的地方停下。這樣讀，大家不但不會不自在，反而會看見一個在危險的夜裡仍然被保護的女人。"]], ["h", "二、原文亮光：安身之處、衣襟、不休息"], ["p", "第一個字在第一節。拿俄米說：「女兒啊，我不當為你找個安身之處，使你享福嗎？」（3:1）「安身之處」原文是 מָנוֹחַ（manoach），字根的意思是歇下來、得安息。請翻回第一章，拿俄米在摩押的路上為兩個兒婦祝福：「願耶和華使你們各在新夫家中得平安！」（1:9）那裡的「平安」是同一個字根 מְנוּחָה（menuchah）。在第一章，她把這件事交給神；到第三章，她決定親手去作。禱告的人，成了自己禱告的一部分。"], ["p", "第二個字是全卷的珍珠，כָּנָף（kanaf）。它可以譯「翅膀」，也可以譯「衣襟」，就是長袍的邊。第二章波阿斯為路得禱告：「你來投靠耶和華－以色列神的翅膀下」（2:12）。到第三章，路得在半夜對他說：「求你用你的衣襟遮蓋我」（3:9）。中文看起來是兩樣東西，原文是同一個字。她好像在說：你求神用翅膀遮蔽我，那就請你用你的翅膀遮蓋我。波阿斯禱告的答案，就是他自己。"], ["p", "以西結先知用過同一個畫面，神對以色列說：「便用衣襟搭在你身上，遮蓋你的赤體；又向你起誓，與你結盟」（結 16:8）。在古代，把衣襟搭在一個女子身上，是立約、娶她、保護她的意思。所以 3:9 有人讀成求婚，有人讀成求贖；本講義認為兩者在這裡合在一起，因為她接著說的理由是「因為你是我一個至近的親屬」。「至近的親屬」原文 גֹּאֵל（go’el），是律法裡有權利、也有責任把家人贖回來的人（利 25:25）。她不是在求一個男人看上她，是在求一位贖回者，照神的律法擔起他的本分。"], ["p", "第三個字在最後一節：「那人今日不辦成這事必不休息」（3:18）。「休息」原文 שָׁקַט（shaqat）。我們剛讀完的路得記，這個字一再出現：「於是國中太平四十年」（士 3:11）。士師一死，太平就結束。到了路得記，這個字倒過來用：不是國中太平，是有一個人不肯太平。安身之處、衣襟、不休息，三個字連起來就是這一章的路：有人求安息，有人展開衣襟，有人為了別人的安息，自己不肯休息。"], ["d", ["「翅膀」和「衣襟」是同一個字，這樣連起來讀，會不會只是講員自己的發揮？", "這正是我們要守的界線，可以分兩層看。第一層是字本身：2:12 和 3:9 用的確實都是 כָּנָף，在路得記裡，這個字只出現在這兩節。作者用同一個字寫兩個場景，聽希伯來文的人一聽就會連起來，這是經文自己的設計，不是我們發明的。第二層是我們怎樣用它：說「波阿斯成了他自己禱告的答案」，是從兩段經文的情節直接讀出來的；可是如果再往下推，說衣襟的每一條線代表甚麼，那就是發揮了。判斷的方法很簡單：這個連結是經文的字和情節給的，還是我們的想像給的？前者可以放心講，後者寧可不講。"]], ["h", "三、求：一個婆婆的計畫，一個媳婦的請求"], ["p", "先看拿俄米。第二章結束的時候，路得「仍與婆婆同住」（2:23），整個收割季過去了。大麥割完，小麥也割完，波阿斯待路得很好，可是甚麼也沒有發生。拿俄米看著媳婦一天一天在田裡彎腰，心裡有一個念頭：我不能讓她一輩子這樣跟著我。第一章那個說「不要叫我拿俄米」的人，現在開口叫她「女兒啊」，而且是為她打算，不是為自己。從苦裡走出來的第一個記號，常常是開始為別人著想。"], ["p", "她的計畫很大膽：「你要沐浴抹膏，換上衣服，下到場上」（3:3），等波阿斯吃喝完了，看準他睡的地方，「就進去掀開他腳上的被，躺臥在那裡，他必告訴你所當做的事」（3:4）。這個計畫有風險。打穀場在城外，夜裡有男人守著糧食；一個摩押寡婦夜裡出現在那裡，若被人看見，名聲就毀了。經文沒有誇她的計畫，也沒有批評她，只是照實記下來，讓我們看見兩個走投無路的女人，怎樣在律法裡找一條出路。"], ["p", "「腳上的被」原文 מַרְגְּלוֹת（margelot），字面就是「腳的地方」。有學者認為這個寫法帶著含蓄的暗示，經文也確實寫得很收斂。我們不需要替經文多講，也不需要假裝這一段不存在，因為經文自己會把結局交代清楚。路得的回答只有一句：「凡你所吩咐的，我必遵行。」（3:5）"], ["p", "到了夜半，波阿斯忽然驚醒，「不料有女子躺在他的腳下」（3:8）。他問：「你是誰？」這時候，路得改了劇本。拿俄米說的是「他必告訴你所當做的事」，路得卻沒有等他告訴她，自己先開口了：「我是你的婢女路得。求你用你的衣襟遮蓋我，因為你是我一個至近的親屬。」（3:9）"], ["p", "請注意她怎樣稱呼自己。第二章她說「我既是外邦人」，又說「我雖然不及你的一個使女」（2:13）。到第三章，她說「我是你的婢女」，原文 אָמָה（amah），是可以被娶為妻的女僕。她的稱呼一步一步改變：從外邦人，到使女，到可以被娶進家中的婢女；她沒有抬高自己，也沒有貶低自己。她沒有用手段去換，也沒有拿眼淚去求；她站在本位上，說出神的律法給她的盼望。這就是「求」：不是操縱，也不是乞討，是在本位上把真實的需要說出來。"], ["d", ["拿俄米的計畫到底是信心還是操縱？我們今天可以照樣替人「安排」嗎？", "各家看法不同。有人說這是信心的行動，因為她要找的是律法裡的至近親屬，不是隨便一個有錢人；也有人覺得她冒的險太大，近乎操縱。經文沒有評論她的方法，只記錄了結果：兩個人都守住了本位。本講義的判斷是，不必把她講成模範，也不必講成反面教材。今天我們能學的，不是那一套做法，而是她的心：她從只看見自己的苦，轉而為媳婦的將來打算。至於替人安排婚事或關係，要記得路得是有選擇的，她說「凡你所吩咐的，我必遵行」，是出於她自己的委身，不是被迫。任何安排，若對方沒有說「不」的自由，就不再是愛，而是控制。"]], ["h", "四、遮與等：賢德的女子、更近的親屬、安坐等候"], ["p", "波阿斯的第一句話是祝福：「女兒啊，願你蒙耶和華賜福。你末後的恩比先前更大」（3:10）。「恩」原文 חֶסֶד（chesed），是立約裡忠心到底的愛。先前的恩，是她跟著婆婆回到伯利恆；末後的恩，是「少年人無論貧富，你都沒有跟從」。她可以為自己挑，卻選了一條能為拿俄米、為死去的丈夫存留家業的路。全卷最後被稱讚有慈愛的，是那個外邦人。"], ["p", "接著他說：「現在不要懼怕……我本城的人都知道你是個賢德的女子。」（3:11）「賢德的女子」原文 אֵשֶׁת חַיִל（eshet chayil），和箴言最後一章「才德的婦人誰能得著呢」（箴 31:10）是同一個詞。第二章介紹波阿斯「是個大財主」（2:1），原文也有這個 חַיִל。同一個字，給了一個有地有糧的伯利恆人，也給了一個拾穗的摩押寡婦。神看人的價值，不看出身，也不看存款。"], ["p", "然後他說了一句很關鍵的話：「我實在是你一個至近的親屬，只是還有一個人比我更近。」（3:12）他大可以當晚就答應，沒有人會知道。可是他守住了律法的次序，不搶別人的權利。他又起誓：「我指著永生的耶和華起誓，我必為你盡了本分」（3:13）。在那個人人任意而行的年代，有一個人在半夜、在沒有人看見的時候，仍然照神的次序走。"], ["p", "經文接著交代結局：「路得便在他腳下躺到天快亮，人彼此不能辨認的時候就起來了。」（3:14）波阿斯說：「不可使人知道有女子到場上來」。這不是遮掩罪，因為這一夜沒有需要遮掩的事；他是在保護一個寡婦的名聲，好讓明天城門前的程序光明正大地進行。他還對路得說：「打開你所披的外衣。」她打開了，他就撮了六簸箕大麥，幫她扛在肩上。"], ["p", "路得回家告訴婆婆：「那人給了我六簸箕大麥，對我說：『你不可空手回去見你的婆婆。』」（3:17）「空手」原文 רֵיקָם（reqam），全卷只出現兩次。第一次是拿俄米說「耶和華使我空空地回來」（1:21），第二次就在這裡。拿俄米說神使她空空地回來，神卻藉著一個人說：不可讓她空手。那六簸箕大麥不是甚麼暗號，就是一份很實在的心意：我記得家裡還有一位老人家。"], ["p", "最後，拿俄米說：「女兒啊，你只管安坐等候，看這事怎樣成就，因為那人今日不辦成這事必不休息。」（3:18）「安坐」原文就是「坐下」。該做的都做了，該說的都說了，剩下的交給那位不肯休息的人。這使我們想起主耶穌說：「凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。」（太 11:28）真正的安息，不是我們終於可以不做，是有一位贖回者替我們把事辦成。"], ["d", ["波阿斯說「不可使人知道」，那教會裡出了事，是不是也應該不要讓人知道？", "這一句不能這樣用。先看經文：那一夜沒有任何需要遮掩的罪，波阿斯保護的是一個寡婦的名聲，好讓第二天城門前的程序光明正大地進行；他暫時不說，是為了公開辦理，不是為了永遠不辦。教會裡若有人受了傷害，特別是性騷擾、性侵害或家暴，絕不可以用「不要讓人知道」去壓住受害者，那是拿聖經去保護加害者。該通報的要通報，該報警的要報警，同時保護受害者的隱私，不讓她在眾人面前再受一次傷。保護名聲是對的，掩蓋罪是錯的。分辨的方法是問：這個保密，是在保護弱者，還是在保護有權的人？"]], ["d", ["我已經禱告、也努力很久了，「安坐等候」是不是叫我甚麼都別做？", "不是。看拿俄米說這句話的時機：路得已經沐浴、下到場上、開口請求了，事情也交到一位有能力的人手中，這時候才說「安坐等候」。等候不是第一步，是盡了本分以後的那一步。同時，安坐也不是麻木。原文是「坐下」，是不再來回踱步，不再用焦慮推著事情走。若你已經做了能做的，可以這樣禱告：「主啊，我把這件事交在你手裡，求你替我辦成。」然後照常生活，該吃飯就吃飯，該上班就上班。詩篇說：「你當默然倚靠耶和華，耐性等候他」（詩 37:7）。等候的力量，不是來自我們確定結果，是來自我們知道那一位不會休息。"]], ["h", "五、幾個必須認得的偏差"], ["p", "第一個偏差，是渲染打穀場的一夜。有人在講台上把「腳上的被」講得繪聲繪影，加上經文沒有的細節，好像那樣才吸引人。經文刻意寫得收斂，又刻意交代了結果：「你是個賢德的女子」，天未亮就起來。只用經文原句、不擴寫，是對經文的尊重，也是對台下每一位姊妹的保護。"], ["p", "第二個偏差，是反過來迴避，把第三章整章跳過，或者一句「這一段比較敏感」就帶過。跳過第三章，路得記就斷了；不講清楚，人就自己去猜，猜得往往比經文更糟。不渲染，也不迴避，把經文自己的結論講出來就夠了。"], ["p", "第三個偏差，是把這一章當成婚戀教材：叫單身的姊妹學路得主動出擊，或叫她們乖乖等著神送來一個好男人。這兩種講法方向相反，錯在同一處。路得求的不是一段戀情，是一位至近的親屬照律法贖回一個家。把這一章變成求偶技巧，一位為婚姻禱告多年的姊妹聽完，只會更焦慮、更自責。"], ["p", "第四個偏差，是把六簸箕大麥、打穀場、外衣逐項寓意化，說六代表甚麼、打穀場又代表甚麼。新約沒有作過這樣的連結，講完以後，人記得的是講員的巧思，不是神。經文本身已經夠深：一位贖回者記得一位老寡婦會餓。"], ["p", "第五個偏差，是把「安坐等候」講成消極、甚麼都不做，或者反過來把拿俄米的計畫講成「信心就是要自己去安排」。第三章兩樣都有：先是盡力，該沐浴就沐浴，該開口就開口；然後是交託，坐下來，看事情怎樣成就。只有行動沒有交託，就成了操縱；只有等候沒有行動，就成了逃避。"], ["d", ["我為婚姻禱告很多年，讀到第三章反而很難過，覺得路得很幸運、我沒有，我該怎麼讀？", "謝謝你這麼誠實。先說一句：路得記不是一個應許，說每一個為婚姻禱告的人都會遇到一個人。路得在遇見波阿斯以前，先失去了丈夫，在摩押多年沒有孩子，跟著婆婆到了異鄉，在別人的田裡撿剩下的穗子。她的故事不是「幸運」，是在很長的空裡，神沒有撇下她。你可以把第三章讀成一句禱告：「求你用你的衣襟遮蓋我。」這句話不論單身或已婚，每一個人都可以對主說。你的價值不在於有沒有結婚；全城稱路得為賢德的女子，是在她結婚以前。若這份失落已經壓得你喘不過氣，請不要一個人扛，會後請私訊同工或小組長，讓人陪你走一段。"]], ["h", "六、兩個華人處境的真實問題"], ["p", "第一個問題：喪偶的人可以再找一個安身之處嗎？華人社會看喪偶的女人，眼光常常很複雜。有人覺得守著才是忠貞，有人怕她再嫁會分走家產，也有婆家希望媳婦留下來照顧老人。拿俄米本來可以把路得留在身邊當依靠，她卻說「我不當為你找個安身之處，使你享福嗎」。她替媳婦想的是媳婦的將來，不是自己的晚年。今天教會裡也有喪偶的弟兄姊妹想再婚卻怕被議論，也有長輩想再婚卻被兒女反對。第三章至少告訴我們：為喪偶的人找一個安身之處，在聖經裡是一件愛的事，不是一件丟臉的事；決定不再婚的人，也同樣在神的翅膀下，不是缺了一角。"], ["p", "第二個問題：我們很怕丟面子，卻不一定懂得保護別人的名聲。華人重面子，常常是重自己的面子。波阿斯那一句「不可使人知道」，保護的是路得的名聲，不是他自己的。教會裡的單身弟兄姊妹，常常在一句「怎麼還不結婚」裡受傷；過年回家被親戚圍著問，比被人拒絕還難受。第三章的波阿斯讓我們看見另一種樣子：他稱她「女兒」，叫她「不要懼怕」，又替她擋住別人的眼光。我們能不能也成為這樣的人，不追問別人的婚姻，卻保護別人的尊嚴？"], ["d", ["家裡長輩一直催我結婚，甚至說我不結婚就是不孝，我該怎麼回應？", "先體諒長輩背後的擔心：他們多半是怕你老了沒有人照顧，怕自己走了以後你孤單。這份愛是真的，只是說出來的方式讓人受傷。你可以先回應那份擔心，不必爭對錯：「爸媽，我知道你們是怕我以後一個人。」然後說出你自己的想法：也許你願意等候，也許你願意先好好過現在的日子；無論哪一種，都不必為了交差而勉強。第三章提醒我們，婚姻是一個家被遮蓋、被保護，不是一張完成任務的清單。同時，也請不要讓這份壓力吞掉你和神的關係，你在神眼中的價值，不需要用婚姻來證明。若衝突已經很激烈，可以請一位兩代都信任的長輩或牧者陪你們一起談。"]], ["h", "七、活出321——在本位上求，在交託裡等"], ["p", "耶穌是我的榜樣：路得說「我是你的婢女」，在本位上求；波阿斯說「還有一個人比我更近」，在本位上讓。主耶穌是最完全的樣子：祂「本有神的形像，不以自己與神同等為強奪的；反倒虛己，取了奴僕的形像」（腓 2:6-7）。祂沒有搶，卻成了我們的弟兄，「他稱他們為弟兄也不以為恥」（來 2:11）。這使我們想起，那位真正的至近親屬，是自己走下來，展開衣襟遮蓋我們的。"], ["p", "聖經是我的準則：這一章所有的事，都繞著神的律法轉。路得憑的是至近親屬的律法，波阿斯守的是律法的次序，他寧可多等一個早上，也不走捷徑。讓聖經作準則，就是在沒有人看見的半夜，仍然照神的次序走。"], ["p", "聖靈是我的引導：第三章沒有異象，沒有天使，神一次也沒有開口。可是一個婆婆的念頭、一個媳婦的勇氣、一個男人的節制，都被引導著走到同一個早晨。聖靈的引導常常不是一個聲音，是日常裡一步一步的智慧與節制。用心靠聖靈，就是在不確定的夜裡，不衝動，也不退縮。"], ["p", "讓耶穌作王：波阿斯在半夜可以自己作主，他卻把決定交給律法的次序，交給第二天城門前的見證人。路得也一樣，她沒有跟從少年人，她選的不是自己最想要的，是神的家需要的。讓耶穌作王，就是連我最渴望的東西，也不用自己的手段去抓。"], ["p", "讓耶穌得著一切的榮耀：波阿斯開口第一句是「願你蒙耶和華賜福」，不是「謝謝你看得起我」。這一章裡最好的人，嘴裡說的都是耶和華。我們幫助人的時候，也要讓人看見神的恩，而不是我們的好。"], ["p", "建立屬神的體系：第三章是兩個女人、一個男人，再加上第二天的長老和見證人。拿俄米叫路得「女兒」，像一位屬靈的母親；路得與拿俄米彼此扶持，是屬靈的同伴；城門前是一整個見證的團隊。這使我們想到 235 裡的 2 屬靈同伴與 3 屬靈父母兒女；城門前的長老與見證人，也提醒我們屬神的事需要一個團隊。屬神的體系不是一個人英雄式的拯救，是一群人各守本位，一起把一個空了的家遮蓋起來。"], ["d", ["我想成為別人的「至近的親屬」，可是我自己的能力很有限，要從哪裡開始？", "從你手裡已經有的開始。波阿斯是大財主，可是他那一夜給路得的，不過是六簸箕大麥和一句「不要懼怕」。成為至近的親屬，不是要你扛起別人的一生，而是在你的關係裡、在你的本分上，不讓一個人空手回去。可以從三件小事開始：第一，記得一個人的需要，下次見面時主動問起；第二，為他做一件實在的事，一頓飯、一次接送、一個介紹；第三，保護他的名聲，不在背後議論他的處境。如果一件事超過你的能力，就像波阿斯一樣去城門找長老，邀請教會的同工和弟兄姊妹一起承擔。你不必作別人的救主，你只要指向那一位真正的贖回者。"]], ["h", "八、四種心，都需要同一件外套"], ["p", "驕傲型的心，是那個讀第三章時急著評論路得、評論拿俄米的人：「這樣做不妥吧」「換作是我就不會」。他站在旁邊打分數，卻忘了自己也是一個需要被遮蓋的人。路得的第一句是「我是你的婢女」，驕傲的心最難說出口的，就是這一句。"], ["p", "恐懼型的心，是那個不敢開口求的人。你怕被拒絕，怕丟臉，怕別人說你不夠屬靈。請聽波阿斯對路得說的話：「現在不要懼怕」。在一位至近的親屬面前說出真實的需要，不是貪心，是信心。"], ["p", "羞恥型的心，是那個覺得自己出身不好、過去不光彩的人。路得是摩押人，是寡婦，是窮人，在伯利恆人眼中，她幾乎每一樣都不合格。可是全城的人都知道她是賢德的女子。神給你的名字，比你身上的標籤更真。"], ["p", "受傷型的心，是那些曾經在親密關係裡被傷害、被利用，甚至被侵犯的人。讀到打穀場，你可能心裡一緊。請你看見：這一章裡的男人，在夜裡選擇的是保護，不是佔有；他起誓照律法辦，天未亮就讓她平安離開。神的心意從來是遮蓋，不是羞辱。那不是你的錯。你的傷，神看見了；如果你需要有人陪，會後請私訊同工或小組長。"], ["h", "九、這一週，你可以做的幾件事"], ["p", "這一課要交給你的，不是一套追求異性的技巧，是一件要披在別人身上的外套，和一張要坐下來等候的椅子。以下五件事，請在散會前把時間、地點、名字填上。"], ["p", "第一，這一週找一個晚上，自己慢慢讀一次路得記第三章，在第九節旁邊寫一句：「主啊，求你用你的衣襟遮蓋我。」再把你此刻最需要被遮蓋的一件事具體寫出來。"], ["p", "第二，對照第二章十二節和第三章九節，寫下你最近為一個人禱告的一件事，再問自己：神是不是也要我成為這個禱告的答案？寫下一個做得到的小行動。"], ["p", "第三，想一位身邊空了的人：喪偶的長輩、獨居的寡婦、剛失業的弟兄。像波阿斯那樣不讓她空手回去，這一週帶一份實在的心意去看她，一袋米、一頓飯、一通電話都好。"], ["p", "第四，這一週若有人在你面前談論別人的婚姻、離婚或單身，練習一件事：不加一句評論，或者溫和地把話題轉開，保護那個不在場的人的名聲。"], ["p", "第五，找出一件你已經盡力、卻還沒有結果的事，寫在紙上，對神說：「我已經做了我該做的，現在我安坐等候。」然後這一週不再用焦慮去推它。"], ["p", "然後我們一起把四句話說出來。請開口說，不要只在心裡默想。"], ["p", "我宣告：我不靠自己的手段得著安身之處，我投靠在神的翅膀下。"], ["p", "我宣告：我要在本位上把真實的需要告訴神，不操縱，也不退縮。"], ["p", "我宣告：我願意成為別人禱告的答案，展開衣襟遮蓋那些空了的人。"], ["p", "我宣告：有一位贖回者不肯休息，所以我可以安坐等候。"], ["h", "十、結語"], ["p", "這一課從寒流夜裡的一件外套開始。再想像一下那個人披著別人的外套回到家，要還外套的時候，才發現口袋裡被塞了一包熱騰騰的包子，還有一張紙條：「帶回去給家裡的人。」他不只自己被溫暖，連家裡等他的人也被記得了。那就是六簸箕大麥。"], ["p", "所以這一課的焦點，不在路得有多勇敢，不在波阿斯有多完美，而在那一位藏在這一夜裡的神。祂沒有說一句話，卻藉著一個婆婆的愛、一個媳婦的請求、一個男人的節制，把一個空了的家遮蓋起來。這使我們想起那一位「為我們捨了自己，要贖我們脫離一切罪惡」（多 2:14）的主。祂成了我們的至近親屬，親自付上代價遮蓋我們；祂在十字架上說「成了」以前，沒有停下來休息。"], ["p", "我們一起低頭禱告。親愛的天父，謝謝你在我們最冷的夜裡，把衣襟展開在我們身上。我們承認，有時我們不敢開口求你，有時又太急著用自己的方法安排。求你教我們在本位上把真實的需要告訴你，盡了本分以後，安坐等候你成就。求你安慰那些為婚姻、為家庭、為將來等了很久的弟兄姊妹，也使我們成為別人禱告的答案，不讓一個空了的人空手回去。謝謝你差來那一位不肯休息的贖回者。奉主耶穌基督的名禱告，阿們。"], ["h", "十一、小組討論分享：三個化"], ["p", "這一課的成敗，在今天有多少人說出了一位身邊空了的人的名字，並且定下這一週要帶甚麼去看他。以下三個化，請組長照次序帶。"], ["m", "帶領說明：本課主軸是「在本位上求，在交託裡等」。不討論打穀場細節的猜測，不把本課變成婚戀討論，不評論任何人的單身或婚姻狀態。時間不夠時寧可縮短第一化，第二化不可省略。"], ["m", "優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"], ["s", "第一化｜內化成為觀念（約20分鐘）"], ["m", "目的：把「禱告的人成了禱告的答案」「在本位上求」「盡力以後安坐等候」三個觀念放進組員心裡。"], ["n", "1. ★ 你這一生有沒有被人「披上外套」的經驗？可能是一件外套、一頓飯、一句保護你的話。說出那個人是誰、大約在哪一年。"], ["n", "2. ★★ 第二章的「翅膀」和第三章的「衣襟」原文是同一個字。用一句話說：波阿斯怎樣成了他自己禱告的答案？"], ["n", "3. ★★★ 路得在本位上求，波阿斯在本位上讓。這一章裡，哪一個守住本位的動作最打動你？說出是哪一節。"], ["n", "4. ★ 拿俄米在第一章為兒婦求平安，在第三章親手去找安身之處。用一句話說出禱告和行動之間的關係。"], ["m", "帶領提醒：第一題可能碰到已經過世的親人，讓組員慢慢講，不催促。有人開始猜測打穀場的細節、談婚戀技巧，或評論某位單身者，就溫和地帶回「至近的親屬」和「安坐等候」。"], ["s", "第二化｜消化成為生命（約35分鐘·本課主軸）"], ["m", "目的：讓每個人說出自己最需要被遮蓋的地方，並且說出一位自己要去遮蓋的人。"], ["t", "【看】看見自己"], ["n", "5. ★★★ 在紙上寫一句：「主啊，我現在最需要被你遮蓋的是＿＿＿。」可以只寫一個詞：孤單、經濟、名聲、過去、身體。寫完不必唸出來。"], ["t", "【聽】聽神說話"], ["n", "6. ★★ 全組慢慢讀第三章九節和十八節，各讀三遍。各說一句：哪幾個字最打中你？"], ["t", "【想】想通關卡"], ["n", "7. ★★★ 安靜一分鐘，問神：「我是不敢開口求你，還是太急著自己安排？」只說是哪一種。"], ["t", "【講】說出口"], ["n", "8. ★★ 對旁邊一位說一句：「我願意安坐等候，因為有一位不肯休息的贖回者。」或者說：「我願意成為某某人禱告的答案。」只說一句。"], ["t", "【行】走一步"], ["n", "9. ★★★ 寫下這一週你不讓他空手回去的一位空了的人：名字、哪一天、帶甚麼去。唸給組員聽，請他們下次問你。"], ["m", "帶領提醒：這一化可能碰到喪偶、不孕、流產、婚姻破裂、在親密關係中受傷甚至遭受性暴力的人，也可能碰到單身多年、覺得被神遺忘、有長期無望感的人。不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，也不說「神一定會給你一個好對象」。會後單獨私訊關心，必要時協助尋求專業協助。"], ["s", "第三化｜轉化成為生活（約25分鐘）"], ["m", "目的：把這一課搬進這一週的行事曆和關係，讓「遮蓋」和「等候」都落在具體的人和時間上。"], ["n", "10. ★★★ 打開行事曆，定下這一週自己讀一次路得記第三章的時間：星期幾、幾點、在哪裡？"], ["n", "11. ★★ 你有沒有一件已經盡力、卻還沒有結果的事？說出這件事，以及這一週你要用甚麼方式把它交給神。"], ["n", "12. ★★ 這一週你可能在哪一個場合聽見別人議論他人的婚姻或家事？家庭聚餐、公司茶水間，還是群組聊天？說出你要怎樣保護那個不在場的人。"], ["n", "13. ★★★ 這是本課的 920 操練：找出你的那一個「2」——神放在你身邊、此刻像拿俄米或路得一樣空了的那一個人，也許是喪偶的長輩、獨自帶孩子的單親，或剛來的外籍同事。當場說出他的名字和這一週去看他的日子；見面時不講道理，先帶一份實在的心意。"], ["n", "14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽，並把三句話寫出來。第一句，三千多年前有一個外邦寡婦，跟著她一無所有的婆婆回到異鄉，甚麼保障都沒有。第二句，她在本位上求一位至近的親屬遮蓋她們的家，那人守住規矩，也不讓她們空手回去。第三句，我相信的神也是這樣，祂差了一位贖回者來遮蓋我，所以我可以安心等候。這一週講給一個人聽，下次回來說他的反應。"], ["m", "帶領提醒：要具體到時間、地點、人名，不收「我會找時間」。920 不是去替人做媒，也不是去勸人再婚；對方若正處在喪親初期、自傷念頭或長期無望之中，不要獨自處理，回來找組長或牧者。"], ["s", "收尾（5分鐘）"], ["p", "用五分鐘收尾。每人一句話：這一週哪一天，帶甚麼去看哪一位空了的人。只說名字、日子和那一樣東西。"], ["p", "然後為三種人指名禱告：一位剛失去配偶、還在哀傷裡的長輩；一位為婚姻或家庭等候很久、心裡疲倦的弟兄姊妹；一位在異鄉工作或生活、身邊沒有親人的朋友。"], ["p", "散會前確認紙上有三樣：那一個需要被遮蓋的詞、那一位要去看的人、自己讀第三章的時間。下次帶著這張紙來。"]]}, "4": {"no": 4, "vol": "《321路得記講義》第四課·路得記第四章", "title": "抱在懷中的孩子——門、贖、王", "chars": 4936, "min": 60, "deep": 8, "dchars": 2016, "tchars": 696, "blocks": [["h", "一、一張老人抱著孫子的照片"], ["p", "弟兄姊妹平安。想像一下一張放在客廳櫃子上的照片。照片裡是一位頭髮全白的老奶奶，坐在一張舊藤椅上，懷裡抱著一個剛滿月的嬰孩。她的手很瘦，皺紋很深，可是她抱孩子的樣子很穩，好像怕一鬆手，這個孩子就會不見。她沒有看鏡頭，她低著頭，一直看著懷裡那張小小的臉。"], ["p", "如果你認識這位老奶奶，你就知道這張照片為甚麼這麼珍貴。也許她年輕時失去過丈夫，也許她送走過自己的孩子，也許有好多年，她每天晚上一個人吃飯，以為自己的日子就這樣到底了。然後有一天，有人把一個孩子放進她懷裡。照片拍不出那些年的空，可是看她的眼神，你就知道，那些空被填起來了。"], ["p", "路得記最後一章，就停在這樣一張照片上：「拿俄米就把孩子抱在懷中，作他的養母。」（4:16）第一章那個說「耶和華使我空空地回來」（1:21）的人，現在懷裡滿了。可是在這張照片之前，還有一座城門、一個不肯贖的親屬、一隻脫下來的鞋，和一群作見證的長老。這一課的三個詞是門、贖、王：城門前的公開程序，一位付代價的贖回者，以及一份從沒有王的年代，一直寫到大衛的家譜。"], ["d", ["我家裡的長輩一直沒有孫子可抱，看到這張照片會很難過，我該怎麼講這一章才不會刺傷他們？", "這個顧慮很重要，也正是這一章要保護的人。請先記得，這一章的高潮不是「生了兒子」，而是婦人們說：「耶和華是應當稱頌的！因為今日沒有撇下你」（4:14）。神沒有撇下拿俄米，不是從孩子出生才開始的，是從路得說「你的神就是我的神」那一天就開始了。婦人們還說了一句很驚人的話：「有這兒婦比有七個兒子還好！」（4:15）在一個以兒子為命的社會裡，她們稱讚的是一個媳婦的愛。講這一章時，可以先講這一句，讓沒有孫子的長輩聽見：神看重的是愛與信實，不是血脈的數目。若長輩為此傷心很久，可以私下陪他們，不要在眾人面前講。"]], ["h", "二、原文亮光：某人、贖、使生命歸回"], ["p", "第一個字在第一節。波阿斯坐在城門口，「恰巧波阿斯所說的那至近的親屬經過」（4:1），他對那人說：「某人哪，你來坐在這裡。」「某人」原文是 פְּלֹנִי אַלְמֹנִי（peloni almoni），意思大概像中文的「某某人」「張三李四」。波阿斯當然知道他的名字，作者卻沒有寫下來。這個人在這一章裡最在意的，是保住自己的產業；經文到最後，連他的名字都沒有留下。"], ["p", "第二個字是全卷的主追蹤，גָּאַל（ga’al），「贖」。這個字在第四章出現了很多次。他先說「我肯贖」（4:4），後來說「我不能贖了」（4:6）。到這一章的最後，婦人們說神「今日沒有撇下你，使你無至近的親屬」（4:14），「至近的親屬」就是同一個字的分詞 גֹּאֵל（go’el）。你仔細讀會發現，在 4:14 被稱為至近親屬的，已經不只是波阿斯，更是那個剛出生的孩子。贖回的事，一路傳到下一代。"], ["p", "第三個字在第十五節：「他必提起你的精神」。原文是 מֵשִׁיב נֶפֶשׁ（meshiv nefesh），直譯是「使你的生命歸回的」。「歸回」就是第一章一再出現的那個 שׁוּב（shuv）。拿俄米在第一章「歸回」了，身體回到伯利恆，心卻還留在摩押的墳前。要到第四章，她的生命才真正歸回。某人、贖、使生命歸回，三個字連起來就是這一章的路：一個人保住了自己，卻沒有留下名字；一個人付了代價，贖回了別人；一個空了的人，生命終於回家。"], ["p", "第五節還有一個要誠實面對的地方。和合本作「你從拿俄米手中買這地的時候，也當娶……死人的妻摩押女子路得」（4:5）。原文寫的是 וּמֵאֵת（ume’et），「也從……」；動詞寫出來是「我買」，讀出來是「你買」。和合本照的是學者常用的改讀和讀出形，所以譯成「也當娶」；英文 WEB 照原文的「也從」與
