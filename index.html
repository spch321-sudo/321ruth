<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321路得記講義">
<meta name="application-name" content="321路得記講義">
<meta name="description" content="321路得記講義：全書四章逐節原文解經、講章逐字稿與321生命應用。">
<title>321路得記講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}
.mknote[data-c="blue"]{border-left-color:var(--hb-blue)}

<script>
/* 開機守門員：主程式若沒能在 8 秒內畫出東西，就顯示可診斷的畫面，而不是一片白 */
window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}
setTimeout(function(){
  var m = document.querySelector('main');
  if (!window.__booted && (!m || m.innerHTML.trim().length < 40)){
    var b = document.getElementById('boot');
    if (b) b.style.display = 'flex';
  }
}, 8000);
</script>

<script id="DATA" type="application/json">{"ch": [{"n": 1, "t": "你的神就是我的神", "sub": "饑、別、歸", "lv": "A", "arc": "饑荒、三座墳、三次「回去吧」、空空地回來", "sec": [["1:1--5", "饑荒與三座墳"], ["1:6--14", "起身歸回，三次「回去吧」"], ["1:15--18", "你的神就是我的神"], ["1:19--21", "不要叫我拿俄米"], ["1:22--22", "正是動手割大麥的時候"]], "serm": {"pts": [["剩下拿俄米", "1:1--5", "空的起點：糧食之家遭遇饑荒，三個男人死了，經文沒有解釋原因，只寫下「剩下」"], ["你的神就是我的神", "1:6--18", "捨己的選擇：路得跟隨的是一個已經空了的婆婆，和她的神"], ["耶和華使我空空地回來", "1:19--22", "誠實的哀歌：拿俄米說自己是空的，經文卻說正是收割大麥的時候"]]}, "q": "想像一下：桃園一間醫院的走廊上，一位從越南嫁來台灣十二年的媳婦，剛簽完丈夫的死亡證明。親戚私下勸她：「你還年輕，回越南吧，這裡已經沒有你的人了。」她轉頭看見婆婆一個人坐在長椅上——三年前，婆婆才送走了公公。\n另一位，是吉隆坡一位七十歲的姊妹，先生和獨子在兩年內相繼過世。主日有人笑著問她最近好不好，她輕輕回了一句：「不要再叫我甚麼蒙福的人了，我現在只剩下苦。」\n路得記第一章，把這兩個人放在同一條回家的路上：一位說「你的神就是我的神」（1:16），一位說「耶和華使我空空地回來」（1:21）。經文沒有先責備誰，神讓她們一起走回伯利恆。", "truth": "第一章從一場饑荒、三座墳開始，經文沒有解釋原因，只寫下「剩下拿俄米」。三次「回去吧」把人間的理由一一拿走：俄珥巴照著勸告回去，路得卻緊緊黏住，說出「你的神就是我的神」。可是一個人的委身，沒有立刻填滿另一個人的空——拿俄米說「耶和華使我空空地回來」。神沒有責備她的哀歌，敘述者只在最後輕輕加上一句：正是動手割大麥的時候。", "mv": {"t": "路得說：「不要催我回去不跟隨你。你往哪裡去，我也往那裡去；你在哪裡住宿，我也在那裡住宿；你的國就是我的國，你的神就是我的神。", "r": "得1:16"}, "card": ["二十二節，從「當士師秉政的時候」開始，那是沒有王、各人任意而行的年代。糧食之家伯利恆遭遇饑荒，以利米勒帶著一家往摩押寄居；十年之間，三個男人相繼死了，「剩下拿俄米，沒有丈夫，也沒有兒子」（1:5）。後來她在摩押聽見耶和華眷顧自己的百姓，就起身歸回。路上她三次對兒婦說「回去吧」：俄珥巴親嘴而別，路得卻捨不得，說出「你的神就是我的神」（1:16）。回到伯利恆，合城驚訝，拿俄米說：不要叫我甜，要叫我苦。全章最後一句是：正是動手割大麥的時候。這一章講的是：饑、別、歸。", "第一章的骨幹是一個字：שׁוּב（shuv），歸回、回去、回來，一章之內出現十二次。拿俄米要「歸回」（1:6），卻三次叫兒婦「回去」（1:8、11、12）；俄珥巴回了她的本國和她所拜的神；路得說「不要催我回去」（1:16）；拿俄米說耶和華使她「空空地回來」（1:21）。同一個字，對俄珥巴是回到原處，對拿俄米是回到傷心地，對從沒住過猶大的路得，卻是生平第一次的「歸向」。1:16 最後兩句原文沒有動詞，只有四個字：עַמֵּךְ עַמִּי וֵאלֹהַיִךְ אֱלֹהָי，「你的百姓，我的百姓；你的神，我的神」。那不是一句情緒的話，是一句身分的宣告。", "這一章有三個女人，沒有一個是壞人。拿俄米失去了丈夫和兩個兒子，開口第一句卻是為兒婦祝福：「願耶和華恩待你們，像你們恩待已死的人與我一樣」（1:8）；她叫她們回去，是一位母親算盡了一切，算出跟著她沒有將來。俄珥巴哭了兩次，也說過要同去，最後是照著婆婆三次的勸告「親嘴而別」，經文沒有一句責備她。路得的不同只在一個字：「捨不得」，原文 דָּבַק，就是創世記「與妻子連合」的那個字。她不是比較乖的媳婦，她是超過本分、緊緊黏住的那一個。三個人站在同一條路上，作了不同的選擇；經文要我們看懂每一個人，不是替她們打分數。", "第一章裡，敘述者只親口說了一次神作了甚麼：拿俄米「聽見耶和華眷顧自己的百姓，賜糧食與他們」（1:6）。全卷這樣直接寫神的作為，只有這裡與 4:13。其餘的時候，神藏在人的話裡：拿俄米的祝福、路得的起誓、拿俄米的哀歌，每一句的主詞都是耶和華。「眷顧」原文 פָּקַד，是神親自來察看、來照顧的字，常常出現在人以為神已經忘了的時候。寫三座墳的時候，經文沒有提神的名，可是神沒有不在。最後一節，祂也沒有開口，只讓田熟了：「正是動手割大麥的時候」（1:22）。神在第一章幾乎不說話，卻一直在作工。", "路得說「你在哪裡死，我也在那裡死，也葬在那裡」（1:17），跟隨一個已經空了的人，一直跟到墳墓。這使我們想起主耶穌說：「若有人要跟從我，就當捨己，天天背起他的十字架來跟從我」（路 9:23）。但福音比這更深：路得是跟隨到死的人，主耶穌是為我們死的那一位。拿俄米說全能者使她受了大苦；主耶穌在十字架上也大聲喊著：「我的神！我的神！為什麼離棄我？」（太 27:46）祂親自走進最深的哀歌裡。新約自己把這個摩押女子寫進了彌賽亞的家譜：「波阿斯從路得氏生俄備得」（太 1:5）。一個空手的外邦寡婦，被接進了那位王的家裡。", "這一章向今天的我們提出三個挑戰。第一，不要替神解釋別人的墳墓：經文對三個男人的死一句因果也沒有說，我們也不要說。第二，容許受苦的人說真話：拿俄米對神哭，對伯利恆的婦女說「要叫我瑪拉」，經文沒有糾正她；我們身邊的拿俄米也不需要被糾正，她需要有人陪她走回家。第三，作一個「捨不得」的人：路得沒有等拿俄米變甜才留下，她跟隨的是一個苦的人。這一週，想一想你身邊有沒有一個剛剛「被剩下」的人——喪偶的長輩、獨自留在異鄉的外籍配偶、送走孩子的父母。你可以不講大道理，只是同行一段路。", "最終整合：一條從摩押到伯利恆的路，\n走出去的是四個人，\n回來的是兩個寡婦。\n三座墳留在摩押的田野，\n經文沒有說為甚麼。\n婆婆在路上停下來，\n三次說：回去吧，\n我已經沒有甚麼可以給你們了。\n一個媳婦親了她，轉身回家，\n那正是婆婆要她作的事。\n另一個卻緊緊黏住她，\n說：你往哪裡去，我也往那裡去；\n你的百姓，就是我的百姓；\n你的神，就是我的神。\n她不是跟隨一個有前途的人，\n是跟隨一個空了的人，\n和那個空了的人仍然呼求的神。\n婆婆沒有回答，\n一路沉默到城門口，\n說：不要叫我甜，叫我苦。\n沒有人糾正她。\n可是城外的大麥，\n正一片一片地黃了。\n你也許是那個說「我空了」的人，\n也許是那個要決定留不留下的人。\n神沒有等她們變好，\n祂已經在伯利恆，\n預備了一片田。"], "self": "這一章照出來的「有己」，不在拿俄米的眼淚裡，而在讀經的人心裡。第一張臉是審判者：看見別人家裡三座墳，就忍不住找原因——「是不是因為他們離開了伯利恆」；經文沉默的地方，我們替神開了口。第二張臉是會計師：委身之前先算前途，有保障才跟隨；路得卻跟隨了一個說「我沒有甚麼可以給你」的人。第三張臉是糾正者：聽見受苦的人說全能者使他受了大苦，就急著叫他要感恩、要喜樂，好像我們比神更怕聽真話。第四張臉是旁觀者：讀完說「我一定是路得，不會是俄珥巴」，把一個照勸告回去的女人當成反面教材，好抬高自己。\n苦是真的，它也會把人關在自己的算術裡；但這一章沒有叫拿俄米先改好了再回家。神把焦點挪開的方法，是讓我們看見祂自己：在摩押也聽得見的眷顧，在路上被一個外邦女子呼求的名，和在城外悄悄熟了的大麥。焦點回到祂身上，人才有力氣同行。", "t321": {"k": "耶穌是我的榜樣：路得的跟隨沒有附帶條件：「你在哪裡死，我也在那裡死，也葬在那裡」（1:17）。她把自己的將來，綁在一個空了的人身上。主耶穌走得更遠：祂「本有神的形像，不以自己與神同等為強奪的；反倒虛己，取了奴僕的形像」（腓 2:6–7），不只陪人走回家，更親自進入人的死亡。祂也哭過，在拉撒路的墳前，「耶穌哭了」（約 11:35）。學祂，是學兩件事：像祂一樣，不撇下那個被剩下的人；也像祂一樣，不急著解釋別人的眼淚，先與哀哭的人同哭。", "g": "讓耶穌作王：以利米勒的名字意思是「我的神是王」，他卻活在一個「沒有王」的年代；敘述者沒有評論他的去留，只記下他的名字。路得正好從另一頭走來：她生在基抹的地界，卻說「你的神就是我的神」（1:16），下一句就指著耶和華的名起誓。這是一次主權的轉移，不是換一個婆婆，是換一位主人。讓耶穌作王，不是在順境裡把祂的名字掛上牆，是在看不見前途的路上說：不管往哪裡去、在哪裡住宿，我的神是祂。哭的時候也一樣，拿俄米的哀歌仍然是對著耶和華說的。", "p": "建立屬神的體系：第一章的伯利恆有一群婦人，她們問「這是拿俄米嗎」；到第四章，也是她們說「耶和華是應當稱頌的」。屬神的群體，是一個容得下哀歌、也等得到頌讚的地方。教會可以照這個樣子問自己。第一，留一個位子給「被剩下」的人：喪偶的長者、獨自留在異鄉的外籍配偶，至少有一個人固定陪她。第二，用 235 搭配：讓一位成熟的姊妹與一位剛經歷失去的人成為「2」屬靈同伴，不是去教導，是同行。第三，接納「摩押女子」：不要求新來的人抹掉出身，只陪她歸向神。"}, "grp": ["【一、破冰】你有沒有搬過家、出過國，或離開家鄉很久之後再回去？回去的那一天，第一個認出你的人是誰？他對你說了甚麼？", "【二、扎心】1:20 拿俄米說「不要叫我拿俄米……要叫我瑪拉」。如果用一個字形容你最近的日子，你會選哪一個字？不必解釋，說出那個字就好；說不出來，也可以只說「跳過」。", "【三、福音】路得跟隨的是一個「空了」的婆婆，和她的神（1:16）。你當初信主或回到神面前的時候，身邊有沒有一個人——不完美、甚至正在受苦，卻讓你看見了神？說出他的名字，和他作過的一件事。", "【四、行動】這一週，你身邊有沒有一位剛剛「被剩下」的人——喪偶、失去孩子、獨自在異鄉？你要在哪一天、用甚麼方式陪他一段路：一通電話、一頓飯、陪他去一個地方？說出名字和時間。", "【五、代禱】為三種人指名禱告：一位剛失去配偶或孩子的人；一位嫁到異國、在夫家沒有娘家可回的姊妹；一位覺得神使他空空的、正對著神哭的人。求神親自眷顧他們，也差我們成為與他們同行的人。"], "prac": {"main": "這一週，作一個「捨不得」的人：陪一位被剩下的人走一段路，並且容許他對神、對你說真話。", "items": ["對神：每天讀一段本章（1:1--5、1:6--14、1:15--18、1:19--21、1:22，一天一段），讀完向神說一句真話；若你也覺得空，就照拿俄米的樣子對祂說，不必修飾，祂承受得起。", "對自己：在筆記本寫下你人生中一段「滿滿地出去，空空地回來」的經歷，再在旁邊寫一行：那時候，神把誰放在我身邊？寫上他的名字。", "對人：找出一位剛經歷失去的人，打一通電話或陪他吃一頓飯；只聽，不解釋原因，不說「你要喜樂」，最後問他一句：我可以為你禱告嗎？", "對生活：檢查你最近作的一個決定：是因為「有前途」才作，還是因為「神在那裡」才作？挑一件這週可以照 1:16 的方向調整的小事，去作。", "對使命：在小組或教會裡認識一位外籍配偶、移工或新住民，記住她的名字，邀請她吃一頓飯；不要求她改變出身，只讓她知道這裡有人歡迎她。"]}, "safe": ["① 錯誤講法——把 1:1–5 講成因果報應：「以利米勒不信靠神、下摩押，所以三個男人都死了」。", "經文只用連續敘事寫「死了」，沒有一個「因為」；神的名字在 1:6 以前根本沒有出現（紅線三）。亞伯蘭也曾因饑荒下埃及（創 12:10），聖經沒有因此判他死罪。替經文加上因果，是替神說了祂沒有說的話。", "檢驗標準：一位丈夫剛在異鄉工作時過世的姊妹聽完，是覺得被神看見，還是開始懷疑「是不是我們搬錯了地方」？", "② 錯誤講法——把 1:4–5「住了約有十年」、沒有孩子，講成神關閉了她們的胎，是因為異族通婚、離開應許之地的審判。", "經文只記十年，沒有記任何審判的話；把不孕、喪偶講成神的審判，正是約伯的朋友犯的錯（紅線三）。神在 4:13 親自「使她懷孕」，那是恩典的作為，不是懲罰終於解除。", "檢驗標準：一對結婚多年、一直沒有孩子的夫妻坐在台下聽完，是覺得被神審判，還是覺得神看見了他們的等待？", "③ 錯誤講法——把 1:1「國中遭遇饑荒」直接講成神審判以色列的罪，再套到今天：「哪裡有天災、疫情，就是那裡的人得罪了神」。", "士師時代確實有管教的循環，但路得記本身沒有說這場饑荒的原因；經文只說後來「耶和華眷顧自己的百姓」（1:6）。把災難直接對號入座，會讓受災的人加上罪咎，也讓講台變成審判台。", "檢驗標準：一位家鄉剛遭遇水災或地震的弟兄姊妹聽完，是覺得神在懲罰他的家鄉，還是知道神仍然要眷顧那地的人？", "④ 錯誤講法——責備拿俄米：「她在埋怨神，她信心軟弱、太消極，我們不要像她那樣怨天尤人」。", "敘述者沒有一句責備她，伯利恆的婦人沒有反駁她，神也沒有斥責她（紅線四）。她對著神說「全能者使我受了大苦」，這是哀歌，是信心的一種形式；約伯也說「全能者使我心中愁苦」（伯 27:2）。經文的回應是 1:22 的大麥田與 4:14–15 的頌讚，不是糾正。", "檢驗標準：一位正在哭著問「神為甚麼這樣待我」的姊妹聽完，是覺得自己的眼淚被定罪，還是知道可以把真話帶到神面前？", "⑤ 錯誤講法——對受苦的人說：「不要埋怨，要喜樂；凡事謝恩，苦難都是祝福」，催他快一點走出來。", "拿俄米從第 1 章說「全能者使我受了大苦」，到第 2 章才說「願那人蒙耶和華賜福」（2:20），到第 4 章才聽見婦人們的稱頌——神給了她一整個收割季。聖經說「與哀哭的人要同哭」（羅 12:15），沒有說要糾正哀哭的人。把苦難美化成祝福，會讓人把傷口藏起來。", "檢驗標準：一位剛失去孩子的父親聽完，是覺得必須在教會裡裝作沒事，還是覺得這裡有人願意陪他一起哭？", "⑥ 錯誤講法——把 1:16 講成孝道條款：「好媳婦就該像路得一樣，婆婆去哪裡就跟到哪裡，婆婆說甚麼都要順從」。", "1:16 的落點是「你的神就是我的神」，下一節她就指著耶和華的名起誓（紅線五）；而且路得是在拿俄米三次勸她回去之後，違背了婆婆的意思留下來。這是對神的委身，不是對婆婆的順從。", "檢驗標準：一位與婆婆關係緊張、正在家裡受委屈的媳婦聽完，是覺得又多了一條屬靈的枷鎖，還是聽見神邀請她先歸向祂？", "⑦ 錯誤講法——把俄珥巴講成反面人物：「她是失敗的榜樣，貪戀世界、回頭拜偶像，就像羅得的妻子」。", "經文沒有一句責備俄珥巴；她哭了兩次、說過要同去（1:10），最後是照拿俄米三次的勸告回去的（紅線五）。「親嘴而別」是合禮的告別。把她講成反面教材，是讓聽眾踩著一個人抬高自己。", "檢驗標準：一位當年因為家庭壓力離開教會、最近才回來的人聽完，是覺得自己被貼上叛徒的標籤，還是知道神仍然等著他？", "⑧ 錯誤講法——用「摩押」講民族優劣：「摩押是亂倫生的民族、是下等人，路得能被接納，是因為她脫離了那個民族」。", "經文一直稱她「摩押女子路得」（1:22），一次也沒有抹掉她的出身；神接納她，不需要她假裝自己不是摩押人（紅線六）。把族群講成高低，會傷到台下的新住民、外籍配偶與移工。神不看你從哪裡來，看你歸向誰。", "檢驗標準：一位從印尼或越南嫁到台灣、馬來西亞的姊妹聽完，是覺得被接納，還是覺得自己的出身被說成羞恥？", "⑨ 錯誤講法——反過來，用路得取消神的聖潔要求：「路得的故事證明律法不算數了，申命記的禁令根本不必理會」。", "「摩押人不可入耶和華的會」（申 23:3）的難處必須並陳：有只禁男子說、入會指公共集會說、恩典勝過禁令說（紅線六）。神的聖潔沒有放鬆，恩典也沒有關門；路得是以「你的神就是我的神」的身分被接納的。", "檢驗標準：會眾聽完，是更看重神的聖潔與恩典，還是學會用一個故事把不喜歡的經文一筆勾銷？", "⑩ 錯誤講法——把 1:15「回她本國和她所拜的神那裡去」講成：「拿俄米都說了，拜哪一位神都一樣，回到娘家的信仰也可以」。", "拿俄米是說出當時人人都知道的事實：回摩押就是回到基抹的權下；正因為這句話把選擇攤開，路得的回答才成為對耶和華的選擇。把這句話講成宗教多元的認可，就把 1:16 的委身講空了；反過來，也不要把拿俄米講成勸人拜偶像的罪人。", "檢驗標準：一位家裡有其他宗教背景、正在考慮信主的朋友聽完，是更清楚跟隨耶和華的意思，還是覺得信甚麼都沒有差別？", "⑪ 錯誤講法——把 1:17「願耶和華重重地降罰與我」當成信徒起誓的範本，鼓勵人在聚會中發重誓、立血誓表忠心。", "這是古代以色列的起誓公式（撒上 20:13），重點是路得第一次呼求「耶和華」的名，不是起誓的方式。主耶穌教導「是，就說是；不是，就說不是」（太 5:37）。用重誓逼人表態，會把委身變成恐懼。", "檢驗標準：一位剛決志的初信者聽完，是覺得要發毒誓才算真跟隨，還是知道路得的重點在她選擇了哪一位神？", "⑫ 錯誤講法——把路得講成照顧者的模範：「真正的愛就是像路得一樣犧牲到底，媳婦照顧婆婆、照顧長輩，不可喊累、不可求助」。", "路得的捨不得是她自己的委身，不是經文要求每一個照顧者的標準；第 2 章她也要出門拾穗，第 4 章有整個社群一起承接這個家。把 1:16 變成長照的道德要求，會壓垮正在照顧失智父母、公婆的人。", "檢驗標準：一位已經連續照顧中風婆婆三年、身心俱疲的媳婦聽完，是更覺得內疚，還是知道可以請教會一起分擔？", "⑬ 錯誤講法——把 1:9「各在新夫家中得平安」講成：「寡婦或單身的人要再婚才有平安，所以要積極找對象」。", "拿俄米是在古代社會裡為兒婦求一個有保障的家，這是她愛的禱告，不是給今天每一個人的婚姻指令。路得記不是婚戀教材（紅線二）；伯利恆的婦人們對拿俄米說「有這兒婦比有七個兒子還好」（4:15），一個人的價值不在有沒有丈夫或兒子。", "檢驗標準：一位喪偶多年、不打算再婚的姊妹聽完，是覺得自己被當成「還沒有平安的人」，還是覺得神在她現在的身分裡就看見她？", "⑭ 錯誤講法——把 1:22「正是動手割大麥的時候」講成成功神學，或寓意化：「大麥代表豐收的祝福，只要回到教會，馬上就會轉運」。", "1:22 是時間的標記，不是逐項的寓意（紅線一）；收割季也不是成功的應許，路得還要在別人田裡彎腰拾穗（紅線七）。這句話的溫柔在於：拿俄米說自己是空的，經文讓我們看見田已經熟了。", "檢驗標準：一位回到教會半年、處境仍然沒有改變的弟兄聽完，是覺得自己回來錯了，還是知道神正在他看不見的地方預備？", "⑮ 錯誤講法——一講到 1:16 就直接跳到 321：「這就是無己、這就是讓耶穌作王」，沒有先講摩押、寡婦、無子的處境。", "鐵律五：不把經文當成 321 的插圖。路得的話之所以有分量，是因為她剛埋葬丈夫、沒有孩子、拿俄米說沒有兒子可以給她；先把這些講完，321 才在末端接上。跳過處境，1:16 會變成一句口號。", "檢驗標準：會眾聽完，記得的是路得站在哪裡、付了甚麼代價，還是只記得講員又講了一次 321 的口號？"]}, {"n": 2, "t": "投靠耶和華－以色列神的翅膀下", "sub": "拾、恩、名", "lv": "A", "arc": "恰巧、田間的恩典、翅膀、一伊法大麥、至近的親屬", "sec": [["2:1--3", "恰巧到了波阿斯的田"], ["2:4--7", "願耶和華與你們同在"], ["2:8--13", "投靠神的翅膀下"], ["2:14--17", "吃飽了，還有餘剩"], ["2:18--23", "是一個至近的親屬"]], "serm": {"pts": [["她恰巧到了", "2:1--7", "神藏在日常裡：一個外邦寡婦去拾穗，走進了一位親族的田"], ["投靠……翅膀下", "2:8--16", "比律法更多的恩典：波阿斯的禱告與慷慨"], ["是一個至近的親屬", "2:17--23", "盼望有了名字：拿俄米的口重新說出祝福"]]}, "q": "想像一下，一位從印尼嫁到台中的姊妹，丈夫三年前車禍走了。她留在婆家，白天在市場幫人切菜，晚上照顧中風的婆婆。她的中文還帶著口音，每次到教會，總是坐最後一排，散會前就先走。有一天，一位阿姨叫出了她的名字，問她：「你吃飯了沒有？」她站在門口，說不出話。\n另一位是在新加坡工地做工的弟兄，每天早上五點出門，在別人的地上蓋別人的房子。他常想：在這裡，有沒有一個人知道我是誰？\n路得記第二章，就是這樣一個人的一天：一個摩押寡婦，彎著腰，在別人的田裡撿別人掉下的麥穗。她問：「我既是外邦人，怎麼蒙你的恩，這樣顧恤我呢？」（2:10）神沒有出聲，卻在一塊田的田角，等著看見她。", "truth": "神沒有在第二章說一句話，卻藏在一個人撿麥穗的路上：她「恰巧」走進了波阿斯的田。一個外邦寡婦求的只是在誰的眼中蒙恩，得到的卻是安全、桌邊的位子、比律法更多的穗子，和一句把她指向神的禱告：投靠在耶和華的翅膀下。晚上，一個名字讓拿俄米的口重新說出祝福——耶和華沒有撇下祂的慈愛；那人是一個至近的親屬。", "mv": {"t": "願耶和華照你所行的賞賜你。你來投靠耶和華－以色列神的翅膀下，願你滿得他的賞賜。」", "r": "得2:12"}, "card": ["二十三節，是一個寡婦的一天。敘述者先插一句話：拿俄米的丈夫家裡有一個人，名叫波阿斯。然後路得出門，求的只是「在誰的眼中蒙恩」；她恰巧走進了波阿斯的田。波阿斯從伯利恆來，先祝福工人，再問那女子是誰，接著給她安全、給她水、給她一句禱告：「你來投靠耶和華－以色列神的翅膀下」（2:12）。中午她被請到桌邊，吃飽了還有餘剩；下午，僕人故意從捆裡抽出穗子留給她。晚上，她扛著一伊法大麥回家，說出一個名字，拿俄米的口重新有了祝福：那人是一個至近的親屬。這一章講的是：拾、恩、名。", "本章有三個字值得放進口袋。第一是「恰巧」，原文 וַיִּקֶר מִקְרֶהָ，直譯「她的機遇遇上了」——作者用一個最不屬靈的字，講一件最屬靈的事。第二是「翅膀」כָּנָף（kanaf）。波阿斯求神讓路得在祂翅膀底下得庇護；到了第三章，路得對他說「求你用你的衣襟遮蓋我」（3:9），「衣襟」正是同一個字。波阿斯成了他自己禱告的答案。第三是「至近的親屬」גֹּאֵל（go’el），在 2:20 第一次出現，而且就和 חֶסֶד（慈愛、恩待）放在同一節。前半卷是「空」，從這一節起，盼望有了名字。你為別人禱告的那件事，神也許正要差你自己去。", "路得是一個沒有身分的人：寡婦、外邦人、窮人、女人，在收割的男工之間獨自彎腰。僕人介紹她時兩次提到摩押；她自己說「我既是外邦人」，又說「我雖然不及你的一個使女」（2:13）。她蒙恩越多，越把自己放低，卻沒有自卑到不敢開口：她先請求，然後從早晨一直站到波阿斯來，又拾取到晚上。波阿斯是一位「大財主」，卻親手把穗子遞給撿穗的人。拿俄米還在第一章的痛裡，早上只說了一句「女兒啊，你只管去」（2:2）；晚上，她開始祝福、開始看顧媳婦。三個人都沒有離開自己的本位，卻都比早上多了一點盼望。", "敘述者在這一章沒有一次寫「耶和華做了甚麼」；全卷只有 1:6 與 4:13 直說神的作為。可是神一直在：在 2:1 讀者先知道的那個名字裡，在「恰巧」那一步裡，在工人與田主彼此祝福的那句話裡，在波阿斯的禱告裡，也在拿俄米重新說出的「耶和華」裡。神沒有取消路得的選擇，也沒有取消她的勞苦；祂讓一個人的慈愛成了祂慈愛的手。所以 2:20 的「他」最自然指耶和華，而祂的恩待正是藉著波阿斯臨到。神不說話的日子，不等於神不做工的日子。", "「投靠……翅膀下」這幅畫，主耶穌親口用過：「我多次願意聚集你的兒女，好像母雞把小雞聚集在翅膀底下，只是你們不願意」（太 23:37）。路得願意，所以她來了。新約沒有說波阿斯預表基督，只把他寫進家譜：「波阿斯從路得氏生俄備得」（太 1:5）——一個摩押寡婦的名字，被寫進了彌賽亞的家譜。「至近的親屬」這個身分，使我們想起那位「凡事該與他的弟兄相同」（來 2:17）的主：祂不只給我們田角的穗子，祂「本來富足，卻為你們成了貧窮」（林後 8:9）。", "這一章向今天的教會問三個問題。第一，我們的田有沒有留田角？律法說「不可割盡田角」（利 19:9），波阿斯卻故意多留。教會的時間、預算、座位，有沒有為新住民、外籍配偶、移工、獨居的長者留下一角？第二，我們的田安不安全？「我已經吩咐僕人不可欺負你」（2:9）——一個弱勢的人走進我們中間，會不會被冷落、被利用、被騷擾？第三，我們有沒有把人請到桌邊？給東西容易，給一個位子、叫出一個名字，難得多。恩典最深的地方，是被看見。", "最終整合：一塊收割過的麥田，\n田角留著一點沒割的麥子。\n一個外邦寡婦彎著腰，\n從早晨撿到晚上，\n不知道田主是誰，\n只求在誰的眼中蒙恩。\n田主卻先知道了她的名聲，\n叫僕人不可碰她，\n請她到桌邊吃餅，\n又悄悄從捆裡抽出麥穗，\n故意掉在她的腳前。\n他沒有說「你來投靠我」，\n他說：你來投靠耶和華的翅膀下。\n晚上，她扛著一伊法大麥進城，\n帶回午飯剩下的一份，\n說出一個名字。\n那個說「空空地回來」的婆婆，\n第一次說：願那人蒙耶和華賜福。\n神整天沒有出聲，\n祂的翅膀卻一直張開在那塊田上。\n你今天撿的也許只是別人剩下的，\n但你不是在運氣裡撿，\n你是在祂的翅膀底下撿。"], "self": "這一章照出來的「有己」有幾張臉。第一張是「我配」：把恩典當成工錢，覺得自己勤快、敬虔，所以理當遇到好人好事；路得卻越蒙恩越俯伏。第二張是「我施捨」：給人東西的時候，順便讓人知道是誰給的，把幫助變成居高臨下；波阿斯卻吩咐僕人不可羞辱她，讓她照樣自己「拾取」。第三張是「我的田」：只問律法最少要我做到哪裡，不問我還可以多留下甚麼。第四張是「我看不見」：教會裡天天有坐在最後一排的人，我卻從來不知道他的名字。\n還有一張更安靜的臉：受苦太久，以為神已經不在，於是只相信自己算出來的結論。神在這一章挪開焦點的方法，不是責備，是讓人看見祂的翅膀一直張開：在「恰巧」裡、在一句禱告裡、在一伊法大麥裡。焦點從「我配不配」「我有沒有」挪回那位沒有撇下慈愛的神，人才會像路得一樣俯伏，像拿俄米一樣重新祝福。", "t321": {"k": "耶穌是我的榜樣：波阿斯是大財主，中午卻親手把烘了的穗子遞給一個撿穗的外邦寡婦；他沒有把她叫到自己面前謝恩，反而把她指向神的翅膀。主耶穌說：「人子來，並不是要受人的服事，乃是要服事人，並且要捨命作多人的贖價」（可 10:45）。波阿斯給的是田角與一伊法大麥，主給的是祂自己。學祂，不是先學慷慨的手法，是先學祂的眼睛：在人群裡看見那個沒有人看見的人，叫得出他的名字，請他坐到桌邊，並且不讓他覺得自己是乞丐。", "g": "讓耶穌作王：路得記的人行「自己眼中」看為對的事；路得出門時說的卻是「我蒙誰的恩」，原文「在誰的眼中蒙恩」。她把評價自己的權柄交出去，不再用自己算出來的結論定自己的價值。讓耶穌作王，就是每天早上像路得一樣出門：不靠運氣，也不靠自己的盤算，忠心做今天這一份卑微的工，把「恰巧」交在祂手裡。波阿斯也一樣：他有田、有權、有名聲，卻在第一句話就說「願耶和華與你們同在」，讓神作那塊田真正的主人。", "p": "建立屬神的體系：伯利恆的這塊田，是一個小小的屬神群體：上下用神的名彼此祝福，弱者有安全，外人有水喝，吃飯時有一個位子，工作的規矩留下了田角。教會可以照這個樣子問自己。第一，留田角：預算、時間、人手，固定留一份給新住民、移工、獨居長者。第二，立規矩保護人：不可欺負、不可羞辱、不可叱嚇，弱勢的人在我們中間是安全的。第三，用名字建立關係：每一位第一次來的人，至少有一個人記得他的名字。人比事重要，關係比收成重要。"}, "grp": ["【一、破冰】你一生中有沒有一次「恰巧」——恰巧遇見一個人、恰巧走進一個地方——後來回頭看，改變了你的方向？用一句話說出那是哪一年、在哪裡。", "【二、扎心】2:10 路得說：「我既是外邦人，怎麼蒙你的恩，這樣顧恤我呢？」你有沒有一段日子，覺得自己在一個地方是「外人」，沒有人知道你的名字？那時第一個叫出你名字的人是誰？", "【三、福音】波阿斯沒有說「你來投靠我」，他說「你來投靠耶和華－以色列神的翅膀下」（2:12）。你現在生命裡最需要躲到神翅膀底下的一件事是甚麼？用一個詞說出來就好，不必講細節。", "【四、行動】在你的教會、公司或社區裡，有沒有一位像路得一樣坐在最後一排、你還叫不出名字的人？這一週你要在哪一天、用甚麼方式（一通電話、一頓飯、一句問候）認識他？說出時間。", "【五、代禱】為三種人指名禱告：一位在異鄉工作或嫁到異鄉的新住民、移工；一位喪偶後獨自撐著一個家的弟兄姊妹；一位像拿俄米一樣，覺得神已經不再恩待自己的人。求神讓他們這一週就遇見一個「恰巧」，被一個人看見。"], "prac": {"main": "這一週，學波阿斯的眼睛與路得的腳步：忠心做好每天那一份卑微的工，並在你的「田」裡為一位外人留下田角、叫出他的名字。", "items": ["對神：每天讀一段本章（2:1--3、2:4--7、2:8--13、2:14--17、2:18--23，一天一段）。每晚睡前問一句：「主啊，今天你藉著誰看見了我？」寫下一個名字或一件小事。", "對自己：寫下你最近一次覺得「我配得」或「我不配」的時刻。把它帶到 2:12 前面，對神說：我所得的不是工錢，是投靠你翅膀下的恩典。", "對人：在教會或公司找一位你還叫不出名字的人，這週記住他的名字，並請他喝一杯飲料或吃一頓飯。只聽他說，不急著給建議。這個人就是你這一季的「2」。", "對生活：檢查你的時間、錢包和冰箱，刻意留下一個「田角」——一筆固定的小錢、一小時、一份多煮的飯——給一位需要的人，給的時候不讓他覺得自己是乞丐。", "對使命：和小組或同工一起，列出你們群體中的「路得」：新住民、外籍配偶、移工、喪偶長者。挑一件事開始做：一個接送、一次翻譯、一份固定的探訪名單。"]}, "safe": ["① 錯誤講法——把「恰巧」講成成功神學：「只要你像路得一樣敬虔、勤快，神就會讓你恰巧遇到貴人，遇到有錢的老闆」。", "路得是在「拾取麥穗」——在最卑微的工作裡，在別人身後撿別人掉下的東西；經文沒有應許每一個勤快的人都會遇到波阿斯（紅線七）。講成公式，會讓正在失業、被剝削的人以為自己不夠敬虔，也讓「恰巧」變成可以操作的投資。", "檢驗標準：一位做了十年粗工、從來沒有遇到「貴人」的移工聽完，是覺得自己被神看見，還是覺得自己被神漏掉了？", "② 錯誤講法——反過來，把「恰巧」講成命定論：「路得的每一步早就被定死了，她只是照劇本走」，叫人甚麼都不必選、不必做。", "經文用最平常的動詞寫路得自己出門、自己開口請求、自己從早晨站到晚上；神的護理沒有取消她的選擇與勞苦（2:2、7、17）。講成命定，人會把懶散當成交託，也會把別人造成的傷害說成「這是神定的」。", "檢驗標準：會眾聽完，是更願意忠心地走今天這一步，還是覺得反正一切早定好了？", "③ 錯誤講法——把第二章講成戀愛指南：「路得去田間其實是去找對象」「單身姊妹要像路得一樣，等候你的波阿斯出現」。", "路得出門是為了讓兩個寡婦有飯吃；她求的是「在誰的眼中蒙恩」，不是求偶。本章的焦點是神藉人的慈愛供應弱者，不是一段浪漫史（紅線二；鐵律六：果效是忍耐，不是浪漫）。", "檢驗標準：一位單身多年、正在為婚姻禱告的姊妹聽完，是被安慰，還是覺得自己又被催了一次？", "④ 錯誤講法——把波阿斯講成擇偶條件：「男生要像波阿斯一樣有錢有品」「姊妹要找一位大財主」。", "「大財主」原文 גִּבּוֹר חַיִל 的重點是分量與品格，同一個 חַיִל 在 3:11 用在一個沒有地的摩押寡婦身上：「你是個賢德的女子」。經文量人的尺是品格，不是存款；把波阿斯講成擇偶清單，正是紅線二要擋住的。", "檢驗標準：一位收入不高、正在認真愛家的年輕弟兄聽完，是覺得自己可以學波阿斯的眼睛，還是覺得自己不夠格被愛？", "⑤ 錯誤講法——用「摩押」「外邦人」講種族標籤：「外邦人就是比較低」，或反過來「以色列人都很排外，只有波阿斯好」。", "經文一直稱她「摩押女子路得」（2:2、21），沒有抹掉她的出身，也沒有因此看輕她；接納她的是一整塊田的人，不只是波阿斯。講成族群優劣，會在團契裡分出本地人與外地人（紅線六）。", "檢驗標準：一位在馬來西亞、新加坡或台灣的新住民、外籍配偶或移工聽完，是覺得被接納，還是又被貼了一次標籤？", "⑥ 錯誤講法——用路得取消神的聖潔要求：「你看，摩押人也可以進來，所以申命記那條律法根本不算數」。", "申 23:3 說「摩押人不可入耶和華的會」，這個難處要並陳：只禁摩押男子、「入會」指公共集會、恩典勝過禁令三說各有理由與難處。共同的落點是：路得是以「你的神就是我的神」（1:16）的身分被接納的，不是聖潔的要求被取消了（紅線六）。", "檢驗標準：會眾聽完，是更敬畏那位既聖潔又恩待外人的神，還是覺得律法可以隨意挑著聽？", "⑦ 錯誤講法——拿拿俄米來對比：「你看，拿俄米早上只會說一句話、第一章還在發怨言，到 2:20 才終於有信心」。", "敘述者沒有一句責備她；她在第一章是對著耶和華哭，哀歌是信心的一種形式。2:2 她叫路得「女兒」，已經是愛；2:20 是觀點先改變，處境還沒有改變（紅線四）。把她講成反面，正在哀哭的人會以為自己的眼淚是罪。", "檢驗標準：一位剛失去配偶、還說不出感恩的長者聽完，是覺得自己的眼淚被接住，還是覺得自己又不屬靈了？", "⑧ 錯誤講法——把拾穗講成「窮人要像路得一樣勤快，才配得幫助」，用來論斷領救濟的人懶惰。", "律法留田角是給「窮人和寄居的」（利 19:10），不是給通過勤勞考試的人；波阿斯親口說出的理由，是她怎樣待婆婆（2:11），不是她撿了多少，而他給的恩典遠超過她的工作量。把恩典改寫成獎勵，會讓病弱、年老、做不動的人羞於求助。", "檢驗標準：一位因病不能工作、正在領補助的弟兄姊妹聽完，是覺得教會是他可以開口的地方，還是覺得自己必須先證明自己不懶？", "⑨ 錯誤講法——把波阿斯的慷慨講成募款壓力：「波阿斯給得比律法多，所以你的奉獻也不能只有十分之一，要更多」。", "波阿斯的多給是愛的流露，不是被要求的額度；新約說「各人要隨本心所酌定的，不要作難，不要勉強，因為捐得樂意的人是神所喜愛的」（林後 9:7）。把本章變成奉獻指標，會把恩典的田變成收款的櫃台。", "檢驗標準：一位經濟正吃緊的家庭聽完，是想到自己還可以給一個人一杯水、一個位子，還是只覺得愧疚與壓力？", "⑩ 錯誤講法——把 2:12「願你滿得他的賞賜」講成功德交換：「你行得好，神就欠你一份賞」。", "波阿斯稱她是「來投靠」的人：躲到翅膀底下的小鳥不是來領工錢的。善行在神面前不是白費，神也記念；但路得所得的一切都先是恩典，她自己的回應是俯伏：「怎麼蒙你的恩」（2:10）。講成交換，會使人驕傲，也會使受苦的人以為自己行得不夠。", "檢驗標準：會眾聽完，是更想把好行為拿去跟神換東西，還是更想躲到祂的翅膀底下？", "⑪ 錯誤講法——把本章細節逐項寓意化：「餅蘸醋預表聖餐」「一伊法大麥代表聖靈的恩膏」「田角象徵十字架」。", "新約只把波阿斯寫在家譜裡（太 1:5），沒有說他預表基督，更沒有替餅、醋、大麥定義。可以說「至近的親屬這個身分，使我們想起那位成了我們弟兄的主」，不可以把細節變成猜謎（紅線一）。", "檢驗標準：會眾聽完，記得的是主耶穌，還是講員找出了多少巧妙的對應？", "⑫ 錯誤講法——把 2:9「不可欺負你」輕輕帶過或說成客套話；或反過來，暗示女子不該獨自出門，「出事是她自己不小心」。", "「欺負」原文 נָגַע 包含侵犯；士 19 伯利恆的另一個女子就是在沒有人保護時受害。危險是真實的，責任在可能侵犯的人與有權保護的人身上，所以波阿斯先下命令，不是責備路得出門。講台不擴寫細節，但要把保護的責任講清楚。", "檢驗標準：一位曾在職場或教會受過騷擾的姊妹聽完，是覺得神站在她這一邊、教會會保護她，還是又被暗示是她自己的錯？若有人因此難過，會後請私訊同工或小組長。", "⑬ 錯誤講法——把「願耶和華與你們同在」講成職場傳教的命令：「老闆就應該要求員工一起禱告」「不在公司講屬靈話的就是不敢見證」。", "2:4 是田主與工人彼此祝福，是關係裡自然流出的話；波阿斯接著用行動保護最弱的人。用宗教語言施壓、或以此要求下屬，正好違背這一節的精神。見證先是怎樣待人，然後才是怎樣說話。", "檢驗標準：一位在非基督徒公司工作、內心常常為難的弟兄聽完，是知道明天可以怎樣善待一位同事，還是只多了一份罪疚感？", "⑭ 錯誤講法——把 2:20 的「他」講死，或乾脆說「波阿斯就是神派來的，他做的就是神做的」，把人當成神。", "「他不斷地恩待活人死人」的「他」各家並陳：指耶和華（最自然，參創 24:27）或指波阿斯；本講義認為指耶和華，而神的慈愛正是藉著波阿斯臨到。把人抬到神的位置，會讓人依賴某位領袖，也會在那人失敗時連神一起失去。", "檢驗標準：會眾聽完，感謝的對象是那位沒有撇下慈愛的神，還是某一個幫過他的人？", "⑮ 錯誤講法——借「至近的親屬」預告傳宗接代：「波阿斯出現了，因為這個家要有兒子延續香火；沒有兒子的家就是斷了」。", "גֹּאֵל 的工作是贖回、看顧失去依靠的家人；全卷的結論不是兒子比女人重要，是婦人們說的：「有這兒婦比有七個兒子還好！」（4:15）用本章製造生子壓力，正是紅線八要擋住的。", "檢驗標準：一對沒有孩子、或只有女兒的夫妻聽完，是被釋放，還是又被提醒一次自己「不完整」？", "⑯ 錯誤講法——把 2:23「路得仍與婆婆同住」講成孝道條款：「好媳婦就應該跟婆婆住、聽婆婆的」，或順便說俄珥巴不孝。", "路得同住是她在 1:16 自己作的委身兌現，不是一條加在每個媳婦身上的規定；俄珥巴是照拿俄米的勸告回去的，經文沒有責備她（紅線五）。也不可把以利米勒一家的死說成「因為下摩押，所以落到要撿穗子」——經文沒有這個因果（紅線三）。", "檢驗標準：一位正在婆媳關係裡受傷、或剛失去丈夫的姊妹聽完，是被看見、被安慰，還是被多綁上一條規矩？"]}, {"n": 3, "t": "求你用你的衣襟遮蓋我", "sub": "求、遮、等", "lv": "A", "arc": "安身之處、打穀場的夜、衣襟與賢德、安坐等候", "sec": [["3:1--5", "拿俄米的計畫：安身之處"], ["3:6--9", "夜半的請求"], ["3:10--13", "賢德的女子與更近的親屬"], ["3:14--18", "安坐等候"]], "serm": {"pts": [["我不當為你找個安身之處，使你享福嗎", "3:1--5", "愛的計畫：拿俄米要親手去做她在 1:9 求神做的事"], ["求你用你的衣襟遮蓋我", "3:6--15", "在本位上的請求：路得求的是一位贖回者履行神律法裡的本分"], ["你只管安坐等候", "3:16--18", "交託之後的安靜：有一位不肯休息的人，替她把事辦成"]]}, "q": "想像一下，吉隆坡一間老公寓裡，一位六十多歲的寡婦，看著守寡五年的兒媳婦每天下班回來照顧她，心裡一直有一句話不敢說出口：「你還年輕，我不能耽誤你一輩子。」她想替兒媳婦打算，又怕說錯一句，傷了這個家。\n另一位是三十八歲的姊妹，在教會長大，單身多年。每到婚禮，總有長輩拍拍她的肩膀說：「不要急，等候你的波阿斯。」她笑著點頭，回家卻覺得，自己的人生好像還沒有開始。\n路得記第三章，常被講成一個浪漫的夜晚，或一套求偶的方法。可是經文裡站著的，是一個想讓別人得安身之處的婆婆、一個求「贖回的人」盡本分的寡婦，和一個半夜驚醒卻守住本位的人。她說：「求你用你的衣襟遮蓋我，因為你是我一個至近的親屬。」（3:9）", "truth": "第三章的中心不是一段戀情，是一個請求：「求你用你的衣襟遮蓋我」（3:9）。「衣襟」與 2:12「翅膀」是同一個字——波阿斯為路得求神的翅膀遮蓋她，如今他自己成了那個禱告的答案。這一夜有危險，經文卻讓三個人都守住了本位：婆婆為別人盤算，媳婦為一個家求贖，親屬照律法的次序辦理。最後，所有的盤算都停下來，交給一位「今日不辦成這事必不休息」的人。", "mv": {"t": "他就說：「你是誰？」回答說：「我是你的婢女路得。求你用你的衣襟遮蓋我，因為你是我一個至近的親屬。」", "r": "得3:9"}, "card": ["十八節，從一個問題開始：「我不當為你找個安身之處，使你享福嗎？」（3:1）那個說自己「空空地回來」的拿俄米，第一次起身為別人盤算。她要路得沐浴抹膏、換上衣服，脫下居喪的日子，夜裡到打穀場去。路得照著做了，卻在波阿斯驚醒時改了劇本，自己開口：求你用你的衣襟遮蓋我。波阿斯先祝福，再安慰，稱她是賢德的女子，又照實說：還有一個人比我更近。他起誓要照律法辦理，天未亮就讓她回去，給了六簸箕大麥。婆婆最後只說一句：你只管安坐等候。這一章講的是：求、遮、等。", "第 9 節的「衣襟」，原文是 כָּנָף（kanaf），就是 2:12 波阿斯祝福她「投靠耶和華－以色列神的翅膀下」的「翅膀」。那一天他為她禱告；這一夜她說：請你展開你的 כָּנָף。結 16:8 神說「便用衣襟搭在你身上」，是立約娶妻的語言，所以這是求婚；可是她給的理由是 גֹאֵל（go’el），「贖回的人」，所以這也是求贖。還有兩個字前後呼應：3:1 的「安身之處」מָנוֹחַ（manoach）回應 1:9 拿俄米為兒婦求的「平安」；3:17 的「空手」רֵיקָם（reqam）回應 1:21 的「空空地回來」，全卷只有這兩次。禱告沒有被收回，空空的人不再空手。", "這一章有三個人，每一個都站在自己的本位上。拿俄米在 1:9 求神給媳婦安歇，在 3:1 自己起身去找；她的計畫有風險，經文沒有評論她的方法，只寫出她的動機是「使你享福」。路得說「凡你所吩咐的，我必遵行」（3:5），卻不是傀儡；到了打穀場，她說的話不在婆婆的劇本裡。她稱自己是「你的婢女」，不抬高，也不貶低。波阿斯可以在這一夜就作主，他卻說「只是還有一個人比我更近」（3:12）。一個想替人打算的婆婆，一個為家求贖的寡婦，一個不搶別人權利的親屬——三個人都可能越界，三個人都守住了。", "第三章的敘述者沒有一次直接寫神作了甚麼。可是神的名在這一夜出現兩次：波阿斯第一句話是「願你蒙耶和華賜福」（3:10），他的承諾是「我指著永生的耶和華起誓」（3:13）。一個在半夜驚醒的人，第一個念頭是祝福，第二個念頭是把自己放在神面前。神藏在人的慈愛裡。2:12 那句禱告——「你來投靠耶和華－以色列神的翅膀下」（2:12）——神沒有用異象回答，祂差那個禱告的人自己去。全卷的「恩」חֶסֶד，從神不斷地恩待活人死人（2:20），流到一個摩押女子身上：「你末後的恩比先前更大」（3:10）。神的慈愛，在人的慈愛裡被看見。", "新約沒有說波阿斯預表基督，也沒有替打穀場、六簸箕、沐浴抹膏找對應；講台不必替它們一件一件找。我們只說：一位不肯休息、要替別人把事辦成的贖回者，使我們想起那位「長遠活著，替他們祈求」（來 7:25）的主。拿俄米說「那人今日不辦成這事必不休息」（3:18）；主耶穌在十字架上說「成了」（約 19:30）。路得投靠神的翅膀，主也曾說，祂多次願意聚集百姓，像母雞把小雞聚集在翅膀底下（太 23:37）。我們安坐等候，不是因為事情不要緊，是因為有一位比我們更在乎的，正替我們辦成。", "這一週做三件事。第一，找一位你一直想替他打算的人——孩子、晚輩、守寡的家人——先問自己：我的盤算是「使你享福」，還是使我安心？然後給他一個選擇的空間，不替他決定。第二，若你正在一件事情上越界或拖延，像波阿斯一樣問：這件事前面，還有誰的位分我沒有尊重？把那個步驟補上。第三，選一件你已經盡了本分、卻還沒有結果的事，寫在紙上，禱告交給神，這一週不再反覆去推、去問、去算。安坐等候，也是一種順服。", "最終整合：一件舊外衣，\n袖口磨薄了，\n冬天的晚上，有人把它披在你身上。\n伯利恆的打穀場上，\n一個寡婦換下了居喪的衣服，\n悄悄地，躺在一個人的腳下。\n半夜，那人驚醒：你是誰？\n她沒有說自己從哪裡來，\n她說：我是你的婢女，\n求你展開你的衣襟，\n因為你是贖回的人。\n幾個月前，他在田裡為她禱告：\n願你投靠神的翅膀下。\n今夜，他自己成了那雙翅膀。\n他沒有搶，也沒有拖，\n他說：還有一個人比我更近。\n他指著永生的神起誓，\n天未亮，就讓她回家，\n肩上扛著大麥，\n不讓那個空空回來的婆婆，\n再空手。\n婆婆終於不再盤算了，\n她說：女兒，坐下吧。\n那人不辦成這事，必不休息。\n你也可以坐下來，\n有一位比你更不肯休息的，\n正替你把事辦成。"], "self": "這一章照出來的「有己」，有四張很體面的臉。第一張是替人作主：我很愛你，所以你的婚姻、工作、前途都要照我的安排；拿俄米的盤算有風險，卻把決定交給了波阿斯的品格，沒有逼任何人就範。第二張是替自己挑：路得年輕，有選擇，「少年人無論貧富，你都沒有跟從」（3:10），有己的人卻先問「我得著甚麼」。第三張是走捷徑：明明可以私下把事辦成，何必管別人的權利與程序？波阿斯偏偏說「還有一個人比我更近」。第四張是坐不住：該做的都做了，還要一直推、一直問、一直算，好像事情的成敗全在我身上。\n還有一張臉更隱蔽：讀第三章，第一個念頭是「我的波阿斯在哪裡」，或「這個女人怎麼這麼大膽」。前者把經文變成我的願望清單，後者把經文變成論斷別人的尺。神在這一章把焦點挪開的方法，是讓我們看見祂的翅膀：祂藉著人的慈愛遮蓋人，祂也有一位替我們辦成事的贖回者。焦點回到祂身上，人才坐得住。", "t321": {"k": "耶穌是我的榜樣：波阿斯有權、有財、有一個在半夜送上門的機會，他卻先說「還有一個人比我更近」，把自己放回律法的次序裡。主耶穌「本有神的形像，不以自己與神同等為強奪的；反倒虛己，取了奴僕的形像」（腓 2:6-7），祂有一切的權利，卻不抓住。學祂，不是先學波阿斯的慷慨，是先學這個「不搶」：不用愛的名義踩過別人的位分，不用好意的名義替人作主。祂也是那位不肯休息、要把事辦成的主——在十字架上說「成了」，叫我們可以安坐。", "g": "讓耶穌作王：拿俄米一生都在盤算——從伯利恆到摩押，從摩押回伯利恆，從田間到打穀場。第三章最後，她第一次放下盤算：「你只管安坐等候，看這事怎樣成就」（3:18）。讓耶穌作王，不只是大事上禱告，是在盡了本分之後，把方向盤交出去，不再一邊禱告一邊偷偷握著。也是像路得一樣，在有選擇的時候，不讓「我想要」坐在寶座上，讓神的心意與別人的益處先說話。用腦靠自己就坐不住，用心靠聖靈才坐得住。", "p": "建立屬神的體系：打穀場的一夜沒有變成伯利恆的閒話，因為三個人都守住了界線：婆婆不逼、媳婦不越、親屬不搶，而且事情要在城門前公開辦理。教會可以照這個樣子問自己。第一，守程序保護人：牽涉婚姻、財產、名譽的事，照次序、公開、有見證人，不私下作成。第二，守名譽不遮罪：保護清白的人不受閒話，卻不用「保護名譽」掩蓋傷害。第三，讓長輩的關心有分寸：為晚輩找安身之處，是陪伴與禱告，不是安排與施壓。人比事重要，關係比結果重要。"}, "grp": ["【一、破冰】寒冷或難過的時候，有沒有人把一件外套、一條毯子，或一句話「披」在你身上？那是誰？在甚麼地方？你還記得那一刻的感覺嗎？", "【二、扎心】3:12 波阿斯說「只是還有一個人比我更近」，他沒有走捷徑。你最近有沒有一件事，為了快一點、為了得著想要的，跳過了別人的位分或該有的程序？不必說細節，只說「有」或「沒有」，以及那是對家人、同事，還是教會。", "【三、福音】3:18「那人今日不辦成這事必不休息」。你現在有哪一件事，自己已經盡了本分，卻一直放不下、睡不好？讀到有一位「長遠活著」替你祈求的主，你想對祂說哪一句話？當場用一句話說出來。", "【四、行動】這一週，你要為哪一位你關心的人（孩子、晚輩、守寡或單身的家人、新住民朋友）作一件「使他享福」卻不替他作主的事？說出他的名字、你要做的事和哪一天。", "【五、代禱】為三種人指名禱告（名字可以放在心裡）：一位常被追問婚事、心裡受傷的弟兄或姊妹；一位喪偶、不知道下一步在哪裡的長輩或年輕寡婦；一位在異鄉的新住民或外籍配偶。求神用祂的翅膀遮蓋他們，也差派我們成為他們身邊的那件衣襟。"], "prac": {"main": "這一週，從「替人作主、替自己盤算」轉到「在本位上請求、在交託裡安坐」：讀一次第三章，為一個人作一件不越界的愛，把一件盡了本分的事交給神。", "items": ["對神：每天早上讀一段本章（3:1--5、3:6--9、3:10--13、3:14--18，四天讀完，其餘三天重讀 3:9 與 3:18），讀完禱告一句：「主啊，求你用你的翅膀遮蓋我，今天我要在哪裡安坐等候？」寫下一句話。", "對自己：在筆記本寫下兩欄：「我已經盡了的本分」與「我還在偷偷握著的結果」。右欄每寫一件，就在旁邊寫「交給主」，並且這一週不再為這件事反覆去推、去問。", "對人：選一位你很想替他打算的人，先問他：「你自己怎麼想？我可以怎樣幫你？」聽完再說話，不給答案、不安排對象、不催。", "對生活：檢查一件你正在處理的事——一筆帳、一份合約、一個家庭決定——有沒有該先問的人、該公開的步驟被你跳過了？這週把它補上。", "對使命：找一位新住民、外籍配偶、移工或喪偶的長者，用一頓飯或一通電話記住他的名字，問他一句：「你在這裡，有安身之處嗎？」照你能力所及，給他一份不讓他空手回去的東西。"]}, "safe": ["① 錯誤講法——渲染第 3 章：用語氣、停頓、想像去描寫打穀場那一夜的身體、衣著與氣氛，把「掀開他腳上的被，躺臥在那裡」（3:4）講成一段曖昧的情節。", "經文刻意含蓄，只說「腳的地方」，而且親手解開張力：3:11 稱她「賢德的女子」，3:13 波阿斯起誓照律法辦理，3:14 天未亮她就起來（紅線二）。擴寫經文沒有寫的細節，是把講員的想像加在聖經上，也讓會眾帶回家的是畫面，不是神。", "檢驗標準：一位帶著國中孩子來聚會的母親聽完，是需要在車上向孩子解釋講員那些話，還是可以和孩子一起談「賢德」與「守住本位」？", "② 錯誤講法——反過來迴避：跳過 3:4、3:7，或說「這段不方便講」，只講第 2 章與第 4 章，彷彿第 3 章是聖經裡的尷尬。", "這一章是全卷的轉捩點：「求你用你的衣襟遮蓋我」（3:9）是主軸的一站。不渲染，也不迴避；照經文原句讀，把各家讀法並陳，並指出經文自己給的結論（紅線二）。迴避會讓人以為聖經有不能說的祕密，也讓自己偷偷去讀、讀歪的年輕人沒有人陪。", "檢驗標準：一位第一次自己讀到第 3 章、心裡有疑問的青年聽完，是覺得問題被正面回答了，還是覺得這題在教會不能問？", "③ 錯誤講法——把本章當婚戀教材：「姊妹們，要像路得一樣，耐心等候你的波阿斯」「弟兄們，要像波阿斯一樣有錢有品，才配得上好姊妹」。", "路得求的不是一個男人的愛慕，是一位 גֹאֵל「贖回的人」履行神律法裡的本分，叫以利米勒的家不至斷絕；經文的重心是慈愛與救贖，不是擇偶。講成戀愛指南，把神的救贖縮小成配對，也讓單身的人覺得自己還不完整（紅線二）。", "檢驗標準：一位單身多年、正在為婚姻禱告的姊妹聽完，是被安慰、被看見，還是又被施壓了一次？", "④ 錯誤講法——把路得夜裡到場上講成「女生要主動，機會是自己爭取來的」；或反過來，講成「女人主動就是不檢點」，用這一章論斷婚前的界線。", "這是一個寡婦在律法框架裡、照著婆婆的計畫，向至近的親屬提出贖回的請求，不是一般男女交往的範本；經文也沒有用它立任何交往規則（紅線二）。兩頭都錯：一頭把冒險講成技巧，一頭把清白講成可疑。婚前界線是其他經文的工作。", "檢驗標準：一位正在交往的年輕姊妹聽完，是學到一套方法或背上一層羞恥，還是看見一個在危險裡仍然守住本位的人？", "⑤ 錯誤講法——逐項寓意化：「沐浴抹膏代表受洗與聖靈、打穀場預表十字架、六簸箕代表六日的工作、躺在腳下代表謙卑地俯伏在基督腳前」。", "新約沒有作過這些連結；「六簸箕」原文只有「六」與「大麥」，連量器都沒有寫（紅線一）。可以說「一位不肯休息的贖回者，使我們想起那位長遠活著替我們祈求的主」，不可以替每一個細節找對應。細節變成猜謎，人記得的是講員的巧思，不是基督。", "檢驗標準：你說的每一個基督連結，新約有沒有明文出處？沒有的話，你用的是「這使我們想起」嗎？會眾記得的是哪一個對應，還是那一位贖回者？", "⑥ 錯誤講法——把「凡你所吩咐的，我必遵行」（3:5）講成孝道條款：「好媳婦就該對婆婆言聽計從，婆婆叫你做甚麼都要做」。", "路得的順服根基在 1:16「你的神就是我的神」，是自由的信任，不是被命令；她在 1:8–15 沒有照婆婆的勸告回去，到了打穀場又自己開口，說了婆婆劇本以外的話（3:9）（紅線五）。講成孝道條款，會讓正在婆家受委屈的媳婦被再綁一次，也讓長輩以為可以用經文命令人。", "檢驗標準：一位跟婆婆同住、常常被要求「順服」的年輕媳婦聽完，是覺得被壓得更低，還是看見一份可以自由選擇的愛？", "⑦ 錯誤講法——把拿俄米的計畫講成操縱與詭計：「她利用媳婦去設局」；或反過來，說「拿俄米終於不再埋怨，所以神祝福了她」，把她第 1 章的哀歌當成要被克服的毛病。", "經文沒有評論她的方法，只寫出動機「使你享福」（3:1），結局交在波阿斯的品格與律法次序裡；她在 1:20–21 的哀歌，敘述者也沒有責備（紅線四）。第 3 章不是她「改掉埋怨」，是一個哀哭過的人，在神的慈愛臨到之後（2:20），重新有力氣為別人盤算。", "檢驗標準：一位剛經歷喪偶、還在對神哭訴的長輩聽完，是覺得自己的哀歌被定罪，還是知道哀哭的人也可以再一次站起來愛人？", "⑧ 錯誤講法——用「摩押女子」製造刻板印象：「摩押女人本來就會引誘人（民 25 章），難怪她會夜裡到打穀場」，或藉此暗示外籍配偶動機不單純。", "波阿斯對她的評價是「我本城的人都知道你是個賢德的女子」（3:11），「賢德」חַיִל 與 2:1 形容波阿斯的是同一個字；經文一直稱她「摩押女子」，卻從不以出身貶低她（紅線六）。把民族歷史套在一個人身上，是經文正在拆除的偏見。", "檢驗標準：一位從越南、印尼或中國大陸嫁到台灣、馬來西亞、新加坡的姊妹聽完，是覺得被尊重、被稱為賢德，還是又被人用出身猜測了一次？", "⑨ 錯誤講法——把本章講成成功神學：「路得忠心孝順，所以神讓她嫁給大財主；你只要敬虔，神也會為你安排有錢的對象、有保障的後半生」。", "路得得著的不是一張飯票，是一位贖回者為一個斷了後的家承擔責任；波阿斯也要付代價（4:6 那位親屬正是怕這個代價）。經文沒有應許敬虔的人一定得著富足的婚姻（紅線七）。講成公式，會讓長年單身、婚姻辛苦的人以為自己不夠敬虔。", "檢驗標準：一位婚後經濟拮据、丈夫失業的姊妹聽完，是懷疑自己當年不夠屬靈，還是看見神的慈愛不靠財富衡量？", "⑩ 錯誤講法——把 3:12 那位「比我更近」的親屬講成障礙、壞人，或講成「撒但的攔阻」，好凸顯波阿斯的偉大。", "波阿斯自己尊重他的優先權：「明早他若肯為你盡親屬的本分，就由他吧」（3:13）。照律法，越近的越先（利 25:25）；他有權贖，也有權不贖，第 4 章才揭曉他的選擇（紅線八）。在第 3 章就把他講成反派，是替經文下它沒有下的判斷，也教會眾把擋路的人妖魔化。", "檢驗標準：會眾聽完，是學會把擋在前面的人當成敵人，還是學會像波阿斯一樣尊重別人的位分？", "⑪ 錯誤講法——把「贖回」「為死人存留名字」講成傳宗接代的責任：「寡婦就該再嫁、就該生兒子，為夫家延續香火」。", "第 3 章的重心是慈愛與保護，不是生育的義務；全卷最後，婦人們說的是「有這兒婦比有七個兒子還好」（4:15），一個摩押媳婦的愛勝過七個兒子（紅線八）。用本章催寡婦再嫁、催媳婦生子，會把救贖的故事變成壓在女人身上的擔子。", "檢驗標準：一位只有女兒、或結婚多年沒有孩子的夫妻聽完，是覺得被釋放，還是又被提醒一次「你們對不起祖先」？", "⑫ 錯誤講法——把「不可使人知道有女子到場上來」（3:14）講成「家醜不可外揚」：教會遇到性騷擾、性侵或權勢傷害，要私下處理、保護領袖的名譽。", "波阿斯保護的是一個清白的人不受閒話，並且要把事情帶到城門前公開辦理（4:1）；他遮的是名譽，不是罪。本章沒有任何人受害，那一夜之所以清白，正因為他守住了界線（紅線二）。用這一節掩蓋傷害，是把保護弱者的經文，變成保護加害者的工具。", "檢驗標準：一位曾在教會受過傷害、一直不敢說出來的姊妹聽完，是更不敢說，還是知道在神的家裡，真相與保護都有她的位置？會後請私訊同工或小組長，必要時協助尋求專業協助。", "⑬ 錯誤講法——把「你只管安坐等候」（3:18）講成甚麼都不必做：「受苦就忍著，被欺負就等神處理，不要求助、不要說出來」。", "拿俄米說這句話，是在路得已經走完該走的路、波阿斯已經起誓之後；安坐，是因為「那人今日不辦成這事必不休息」（3:18），有一位承擔的人。經文的等候是交託之後的安靜，不是叫受壓的人放棄求助。講成被動忍受，會讓正在受家暴或職場霸凌的人留在危險裡。", "檢驗標準：一位在家裡長期受壓的弟兄姊妹聽完，是以為自己只能忍，還是知道盡本分包括求助，而等候是把結果交給神？", "⑭ 錯誤講法——把「安身之處」講成「女人沒有丈夫就沒有歸宿」，暗示寡婦、單身或離婚的人是不完整的，需要婚姻才能被神祝福。", "「安身之處」מָנוֹחַ 回應的是 1:9 拿俄米為兒婦的禱告，在古代以色列的處境裡，寡婦失去保護是真實的危險；經文沒有說喪偶是審判，也沒有說單身是缺陷（紅線三）。路得早在投靠神的翅膀下時（2:12），就已經是被神接納的人。真正的安息是神自己：「你們得救在乎歸回安息」（賽 30:15）。", "檢驗標準：一位喪偶多年、決定不再婚的長輩姊妹聽完，是覺得自己的人生缺了一角，還是知道神的翅膀已經遮蓋她？", "⑮ 錯誤講法——把波阿斯講成完美男人、屬靈英雄，或把路得講成「賢妻典範」，整篇講道都在佩服人。", "波阿斯第一句話是「願你蒙耶和華賜福」（3:10），他的承諾是指著永生的耶和華起誓；他把焦點指向神，不指向自己（鐵律七）。路得被稱「賢德」，是全城看見了她的慈愛，不是要所有姊妹照一個模子活。焦點落在人身上，會眾回家記得的是偶像，不是那位藏在人的慈愛裡的神。", "檢驗標準：會眾聽完，記得的是波阿斯多好、路得多美，還是那位用翅膀遮蓋人、差派人去遮蓋人的神？"]}, {"n": 4, "t": "今日沒有撇下你", "sub": "門、贖、王", "lv": "A", "arc": "城門、我不能贖了、存留死人的名、拿俄米得孩子了、法勒斯到大衛", "sec": [["4:1--6", "城門前的某人"], ["4:7--10", "脫鞋為證，存留死人的名"], ["4:11--12", "願你在以法他得亨通"], ["4:13--17", "拿俄米得孩子了"], ["4:18--22", "法勒斯的後代"]], "serm": {"pts": [["我不能贖了", "4:1--6", "有己的人保住了產業，經文卻沒有留下他的名字"], ["你們今日作見證", "4:7--12", "無己的人付代價，為死人存留名字"], ["拿俄米得孩子了", "4:13--22", "空的被填滿，沒有王的年代，王的家譜開始了"]]}, "q": "一位七十二歲的阿嬤，丈夫走了，唯一的兒子也在前年過世。每週陪她去洗腎的，是那位從越南嫁來的媳婦。年節聚會時，有親戚嘆了一口氣：「可惜沒有男孫，這一房就斷了。」阿嬤低頭不說話；媳婦在旁邊替她剝橘子。\n另一位中年弟兄，在家族會議上被問：老家那塊地，連同中風的二叔，要不要一起接下來？他算了一夜，第二天說：「這樣對我不利，我不接。」沒有人怪他，他自己卻說不出心裡哪裡空了一塊。\n路得記第四章把這兩個人都帶到城門口：一個人說「我不能贖了」（4:6），一群婦人說「有這兒婦比有七個兒子還好」（4:15）。這一章要我們看見的，不是誰比較好，而是那位今日沒有撇下人的神。", "truth": "第四章真正的主角，不是城門前的兩個男人，是藏在程序、見證與一個嬰孩背後的神。有權贖的人合法地說「我不能」，保住了產業，名字卻沒有留下；波阿斯甘願受虧，為死人存留名字。最後婦人們稱頌的不是波阿斯，是耶和華：「今日沒有撇下你」。空空地回來的拿俄米，懷裡抱著王的祖先；一個愛她的摩押媳婦，比七個兒子還好。", "mv": {"t": "婦人們對拿俄米說：「耶和華是應當稱頌的！因為今日沒有撇下你，使你無至近的親屬。願這孩子在以色列中得名聲。", "r": "得4:14"}, "card": ["二十二節，從一座城門開始。夜裡答應的事，波阿斯天一亮就帶到最公開的地方：請那位更近的親屬坐下，請十位長老坐下，把以利米勒的那塊地擺出來。那人先說「我肯贖」；聽到還要娶摩押女子路得、為死人存留名字，就改口說「我不能贖了」，並且脫鞋為證。波阿斯在眾人面前宣告「你們今日作見證」，城門前的人用拉結、利亞和她瑪的名字祝福這個家。接著節奏忽然加快：娶妻、懷孕、生子；婦人們稱頌耶和華，拿俄米把孩子抱在懷中。最後鏡頭拉遠，十個名字，從法勒斯一直寫到大衛。這一章講的是：門、贖、王。", "第四章是 גָּאַל（ga’al，贖）這個字的終點站。4:4 那人說 אָנֹכִי אֶגְאָל（’anokhi ’eg’al），原文加重了「我」：我肯贖。4:6 他說 לֹא אוּכַל לִגְאֹל（lo’ ’ukhal lig’ol），同一個動詞，前面多了「不能」。全卷這個字根連同名詞 גְּאֻלָּה（ge’ullah，贖回權）出現二十三次，到這裡，有權贖的人把它放下了。可是故事沒有停在「不能」。4:14 婦人們說，神沒有使拿俄米斷絕 גֹּאֵל（go’el）——這一次被稱為至近的親屬的，是一個剛出生的嬰孩。4:15 又說他要作她的 מֵשִׁיב נֶפֶשׁ（meshiv nefesh），原文直譯是「使生命歸回的」。第一章她說「耶和華使我空空地回來」（1:21）；同一個「回」字，在這裡變成生命的歸回。贖，不只是把地買回來，是把一個人的生命帶回家。", "這一章的人物，幾乎都站在別人的位置旁邊。那位親屬不是惡人：他先答應贖地，後來誠實地說會損害自己的產業，也許還有自己的妻兒要顧；律法本來就容許人不肯，他在城門前公開、合法地交出權利，經文沒有一個字罵他。波阿斯夜裡答應了路得，白天卻先把更近的人請到前面，不搶、不繞、不私了。路得在本章一句話也沒有說，卻是全城祝福的對象；長老們用以色列的建國之母祝福一個摩押女子。拿俄米也沒有說話——第一章她說了許多苦話，這一章是別人替她說：「拿俄米得孩子了！」那群曾經驚訝地問「這是拿俄米嗎」的婦人，如今成了她得安慰的見證人。", "全卷八十五節，敘述者只親口說了兩次神做了甚麼：1:6 賜糧食，以及「耶和華使她懷孕生了一個兒子」（4:13）。其餘的時候，神藏著——藏在那人恰巧經過的時機裡，藏在長老們「願耶和華……」的祝福裡，藏在一個人肯付代價的心裡。路得在摩押多年沒有孩子，經文從不解釋，也從不說那是懲罰；這裡只說耶和華「給了」，不說「因為她配得」。所以全章的高潮不是婚禮，是頌讚：「耶和華是應當稱頌的！因為今日沒有撇下你」（4:14）。拿俄米曾說耶和華降禍與她，神沒有反駁她，祂用一個嬰孩回答她。神的沉默不是缺席，祂的手一直沒有停。", "新約自己作過的連結，就在家譜裡：「波阿斯從路得氏生俄備得；俄備得生耶西」（太 1:5）。馬太把這份名單放進「耶穌基督的家譜」（太 1:1），一直接到那一位，還加上了路得的名字——一個摩押寡婦，被寫進了彌賽亞的家譜。這是講台可以放心說的。至於波阿斯，新約沒有說他預表基督；我們只說：「至近的親屬」這個身分，使我們想起那位「稱他們為弟兄也不以為恥」（來 2:11）的主。波阿斯付的是一塊地的代價；祂「為我們捨了自己，要贖我們脫離一切罪惡」（多 2:14）。不必把城門、長老、那隻鞋一件一件對號入座；要記住的是方向：有一位甘願吃虧的贖回者，把外人寫進了神的家。", "這一章對華人教會最直接的挑戰，在 4:15。在許多家庭裡，沒有兒子仍是一句說不出口的遺憾：喪偶的長輩被問「有沒有男孫」，只有女兒的夫妻在年節飯桌上被「關心」。伯利恆的婦人們卻當著全城說：「有這兒婦比有七個兒子還好！」（4:15）她們稱讚的，是一個「愛慕你的」外邦媳婦。神看重的不是兒子的數目，是愛的真實。第二個挑戰是：你身邊有沒有一位拿俄米——年老、喪偶、地還在名下卻守不住——正在等一個肯站出來的親人？不一定要買地；也許是陪她走一趟醫院，或替她把一件拖了很久的事，公開、清楚地辦完。", "最終整合：一座城門，\n一排石凳，十位長老。\n一個人說：我肯贖。\n又說：恐怕於我的產業有礙。\n他沒有違法，\n脫下一隻鞋，走回自己的田，\n經文從此不再提起他。\n另一個人說：你們今日作見證，\n一口氣念出三座墳上的名字，\n把一個摩押寡婦娶回家。\n然後是一個嬰孩，\n一雙埋葬過丈夫和兩個兒子的手，\n把他抱在懷中。\n婦人們沒有說「早告訴你要有信心」，\n她們說：耶和華是應當稱頌的！\n因為今日沒有撇下你。\n空空地回來的，\n懷裡抱著王的祖父；\n沒有王的年代，\n家譜的最後一個名字是大衛。\n這使我們想起那一位，\n甘願讓自己受虧、\n把外人寫進神家的贖回者。\n今天，你可以保住你的，\n也可以把一個快被忘記的名字接過來，\n說：我來。\n神沒有撇下拿俄米，\n祂也沒有撇下你。"], "self": "這一章照出來的「有己」，大多很體面。第一張臉是算盤：看得見好處的部分，我說「我肯」；一聽到要扛一個人、扛一個不歸我名下的將來，就說「這樣對我不利」。第二張臉是名分：怕自己的產業受損，其實是怕自己的名字被別人的家吞掉；越想保住自己的名，越容易錯過愛。第三張臉是捷徑：愛一個人，就想越過次序、私下了結；波阿斯卻把更近的人請到前面，在眾人面前辦。第四張臉是面子：家族裡沒有兒子、教會裡有人說「我不能」，我們就用眼神和閒話替神審判別人。\n還有一張臉藏得更深：讀完 4:6，第一個念頭是「還好我不像那個人」。這也是有己。這一章把焦點挪開的方法，是讓婦人們稱頌的不是波阿斯，而是耶和華——那位在城門、在床邊、在一份家譜裡，一直沒有撇下人的神。焦點回到祂身上，我們才有力氣把別人的名字接過來。", "t321": {"k": "耶穌是我的榜樣：波阿斯為一個不能回報他的家付代價，娶的人、買的地，將來都要歸在死人的名下。這使我們想起那位「反倒虛己，取了奴僕的形像」（腓 2:7）的主；祂付的不是一塊地的價，是「本來富足，卻為你們成了貧窮」（林後 8:9）。波阿斯在眾人面前說「你們今日作見證」，主耶穌也不是在暗中愛我們，祂在十字架上公開地擔當。祂是我的榜樣，更是我的贖回者：先被祂贖回，我才有力氣去作別人的至近的親屬——為一位長輩、一位新住民姊妹、一個沒有人記得名字的人，接下一件不歸我名下的事。", "g": "讓耶穌作王：路得記的最後一句是「那時，以色列中沒有王，各人任意而行」（士 21:25）；路得記的最後一個名字是大衛。王的家譜不是在宮廷裡開始的，是在一座城門口開始的：有人肯照著神的次序辦事，肯為別人吃虧。讓耶穌作王，先不是談國家或教會需要一位強勢的領袖，是在我自己的產業上換主人：我的錢、我的時間、我名下的那塊地，誰說了算？婦人們稱頌的是耶和華，不是波阿斯；讓耶穌作王，也是讓祂得著一切的榮耀，連我們作對了的事，也歸給祂。", "p": "建立屬神的體系：4:11 是全卷唯一的「建立」——長老們祝福路得「像建立以色列家的拉結、利亞二人一樣」（4:11）。屬神的家怎樣被建立？這一章給了三根柱子。第一，透明的程序：在長老面前照次序、有見證地辦事；教會交接服事、處理奉獻與照顧，不私了，也不羞辱說「我不能」的人。第二，祝福的社群：長老不問她從哪裡來，只求神藉她建立甚麼；鄰舍的婦人替孩子起名，一起慶祝一個人的復原。第三，代代相傳：俄備得的意思是「事奉的人」，一個家從事奉走到大衛。用 235 搭起來：有同伴，有屬靈父母兒女，有作見證的團隊。"}, "grp": ["【一、破冰】你家裡有沒有一份族譜、一張老照片，或一位長輩常講的祖先故事？裡面你最記得哪一個名字？為甚麼記得他？", "【二、扎心】4:6 那人說他不能贖，怕對自己的產業有礙。回想最近一次你心裡說「這樣對我不利」而推掉的一件事，不必說細節：那件事後來是誰接下了？你現在想起來，心裡是平安，還是空了一塊？", "【三、福音】4:14 婦人們說「今日沒有撇下你」。回想一段你覺得自己空空的日子，神後來藉著哪一個人、哪一件事，讓你知道祂沒有撇下你？說出那個人的名字。", "【四、行動】你身邊有沒有一位像拿俄米的長輩，或一位像路得那樣離鄉的新住民？這一週哪一天、用甚麼具體的方式（陪診、一頓飯、一通電話、幫她辦完一件事），作她身邊的親人？說出名字和時間。", "【五、代禱】為三種人指名禱告：一位喪偶、獨居的長輩；一對長年等候孩子，或只有女兒而被親戚議論的夫妻；一位離鄉來到你城市的新住民或移工。求那位今日沒有撇下拿俄米的神親自安慰他們，也差你成為祂回答禱告的那個人。"], "prac": {"main": "這一週，作一次別人的「至近的親屬」：找一件你可以接下、卻不會歸在你名下的事，公開、清楚地把它辦完，並把感謝歸給神。", "items": ["對神：每天讀一段本章（4:1--6、4:7--10、4:11--12、4:13--17、4:18--22，一天一段），讀完用 4:14 婦人們的話對神說：「耶和華是應當稱頌的！」再寫下今天你看見祂沒有撇下你的一件小事。", "對自己：寫下一件這陣子你心裡說「這樣對我不利」的事。不必自責，只問神：我要保住的，是我的東西，還是一個人？若是一個人，寫下你願意吃的那一點虧。", "對人：選一位像拿俄米的長輩，或一位離鄉的新住民姊妹，這週陪她做一件她一個人做不來的事：看診、辦文件、修一樣東西。做完不必說教，只說一句「我在」。", "對生活：留意自己在年節、聚會裡對沒有兒子、沒有孩子的親友說過的「玩笑」或「關心」。這週決定不再說；並找一次機會，對一位只有女兒的父母說：「你的女兒真是你的福氣。」", "對使命：在小組裡公開承諾一件服事或照顧的責任，請組員作你的見證人，一個月後回報。也請一位長輩講家族裡一個被神接起來的破口，記錄下來，讓下一代知道神怎樣建立這個家。"]}, "safe": ["① 錯誤講法——把 4:6 那位親屬講成自私、貪財的壞人：「他只顧自己，所以神讓他的名字消失」，讓台下說過「我不能」的人一起被定罪。", "他有權不贖：申 25:7--10 本來就容許人不肯，他是在城門前公開、合法、坦白地放棄；經文沒有一個字責備他（紅線八）。不寫名字是敘述者的對照，不是定罪。講成壞人，會把一個安靜的對照講成道德審判，也教會眾去審判說「不」的人。", "檢驗標準：一位曾經因為力不從心、推掉照顧家人責任的弟兄聽完，是覺得被羞辱，還是被溫柔地邀請重新思想：我要保住的是東西，還是人？", "② 錯誤講法——用「存留名字」「生了一個兒子」勸人一定要生、一定要有男孩：「神看重香火，你也要為家族留後」。", "「存留死人的名」是古代以色列地業律法的處境（申 25:5--6），不是給今天家庭的生育命令；婦人們最後說的是「有這兒婦比有七個兒子還好」（4:15），把價值從兒子的數目翻轉到愛的真實（紅線八）。", "檢驗標準：一對只有女兒、或沒有孩子的夫妻聽完，是被釋放，還是又被加上一層壓力？", "③ 錯誤講法——把 4:13「耶和華使她懷孕」講成應許公式：「只要有信心，神一定給你孩子」；或反過來暗示：沒有孩子，就是神還沒有恩待你、你還有罪沒處理。", "路得在摩押多年沒有孩子，經文從不解釋原因，也不說那是懲罰（紅線三）；4:13 只說耶和華「給了」，沒有說「因為她配得」。生命是神賜的，不是信心換來的；兩節之後，經文就說一個愛人的兒婦比七個兒子還好。", "檢驗標準：一對剛經歷流產、或長年不孕的夫妻聽完，是覺得被神看見，還是覺得自己信心不夠、被神審判？", "④ 錯誤講法——把第 4 章逐項寓意化：「城門預表天上的審判台，十位長老代表十誡，脫鞋象徵基督脫去榮耀，那位親屬代表律法」。", "新約沒有作過這些連結（紅線一）；能放心說的是太 1:5 與路 3:32 的家譜。「至近的親屬」這個身分，可以說「這使我們想起」那位稱我們為弟兄的主（來 2:11），但不可把細節當成猜謎。", "檢驗標準：講完之後，會眾記得的是基督的慈愛，還是講員的巧思？每一個基督連結，用的是「這使我們想起」嗎？", "⑤ 錯誤講法——直接宣告「波阿斯就是基督的預表」，把他講成完美無瑕的救主；或反過來，為了避免預表，完全不提基督。", "新約沒有說波阿斯預表基督，他只被列在家譜裡（太 1:5）；他是一個忠心、肯付代價的人，不是救主（紅線一）。但路得記也不是與基督無關：馬太把這份家譜一直接到耶穌基督。兩頭都要守住。", "檢驗標準：會眾聽完，是更佩服波阿斯，還是更愛那位甘願為我們成了貧窮的主？", "⑥ 錯誤講法——把第 4 章講成愛情故事的大結局：「等候你的波阿斯，神會在對的時候讓他出現在城門口」，或「男生要像波阿斯一樣有錢有品，才配得上好女孩」。", "全章的高潮不是婚禮，是頌讚：「耶和華是應當稱頌的」（4:14）；4:13 只用一句話交代婚姻，焦點在耶和華賜下生命（紅線二）。講成婚戀教材，會讓單身的人覺得自己還沒等到「劇情」，也把財富講成蒙福的標準。", "檢驗標準：一位單身多年、正在為婚姻禱告的姊妹聽完，是被安慰、被看見，還是被施壓、覺得自己缺了甚麼？", "⑦ 錯誤講法——把 4:1 那人「恰巧」經過講成：「只要你順服，神就會安排貴人在對的時間出現，事情一定順利。」", "「恰巧」原文只是「看哪」，敘述者讓我們看見時機，卻不給我們公式（紅線七）；這一切發生在一個寡婦要變賣地業、一個人說「不能」的處境裡。神的護理是祂在暗中不撇下人，不是保證成功或發財。", "檢驗標準：一位禱告了很久、事情仍然卡住的人聽完，是覺得自己不夠順服，還是知道神在看不見的地方仍然沒有停手？", "⑧ 錯誤講法——把長老的祝福講成「路得終於脫離了摩押的身分，變成真正的以色列人」，好像她的出身是需要洗掉的污點；或反過來說「申命記的禁令從此不算數了」。", "經文到 4:10 仍稱她「摩押女子路得」，沒有抹掉她的出身；長老們用拉結、利亞祝福她，問的是神要藉她建立甚麼（紅線六）。申 23:3 的難處要並陳，不可一筆抹去；她是以「你的神就是我的神」的身分被接納。", "檢驗標準：一位在台灣、馬來西亞或新加坡的新住民、外籍配偶聽完，是覺得被接納、被祝福，還是覺得自己要先變得「像我們」才被接受？", "⑨ 錯誤講法——把 4:12 提到她瑪講成「為了目的可以不擇手段，她瑪喬裝也被祝福」；或為了體面，乾脆跳過她瑪不講。", "長老們提她瑪，是因為她也是無子的寡婦，猶大家不肯盡弟兄的本分，猶大承認「她比我更有義」（創 38:26）；經文沒有稱讚喬裝的方法。跳過不講，又錯過了全章的安慰：神常從破口裡建立祂的家。", "檢驗標準：一位家族裡有不光彩往事的弟兄姊妹聽完，是學會走捷徑，還是知道神能接起他家譜裡的破口？", "⑩ 錯誤講法——把 4:14 講成「拿俄米當初埋怨錯了，你看神多好，所以受苦的時候不要抱怨、要喜樂」。", "婦人們回應的是頌讚，不是「早告訴你」；經文從頭到尾沒有責備拿俄米的哀歌（1:20--21），神用一個嬰孩回答她（紅線四）。哀歌是信心的一種形式；用結局去數落當初的眼淚，會讓正在哀哭的人閉口。", "檢驗標準：一位剛失去配偶、還說不出感謝的長輩聽完，是覺得眼淚被允許，還是覺得自己又多了一條罪？", "⑪ 錯誤講法——把 4:16 講成「神給了新的孩子，從前的失去就一筆勾銷了，你也該放下，不要再難過」。", "經文沒有說拿俄米從此不想念以利米勒、瑪倫和基連；波阿斯在城門前還一一念出他們的名字（4:9）。神的安慰不是抹掉傷痛，是在傷痛旁邊放下一個新的生命。", "檢驗標準：一位失去孩子、後來又有了孩子的母親聽完，是覺得可以帶著思念被安慰，還是被要求假裝已經不痛？", "⑫ 錯誤講法——用 4:10「買」路得為妻，說婚姻就是交易、女人是家族的財產；或說女人的價值就在於為夫家生兒子。", "「買」反映古代婚約裡聘禮與地業的安排，和合本已有夾注；波阿斯明說是「為妻」，長老們祝福她像建立以色列家的拉結、利亞。4:15 婦人們稱讚路得的，是她「愛慕你」，不是她生了兒子。", "檢驗標準：一位在婚姻裡覺得自己只是生孩子、顧家工具的姊妹聽完，是被貶低，還是知道神看重她這個人？", "⑬ 錯誤講法——從 4:18--22 十個名字推算年代，算出「第七代、第十代」的密碼，甚至拿來預測末世，或對應申 23:3「十代」的數字。", "這是經過挑選的家譜：從希斯崙到拿順跨越數百年，只列寥寥幾代；它的目的是神學的連結，叫我們看見神的信實，不是年表（鐵律四）。本講義不從家譜推算任何數字。", "檢驗標準：會眾帶回家的，是一張算式，還是一句「幾百年過去，神沒有忘記祂的應許」？", "⑭ 錯誤講法——一開口就說「4:6 就是有己，波阿斯就是無己」，跳過城門前的律法程序，直接把兩個人當成 321 理念的插圖。", "先從經文自己講出來（鐵律五）：要先講清楚利 25:25 的贖地、申 25:5--6 的立後、4:5 的異讀與那人合法的理由，對照才站得住；跳過經文，那位親屬就從一個真實的人變成道具。", "檢驗標準：會眾聽完，能不能說出那人為甚麼「不能贖」？若說不出來，321 的應用就只是貼上去的標語。", "⑮ 錯誤講法——把「耶西生大衛」講成「所以我們需要一位強勢的領袖」，或藉此評論當代政治、鞏固講台的權威。", "士 21:25 的問題是人人在自己眼中作王；路得記的回答是神在暗中預備祂的王，最後指向「耶穌基督的家譜」（太 1:1）。需要的是讓耶穌作王，不是推崇強人。", "檢驗標準：「沒有王」與「大衛」的應用，最後有沒有先落在講者與聽者自己身上：我的產業、我的決定，誰作王？"]}], "txt": {"1": ["當士師秉政的時候，國中遭遇饑荒。在猶大的伯利恆，有一個人帶著妻子和兩個兒子往摩押地去寄居。", "這人名叫以利米勒，他的妻名叫拿俄米；他兩個兒子，一個名叫瑪倫，一個名叫基連，都是猶大伯利恆的以法他人。他們到了摩押地，就住在那裡。", "後來拿俄米的丈夫以利米勒死了，剩下婦人和她兩個兒子。", "這兩個兒子娶了摩押女子為妻，一個名叫俄珥巴，一個名叫路得，在那裡住了約有十年。", "瑪倫和基連二人也死了，剩下拿俄米，沒有丈夫，也沒有兒子。", "她就與兩個兒婦起身，要從摩押地歸回；因為她在摩押地聽見耶和華眷顧自己的百姓，賜糧食與他們。", "於是她和兩個兒婦起行離開所住的地方，要回猶大地去。", "拿俄米對兩個兒婦說：「你們各人回娘家去吧。願耶和華恩待你們，像你們恩待已死的人與我一樣！", "願耶和華使你們各在新夫家中得平安！」於是拿俄米與她們親嘴。她們就放聲而哭，", "說：「不然，我們必與你一同回你本國去。」", "拿俄米說：「我女兒們哪，回去吧！為何要跟我去呢？我還能生子作你們的丈夫嗎？", "我女兒們哪，回去吧！我年紀老邁，不能再有丈夫；即或說，我還有指望，今夜有丈夫可以生子，", "你們豈能等著他們長大呢？你們豈能等著他們不嫁別人呢？我女兒們哪，不要這樣。我為你們的緣故甚是愁苦，因為耶和華伸手攻擊我。」", "兩個兒婦又放聲而哭，俄珥巴與婆婆親嘴而別，只是路得捨不得拿俄米。", "拿俄米說：「看哪，你嫂子已經回她本國和她所拜的神那裡去了，你也跟著你嫂子回去吧！」", "路得說：「不要催我回去不跟隨你。你往哪裡去，我也往那裡去；你在哪裡住宿，我也在那裡住宿；你的國就是我的國，你的神就是我的神。", "你在哪裡死，我也在那裡死，也葬在那裡。除非死能使你我相離！不然，願耶和華重重地降罰與我。」", "拿俄米見路得定意要跟隨自己去，就不再勸她了。", "於是二人同行，來到伯利恆。她們到了伯利恆，合城的人就都驚訝。婦女們說：「這是拿俄米嗎？」", "拿俄米對她們說：「不要叫我拿俄米〔就是甜的意思〕，要叫我瑪拉〔就是苦的意思〕，因為全能者使我受了大苦。", "我滿滿地出去，耶和華使我空空地回來。耶和華降禍與我；全能者使我受苦。既是這樣，你們為何還叫我拿俄米呢？」", "拿俄米和她兒婦摩押女子路得，從摩押地回來到伯利恆，正是動手割大麥的時候。"], "2": ["拿俄米的丈夫以利米勒的親族中，有一個人名叫波阿斯，是個大財主。", "摩押女子路得對拿俄米說：「容我往田間去，我蒙誰的恩，就在誰的身後拾取麥穗。」拿俄米說：「女兒啊，你只管去。」", "路得就去了，來到田間，在收割的人身後拾取麥穗。她恰巧到了以利米勒本族的人波阿斯那塊田裡。", "波阿斯正從伯利恆來，對收割的人說：「願耶和華與你們同在！」他們回答說：「願耶和華賜福與你！」", "波阿斯問監管收割的僕人說：「那是誰家的女子？」", "監管收割的僕人回答說：「是那摩押女子，跟隨拿俄米從摩押地回來的。", "她說：『請你容我跟著收割的人拾取打捆剩下的麥穗。』她從早晨直到如今，除了在屋子裡坐一會兒，常在這裡。」", "波阿斯對路得說：「女兒啊，聽我說，不要往別人田裡拾取麥穗，也不要離開這裡，要常與我使女們在一處。", "我的僕人在那塊田收割，你就跟著他們去。我已經吩咐僕人不可欺負你；你若渴了，就可以到器皿那裡喝僕人打來的水。」", "路得就俯伏在地叩拜，對他說：「我既是外邦人，怎麼蒙你的恩，這樣顧恤我呢？」", "波阿斯回答說：「自從你丈夫死後，凡你向婆婆所行的，並你離開父母和本地，到素不認識的民中，這些事人全都告訴我了。", "願耶和華照你所行的賞賜你。你來投靠耶和華－以色列神的翅膀下，願你滿得他的賞賜。」", "路得說：「我主啊，願在你眼前蒙恩。我雖然不及你的一個使女，你還用慈愛的話安慰我的心。」", "到了吃飯的時候，波阿斯對路得說：「你到這裡來吃餅，將餅蘸在醋裡。」路得就在收割的人旁邊坐下；他們把烘了的穗子遞給她。她吃飽了，還有餘剩的。", "她起來又拾取麥穗，波阿斯吩咐僕人說：「她就是在捆中拾取麥穗，也可以容她，不可羞辱她；", "並要從捆裡抽出些來，留在地下任她拾取，不可叱嚇她。」", "這樣，路得在田間拾取麥穗，直到晚上，將所拾取的打了，約有一伊法大麥。", "她就把所拾取的帶進城去給婆婆看，又把她吃飽了所剩的給了婆婆。", "婆婆問她說：「你今日在哪裡拾取麥穗，在哪裡做工呢？願那顧恤你的得福。」路得就告訴婆婆說：「我今日在一個名叫波阿斯的人那裡做工。」", "拿俄米對兒婦說：「願那人蒙耶和華賜福，因為他不斷地恩待活人死人。」拿俄米又說：「那是我們本族的人，是一個至近的親屬。」", "摩押女子路得說：「他對我說：『你要緊隨我的僕人拾取麥穗，直等他們收完了我的莊稼。』」", "拿俄米對兒婦路得說：「女兒啊，你跟著他的使女出去，不叫人遇見你在別人田間，這才為好。」", "於是路得與波阿斯的使女常在一處拾取麥穗，直到收完了大麥和小麥。路得仍與婆婆同住。"], "3": ["路得的婆婆拿俄米對她說：「女兒啊，我不當為你找個安身之處，使你享福嗎？", "你與波阿斯的使女常在一處，波阿斯不是我們的親族嗎？他今夜在場上簸大麥；", "你要沐浴抹膏，換上衣服，下到場上，卻不要使那人認出你來。你等他吃喝完了，", "到他睡的時候，你看準他睡的地方，就進去掀開他腳上的被，躺臥在那裡，他必告訴你所當做的事。」", "路得說：「凡你所吩咐的，我必遵行。」", "路得就下到場上，照她婆婆所吩咐她的而行。", "波阿斯吃喝完了，心裡歡暢，就去睡在麥堆旁邊。路得便悄悄地來掀開他腳上的被，躺臥在那裡。", "到了夜半，那人忽然驚醒，翻過身來，不料有女子躺在他的腳下。", "他就說：「你是誰？」回答說：「我是你的婢女路得。求你用你的衣襟遮蓋我，因為你是我一個至近的親屬。」", "波阿斯說：「女兒啊，願你蒙耶和華賜福。你末後的恩比先前更大；因為少年人無論貧富，你都沒有跟從。", "女兒啊，現在不要懼怕，凡你所說的，我必照著行；我本城的人都知道你是個賢德的女子。", "我實在是你一個至近的親屬，只是還有一個人比我更近。", "你今夜在這裡住宿，明早他若肯為你盡親屬的本分，就由他吧！倘若不肯，我指著永生的耶和華起誓，我必為你盡了本分，你只管躺到天亮。」", "路得便在他腳下躺到天快亮，人彼此不能辨認的時候就起來了。波阿斯說：「不可使人知道有女子到場上來」；", "又對路得說：「打開你所披的外衣。」她打開了，波阿斯就撮了六簸箕大麥，幫她扛在肩上，她便進城去了。", "路得回到婆婆那裡，婆婆說：「女兒啊，怎麼樣了？」路得就將那人向她所行的述說了一遍，", "又說：「那人給了我六簸箕大麥，對我說：『你不可空手回去見你的婆婆。』」", "婆婆說：「女兒啊，你只管安坐等候，看這事怎樣成就，因為那人今日不辦成這事必不休息。」"], "4": ["波阿斯到了城門，坐在那裡，恰巧波阿斯所說的那至近的親屬經過。波阿斯說：「某人哪，你來坐在這裡。」他就來坐下。", "波阿斯又從本城的長老中揀選了十人，對他們說：「請你們坐在這裡。」他們就都坐下。", "波阿斯對那至近的親屬說：「從摩押地回來的拿俄米，現在要賣我們族兄以利米勒的那塊地；", "我想當贖那塊地的是你，其次是我，以外再沒有別人了。你可以在這裡的人面前和我本國的長老面前說明，你若肯贖就贖，若不肯贖就告訴我。」那人回答說：「我肯贖。」", "波阿斯說：「你從拿俄米手中買這地的時候，也當娶〔原文是買；十節同〕死人的妻摩押女子路得，使死人在產業上存留他的名。」", "那人說：「這樣我就不能贖了，恐怕於我的產業有礙。你可以贖我所當贖的，我不能贖了。」", "從前，在以色列中要定奪什麼事，或贖回，或交易，這人就脫鞋給那人。以色列人都以此為證據。", "那人對波阿斯說：「你自己買吧！」於是將鞋脫下來了。", "波阿斯對長老和眾民說：「你們今日作見證，凡屬以利米勒和基連、瑪倫的，我都從拿俄米手中置買了；", "又娶了瑪倫的妻摩押女子路得為妻，好在死人的產業上存留他的名，免得他的名在本族本鄉滅沒。你們今日可以作見證。」", "在城門坐著的眾民和長老都說：「我們作見證。願耶和華使進你家的這女子，像建立以色列家的拉結、利亞二人一樣。又願你在以法他得亨通，在伯利恆得名聲。", "願耶和華從這少年女子賜你後裔，使你的家像她瑪從猶大所生法勒斯的家一般。」", "於是，波阿斯娶了路得為妻，與她同房。耶和華使她懷孕生了一個兒子。", "婦人們對拿俄米說：「耶和華是應當稱頌的！因為今日沒有撇下你，使你無至近的親屬。願這孩子在以色列中得名聲。", "他必提起你的精神，奉養你的老，因為是愛慕你的那兒婦所生的。有這兒婦比有七個兒子還好！」", "拿俄米就把孩子抱在懷中，作他的養母。", "鄰舍的婦人說：「拿俄米得孩子了！」就給孩子起名叫俄備得。這俄備得是耶西的父，耶西是大衛的父。", "法勒斯的後代記在下面：法勒斯生希斯崙；", "希斯崙生蘭；蘭生亞米拿達；", "亞米拿達生拿順；拿順生撒門；", "撒門生波阿斯；波阿斯生俄備得；", "俄備得生耶西；耶西生大衛。"]}, "blk": {"1": [{"a": 1, "z": 2, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַיְהִ֗י בִּימֵי֙ שְׁפֹ֣ט הַשֹּׁפְטִ֔ים וַיְהִ֥י רָעָ֖ב בָּאָ֑רֶץ וַיֵּ֨לֶךְ אִ֜ישׁ מִבֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָגוּר֙ בִּשְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְאִשְׁתּ֖וֹ וּשְׁנֵ֥י בָנָֽיו׃ וְשֵׁ֣ם הָאִ֣ישׁ אֱֽלִימֶ֡לֶךְ וְשֵׁם֩ אִשְׁתּ֨וֹ נָעֳמִ֜י וְשֵׁ֥ם שְׁנֵֽי־בָנָ֣יו מַחְל֤וֹן וְכִלְיוֹן֙ אֶפְרָתִ֔ים מִבֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַיָּבֹ֥אוּ שְׂדֵי־מוֹאָ֖ב וַיִּֽהְיוּ־שָֽׁם׃<\/p>", "lit": "<p>「事情發生在士師審判的日子，地上有了饑荒。有一個人從猶大的伯利恆出去，要寄居在摩押的田野，他和他的妻子，並他的兩個兒子。這人的名字是以利米勒，他妻子的名字是拿俄米，他兩個兒子的名字是瑪倫和基連，是猶大伯利恆的以法他人。他們進了摩押的田野，就留在那裡。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>士師<\/td><td>הַשֹּׁפְטִים<\/td><td>hashofetim<\/td><td>H8199<\/td><td>「審判者」；開頭原文是「士師審判的日子」，同一個字根連用兩次<\/td><\/tr><tr><td>饑荒<\/td><td>רָעָב<\/td><td>ra‘av<\/td><td>H7458<\/td><td>饑荒；亞伯拉罕、雅各都曾因饑荒下埃及，以撒也因饑荒往基拉耳去<\/td><\/tr><tr><td>伯利恆<\/td><td>בֵּית לֶחֶם<\/td><td>beit lechem<\/td><td>H1035<\/td><td>「糧食之家」；糧食之家竟然沒有糧食<\/td><\/tr><tr><td>寄居<\/td><td>לָגוּר<\/td><td>lagur<\/td><td>H1481<\/td><td>作寄居的人；本意只是暫住，結果住了十年<\/td><\/tr><tr><td>以利米勒<\/td><td>אֱלִימֶלֶךְ<\/td><td>’elimelekh<\/td><td>H458<\/td><td>「我的神是王」；在一個「沒有王」的年代<\/td><\/tr><tr><td>拿俄米<\/td><td>נָעֳמִי<\/td><td>na‘omi<\/td><td>H5281<\/td><td>「甜美、喜悅」；1:20 她要改名<\/td><\/tr><\/table>", "gram": "<p><strong>第一句話就把路得記放回路得記裡。<\/strong><\/p><p>原文開頭是 וַיְהִי בִּימֵי שְׁפֹט הַשֹּׁפְטִים（vayhi bimei shefot hashofetim），直譯「在士師審判的日子」，名詞與不定詞同一字根連用，像說「在審判者審判的那些年」。同一節裡 וַיְהִי（「事情發生」）出現兩次：一次是時代，一次是饑荒。<\/p><p>「摩押地」原文是 בִּשְׂדֵי מוֹאָב（bisdei mo’av），直譯「摩押的田野」，1:2、6、22 反覆出現。全卷從「摩押的田野」寫到「波阿斯的田」（第 2 章），<strong>田的轉換，就是故事的轉換。<\/strong><\/p>", "exp": "<p><strong>路得記開場的第一筆，是一個國家的時代，第二筆，是一個家的饑荒。<\/strong><\/p><p>「當士師秉政的時候，國中遭遇饑荒」（1:1）。讀過路得記的人聽到這句話，心會往下沉。那是「沒有王，各人任意而行」的年代；路得記最後兩個悲劇故事，都和「猶大的伯利恆」有關（士 17:7；19:1）。路得記是伯利恆的第三個故事。<\/p><p>伯利恆原文的意思是「糧食之家」。<strong>糧食之家沒有糧食，「我的神是王」帶著一家人離開神的地。<\/strong>敘述者沒有加一句評語，沒有說他對，也沒有說他錯，只記下他的名字、他妻子的名字、他兩個兒子的名字，和他們要去的地方。<\/p><p>「寄居」原文 לָגוּר，本來是暫時住一住的意思；1:2 末了卻說「就住在那裡」，到 1:4 已經「住了約有十年」。暫住變成長住，常常不是一個決定，是一天一天沒有回頭。<\/p><p>饑荒中離鄉，不是以利米勒才有的事。亞伯蘭也曾「那地遭遇饑荒」（創 12:10）就往埃及去。今天許多弟兄姊妹為了生計離鄉、出國打工、移民，帶著一家人在別人的地上寄居。<strong>神沒有在第一節就判斷這一家，祂先把他們的名字一個一個寫下來。<\/strong>被神記得名字的人，走到哪裡都還在祂的故事裡。<\/p><p class=\"xref\">〔舊約〕士 17:7；19:1；21:25（路得記講義第 17、19、21 章）；創 12:10（創世記講義第 12 章）<\/p>"}, {"a": 3, "z": 5, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַיָּ֥מָת אֱלִימֶ֖לֶךְ אִ֣ישׁ נָעֳמִ֑י וַתִּשָּׁאֵ֥ר הִ֖יא וּשְׁנֵ֥י בָנֶֽיהָ׃ וַיִּשְׂא֣וּ לָהֶ֗ם נָשִׁים֙ מֹֽאֲבִיּ֔וֹת שֵׁ֤ם הָֽאַחַת֙ עָרְפָּ֔ה וְשֵׁ֥ם הַשֵּׁנִ֖ית ר֑וּת וַיֵּ֥שְׁבוּ שָׁ֖ם כְּעֶ֥שֶׂר שָׁנִֽים׃ וַיָּמ֥וּתוּ גַם־שְׁנֵיהֶ֖ם מַחְל֣וֹן וְכִלְי֑וֹן וַתִּשָּׁאֵר֙ הָֽאִשָּׁ֔ה מִשְּׁנֵ֥י יְלָדֶ֖יהָ וּמֵאִישָֽׁהּ׃<\/p>", "lit": "<p>「以利米勒，拿俄米的丈夫，死了；她被剩下，她和她的兩個兒子。他們為自己娶了摩押的女子為妻，一個的名字是俄珥巴，第二個的名字是路得；他們在那裡住了約十年。他們兩個，瑪倫和基連，也死了；這婦人被剩下，沒有了她的兩個孩子，也沒有了她的丈夫。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>死<\/td><td>וַיָּמָת<\/td><td>vayyamat<\/td><td>H4191<\/td><td>死；三節之內三個男人，經文只用最短的動詞<\/td><\/tr><tr><td>剩下<\/td><td>וַתִּשָּׁאֵר<\/td><td>vattisha’er<\/td><td>H7604<\/td><td>★ Niphal：被留下；1:3、5 各一次，主詞都是拿俄米<\/td><\/tr><tr><td>摩押女子<\/td><td>מֹאֲבִיּוֹת<\/td><td>mo’aviyyot<\/td><td>H4125<\/td><td>摩押的女子；全卷一再保留路得的出身<\/td><\/tr><tr><td>十年<\/td><td>כְּעֶשֶׂר שָׁנִים<\/td><td>ke‘eser shanim<\/td><td>H6235／H8141<\/td><td>約十年；經文沒有提到一個孩子<\/td><\/tr><tr><td>孩子<\/td><td>יְלָדֶיהָ<\/td><td>yeladeiha<\/td><td>H3206<\/td><td>「她的孩子們」；不說「兒子」而說「孩子」，4:16 拿俄米懷裡抱的「孩子」同一個字<\/td><\/tr><\/table>", "gram": "<p><strong>三個男人的死，是神的懲罰嗎？<\/strong><\/p><ul><li>懲罰說：部分猶太傳統（亞蘭文意譯本、拉比註釋）認為，離開應許之地、娶外邦女子，招來了死亡。<\/li><li>敘事說：經文只用連續敘事的「於是……死了」，沒有任何「因為」或評語；神的名字在 1:6 以前根本沒有出現。<\/li><li>處境說：饑荒中寄居是先祖走過的路（創 12:10），聖經沒有因此定罪亞伯蘭。<\/li><\/ul><blockquote><p><strong>本講義判斷：經文刻意沉默，講台也不可替經文加上因果。<\/strong>路得記不解釋這三座墳，只寫下一個被「剩下」的人。<\/p><\/blockquote>", "exp": "<p><strong>三節經文，三座墳；敘述者沒有說原因，只說了兩次「剩下」。<\/strong><\/p><p>以利米勒死了，「剩下婦人和她兩個兒子」（1:3）。兒子們娶了摩押女子，俄珥巴與路得，住了約十年，經文沒有提到一個孫子。然後瑪倫和基連也死了，「剩下拿俄米，沒有丈夫，也沒有兒子」（1:5）。<\/p><p>「剩下」原文 וַתִּשָּׁאֵר 是被動式，拿俄米不是主動留下，是被留下。<strong>苦難最深的地方，常常不是失去，是失去以後還要活下去。<\/strong><\/p><p>這裡最容易講錯。有人說：他們離開伯利恆，所以死了；兒子娶外邦女子，所以死了。可是經文一個「因為」也沒有。<strong>聖經沒有說的因果，講台不可以替神說。<\/strong>一位剛失去丈夫、或結婚多年沒有孩子的姊妹坐在會眾中，她需要聽到的是：神看見了這個被剩下的人，而不是神在處罰她。<\/p><p>1:5 有一個細節：拿俄米失去的不是「兒子」，原文是「孩子」（יְלָדֶיהָ，「她的孩子們」）。這個字要到第 4 章才再出現：「拿俄米就把孩子抱在懷中」。<strong>第一章失去的那個字，神在最後一章還給她。<\/strong>敘述者此刻不說破，卻已經知道結局。<\/p><p>今天若你也被「剩下」，你不必急著找出原因。路得記從不急著解釋，卻一路往前寫。<\/p><p class=\"xref\">〔舊約〕創 12:10（創世記講義第 12 章）；民 25:1（民數記講義第 25 章）<\/p>"}, {"a": 6, "z": 7, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַתָּ֤קָם הִיא֙ וְכַלֹּתֶ֔יהָ וַתָּ֖שָׁב מִשְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּשְׂדֵ֣ה מוֹאָ֔ב כִּֽי־פָקַ֤ד יְהוָה֙ אֶת־עַמּ֔וֹ לָתֵ֥ת לָהֶ֖ם לָֽחֶם׃ וַתֵּצֵ֗א מִן־הַמָּקוֹם֙ אֲשֶׁ֣ר הָיְתָה־שָׁ֔מָּה וּשְׁתֵּ֥י כַלֹּתֶ֖יהָ עִמָּ֑הּ וַתֵּלַ֣כְנָה בַדֶּ֔רֶךְ לָשׁ֖וּב אֶל־אֶ֥רֶץ יְהוּדָֽה׃<\/p>", "lit": "<p>「她就起來，她和她的兒婦們，要從摩押的田野回去；因為她在摩押的田野聽見：耶和華眷顧了自己的百姓，要給他們糧食。她從她所在的地方出來，她兩個兒婦與她一起；她們走在路上，要回到猶大地去。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>眷顧<\/td><td>פָקַד<\/td><td>paqad<\/td><td>H6485<\/td><td>★ 來察看、照顧；敘述者第一次親口說神作了甚麼<\/td><\/tr><tr><td>歸回<\/td><td>וַתָּשָׁב<\/td><td>vattashov<\/td><td>H7725<\/td><td>★ 回轉；本章出現十二次，全章的主旋律<\/td><\/tr><tr><td>糧食<\/td><td>לָחֶם<\/td><td>lachem<\/td><td>H3899<\/td><td>餅、糧食；與「伯利恆」（糧食之家）同一個字<\/td><\/tr><tr><td>兒婦<\/td><td>וְכַלֹּתֶיהָ<\/td><td>vekhalloteiha<\/td><td>H3618<\/td><td>媳婦；本章拿俄米卻一再叫她們「女兒」<\/td><\/tr><tr><td>路<\/td><td>בַדֶּרֶךְ<\/td><td>baddarekh<\/td><td>H1870<\/td><td>道路；「走在路上」——回頭的決定變成了腳步<\/td><\/tr><\/table>", "gram": "<p><strong>全卷只有兩次，敘述者直接說「耶和華」作了甚麼：1:6 與 4:13。<\/strong><\/p><p>一次是 פָקַד יְהוָה（paqad YHWH，「耶和華眷顧」），給了糧食；一次是「耶和華使她懷孕生了一個兒子」（4:13），給了生命。其餘的時候，神都藏在人的話語、祝福和「恰巧」裡。<\/p><p>1:6 還有一個字的遊戲：לָתֵת לָהֶם לָחֶם（latet lahem lachem，「給他們糧食」）。lachem 正是 beit lechem 的 lechem：<strong>「糧食之家」又有糧食了。<\/strong><\/p>", "exp": "<p><strong>拿俄米回家的第一步，不是因為看見，是因為聽見。<\/strong><\/p><p>她人還在摩押，消息傳來：「耶和華眷顧自己的百姓，賜糧食與他們」（1:6）。她沒有看見伯利恆的麥田，只聽說神在那裡作工。<strong>回轉常常從一個消息開始：神還在祂的百姓中間。<\/strong><\/p><p>「眷顧」原文 פָּקַד，是神親自來察看、來照顧的字。神「按著先前的話眷顧撒拉」（創 21:1），「耶和華眷顧哈拿」（撒上 2:21），以色列人在埃及「聽見耶和華眷顧他們」就低頭下拜（出 4:31）。<strong>這個字常常出現在人等了很久、以為神忘了的時候。<\/strong><\/p><p>經文兩次說她們「歸回」「要回猶大地去」。「歸回」原文 שׁוּב，第 1 章出現十二次，是全章的骨幹。奇怪的是，兩個兒婦從來沒有住過猶大，對她們來說，這不是回家，是離家。<strong>同一條路，拿俄米是回頭，兩個摩押女子是轉向。<\/strong><\/p><p>拿俄米還沒有走出她的傷痛，她的心到 1:21 還是空的；但她的腳已經上了路。今天有人說：我還感覺不到神，我不知道能不能回去。路得記告訴我們，<strong>可以先帶著聽見的消息起身，感覺會在路上趕上來。<\/strong><\/p><p class=\"xref\">〔舊約〕創 21:1（創世記講義第 21 章）；出 4:31（出埃及記講義第 4 章）<\/p>"}, {"a": 8, "z": 9, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּ֤אמֶר נָעֳמִי֙ לִשְׁתֵּ֣י כַלֹּתֶ֔יהָ לֵ֣כְנָה שֹּׁ֔בְנָה אִשָּׁ֖ה לְבֵ֣ית אִמָּ֑הּ יַ֣עַשׂ יְהוָ֤ה עִמָּכֶם֙ חֶ֔סֶד כַּאֲשֶׁ֧ר עֲשִׂיתֶ֛ם עִם־הַמֵּתִ֖ים וְעִמָּדִֽי׃ יִתֵּ֤ן יְהוָה֙ לָכֶ֔ם וּמְצֶ֣אןָ מְנוּחָ֔ה אִשָּׁ֖ה בֵּ֣ית אִישָׁ֑הּ וַתִּשַּׁ֣ק לָהֶ֔ן וַתִּשֶּׂ֥אנָה קוֹלָ֖ן וַתִּבְכֶּֽינָה׃<\/p>", "lit": "<p>「拿俄米對她兩個兒婦說：去吧，回去吧，各人回到她母親的家。願耶和華以慈愛待你們，像你們以慈愛待那些死了的人和我一樣。願耶和華賜給你們，使你們找到安息，各人在她丈夫的家。她就與她們親嘴；她們放聲而哭。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>母家<\/td><td>לְבֵית אִמָּהּ<\/td><td>leveit ’immah<\/td><td>H1004／H517<\/td><td>「她母親的家」；舊約一般說「父家」，這裡說「母家」<\/td><\/tr><tr><td>恩待<\/td><td>חֶסֶד<\/td><td>chesed<\/td><td>H2617<\/td><td>★ 立約的慈愛、忠誠的恩情；全卷三次（1:8；2:20；3:10）<\/td><\/tr><tr><td>平安<\/td><td>מְנוּחָה<\/td><td>menuchah<\/td><td>H4496<\/td><td>★ 安息、安頓之處；3:1「安身之處」同字根<\/td><\/tr><tr><td>親嘴<\/td><td>וַתִּשַּׁק<\/td><td>vattishshaq<\/td><td>H5401<\/td><td>親吻；告別的動作，1:14 再出現一次<\/td><\/tr><tr><td>放聲<\/td><td>וַתִּשֶּׂאנָה קוֹלָן<\/td><td>vattisse’nah qolan<\/td><td>H5375／H6963<\/td><td>直譯「她們舉起她們的聲音」<\/td><\/tr><\/table>", "gram": "<p><strong>1:8 有一處 Ketiv／Qere。<\/strong>抄本寫作 יעשה（未完成式「他將作」），讀作 יַעַשׂ（ya‘as，祈願式「願他作」）。照讀出形，整句是禱告，不是預言：「願耶和華恩待你們」（1:8）。<\/p><p>「母家」是少見的說法（另見創 24:28；歌 3:4），常和婚嫁的安排有關：拿俄米是要她們回到可以再嫁的地方。另外，「你們」עִמָּכֶם 原文用陽性詞尾指兩位女子，這是古希伯來文常見的現象，不必另作解釋。<\/p>", "exp": "<p><strong>拿俄米失去了一切，她開口的第一句話，卻是為別人祝福。<\/strong><\/p><p>她叫兩個兒婦回去，接著說：「願耶和華恩待你們，像你們恩待已死的人與我一樣」（1:8）。「恩待」原文 חֶסֶד，是舊約最重的字之一：不是一時的好心，是在關係裡守住到底的忠誠。<strong>拿俄米求神照著這兩個摩押女子待人的樣子，來待她們。<\/strong>這是全卷第一次出現 חֶסֶד，而它最先被用來形容的，是兩個外邦媳婦。<\/p><p>然後她說：「願耶和華使你們各在新夫家中得平安」（1:9）。「平安」原文 מְנוּחָה，是安息、安頓的地方。一個寡婦在古代沒有丈夫，就沒有保障；拿俄米最想給她們的，是一個家。到了 3:1，她會說：「我不當為你找個安身之處，使你享福嗎」（3:1）——<strong>她在第 1 章求神作的事，第 3 章她自己捲起袖子去作。<\/strong><\/p><p>注意她的心：讓兒婦回去，等於讓自己一個人上路。她選擇了別人的好處，不是自己的依靠。三個人「放聲而哭」，因為這是真愛，才會這麼痛。<\/p><p>在最空的時候還能祝福別人，這不是因為不痛，是因為心還向著神。<strong>受傷的人不一定只會傷人，受傷的人也可以為人禱告。<\/strong><\/p><p class=\"xref\">〔舊約〕創 24:27（創世記講義第 24 章）；出 34:6（出埃及記講義第 34 章）<\/p>"}, {"a": 10, "z": 13, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּאמַ֖רְנָה־לָּ֑הּ כִּי־אִתָּ֥ךְ נָשׁ֖וּב לְעַמֵּֽךְ׃ וַתֹּ֤אמֶר נָעֳמִי֙ שֹׁ֣בְנָה בְנֹתַ֔י לָ֥מָּה תֵלַ֖כְנָה עִמִּ֑י הַֽעֽוֹד־לִ֤י בָנִים֙ בְּֽמֵעַ֔י וְהָי֥וּ לָכֶ֖ם לַאֲנָשִֽׁים׃ שֹׁ֤בְנָה בְנֹתַי֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִהְי֣וֹת לְאִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ־לִ֣י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַלַּ֨יְלָה֙ לְאִ֔ישׁ וְגַ֖ם יָלַ֥דְתִּי בָנִֽים׃ הֲלָהֵ֣ן תְּשַׂבֵּ֗רְנָה עַ֚ד אֲשֶׁ֣ר יִגְדָּ֔לוּ הֲלָהֵן֙ תֵּֽעָגֵ֔נָה לְבִלְתִּ֖י הֱי֣וֹת לְאִ֑ישׁ אַ֣ל בְּנֹתַ֗י כִּֽי־מַר־לִ֤י מְאֹד֙ מִכֶּ֔ם כִּֽי־יָצְאָ֥ה בִ֖י יַד־יְהוָֽה׃<\/p>", "lit": "<p>「她們對她說：不，我們要與你一同回到你的百姓那裡。拿俄米說：回去吧，我的女兒們，為甚麼要與我同去呢？我腹中還有兒子可以作你們的丈夫嗎？回去吧，我的女兒們，走吧，因為我太老，不能再屬丈夫了。即使我說：我還有盼望，就算我今夜屬了丈夫，也生了兒子，你們豈能為他們等候，直到他們長大？你們豈能為此把自己關起來，不屬丈夫？不，我的女兒們，因為我比你們苦得多，因為耶和華的手出來攻擊我。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>女兒們<\/td><td>בְנֹתַי<\/td><td>benotai<\/td><td>H1323<\/td><td>「我的女兒們」；三節之內三次，婆婆的稱呼裡有母親的心<\/td><\/tr><tr><td>指望<\/td><td>תִקְוָה<\/td><td>tiqvah<\/td><td>H8615<\/td><td>盼望；與書 2:18「朱紅線繩」的「線繩」同形異義；在這裡只是一個假設：「即或說，我還有指望」<\/td><\/tr><tr><td>等著<\/td><td>תְּשַׂבֵּרְנָה<\/td><td>tesabbernah<\/td><td>H7663<\/td><td>Piel：等候、盼望<\/td><\/tr><tr><td>不嫁別人<\/td><td>תֵּעָגֵנָה<\/td><td>te‘agenah<\/td><td>H5702<\/td><td>聖經只此一次：把自己關住、守著不嫁<\/td><\/tr><tr><td>愁苦<\/td><td>מַר<\/td><td>mar<\/td><td>H4843<\/td><td>苦；1:20「瑪拉」同字根<\/td><\/tr><tr><td>耶和華的手<\/td><td>יַד־יְהוָה<\/td><td>yad YHWH<\/td><td>H3027／H3068<\/td><td>神的手；直譯「耶和華的手出來攻擊我」<\/td><\/tr><\/table>", "gram": "<p><strong>「我為你們的緣故甚是愁苦」（1:13），原文 כִּי־מַר־לִי מְאֹד מִכֶּם 可以有兩種讀法。<\/strong><\/p><ul><li>原因說：介系詞 מִן 表原因——「為你們的緣故，我非常難過」，和合本採這個讀法。<\/li><li>比較說：מִן 表比較——「我比你們苦得多」，因為你們還年輕，還可以再嫁，我卻沒有將來。<\/li><\/ul><blockquote><p><strong>本講義判斷：兩說文法都成立；比較說更貼近下文「因為耶和華伸手攻擊我」與 1:20 的「瑪拉」。<\/strong>不論哪一種，拿俄米都沒有責怪兒婦；她是在說，跟著她只會分擔她的苦。<\/p><\/blockquote>", "exp": "<p><strong>拿俄米不是在趕人，她是在用盡最後的理性愛她們。<\/strong><\/p><p>兩個兒婦說：「不然，我們必與你一同回你本國去」（1:10）。拿俄米連說三次「回去吧」，理由非常現實：「我還能生子作你們的丈夫嗎」（1:11）。按照以色列的習俗，丈夫死了沒有兒子，由弟兄娶寡嫂，為死人立後（申 25:5）。拿俄米一層一層算給她們聽：我老了；就算今夜嫁人、生子，你們要等到他們長大嗎？<\/p><p><strong>這是一位母親的算術，每一步都算出同一個答案：跟著我，你們沒有將來。<\/strong>她三次叫她們「女兒」，原文 בְּנֹתַי，這不是婆婆對媳婦的命令，是母親對女兒的不捨。<\/p><p>最後一句是全章第一聲哀歌：「我為你們的緣故甚是愁苦，因為耶和華伸手攻擊我」（1:13）。她把苦難歸到神的手上。<strong>經文沒有糾正她，敘述者沒有，兩個兒婦也沒有。<\/strong>她沒有離開神，她是對著神說出最真的話。<\/p><p>我們身邊也有這樣的人：病了、老了、失去了，就對身邊的人說「你們不要管我了」。那不一定是放棄，常常是愛。<strong>能誠實地說「我沒有甚麼可以給你了」的人，心裡其實還在為對方著想。<\/strong><\/p><p class=\"xref\">〔舊約〕申 25:5--10（申命記講義第 25 章）；創 38:8（創世記講義第 38 章）<\/p>"}, {"a": 14, "z": 14, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַתִּשֶּׂ֣נָה קוֹלָ֔ן וַתִּבְכֶּ֖ינָה ע֑וֹד וַתִּשַּׁ֤ק עָרְפָּה֙ לַחֲמוֹתָ֔הּ וְר֖וּת דָּ֥בְקָה בָּֽהּ׃<\/p>", "lit": "<p>「她們又放聲而哭；俄珥巴與她婆婆親嘴，路得卻緊緊黏住她。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>親嘴<\/td><td>וַתִּשַּׁק<\/td><td>vattishshaq<\/td><td>H5401<\/td><td>親吻告別；與 1:9 拿俄米親兒婦同一個動作<\/td><\/tr><tr><td>俄珥巴<\/td><td>עָרְפָּה<\/td><td>‘orpah<\/td><td>H6204<\/td><td>人名；有拉比聯想 עֹרֶף（頸背），只是民間字源，經文沒有這樣用<\/td><\/tr><tr><td>婆婆<\/td><td>לַחֲמוֹתָהּ<\/td><td>lachamotah<\/td><td>H2545<\/td><td>丈夫的母親；路得記全卷十次稱拿俄米為婆婆<\/td><\/tr><tr><td>捨不得<\/td><td>דָּבְקָה<\/td><td>daveqah<\/td><td>H1692<\/td><td>★ 緊貼、連合；創 2:24「與妻子連合」、申 10:20「專靠他」同一個字<\/td><\/tr><\/table>", "gram": "<p><strong>一節之內，兩個動詞把兩個媳婦分開：וַתִּשַּׁק（親嘴）與 דָּבְקָה（緊貼）。<\/strong><\/p><p>經文沒有用「離開」或「背棄」形容俄珥巴，只說她「與婆婆親嘴而別」——這是正常、合禮的告別。路得的 דָּבַק 卻是盟約的字眼：人與妻子的「連合」、以色列對耶和華的「專靠」。原文語序也把路得放在動詞前面：וְרוּת דָּבְקָה בָּהּ，直譯「至於路得，她黏住了她」，對比就在這個語序裡。<\/p>", "exp": "<p><strong>這一節不是一個好媳婦和一個壞媳婦，是一個照著勸告回去的人，和一個超過勸告留下來的人。<\/strong><\/p><p>「俄珥巴與婆婆親嘴而別，只是路得捨不得拿俄米」（1:14）。我們常把俄珥巴講成反面人物，可是經文沒有一句責備她。她哭了兩次，她說過要跟著去（1:10），最後是拿俄米三次勸她回去，她才回去。<strong>她作的，正是拿俄米要她作的。<\/strong>俄珥巴作的，是合理、正常、可以被理解的選擇。<\/p><p>路得的不同，在一個字：「捨不得」原文 דָּבַק，意思是緊緊黏住。這個字在創世記說「與妻子連合」（創 2:24），在申命記說以色列要「專靠他」（申 10:20）。<strong>路得對拿俄米的緊貼，用的是盟約的語言。<\/strong>她不是一時的情緒，是一個綁上自己一生的決定。<\/p><p>親嘴是告別，緊貼是不放手。愛可以讓人得體地離開，也可以讓人不顧代價地留下。<strong>神沒有要我們看不起那個回去的人，祂要我們看見，有人選擇了超過本分的愛。<\/strong><\/p><p>今天在你的家裡、小組裡，也許有人得體地離開了，也有人默默留下。不要定罪前者；也別忘了感謝後者。這個 דָּבַק 在第 2 章還要出現三次，路得「常在一處」拾穗——<strong>她黏住拿俄米，也就黏住了拿俄米的神所預備的路。<\/strong><\/p><p class=\"xref\">〔舊約〕創 2:24（創世記講義第 2 章）；申 10:20（申命記講義第 10 章）<\/p>"}, {"a": 15, "z": 15, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔ךְ אֶל־עַמָּ֖הּ וְאֶל־אֱלֹהֶ֑יהָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽךְ׃<\/p>", "lit": "<p>「她說：看哪，你的嫂子已經回到她的百姓和她的神那裡去了；你跟在你嫂子後面回去吧。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>嫂子<\/td><td>יְבִמְתֵּךְ<\/td><td>yevimtekh<\/td><td>H2994<\/td><td>妯娌、寡嫂；與「弟兄娶寡嫂」的律法同一個字根<\/td><\/tr><tr><td>本國<\/td><td>עַמָּהּ<\/td><td>‘ammah<\/td><td>H5971<\/td><td>她的百姓；1:16 路得就用這個字回答<\/td><\/tr><tr><td>她所拜的神<\/td><td>אֱלֹהֶיהָ<\/td><td>’eloheiha<\/td><td>H430<\/td><td>「她的神」；形式是複數，指摩押的神祇<\/td><\/tr><tr><td>回去<\/td><td>שׁוּבִי<\/td><td>shuvi<\/td><td>H7725<\/td><td>命令式「回去吧」；拿俄米第四次叫兒婦回去<\/td><\/tr><\/table>", "gram": "<p><strong>拿俄米勸路得回到「她所拜的神那裡去」，她是在勸人拜偶像嗎？<\/strong><\/p><ul><li>現實描述說：古代近東的人把民族與神明看作一體（士 11:24；撒上 26:19），回到摩押就是回到基抹的地界；拿俄米只是說出事實。<\/li><li>試驗說：拿俄米故意把代價說破，要路得看清楚自己在選甚麼。<\/li><li>軟弱說：在極深的苦裡，拿俄米沒有想到要為兒婦的信仰負責。<\/li><\/ul><blockquote><p><strong>本講義判斷：經文沒有評論拿俄米的動機，第一說最合原文的口氣；但這句話客觀上把選擇攤開了。<\/strong>正因為「回去」等於回到別神那裡，路得的回答才成了對耶和華的選擇。<\/p><\/blockquote>", "exp": "<p><strong>拿俄米這一句話，把路得的選擇從「留不留在婆婆身邊」，變成了「要事奉哪一位神」。<\/strong><\/p><p>「你嫂子已經回她本國和她所拜的神那裡去了」（1:15）。在拿俄米的世界裡，百姓和神是分不開的。摩押人的神是基抹，耶弗他也曾對亞捫王說「你的神基抹所賜你的地你不是得為業嗎」（士 11:24）。回到摩押，不只是回娘家，也是回到另一位神的權下。<\/p><p>這句話聽起來很刺耳，好像一個以色列人在勸人拜偶像。可是我們要先聽懂她：她不是在傳道，她是在說明一件人人都知道的事。<strong>她沒有把信仰包裝得很容易；她把路的兩頭都說破了。<\/strong><\/p><p>「嫂子」原文 יְבִמְתֵּךְ，正是「弟兄娶寡嫂」那條律法的字根。拿俄米在提醒路得：那條路對你已經關上了。<strong>她把所有人間的理由都拿走了，留下的只有一個問題：你要跟隨誰？<\/strong><\/p><p>主耶穌也曾在眾人退去的時候，轉身問門徒：「你們也要去嗎」（約 6:67）。有時神容許我們身邊的人一個一個走開，不是為了讓我們孤單，是為了讓我們自己回答。這一節是 1:16 的門，打開了，路得才說得出那句話。<\/p><p class=\"xref\">〔舊約〕士 11:24（路得記講義第 11 章）；民 21:29（民數記講義第 21 章）<\/p>"}, {"a": 16, "z": 16, "star": 3, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּ֤אמֶר רוּת֙ אַל־תִּפְגְּעִי־בִ֔י לְעָזְבֵ֖ךְ לָשׁ֣וּב מֵאַחֲרָ֑יִךְ כִּ֠י אֶל־אֲשֶׁ֨ר תֵּלְכִ֜י אֵלֵ֗ךְ וּבַאֲשֶׁ֤ר תָּלִ֨ינִי֙ אָלִ֔ין עַמֵּ֣ךְ עַמִּ֔י וֵאלֹהַ֖יִךְ אֱלֹהָֽי׃<\/p>", "lit": "<p>「路得說：不要逼我離開你，不要逼我不跟在你後面而回去；因為你往哪裡去，我就往那裡去；你在哪裡過夜，我就在那裡過夜。你的百姓，我的百姓；你的神，我的神。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>催<\/td><td>תִּפְגְּעִי<\/td><td>tifge‘i<\/td><td>H6293<\/td><td>逼迫、催逼、遇上；2:22「遇見」同一個字根<\/td><\/tr><tr><td>離開<\/td><td>לְעָזְבֵךְ<\/td><td>le‘ozvekh<\/td><td>H5800<\/td><td>撇下；2:20 神「不斷地恩待」直譯「不撇下祂的慈愛」同一個字<\/td><\/tr><tr><td>住宿<\/td><td>תָּלִינִי<\/td><td>talini<\/td><td>H3885<\/td><td>過夜；3:13「你今夜在這裡住宿」同一個字<\/td><\/tr><tr><td>你的國就是我的國<\/td><td>עַמֵּךְ עַמִּי<\/td><td>‘ammekh ‘ammi<\/td><td>H5971<\/td><td>直譯「你的百姓，我的百姓」<\/td><\/tr><tr><td>你的神就是我的神<\/td><td>וֵאלֹהַיִךְ אֱלֹהָי<\/td><td>velohayikh ’elohai<\/td><td>H430<\/td><td>★ 全卷的起點：主權的轉移<\/td><\/tr><\/table>", "gram": "<p><strong>這是對婆婆的效忠，還是對神的委身？<\/strong><\/p><p>最後兩句原文沒有動詞，只有四個字：עַמֵּךְ עַמִּי וֵאלֹהַיִךְ אֱלֹהָי。希伯來文的無動詞句是身分的宣告，句型正像神立約的話：「我要作他們的神，他們要作我的子民」（耶 31:33）。路得從人這一邊，說出了這個約。<\/p><ul><li>個人忠誠說：重點在婆媳之情，信仰是附帶的。<\/li><li>歸信宣告說：重點在換了百姓、換了神，婆婆是帶她到神面前的那個人。<\/li><\/ul><blockquote><p><strong>本講義判斷：兩者交織，重心落在「你的神就是我的神」。<\/strong>下一節她就指著耶和華的名起誓。這一節不是孝道條款。<\/p><\/blockquote>", "exp": "<p><strong>全本舊約最美的一句委身的話，是一個摩押寡婦，對一個已經空了的以色列寡婦說的。<\/strong><\/p><p>先看她站在哪裡。她剛埋葬了丈夫，在摩押約十年，經文沒有提到一個孩子。拿俄米已經說清楚：她沒有兒子可以給她，回伯利恆沒有任何保障；嫂子已經回去了。<strong>路得不是跟隨一個有前途的婆婆，是跟隨一個空了的婆婆，和她的神。<\/strong><\/p><p>她說：「不要催我回去不跟隨你」（1:16）。「離開」原文 עָזַב，就是「撇下」。到了 2:20，拿俄米會說神「不斷地恩待活人死人」，原文直譯是神「不撇下祂的慈愛」。<strong>一個不肯撇下人的媳婦，帶出一位不撇下人的神。<\/strong><\/p><p>接著是四個字：「你的百姓，我的百姓；你的神，我的神。」這不是婆媳相處之道，是一個人換了國籍、換了主人。經文以後仍然一直叫她「摩押女子路得」（1:22），神接納她，不需要她假裝自己不是摩押人。<strong>神不看你從哪裡來，看你歸向誰。<\/strong><\/p><p>這使我們想起主耶穌說：「若有人要跟從我，就當捨己」（路 9:23）。路得沒有聽過這句話，卻活出了它的樣子：在看不見回報的地方，作了一個不回頭的決定。321 說「讓耶穌作王」，起點就在這裡——<strong>不是先算好代價再跟隨，是先說「你的神就是我的神」，再一步一步走。<\/strong><\/p><p class=\"xref\">〔舊約〕利 26:12（利未記講義第 26 章）；申 23:3（申命記講義第 23 章）〔新約〕太 1:5<\/p>"}, {"a": 17, "z": 18, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">בַּאֲשֶׁ֤ר תָּמ֨וּתִי֙ אָמ֔וּת וְשָׁ֖ם אֶקָּבֵ֑ר כֹּה֩ יַעֲשֶׂ֨ה יְהוָ֥ה לִי֙ וְכֹ֣ה יֹסִ֔יף כִּ֣י הַמָּ֔וֶת יַפְרִ֖יד בֵּינִ֥י וּבֵינֵֽךְ׃ וַתֵּ֕רֶא כִּֽי־מִתְאַמֶּ֥צֶת הִ֖יא לָלֶ֣כֶת אִתָּ֑הּ וַתֶּחְדַּ֖ל לְדַבֵּ֥ר אֵלֶֽיהָ׃<\/p>", "lit": "<p>「你在哪裡死，我就在那裡死，也在那裡被埋葬。願耶和華這樣待我，並且加倍，因為只有死能使我和你分開。拿俄米看見她堅定要與她同去，就停止不再對她說了。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>葬<\/td><td>אֶקָּבֵר<\/td><td>’eqqaver<\/td><td>H6912<\/td><td>Niphal：被埋葬；連墳墓都選在以色列<\/td><\/tr><tr><td>重重地降罰<\/td><td>כֹּה יַעֲשֶׂה יְהוָה<\/td><td>koh ya‘aseh YHWH<\/td><td>H3541／H6213／H3068<\/td><td>起誓的固定句式：「願耶和華這樣待我，並且更重」<\/td><\/tr><tr><td>相離<\/td><td>יַפְרִיד<\/td><td>yafrid<\/td><td>H6504<\/td><td>Hiphil：使分開<\/td><\/tr><tr><td>定意<\/td><td>מִתְאַמֶּצֶת<\/td><td>mit’ammetset<\/td><td>H553<\/td><td>★ Hithpael：使自己剛強；書 1:6「剛強壯膽」同字根<\/td><\/tr><\/table>", "gram": "<p><strong>「願耶和華重重地降罰與我」（1:17）是舊約的起誓公式。<\/strong>原文 כֹּה יַעֲשֶׂה יְהוָה לִי וְכֹה יֹסִיף，直譯「願耶和華這樣待我，並且這樣加上」，意思是若違背誓言，甘受重罰（撒上 3:17；20:13）。重點是：<strong>路得用的是耶和華的名，不是基抹的名。<\/strong>這是她第一次說出以色列神的名字。<\/p><p>כִּי הַמָּוֶת 可讀作「若有甚麼使你我分開，除非是死」，或「唯有死能使你我分開」；意思相同。<\/p>", "exp": "<p><strong>路得不只選了一條路，她連墳墓都選好了。<\/strong><\/p><p>「你在哪裡死，我也在那裡死，也葬在那裡」（1:17）。古人極看重葬在本族的地。路得等於說：就算拿俄米死了，我也不回摩押；我的骨頭要留在你的百姓中間。<strong>她的委身沒有附帶「如果」，沒有退路。<\/strong><\/p><p>接著她起誓：「願耶和華重重地降罰與我」（1:17）。這是以色列人最重的起誓。值得注意的是，她呼求的是「耶和華」。一個摩押女子在歸回的路上，第一次叫出以色列神的名字，就是把自己的一生交在祂手中作擔保。<\/p><p>然後是一句很安靜的話：「拿俄米見路得定意要跟隨自己去，就不再勸她了」（1:18）。「定意」原文 מִתְאַמֶּצֶת，是「使自己剛強」，和神對約書亞說「你當剛強壯膽」（書 1:6）同一個字根。<strong>路得的剛強，不在戰場，在一條寡婦回家的路上。<\/strong><\/p><p>可是拿俄米沒有擁抱她，沒有說「謝謝你」，只是「不再勸她了」。一個人的信心，不會立刻改變另一個人的苦。路得說了全卷最美的話，換來的是一路沉默。<strong>真實的委身，常常不是在掌聲裡，是在沒有回應的路上繼續走。<\/strong><\/p><p class=\"xref\">〔舊約〕撒上 20:13；書 1:6（約書亞記講義第 1 章）<\/p>"}, {"a": 19, "z": 19, "star": 1, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֵּלַ֣כְנָה שְׁתֵּיהֶ֔ם עַד־בֹּאָ֖נָה בֵּ֣ית לָ֑חֶם וַיְהִ֗י כְּבֹאָ֨נָה֙ בֵּ֣ית לֶ֔חֶם וַתֵּהֹ֤ם כָּל־הָעִיר֙ עֲלֵיהֶ֔ן וַתֹּאמַ֖רְנָה הֲזֹ֥את נָעֳמִֽי׃<\/p>", "lit": "<p>「於是她們二人同行，直到她們進了伯利恆。她們一進伯利恆，全城就因她們騷動起來；婦女們說：這是拿俄米嗎？」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>二人<\/td><td>שְׁתֵּיהֶם<\/td><td>shteihem<\/td><td>H8147<\/td><td>她們兩個；四個人出去，兩個人回來<\/td><\/tr><tr><td>驚訝<\/td><td>וַתֵּהֹם<\/td><td>vattehom<\/td><td>H1949<\/td><td>Niphal：騷動、震動；撒上 4:5「地便震動」同一個字<\/td><\/tr><tr><td>合城<\/td><td>כָּל־הָעִיר<\/td><td>kol-ha‘ir<\/td><td>H3605／H5892<\/td><td>全城；整座伯利恆都動起來<\/td><\/tr><tr><td>這是拿俄米嗎<\/td><td>הֲזֹאת נָעֳמִי<\/td><td>hazo’t na‘omi<\/td><td>H2063／H5281<\/td><td>驚問；只有兩個字<\/td><\/tr><\/table>", "gram": "<p><strong>「婦女們說」原文是陰性複數動詞 וַתֹּאמַרְנָה，和合本補出「婦女們」是對的。<\/strong>這群伯利恆的婦人是全卷的「合唱隊」：第 1 章她們問「這是拿俄米嗎」，第 4 章她們說「耶和華是應當稱頌的」（4:14），又說「拿俄米得孩子了」（4:17）。同一群人，一頭一尾，見證了拿俄米從空到滿。<\/p><p>「她們二人」שְׁתֵּיהֶם 用了陽性詞尾，與 1:8 同類，屬古希伯來文的常見現象。<\/p>", "exp": "<p><strong>十年後，伯利恆認出了拿俄米的臉，卻認不出她的人生。<\/strong><\/p><p>「於是二人同行，來到伯利恆。」出去的時候是四個人，在摩押又多了兩個媳婦；回來的時候，只剩兩個女人。「合城的人就都驚訝」（1:19），原文 וַתֵּהֹם 是騷動、震動，和約櫃進營時「地便震動」（撒上 4:5）同一個字。<strong>一個寡婦回家，整座城都震動了。<\/strong><\/p><p>婦女們只問了一句，原文只有兩個字：「這是拿俄米嗎」（1:19）。這不一定是嘲笑，更像是不敢相信：那個帶著丈夫兒子離開的「甜美」的女人，怎麼變成這樣？十年的風霜都寫在臉上。<\/p><p>回到熟悉的地方，有時比留在陌生的地方更難。在外地，沒有人記得你以前的樣子；回到老家、回到教會、回到老朋友中間，每個人的眼睛都在比較：你從前是怎樣，現在怎麼了。<strong>拿俄米要面對的，不只是失去，還有被人看見她的失去。<\/strong><\/p><p>可是請記得這群婦人。她們今天的問題，要在第 4 章變成她們的頌讚。<strong>神讓同一群看見你跌倒的人，也看見祂怎樣把你扶起來。<\/strong>今天驚訝的眼光，不是故事的結局。<\/p><p class=\"xref\">〔舊約〕撒上 4:5；士 19:1（路得記講義第 19 章）<\/p>"}, {"a": 20, "z": 21, "star": 3, "grk": "<p dir=\"rtl\" lang=\"he\">וַתֹּ֣אמֶר אֲלֵיהֶ֔ן אַל־תִּקְרֶ֥אנָה לִ֖י נָעֳמִ֑י קְרֶ֤אןָ לִי֙ מָרָ֔א כִּי־הֵמַ֥ר שַׁדַּ֛י לִ֖י מְאֹֽד׃ אֲנִי֙ מְלֵאָ֣ה הָלַ֔כְתִּי וְרֵיקָ֖ם הֱשִׁיבַ֣נִי יְהוָ֑ה לָ֣מָּה תִקְרֶ֤אנָה לִי֙ נָעֳמִ֔י וַֽיהוָה֙ עָ֣נָה בִ֔י וְשַׁדַּ֖י הֵ֥רַֽע לִֽי׃<\/p>", "lit": "<p>「她對她們說：不要叫我拿俄米，叫我瑪拉吧，因為全能者使我非常苦。我滿滿地走了，耶和華卻使我空空地回來。為甚麼你們還叫我拿俄米呢？耶和華作見證攻擊我，全能者使禍臨到我。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>拿俄米<\/td><td>נָעֳמִי<\/td><td>na‘omi<\/td><td>H5281<\/td><td>甜美、喜悅<\/td><\/tr><tr><td>瑪拉<\/td><td>מָרָא<\/td><td>mara’<\/td><td>H4755<\/td><td>苦；以 א 收尾的拼法較少見<\/td><\/tr><tr><td>全能者<\/td><td>שַׁדַּי<\/td><td>shaddai<\/td><td>H7706<\/td><td>★ 先祖時代的神名（創 17:1），兩節之內兩次<\/td><\/tr><tr><td>滿滿地<\/td><td>מְלֵאָה<\/td><td>mele’ah<\/td><td>H4392<\/td><td>滿的；她把丈夫和兒子看作她的「滿」<\/td><\/tr><tr><td>空空地<\/td><td>וְרֵיקָם<\/td><td>reqam<\/td><td>H7387<\/td><td>★ 空手地；全卷只有兩次，另一次在 3:17<\/td><\/tr><tr><td>降禍與我<\/td><td>עָנָה בִי<\/td><td>‘anah vi<\/td><td>H6030<\/td><td>直譯「作見證攻擊我」，或讀作「使我受苦」<\/td><\/tr><\/table>", "gram": "<p><strong>「耶和華降禍與我」（1:21），原文 וַיהוָה עָנָה בִי，各家讀法不同。<\/strong><\/p><ul><li>馬所拉文本：Qal 動詞 עָנָה בְּ 是法庭用語，「作見證攻擊」，和「不可作假見證陷害人」（出 20:16）同一個句式。WEB 照此作 testified against me。<\/li><li>古譯本：七十士譯本、敘利亞譯本讀作 Piel עִנָּה，「使我受苦、使我降卑」；和合本「降禍與我」近於這一類讀法。<\/li><\/ul><blockquote><p><strong>本講義判斷：馬所拉文本可以讀通，宜照原文理解為「作見證攻擊我」；兩種讀法都是哀歌的語言，對象都是神。<\/strong>拿俄米覺得自己在神的法庭上被定了罪。<\/p><\/blockquote>", "exp": "<p><strong>拿俄米要把名字從「甜」改成「苦」；她說到自己的苦，每一句的主詞都是神。<\/strong><\/p><p>「不要叫我拿俄米，要叫我瑪拉，因為全能者使我受了大苦」（1:20）。接著她說：「我滿滿地出去，耶和華使我空空地回來」（1:21）。她離開的時候正是饑荒，卻說自己是「滿滿地」出去；因為那時丈夫和兩個兒子都在身邊。<strong>她的滿，從來不是糧食，是人。<\/strong><\/p><p>兩節之內，她四次說神作了甚麼：全能者使我受苦，耶和華使我空空地回來，耶和華作見證攻擊我，全能者使禍臨到我。她沒有說神不存在，也沒有轉去求別的神。<strong>她是對著神哭，這是哀歌，是信心的一種形式。<\/strong>約伯也說「全能者使我心中愁苦」（伯 27:2），詩人也喊「我的神，我的神！為什麼離棄我」（詩 22:1）。<\/p><p>經文怎樣回應她？敘述者沒有糾正她，婦人們沒有反駁她，神也沒有責備她。講台更不可以對受苦的人說「不要埋怨，要喜樂」。<strong>神承受得起我們誠實的話；神也比我們的結論更大。<\/strong><\/p><p>「空空地」原文 רֵיקָם，全卷只出現兩次。另一次是波阿斯說：「你不可空手回去見你的婆婆」（3:17）。<strong>拿俄米說神使她空空地回來；神卻差一個人說：不可讓她空著。<\/strong>她的話是真實的，但不是最後的一句。<\/p><p class=\"xref\">〔舊約〕創 17:1（創世記講義第 17 章）；出 20:16（出埃及記講義第 20 章）<\/p>"}, {"a": 22, "z": 22, "star": 2, "grk": "<p dir=\"rtl\" lang=\"he\">וַתָּ֣שָׁב נָעֳמִ֗י וְר֨וּת הַמּוֹאֲבִיָּ֤ה כַלָּתָהּ֙ עִמָּ֔הּ הַשָּׁ֖בָה מִשְּׂדֵ֣י מוֹאָ֑ב וְהֵ֗מָּה בָּ֚אוּ בֵּ֣ית לֶ֔חֶם בִּתְחִלַּ֖ת קְצִ֥יר שְׂעֹרִֽים׃<\/p>", "lit": "<p>「於是拿俄米回來了，還有摩押女子路得，她的兒婦，與她一起，就是那從摩押田野回來的；她們進了伯利恆，正是大麥收割開始的時候。」<\/p>", "key": "<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>意義<\/th><\/tr><tr><td>摩押女子<\/td><td>הַמּוֹאֲבִיָּה<\/td><td>hammo’aviyyah<\/td><td>H4125<\/td><td>「那摩押女子」；全卷第一次用這個稱號稱路得<\/td><\/tr><tr><td>回來<\/td><td>הַשָּׁבָה<\/td><td>hashavah<\/td><td>H7725<\/td><td>★「那回來的」；路得從未住過伯利恆，卻被稱為「回來的」<\/td><\/tr><tr><td>起初<\/td><td>בִּתְחִלַּת<\/td><td>bitchillat<\/td><td>H8462<\/td><td>開始；收割季才剛開始<\/td><\/tr><tr><td>割<\/td><td>קְצִיר<\/td><td>qetsir<\/td><td>H7105<\/td><td>收割、收成<\/td><\/tr><tr><td>大麥<\/td><td>שְׂעֹרִים<\/td><td>se‘orim<\/td><td>H8184<\/td><td>大麥；最早熟的穀物，2:23 一路收到小麥<\/td><\/tr><\/table>", "gram": "<p><strong>本節的 הַשָּׁבָה（hashavah）是一個值得
